          isDirtyRef.current = true;
          isLoadedRef.current = false;
          setTimeout(() => { isLoadedRef.current = true; }, 1500);
          
          if (typeof idbKeyval !== 'undefined') {
            await idbKeyval.set('kb_file_handle', serializeFileHandleForStorage(handle));
          }
          setAppState('workspace');
        } catch (err) {
          if (err.name !== 'AbortError') setError(`File error: ${err.message}`);
        }
      };
      
      const handleManualImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            const migrated = migrateWorkspaceData(data);
            let activeEntries = migrated.entries;
            let loadedChats = migrated.assistantChats || { workspace: [] };
            let chatArchivedOnLoad = false;
            const activeWholeBrainMsgs = loadedChats.workspace || [];
            if (Array.isArray(activeWholeBrainMsgs) && activeWholeBrainMsgs.length > 0) {
              const archivedChatEntry = convertChatMessagesToEntry(activeWholeBrainMsgs, activeEntries);
              if (archivedChatEntry) {
                activeEntries = [archivedChatEntry, ...activeEntries];
                loadedChats = { ...loadedChats, workspace: [] };
                chatArchivedOnLoad = true;
              }
            }

            setHistoryState({ past: [], present: activeEntries });
            const initialIds = activeEntries.length > 0 ? [activeEntries[0].id] : [];
            setSelectedEntryIds(initialIds);
            setNavHistory(initialIds.length > 0 ? [initialIds] : []);
            setNavIndex(initialIds.length > 0 ? 0 : -1);
            setTombstones(migrated.tombstones || {});
            tombstonesRef.current = migrated.tombstones || {};
            setStoredPrompts(migrated.storedPrompts || []);
            if (migrated.promptConfig) setPromptConfig(migrated.promptConfig);
            setApiKeys(migrated.apiKeys);
            setModel(migrated.model);
            setTaskModels(migrated.taskModels || {
              metadata: DEFAULT_MODEL,
              prompts: DEFAULT_MODEL,
              assistant: migrated.model || DEFAULT_MODEL
            });
            setTheme(migrated.theme);
            setAssistantChats(loadedChats);
            setArchivedAssistantChats(migrated.archivedAssistantChats || { workspace: [] });
            setExpandedArchivedChatIds([]);
            if (migrated.layout) {
              setIsLeftSidebarOpen(migrated.layout.isLeftSidebarOpen);
              setIsListSidebarOpen(migrated.layout.isListSidebarOpen);
              setIsAssistantOpen(migrated.layout.isAssistantOpen);
            }
            
            setFileName(file.name);
            setFileHandle(null);
            setLastSyncTime(Date.now());
            lastSyncTimeRef.current = Date.now();
            isDirtyRef.current = chatArchivedOnLoad;
            isLoadedRef.current = false;
            setTimeout(() => { isLoadedRef.current = true; }, 1500);
            setAppState('workspace');
          } catch (err) {
            setError(`Import error: ${err.message}`);
          }
        };
        reader.readAsText(file);
      };

      const handleCloseWorkspace = () => {
        setAppState('landing');
        setFileHandle(null);
        setHistoryState({ past: [], present: [] });
      };

      // Library Merge state & helpers
      const [mergeStatus, setMergeStatus] = useState(null);
      const mergeFileInputRef = useRef(null);

      const executeLibraryMerge = (incomingData, sourceFileName = '') => {
        try {
          if (!incomingData || typeof incomingData !== 'object') {
            throw new Error("Invalid format. Expected a KnowledgeBase JSON object.");
          }
          const current = saveStateRef.current;
          const merged = mergeDatabases(
            {
              entries: current.entries,
              tombstones: tombstonesRef.current || {},
              assistantChats: current.assistantChats,
              archivedAssistantChats: current.archivedAssistantChats,
              storedPrompts: current.storedPrompts,
              apiKeys: current.apiKeys,
              model: current.model,
              taskModels: current.taskModels,
              theme: current.theme,
              isDirty: true,
              lastSyncTime: lastSyncTimeRef.current
            },
            incomingData
          );

          setHistoryState(h => ({
            past: [...h.past.slice(-25), h.present],
            present: merged.entries
          }));
          setTombstones(merged.tombstones);
          tombstonesRef.current = merged.tombstones;
          setAssistantChats(merged.assistantChats);
          setArchivedAssistantChats(merged.archivedAssistantChats);
          setStoredPrompts(merged.storedPrompts);
          if (merged.promptConfig) setPromptConfig(merged.promptConfig);
          if (merged.taskModels) setTaskModels(merged.taskModels);
          if (merged.model) setModel(merged.model);
          isDirtyRef.current = true;

          const summary = `Merged successfully${sourceFileName ? ` with "${sourceFileName}"` : ''}: ${merged.addedCount} new note${merged.addedCount === 1 ? '' : 's'} added, ${merged.updatedCount} note${merged.updatedCount === 1 ? '' : 's'} updated to latest changes${merged.conflictCount ? `, ${merged.conflictCount} conflict copies preserved` : ''}.`;
          setMergeStatus({ type: 'success', message: summary });
        } catch (err) {
          console.error("Library merge error:", err);
          setMergeStatus({ type: 'error', message: `Merge failed: ${err.message}` });
        }
      };

      const handleMergePicker = async () => {
        setMergeStatus(null);
        try {
          if (hasNativeFileSystemAccess) {
            const [handle] = await window.showOpenFilePicker({
              types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
            });
            const file = await handle.getFile();
            const text = await file.text();
            let data = {};
            try {
              data = JSON.parse(text);
            } catch (pErr) {
              throw new Error("File is not valid JSON.");
            }
            executeLibraryMerge(data, file.name);
          } else if (safariBridgeStatus === 'online') {
            const res = await fetch(`${SAFARI_BRIDGE_URL}/pick-open`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ remember: false })
            }).catch(() => null);
            if (!res) {
              if (mergeFileInputRef.current) {
                mergeFileInputRef.current.value = '';
                mergeFileInputRef.current.click();
              }
              return;
            }
            const pickData = await res.json().catch(() => ({}));
            if (pickData.cancelled) return;
            if (!res.ok || !pickData.ok) {
              throw new Error(pickData.error || "Could not open file via Safari Local Sync Bridge.");
            }
            const handle = createBridgeFileHandle(pickData.path, pickData.name);
            const file = await handle.getFile();
            const text = await file.text();
            let data = {};
            try {
              data = JSON.parse(text);
            } catch (pErr) {
              throw new Error("File is not valid JSON.");
            }
            executeLibraryMerge(data, file.name);
          } else {
            if (mergeFileInputRef.current) {
              mergeFileInputRef.current.value = '';
              mergeFileInputRef.current.click();
            }
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            setMergeStatus({ type: 'error', message: `Could not open file: ${err.message}` });
          }
        }
      };

      const handleMergeFileInputChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            executeLibraryMerge(data, file.name);
          } catch (err) {
            setMergeStatus({ type: 'error', message: `Failed to parse JSON file: ${err.message}` });
          }
        };
        reader.readAsText(file);
      };

      const isWelcomeEntry = (entry) => {
        if (!entry) return false;
        return entry.id === 'sample-1' || entry.id === INITIAL_ENTRY.id || (entry.numericId === 1 && entry.title === 'Welcome to your Knowledge Base');
      };

      const hasSummaryOrTakeaways = (entry) => {
        if (!entry) return false;
        const hasSummary = Boolean(entry.summary && typeof entry.summary === 'string' && entry.summary.trim().length > 0);
        const hasTakeaways = Boolean(Array.isArray(entry.shortVersion) && entry.shortVersion.length > 0);
        return hasSummary || hasTakeaways;
      };

      const userEntries = entries.filter(e => !isWelcomeEntry(e));

      // Taxonomy stats (excluding sample welcome note from counts)
      const projectCounts = {};
      const categoryCounts = {};
      const tagCounts = {};
      const allProjects = new Set();
      const allCategories = new Set();
      const allTags = new Set();

      userEntries.forEach(e => {
        if (Array.isArray(e.projects)) {
          e.projects.forEach(p => {
            allProjects.add(p);
            projectCounts[p] = (projectCounts[p] || 0) + 1;
          });
        }
        if (Array.isArray(e.categories)) {
          e.categories.forEach(c => {
            if (!isEntryTypeTaxonomy(c)) {
              allCategories.add(c);
            }
            categoryCounts[c] = (categoryCounts[c] || 0) + 1;
          });
        }
        if (Array.isArray(e.tags)) {
          e.tags.forEach(t => {
            if (!isEntryTypeTaxonomy(t)) {
              allTags.add(t);
            }
            tagCounts[t] = (tagCounts[t] || 0) + 1;
          });
        }
      });

      const normTax = s => String(s || '').trim().toLowerCase();

      const availableProjects = new Set();
      const availableCategories = new Set();
      const availableTags = new Set();

      userEntries.forEach(e => {
        const matchesType = activeTypeFilters.includes(getEntryType(e));
        if (!matchesType) return;

        const matchesProject = activeProjects.length === 0 || (Array.isArray(e.projects) && e.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
        const matchesCat = activeCategories.length === 0 || (Array.isArray(e.categories) && e.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
        const matchesTag = activeTags.length === 0 || (Array.isArray(e.tags) && e.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));

        if (matchesProject && matchesTag) {
          if (Array.isArray(e.categories)) e.categories.forEach(c => availableCategories.add(c));
        }
        if (matchesProject && matchesCat) {
          if (Array.isArray(e.tags)) e.tags.forEach(t => availableTags.add(t));
        }
        if (matchesCat && matchesTag) {
          if (Array.isArray(e.projects)) e.projects.forEach(p => availableProjects.add(p));
        }
      });

      const handleProjectClick = (proj, e) => {
        setActiveCategories([]);
        setActiveTags([]);
        if (e.ctrlKey || e.metaKey) {
          setActiveProjects(prev => prev.some(p => normTax(p) === normTax(proj)) ? prev.filter(p => normTax(p) !== normTax(proj)) : [...prev, proj]);
        } else {
          setActiveProjects(prev => (prev.length === 1 && normTax(prev[0]) === normTax(proj)) ? [] : [proj]);
        }
      };

      const handleCategoryClick = (cat, e) => {
        setActiveTags([]);
        if (e.ctrlKey || e.metaKey) {
          setActiveCategories(prev => prev.some(c => normTax(c) === normTax(cat)) ? prev.filter(c => normTax(c) !== normTax(cat)) : [...prev, cat]);
        } else {
          setActiveCategories(prev => (prev.length === 1 && normTax(prev[0]) === normTax(cat)) ? [] : [cat]);
        }
      };

      const handleTagClick = (tag, e) => {
        if (e.ctrlKey || e.metaKey) {
          setActiveTags(prev => prev.some(t => normTax(t) === normTax(tag)) ? prev.filter(t => normTax(t) !== normTax(tag)) : [...prev, tag]);
        } else {
          setActiveTags(prev => (prev.length === 1 && normTax(prev[0]) === normTax(tag)) ? [] : [tag]);
        }
      };

      const sortedProjects = Array.from(allProjects).sort((a, b) => a.localeCompare(b));
      const sortedCategories = Array.from(allCategories).sort((a, b) => a.localeCompare(b));
      const sortedTags = Array.from(allTags).sort((a, b) => {
        const diff = (tagCounts[b] || 0) - (tagCounts[a] || 0);
        return diff !== 0 ? diff : a.localeCompare(b);
      });

      // Ingestion / Add entry
      const processInput = async (textContent, file = null) => {
        if (!apiKeys || apiKeys.length === 0) {
          setShowKeyModal(true);
          return setError("Please set your Gemini API key in Settings first.");
        }
        setIsAnalyzing(true);
        setError(null);
        try {
          let sourceUrl = null;
          let originalWebTitle = null;
          let useSearchTool = false;
          let prompt = '';
          let payloadParts = [];

          const schema = {
            type: "OBJECT",
            properties: {
              title: { type: "STRING" },
              summary: { type: "STRING" },
              shortVersion: { type: "ARRAY", items: { type: "STRING" } },
              fullContent: { type: "STRING" },
              categories: { type: "ARRAY", items: { type: "STRING" } },
              tags: { type: "ARRAY", items: { type: "STRING" } },
              projects: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["title", "summary", "shortVersion", "fullContent", "categories", "tags", "projects"]
          };

          const taxonomyRules = `
          Taxonomy guidelines:
          - Projects: Assign 0-1 scoped initiative from: ${JSON.stringify(Array.from(allProjects))}. Return in lowercase.
          - Categories: Assign 1-2 broad topic/domain categories from existing list: ${JSON.stringify(Array.from(allCategories))}. Return in lowercase.
          - Tags: Assign 2-4 concept tags from existing list if possible: ${JSON.stringify(Array.from(allTags))}. Include author/creator name as tag. Return in lowercase.
          - CRITICAL: Categories and tags MUST represent domain subjects/topics only. NEVER create or assign categories or tags that overlap with entry types or document formats (e.g. do NOT use "notes", "note", "video", "videos", "media", "audio", "web", "website", "prompt", "pdf", "document").`;

          if (file && file.type === 'application/pdf') {
            const base64Data = await readFileAsBase64(file);
            originalWebTitle = file.name;
            prompt = `Analyze this PDF document and return JSON:
            1. Title (Use the document title or "${file.name}").
            2. Comprehensive executive summary in 'summary' (2-3 informative sentences capturing core context and principal findings). CRITICAL: Jump straight into the substance. NEVER begin with redundant meta-openings like "This note summarises", "This note summarizes", "This document", or "This PDF".
            3. 3-5 descriptive, insightful key takeaways in 'shortVersion' that provide substantive context and actionable depth rather than brief fragments.
            4. Detailed reconstructed fullContent in clean Markdown.
            ${taxonomyRules}`;
            payloadParts = [
              { text: prompt },
              { inlineData: { mimeType: "application/pdf", data: base64Data } }
            ];
          } else if (textContent) {
            const droppedData = textContent.trim();
            const isUrl = /^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(droppedData);
            const isYouTube = isUrl && /(youtube\.com|youtu\.be)/i.test(droppedData);
            sourceUrl = isUrl ? droppedData : null;
            let rawContent = droppedData;

            if (isYouTube) {
              useSearchTool = true;
              let videoId = '';
              try {
                const urlObj = new URL(droppedData);
                videoId = urlObj.hostname.includes('youtu.be') ? urlObj.pathname.slice(1) : urlObj.searchParams.get('v');
              } catch(e) {}
              prompt = `Use Google Search to find the exact content, transcript, or summary for this YouTube video (URL: ${droppedData}, ID: ${videoId}). Return strictly JSON:
              1. Title.
              2. Comprehensive executive summary in 'summary' (2-3 informative sentences capturing core context and principal findings). CRITICAL: Jump straight into the substance. NEVER begin with redundant meta-openings like "This note summarises", "This video summarizes", or "This note".
              3. 3-5 descriptive, insightful key takeaways in 'shortVersion' that provide substantive context and actionable depth rather than brief fragments.
              4. Detailed reconstructed fullContent in clean Markdown.
              ${taxonomyRules}`;
              payloadParts = [{ text: prompt }];
            } else if (isUrl) {
              try {
                const scrapeResult = await fetchAndScrubUrl(droppedData);
                originalWebTitle = scrapeResult.title;
                rawContent = scrapeResult.content;
                prompt = `Analyze this web article and return strictly JSON:
                1. Title.
                2. Comprehensive executive summary in 'summary' (2-3 informative sentences capturing core context and principal findings). CRITICAL: Jump straight into the substance. NEVER begin with redundant meta-openings like "This note summarises", "This article summarizes", or "This document".
                3. 3-5 descriptive, insightful key takeaways in 'shortVersion' that provide substantive context and actionable depth rather than brief fragments.
                4. Reconstruct detailed fullContent in clean Markdown.
                ${taxonomyRules}
                Content:\n${rawContent.substring(0, 40000)}`;
              } catch (err) {
                useSearchTool = true;
                prompt = `Use Google Search to find content for this URL: ${droppedData}. Return strictly JSON:
                1. Title. 2. Comprehensive executive summary in 'summary' (2-3 informative sentences). CRITICAL: Jump straight into the substance; NEVER begin with "This note summarises", "This article", or redundant intros. 3. 3-5 descriptive, insightful key takeaways in 'shortVersion' providing substantive context. 4. Reconstruct detailed fullContent in Markdown. ${taxonomyRules}`;
              }
              payloadParts = [{ text: prompt }];
            } else {
              prompt = `Analyze this text and return strictly JSON:

          };
          if (useSearchTool) payload.tools = [{ google_search: {} }];

          const result = await handleGeminiCall(payload, metadataModel);
          const parsed = parseAIJson(result.candidates?.[0]) || {};
          const nextNumericId = Math.floor(entries.reduce((max, e) => Math.max(max, e.numericId || 0), 0)) + 1;

          const cleanedCategories = (parsed.categories || [])

            id: 'entry-' + Date.now(),

        const initialEditObj = {

      const handleWriteFromPrompt = () => {
        if (!promptState.draft) return;

      // Filtered entries (matching active type filters, taxonomies, and search query)
      const entryMatchesFilters = (entry) => {
        if (!entry) return false;
        const entryType = getEntryType(entry);
        if (!activeTypeFilters.includes(entryType)) return false;
        const matchesProject = activeProjects.length === 0 || (Array.isArray(entry.projects) && entry.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
        const matchesCat = activeCategories.length === 0 || (Array.isArray(entry.categories) && entry.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
        const matchesTag = activeTags.length === 0 || (Array.isArray(entry.tags) && entry.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));
        const searchLower = searchQuery.toLowerCase();
        const matchesSearch = !searchQuery ||
          (entry.title && entry.title.toLowerCase().includes(searchLower)) ||
          (entry.summary && entry.summary.toLowerCase().includes(searchLower)) ||
          (entry.fullContent && entry.fullContent.toLowerCase().includes(searchLower)) ||
          (entry.numericId != null && (`#${entry.numericId}`).includes(searchLower)) ||
          (entry.numericId != null && String(entry.numericId).includes(searchLower));
        return matchesProject && matchesCat && matchesTag && matchesSearch;
      };
      const sortEntriesForList = (a, b) => {
        if (a.pinned && !b.pinned) return -1;

        if (listSortMode === 'modified') {
          const diff = (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
          if (diff !== 0) return diff;
        } else {
          const diff = (b.createdAt || 0) - (a.createdAt || 0);
          if (diff !== 0) return diff;
        }
        return (b.numericId || 0) - (a.numericId || 0);
      };
      // All entries stay mounted (sorted) so filtering can animate; filteredEntries is the visible subset
      const sortedAllEntries = entries.filter(Boolean).slice().sort(sortEntriesForList);
      const filteredEntries = sortedAllEntries.filter(entryMatchesFilters);
      const visibleEntryIds = new Set(filteredEntries.map(e => e.id));

      const activeTaxonomyList = [
        ...activeProjects,
        ...activeCategories,
        ...activeTags.map(t => `#${t}`)
      ];
      const activeTaxonomySummary = activeTaxonomyList.length > 0
        ? (activeTaxonomyList.length <= 2 ? activeTaxonomyList.join(', ') : `${activeTaxonomyList.slice(0, 2).join(', ')} +${activeTaxonomyList.length - 2}`)
        : '';

      // Check if standard content types are selected (default state excludes aiChat and seed)
      const standardDefaultVisibleTypes = ENTRY_TYPES.filter(t => t.id !== 'aiChat' && t.id !== 'seed').map(t => t.id);
      const selectedNonChatTypeObjs = ENTRY_TYPES.filter(t => t.id !== 'aiChat' && t.id !== 'seed' && activeTypeFilters.includes(t.id));
      const isAllStandardTypesSelected = standardDefaultVisibleTypes.every(tid => activeTypeFilters.includes(tid)) && !activeTypeFilters.includes('aiChat') && !activeTypeFilters.includes('seed');
      const hasCustomTypeFilter = !isAllStandardTypesSelected;

      // Descriptive summary of active list view filters (taxonomies, search, and type filters)
      const activeFilterParts = [
        ...activeTaxonomyList,
        searchQuery ? `"${searchQuery}"` : null,
        hasCustomTypeFilter ? selectedNonChatTypeObjs.map(t => t.label).join('/') : null
      ].filter(Boolean);
      const activeListScopeSummary = activeFilterParts.length > 0
        ? (activeFilterParts.length <= 2 ? activeFilterParts.join(', ') : `${activeFilterParts.slice(0, 2).join(', ')} +${activeFilterParts.length - 2}`)
        : '';

      // Dynamic scope label & title for Whole Brain AI Chat based on current selected types and taxonomies
      const activeBrainChatScopeLabel = activeListScopeSummary || 'Whole Brain';
      const activeBrainChatTitle = activeListScopeSummary ? `${activeListScopeSummary} AI Chat` : 'Whole Brain AI Chat';

      const formatPromptDateRangeLabel = (months) => {
        const m = Number(months) || 2;
        if (m > 24) return 'All Time';
        if (m === 1) return 'Last 1 month';
        if (m === 12) return 'Last 1 year (12 mos)';
        if (m === 24) return 'Last 2 years (24 mos)';
        return `Last ${m} months`;
      };

      const formatPromptPoolSizeLabel = (size) => {
        const s = Number(size) || 10;
        if (s > 50) return 'All';
        return `${s} notes`;
      };

      const isEntryWithinPromptDateRange = (entry, months, nowTs = Date.now()) => {
        const m = Number(months) || 2;
        if (m > 24) return true; // All Time
        const cutoff = nowTs - (m * 30.4375 * 24 * 60 * 60 * 1000);
        const entryTime = Math.max(Number(entry?.createdAt) || 0, Number(entry?.updatedAt) || 0);
        if (!entryTime) return true;
        return entryTime >= cutoff;
      };

      const generatePromptNote = async () => {
        if (promptState.isGenerating) return;
        const previousDraft = promptState.draft;
        setPromptState(prev => ({ ...prev, isGenerating: true }));
        try {
          const now = Date.now();
          const rangeMonths = Number(promptConfig?.dateRangeMonths) || 2;
          const rangeLabel = formatPromptDateRangeLabel(rangeMonths);
          const poolSizeVal = Number(promptConfig?.poolSize) || 10;
          
          // Potential pool: entries currently shown in the entry list view (filtered by active entry types, taxonomy, or search)
          // AND within the configured date range timeframe (default: 2 months)
          // Explicitly ignore seeds and AI chats; only consider notes, prompt replies, and external media/web documents
          const baseFilteredPool = filteredEntries.filter(e => !isWelcomeEntry(e) && !isSeedEntry(e) && !isAiChatEntry(e) && hasSummaryOrTakeaways(e));
          const scopedEntries = baseFilteredPool.filter(e => isEntryWithinPromptDateRange(e, rangeMonths, now));

          if (scopedEntries.length < 1) {
            if (baseFilteredPool.length > 0 && rangeMonths <= 24) {
              throw new Error(`No summarized notes found within the ${rangeLabel.toLowerCase()} timeframe${activeListScopeSummary ? ` matching [${activeListScopeSummary}]` : ''}. Open Prompt Settings (sliders icon) and widen the Date Range slider (or set to All Time).`);
            } else if (activeListScopeSummary) {
              throw new Error(`At least 1 summarized note visible in the list is required to generate a prompt. None found with an executive summary or key takeaways matching filter(s) [${activeListScopeSummary}].`);
            } else {
              throw new Error("At least 1 note with an executive summary or key takeaways matching your selected entry types is required to generate prompts.");
            }
          }

          // Select up to poolSizeVal random notes (or all if poolSizeVal > 50) with equal weighting from the available summarized notes pool
          const shuffledScoped = [...scopedEntries];
          for (let i = shuffledScoped.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledScoped[i], shuffledScoped[j]] = [shuffledScoped[j], shuffledScoped[i]];
          }
          const selectedNotes = poolSizeVal > 50 ? shuffledScoped : shuffledScoped.slice(0, poolSizeVal);

          if (selectedNotes.length === 0) {
            throw new Error("No notes found in current list view to analyze.");
          }

          const activeKey = apiKeys[0]?.key;
          if (!activeKey) {
            setShowKeyModal(true);
            setError("Please configure your Gemini API key in Settings first.");
            setPromptState({ isGenerating: false, draft: previousDraft || null });
            return;
          }

          const promptModel = taskModels.prompts || DEFAULT_MODEL;
          const promptTemperature = 1.0;

          const filterScopeParts = [
            activeProjects.length > 0 ? `Projects: ${activeProjects.join(', ')}` : '',
            activeCategories.length > 0 ? `Categories: ${activeCategories.join(', ')}` : '',
            activeTags.length > 0 ? `Tags: ${activeTags.map(t => '#' + t).join(', ')}` : '',
            searchQuery ? `Search query: "${searchQuery}"` : '',
            hasCustomTypeFilter ? `Types: ${activeTypeFilters.join(', ')}` : ''
          ].filter(Boolean);

          const filterFocusInstruction = filterScopeParts.length > 0
            ? `\n\nACTIVE FILTER FOCUS:\nAll provided notes belong to the user's active list view filters (${filterScopeParts.join(' | ')}). Ground your reflection question exclusively in the context, themes, and goals of these filtered notes.\n`
            : '';

          // =============================================================
          // SINGLE-PASS CONCEPT ISOLATION SYNTHESIS (UP TO 10 NOTES)
          // =============================================================
          const candidateNotesText = selectedNotes.map(e => {
            const time = Number(e.createdAt) || Number(e.updatedAt) || now;
            const dateStr = new Date(time).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            const type = getEntryType(e);
            let provenance = 'Note [User Content - Own Issues/Projects/Knowledge]';
            if (type === 'prompt') {
              provenance = 'Prompt Reply [User Content - Reflection Answer]';
            } else if (type === 'media') {
              provenance = 'Media [External Third-Hand Knowledge - Video/Audio]';
            } else if (type === 'web') {
              provenance = 'Web / Document [External Third-Hand Knowledge - Web/Text]';
            }
            const promptQuestionPart = (type === 'prompt' && e.promptQuestion) ? `\nPrompt Question: ${e.promptQuestion}` : '';
            const summaryPart = e.summary ? `\nSummary: ${e.summary}` : '';
            const takeawaysList = Array.isArray(e.shortVersion) && e.shortVersion.length
              ? `\nTakeaways:\n${e.shortVersion.map((t) => `  - ${t}`).join('\n')}`
              : '';
            const replyPart = (type === 'prompt' && e.fullContent && String(e.fullContent).trim()) ? `\nUser Reply: ${String(e.fullContent).trim()}` : '';
            const fallbackPart = (!summaryPart && !takeawaysList && !replyPart) ? `\nSummary: ${e.title || 'Untitled note'}` : '';

            return `=== [[kb-ref:${e.id}]] [Ref ID: ${e.numericId}] "${e.title || 'Untitled'}" [${provenance}] (${dateStr}) ===${promptQuestionPart}${summaryPart}${takeawaysList}${replyPart}${fallbackPart}`;
          }).join('\n\n' + '='.repeat(50) + '\n\n');

          const promptRequestText = `${candidateNotesText}\n\nTASK:\nReview the candidate entries above (up to 10 randomly sampled entries from the user's knowledge base).

KNOWLEDGE PROVENANCE & USER PERSPECTIVE:
- Assume ONLY the content of Notes and Prompt replies is user-generated content that reflects their own issues, projects, and personal knowledge.
- Web, media, and text documents are assumed to be external and contextual third-hand knowledge (reference materials, articles, videos, or external docs collected for context—not the user's personal thoughts or creations).
- Seeds and AI are ignored.

Select 1 or 2 entries where isolating ONE single idea from an entry (whether from its Summary, Takeaway, or user reflection) reveals an interesting tension, contradiction, or practical trade-off, and write a concise, conversational reflection prompt adhering strictly to these rules:

1. Length & Concept Isolation (50 words max):
   - Keep the entire prompt to 50 words or fewer.
   - Use concept isolation: take ONE single idea from an entry (or ONE single idea from each of 2 entries) drawn from either its Summary, one Takeaway, or user reply, and show how they clash or complicate each other (or highlight an internal tension within a single entry). Do NOT summarize the whole entry or combine multiple takeaways. Weave the exact citation tag(s) (e.g. [[kb-ref:ID]]) in naturally.
   - End with one sharp, open-ended question that cuts to the heart of that tension.
2. Conversational & Direct: Write like a perceptive friend, not an academic or a template. Use plain, everyday English and active verbs. Skip dramatic metaphors, clichés ("bridges the gap", "anchor yourself", "hold space"), and armchair psychology.
3. Self-Contained Context: State the isolated idea clearly so the prompt makes complete sense on its own. Never drop brand-new facts or unmentioned feelings into the final question if you haven't set them up first.
4. Synthesize, Don't Parrot: Connect the ideas naturally in your question without repeating the exact same phrases used in the setup. Compress ideas into natural summary terms.
5. Open Exploration: Ask questions that spark genuine reflection or small experiments, strongly preferring "Why" and "How" over "What" or "Which". NEVER start the question with closed auxiliary verbs ("Can", "Could", "Is", "Are", "Do", "Does", "Did", "Will", "Would", "Should", "Have", "Has") and NEVER ask Either/Or trap choices.

Respond with valid JSON containing "title" (3-5 words) and "content" (50 words max ending with a Why or How question).`;

          let systemPrompt = DEFAULT_PROMPT_INSTRUCTIONS;
          if (filterFocusInstruction && !systemPrompt.includes('ACTIVE FILTER FOCUS:')) {
            systemPrompt += filterFocusInstruction;
          }

          const payload = {
            contents: [{ parts: [{ text: promptRequestText }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: "OBJECT",
                properties: {
                  title: { type: "STRING", description: "A concise 3-5 word direct title capturing the essence of the inquiry" },
                  content: { type: "STRING", description: "A conversational reflection prompt (50 words maximum) using concept isolation: take ONE single idea from 1 or 2 notes' summary or takeaway, weave citations ([[kb-ref:ID]]) in naturally, synthesize without parroting, and end with one sharp open-ended question starting with Why or How (strongly preferred over What or Which)." }
                },
                required: ["title", "content"]
              },
              temperature: promptTemperature,
              maxOutputTokens: 8192
            }
          };

          const result = await callGemini(activeKey, payload, promptModel);
          const rawText = getCandidateText(result.candidates?.[0]);
          const parsed = parseAIJson(rawText) || {};

          let promptContent = (
            parsed.content ||
            parsed.question ||
            parsed.prompt ||
            parsed.reflection ||
            parsed.inquiry ||
            parsed.text ||
            ""
          ).trim();

          let promptTitle = (parsed.title || "").trim();

          // Resilient fallback if parsed object was missing content but rawText has text
          if (!promptContent && rawText) {
            const cMatch = rawText.match(/"(?:content|question|prompt|reflection|inquiry|text)"\s*:\s*"([\s\S]*?)(?:"\s*,\s*"[a-zA-Z]+"|"\s*\}|$)/i);
            if (cMatch) {
              promptContent = cMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n').replace(/\\t/g, ' ').trim();
            } else {
              const cleaned = rawText.replace(/```(?:json)?/gi, '').replace(/```/g, '').trim();
              if (cleaned && !cleaned.startsWith('{')) {
                promptContent = cleaned;
              }
            }
          }

          if (!promptTitle && rawText) {
            const tMatch = rawText.match(/"title"\s*:\s*"([^"]+)"/i);
            if (tMatch) promptTitle = tMatch[1].trim();
          }
          if (!promptTitle) {
            promptTitle = "Theme Reflection";
          }

          // Strip any truncated or unclosed reference shortcode at the end (e.g. [[kb-ref:entry or [[kb-ref:)
          promptContent = promptContent.replace(/\[\[kb-ref:[^\]]*$/i, '').trim();

          if (!promptContent) {
            throw new Error("AI generated an empty prompt response. Please click 'Generate Prompt' again.");
          }
          
          setPromptState({
            isGenerating: false,
            draft: {
              title: promptTitle,
              fullContent: promptContent,
              summary: promptContent,
              projects: [...activeProjects],
              categories: activeCategories.filter(c => !isEntryTypeTaxonomy(c)),
              tags: activeTags.filter(t => !isEntryTypeTaxonomy(t))
            }

        } catch (e) {
