  <!-- Global Diagnostic Screen -->
  <div id="error-fallback" class="hidden fixed inset-0 bg-[var(--bg-main)] text-[var(--text-main)] p-[50px] flex flex-col items-center justify-center z-[9999]">
    <div class="max-w-md w-full bg-[var(--card-bg)] p-8 rounded-lg shadow-xl text-center">
      <div class="flex items-center justify-center gap-3 text-[var(--danger)] mb-4">
        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
        <h1 class="text-lg font-bold">App Initialization Error</h1>
      </div>
      <p class="text-[var(--text-muted)] text-xs mb-4">A background script encountered an issue.</p>
      <div id="error-details" class="bg-[var(--bg-main)] p-3 rounded font-mono text-xs text-[var(--danger)] overflow-x-auto mb-6 max-h-40 text-left"></div>
      <button onclick="window.location.reload()" class="btn-primary w-full py-2.5">
        <i class="fa-solid fa-rotate-right mr-2"></i> Reload App
      </button>
    </div>
  </div>

  <div id="root"></div>

  <script>
    window.addEventListener('error', function(e) {
      console.error("Captured Error:", e);
      const fallback = document.getElementById('error-fallback');
      const details = document.getElementById('error-details');
      if (fallback && details) {
        fallback.classList.remove('hidden');
        details.textContent = `${e.message}\nLine: ${e.lineno}:${e.colno}\nFile: ${e.filename}`;
      }
    });
  </script>

    const isMediaSource = (url) => {
      if (!url) return false;
      return /(youtube\.com|youtu\.be|vimeo\.com|tiktok\.com|twitch\.tv|dailymotion\.com|spotify\.com|soundcloud\.com|\.(mp4|webm|ogg|mov|mp3|wav|m4a)$)/i.test(url);
    };

    const isPromptEntry = (entry) => {
      if (!entry) return false;
      return Boolean(entry.promptQuestion || (Array.isArray(entry.tags) && entry.tags.includes('prompt')) || (Array.isArray(entry.categories) && entry.categories.includes('prompt')));
    };

    const ENTRY_TYPES = [
      { id: 'note', label: 'Notes', color: '#f59e0b', icon: 'fa-file-lines' },
      { id: 'prompt', label: 'Prompts', color: '#f97316', icon: 'fa-brain' },
      { id: 'media', label: 'Media', color: '#ff5252', icon: 'fa-play' },
      { id: 'web', label: 'Web', color: '#38bdf8', icon: 'fa-link' },
      { id: 'pdf', label: 'PDFs', color: '#ec4899', icon: 'fa-file-pdf' }
    ];

    // Keywords and aliases corresponding to entry types that should not be used as categories or tags
    const ENTRY_TYPE_TAXONOMY_KEYWORDS = new Set([
      'note', 'notes',
      'prompt', 'prompts',
      'media', 'video', 'videos', 'audio', 'podcast', 'podcasts',
      'web', 'website', 'webpage', 'article', 'articles',
      'pdf', 'pdfs', 'document', 'documents'
    ]);

    const isEntryTypeTaxonomy = (term) => {
      if (!term || typeof term !== 'string') return false;
      const clean = term.trim().toLowerCase().replace(/^[#@]/, '');
      return ENTRY_TYPE_TAXONOMY_KEYWORDS.has(clean);
    };

    const getEntryType = (entry) => {
      if (!entry) return 'note';
      if (isPromptEntry(entry)) return 'prompt';
      const isPdf = !entry.sourceUrl && entry.title?.toLowerCase().endsWith('.pdf');
      if (isPdf) return 'pdf';
      if (isMediaSource(entry.sourceUrl)) return 'media';
      if (entry.sourceUrl) return 'web';
      return 'note';
    };

    const getEmbedUrl = (url) => {
      if (!url) return null;
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
      if (match && match[1]) return `https://www.youtube-nocookie.com/embed/${match[1]}?origin=https://localhost`;
      match = url.match(/vimeo\.com\/(?:video\/)?([0-9]+)/);
      if (match && match[1]) return `https://player.vimeo.com/video/${match[1]}`;
      return null;
    };

    const parseMarkdown = (content) => {
      if (typeof marked !== 'undefined' && marked.parse) {
        return marked.parse(content || '');
      }
      return (content || '')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br />');
    };

    const parseMarkdownInline = (content) => {
      if (typeof marked !== 'undefined' && marked.parseInline) {
        return marked.parseInline(content || '');
      }
      return content || '';
    };

    const injectReferences = (text, allEntries) => {
      if (!text) return '';
      return text.replace(/\[\[(?:kb-ref:|ref:)?([^\]]+)\]\]|\[(?:kb-ref:|ref:)?(entry-[a-zA-Z0-9_-]+)\](?!\()/gi, (match, id1, id2) => {
        const rawId = (id1 || id2 || '').trim();
        const refEntry = (allEntries || []).find(e => e.id === rawId || String(e.numericId) === rawId);
        if (!refEntry) return `<span class="text-[var(--danger)] text-xs font-semibold px-2 py-0.5 rounded bg-[var(--danger)]/10">[Broken Link: ${rawId}]</span>`;
        return `<span class="kb-embedded-ref" data-id="${refEntry.id}" title="${refEntry.title}">[Ref: ${refEntry.numericId}]</span>`;
      });
    };

      id: 'sample-1',

      summary: 'A clean, offline-first personal knowledge base with built-in AI Assistant.',

      fullContent: 'Welcome! This application runs entirely in your browser and automatically syncs with a local JSON file on your machine.\n\n### Quick Start\n* **Ingest Notes:** Paste any article or YouTube link in the input bar above the list.\n* **Edit:** Double-click any field (title, summary, takeaways, or content) to edit inline, or click taxonomies to manage tags.\n* **AI Assistant:** Open the Assistant in the right sidebar (or press Cmd+J) to synthesize information across notes or chat with the current note.\n* **Taxonomy:** Organize notes by Projects, Categories, and Tags in the left sidebar.',
      categories: ['getting started'],
      tags: ['tutorial'],

      updatedAt: Date.now(),
      sourceUrl: null,
      references: [],

    const normalizeTaxonomy = (entries) => {
      return (entries || []).map(e => ({
        ...e,
        categories: Array.isArray(e.categories) ? [...new Set(e.categories.map(c => String(c).toLowerCase()))] : [],
        tags: Array.isArray(e.tags) ? [...new Set(e.tags.map(t => String(t).toLowerCase()))] : [],
        projects: Array.isArray(e.projects) ? [...new Set(e.projects.map(p => String(p).toLowerCase()))] : []
      }));
    };

    const fetchAndScrubUrl = async (urlString) => {
      let html = '';
      try {
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(urlString)}`);
        const data = await response.json();
        if (data.contents) html = data.contents;
        else throw new Error("Invalid proxy response");
      } catch (err) {
        try {
          const response2 = await fetch(`https://corsproxy.io/?${encodeURIComponent(urlString)}`);
          if (!response2.ok) throw new Error("Network response failed");
          html = await response2.text();
        } catch (err2) {
          throw new Error("Scrape blocked. Falling back to search.");
        }
      }
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      let originalTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || 
                          doc.querySelector('title')?.textContent || 
                          doc.querySelector('h1')?.textContent || 
                          "Untitled Page";
      originalTitle = originalTitle.trim().replace(/\s*[|•-]\s*([A-Za-z0-9 ]+Substack|[A-Za-z0-9 ]+Medium|[A-Za-z0-9 ]+Blog|[A-Za-z0-9 ]+HQ|QUT.*)$/i, '').trim();

      const unwanted = doc.querySelectorAll('script, style, noscript, iframe, svg, video, header, footer, nav, aside, form, .menu, .mega-menu, .global-nav, .navbar');
      unwanted.forEach(el => el.remove());
      
      let mainNode = doc.querySelector('.profile-details') || doc.querySelector('article') || doc.querySelector('main') || doc.body;
      
      let markdownContent = '';
      if (typeof TurndownService !== 'undefined') {
        const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
        markdownContent = turndownService.turndown(mainNode);
      } else {
        markdownContent = mainNode.innerText || mainNode.textContent || '';
      }
      
      if (!markdownContent || markdownContent.length < 50) throw new Error("No text found. Falling back to search.");
      return { title: originalTitle, content: markdownContent.substring(0, 50000) }; 
    };

    async function verifyPermission(fileHandle, readWrite) {
      const options = { mode: readWrite ? 'readwrite' : 'read' };
      if ((await fileHandle.queryPermission(options)) === 'granted') return true;
      if ((await fileHandle.requestPermission(options)) === 'granted') return true;
      return false;
    }

    const readFileAsBase64 = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const callGemini = async (key, payload, model) => {
      const activeModel = model || 'gemini-2.5-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${key}`;
      const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await response.json();
      
      if (result.error) throw new Error(result.error.message);
      if (!result.candidates || result.candidates.length === 0) {
        const reason = result.promptFeedback?.blockReason || "Empty response from AI";
        throw new Error(`AI rejected the prompt. Reason: ${reason}`);
      }
      return result;
    };

    const parseAIJson = (text) => {
      let t = text.trim();
      const match = t.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
      if (match) t = match[1];
      return JSON.parse(t);
    };

    const EditableText = ({ text, onSave, className = '', tag = 'span', multiline = false, stripPrefix = '', renderView = null, placeholder = '' }) => {
      const [isEditing, setIsEditing] = useState(false);
      const elementRef = useRef(null);

      const handleDoubleClick = (e) => {
        e.stopPropagation();
        setIsEditing(true);
      };

      const handleBlur = () => {
        setIsEditing(false);
        if (elementRef.current) {
          let newText = elementRef.current.innerText;
          if (newText !== undefined && newText !== null) {
            newText = newText.trim();
          } else {
            newText = '';
          }
          const originalText = (text || '').trim();
          if (newText !== originalText && newText !== (stripPrefix + originalText).trim()) {
            if (stripPrefix && newText.startsWith(stripPrefix)) {
              newText = newText.substring(stripPrefix.length);
            }
            onSave(newText);
          } else if (!renderView) {
            elementRef.current.innerText = (stripPrefix || '') + (text || placeholder || '');
          }
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !multiline) {
          e.preventDefault();
          elementRef.current.blur();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          setIsEditing(false);
          if (elementRef.current && !renderView) {
            elementRef.current.innerText = (stripPrefix || '') + (text || placeholder || '');
          }
        }
      };

      useEffect(() => {
        if (elementRef.current && !isEditing && !renderView) {
          elementRef.current.innerText = (stripPrefix || '') + (text || placeholder || '');
        }
      }, [text, isEditing, stripPrefix, renderView, placeholder]);

      useEffect(() => {
        if (isEditing && elementRef.current) {
          elementRef.current.innerText = (stripPrefix || '') + (text || '');
          elementRef.current.focus();
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(elementRef.current);
          selection.removeAllRanges();
          selection.addRange(range);
        }
      }, [isEditing]);

      const Tag = tag;

      return (
        <Tag
          ref={elementRef}
          contentEditable={isEditing}
          onDoubleClick={handleDoubleClick}
          onBlur={handleBlur}
          onKeyDown={handleKeyDown}
          className={`${className} ${!text && placeholder ? 'italic opacity-60' : ''} ${isEditing ? 'outline-none rounded bg-[var(--card-bg)] text-[var(--text-main)] cursor-text p-2 font-mono whitespace-pre-wrap text-sm block not-italic opacity-100' : ''}`}
          suppressContentEditableWarning={true}
          title={!isEditing ? "Double-click to edit inline" : undefined}
        >
          {isEditing ? (stripPrefix || '') + (text || '') : (renderView ? renderView(text) : `${stripPrefix || ''}${text || placeholder}`)}
        </Tag>
      );
    };

          const contentModels = data.models
            .filter(m =>

        let parsedKeys = data.apiKeys || [];

      // Non-Destructive Entry-Level 3-Way Merge Algorithm

        const SIXTY_DAYS = 60 * 24 * 60 * 60 * 1000;
        const cutoff = Date.now() - SIXTY_DAYS;
        const mergedTombstones = {};

        const addTombstone = (id, time) => {

        if (localState.tombstones) {

        (localState.entries || []).forEach(e => {

        let updatedCount = 0;
        let conflictCount = 0;

          const local = localMap.get(id);

          const tombTime = mergedTombstones[id] || 0;

          }

          // If edited after tombstone, keep note and remove tombstone
          if (mergedTombstones[id]) {

          const localContent = (local.fullContent || '').trim();

              conflictCount++;
            } else {
              mergedList.push({ ...inc, numericId: local.numericId || inc.numericId });

            }

              const conflictCopy = {
                ...inc,
                id: 'conflict-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),

          isLeftSidebarOpen: localState.isDirty ? localState.isLeftSidebarOpen : (incoming.isLeftSidebarOpen ?? localState.isLeftSidebarOpen),
          isListSidebarOpen: localState.isDirty ? localState.isListSidebarOpen : (incoming.isListSidebarOpen ?? localState.isListSidebarOpen),
          isAssistantOpen: localState.isDirty ? localState.isAssistantOpen : (incoming.isAssistantOpen ?? localState.isAssistantOpen),

            setNavHistory(initialIds.length > 0 ? [initialIds] : []);
            setNavIndex(initialIds.length > 0 ? 0 : -1);
            setTombstones(migrated.tombstones || {});
            tombstonesRef.current = migrated.tombstones || {};
            setStoredPrompts(migrated.storedPrompts || []);
            setApiKeys(migrated.apiKeys);
            setModel(migrated.model);
            setTaskModels(migrated.taskModels || {
              metadata: DEFAULT_MODEL,
              prompts: DEFAULT_MODEL,
              assistant: migrated.model || DEFAULT_MODEL
            });
            setTheme(migrated.theme);
            setAssistantChats(migrated.assistantChats || { workspace: [] });
            setArchivedAssistantChats(migrated.archivedAssistantChats || { workspace: [] });
            setExpandedArchivedChatIds([]);
            if (migrated.layout) {
              setIsLeftSidebarOpen(migrated.layout.isLeftSidebarOpen);
              setIsListSidebarOpen(migrated.layout.isListSidebarOpen);
              setIsAssistantOpen(migrated.layout.isAssistantOpen);
            }
            
            setFileName(file.name);
            setFileHandle(null);
            setLastSyncTime(Date.now());
            lastSyncTimeRef.current = Date.now();
            isDirtyRef.current = false;
            isLoadedRef.current = false;
            setTimeout(() => { isLoadedRef.current = true; }, 1500);
            setAppState('workspace');
          } catch (err) {
            setError(`Import error: ${err.message}`);
          }
        };
        reader.readAsText(file);
      };

      const handleCloseWorkspace = () => {
        setAppState('landing');
        setFileHandle(null);
        setHistoryState({ past: [], present: [] });
      };

      // Library Merge state & helpers
      const [mergeStatus, setMergeStatus] = useState(null);
      const mergeFileInputRef = useRef(null);

      const executeLibraryMerge = (incomingData, sourceFileName = '') => {
        try {
          if (!incomingData || typeof incomingData !== 'object') {
            throw new Error("Invalid format. Expected a KnowledgeBase JSON object.");
          }
          const current = saveStateRef.current;
          const merged = mergeDatabases(
            {
              entries: current.entries,
              tombstones: tombstonesRef.current || {},
              assistantChats: current.assistantChats,
              archivedAssistantChats: current.archivedAssistantChats,
              storedPrompts: current.storedPrompts,
              apiKeys: current.apiKeys,
              model: current.model,
              taskModels: current.taskModels,
              theme: current.theme,
              isDirty: true,
              lastSyncTime: lastSyncTimeRef.current
            },
            incomingData
          );

          setHistoryState(h => ({
            past: [...h.past.slice(-25), h.present],
            present: merged.entries
          }));
          setTombstones(merged.tombstones);
          tombstonesRef.current = merged.tombstones;
          setAssistantChats(merged.assistantChats);
          setArchivedAssistantChats(merged.archivedAssistantChats);
          setStoredPrompts(merged.storedPrompts);
          if (merged.taskModels) setTaskModels(merged.taskModels);
          if (merged.model) setModel(merged.model);
          isDirtyRef.current = true;

          const summary = `Merged successfully${sourceFileName ? ` with "${sourceFileName}"` : ''}: ${merged.addedCount} new note${merged.addedCount === 1 ? '' : 's'} added, ${merged.updatedCount} note${merged.updatedCount === 1 ? '' : 's'} updated to latest changes${merged.conflictCount ? `, ${merged.conflictCount} conflict copies preserved` : ''}.`;
          setMergeStatus({ type: 'success', message: summary });
        } catch (err) {
          console.error("Library merge error:", err);
          setMergeStatus({ type: 'error', message: `Merge failed: ${err.message}` });
        }
      };

      const handleMergePicker = async () => {
        setMergeStatus(null);
        try {
          if (window.showOpenFilePicker) {
            const [handle] = await window.showOpenFilePicker({
              types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
            });
            const file = await handle.getFile();
            const text = await file.text();
            let data = {};
            try {
              data = JSON.parse(text);
            } catch (pErr) {
              throw new Error("File is not valid JSON.");
            }
            executeLibraryMerge(data, file.name);
          } else {
            if (mergeFileInputRef.current) {
              mergeFileInputRef.current.value = '';
              mergeFileInputRef.current.click();
            }
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            setMergeStatus({ type: 'error', message: `Could not open file: ${err.message}` });
          }
        }
      };

      const handleMergeFileInputChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            executeLibraryMerge(data, file.name);
          } catch (err) {
            setMergeStatus({ type: 'error', message: `Failed to parse JSON file: ${err.message}` });
          }
        };
        reader.readAsText(file);
      };

      // Taxonomy stats
      const projectCounts = {};
      const categoryCounts = {};
      const tagCounts = {};
      const allProjects = new Set();
      const allCategories = new Set();
      const allTags = new Set();

      entries.forEach(e => {
        if (Array.isArray(e.projects)) {
          e.projects.forEach(p => {
            allProjects.add(p);
            projectCounts[p] = (projectCounts[p] || 0) + 1;
          });
        }
        if (Array.isArray(e.categories)) {
          e.categories.forEach(c => {
            if (!isEntryTypeTaxonomy(c)) {
              allCategories.add(c);
            }
            categoryCounts[c] = (categoryCounts[c] || 0) + 1;
          });
        }
        if (Array.isArray(e.tags)) {
          e.tags.forEach(t => {
            if (!isEntryTypeTaxonomy(t)) {
              allTags.add(t);
            }
            tagCounts[t] = (tagCounts[t] || 0) + 1;
          });
        }
      });

      const normTax = s => String(s || '').trim().toLowerCase();

      const availableProjects = new Set();
      const availableCategories = new Set();
      const availableTags = new Set();

      entries.forEach(e => {
        const matchesType = activeTypeFilters.includes(getEntryType(e));
        if (!matchesType) return;

        const matchesProject = activeProjects.length === 0 || (Array.isArray(e.projects) && e.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
        const matchesCat = activeCategories.length === 0 || (Array.isArray(e.categories) && e.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
        const matchesTag = activeTags.length === 0 || (Array.isArray(e.tags) && e.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));

        if (matchesProject && matchesTag) {
          if (Array.isArray(e.categories)) e.categories.forEach(c => availableCategories.add(c));
        }
        if (matchesProject && matchesCat) {
          if (Array.isArray(e.tags)) e.tags.forEach(t => availableTags.add(t));
        }
        if (matchesCat && matchesTag) {
          if (Array.isArray(e.projects)) e.projects.forEach(p => availableProjects.add(p));
        }
      });

      const handleProjectClick = (proj, e) => {
        setActiveCategories([]);
        setActiveTags([]);
        if (e.ctrlKey || e.metaKey) {
          setActiveProjects(prev => prev.some(p => normTax(p) === normTax(proj)) ? prev.filter(p => normTax(p) !== normTax(proj)) : [...prev, proj]);
        } else {
          setActiveProjects(prev => (prev.length === 1 && normTax(prev[0]) === normTax(proj)) ? [] : [proj]);
        }
      };

      const handleCategoryClick = (cat, e) => {
        setActiveTags([]);
        if (e.ctrlKey || e.metaKey) {
          setActiveCategories(prev => prev.some(c => normTax(c) === normTax(cat)) ? prev.filter(c => normTax(c) !== normTax(cat)) : [...prev, cat]);
        } else {
          setActiveCategories(prev => (prev.length === 1 && normTax(prev[0]) === normTax(cat)) ? [] : [cat]);
        }
      };

      const handleTagClick = (tag, e) => {
        if (e.ctrlKey || e.metaKey) {
          setActiveTags(prev => prev.some(t => normTax(t) === normTax(tag)) ? prev.filter(t => normTax(t) !== normTax(tag)) : [...prev, tag]);
        } else {
          setActiveTags(prev => (prev.length === 1 && normTax(prev[0]) === normTax(tag)) ? [] : [tag]);
        }
      };

      const sortedProjects = Array.from(allProjects).sort((a, b) => a.localeCompare(b));
      const sortedCategories = Array.from(allCategories).sort((a, b) => a.localeCompare(b));
      const sortedTags = Array.from(allTags).sort((a, b) => {
        const diff = (tagCounts[b] || 0) - (tagCounts[a] || 0);
        return diff !== 0 ? diff : a.localeCompare(b);
      });

      // Ingestion / Add entry
      const processInput = async (textContent, file = null) => {
        if (!apiKeys || apiKeys.length === 0) {
          setShowKeyModal(true);
          return setError("Please set your Gemini API key in Settings first.");
        }
        setIsAnalyzing(true);
        setError(null);
        try {
          let sourceUrl = null;
          let originalWebTitle = null;
          let useSearchTool = false;
          let prompt = '';
          let payloadParts = [];

          const schema = {
            type: "OBJECT",
            properties: {
              title: { type: "STRING" },
              summary: { type: "STRING" },
              shortVersion: { type: "ARRAY", items: { type: "STRING" } },
              fullContent: { type: "STRING" },
              categories: { type: "ARRAY", items: { type: "STRING" } },
              tags: { type: "ARRAY", items: { type: "STRING" } },
              projects: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["title", "summary", "shortVersion", "fullContent", "categories", "tags", "projects"]
          };

          const taxonomyRules = `
          Taxonomy guidelines:
          - Projects: Assign 0-1 scoped initiative from: ${JSON.stringify(Array.from(allProjects))}. Return in lowercase.
          - Categories: Assign 1-2 broad topic/domain categories from existing list: ${JSON.stringify(Array.from(allCategories))}. Return in lowercase.
          - Tags: Assign 2-4 concept tags from existing list if possible: ${JSON.stringify(Array.from(allTags))}. Include author/creator name as tag. Return in lowercase.
          - CRITICAL: Categories and tags MUST represent domain subjects/topics only. NEVER create or assign categories or tags that overlap with entry types or document formats (e.g. do NOT use "notes", "note", "video", "videos", "media", "audio", "web", "website", "prompt", "pdf", "document").`;

          if (file && file.type === 'application/pdf') {
            const base64Data = await readFileAsBase64(file);
            originalWebTitle = file.name;
            prompt = `Analyze this PDF document and return JSON:
            1. Title (Use the document title or "${file.name}").
            2. Ultra-concise TLDR summary (1 short sentence, strictly under 15 words).
            3. 3-5 key points in 'shortVersion'.
            4. Detailed reconstructed fullContent in clean Markdown.
            ${taxonomyRules}`;
            payloadParts = [
              { text: prompt },
              { inlineData: { mimeType: "application/pdf", data: base64Data } }
            ];
          } else if (textContent) {
            const droppedData = textContent.trim();
            const isUrl = /^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(droppedData);
            const isYouTube = isUrl && /(youtube\.com|youtu\.be)/i.test(droppedData);
            sourceUrl = isUrl ? droppedData : null;
            let rawContent = droppedData;

            if (isYouTube) {
              useSearchTool = true;
              let videoId = '';
              try {
                const urlObj = new URL(droppedData);
                videoId = urlObj.hostname.includes('youtu.be') ? urlObj.pathname.slice(1) : urlObj.searchParams.get('v');
              } catch(e) {}
              prompt = `Use Google Search to find the exact content, transcript, or summary for this YouTube video (URL: ${droppedData}, ID: ${videoId}). Return strictly JSON:
              1. Title.
              2. Ultra-concise TLDR summary (1 short sentence, strictly under 15 words).
              3. 3-5 key points in 'shortVersion'.
              4. Detailed reconstructed fullContent in clean Markdown.
              ${taxonomyRules}`;
              payloadParts = [{ text: prompt }];
            } else if (isUrl) {
              try {
                const scrapeResult = await fetchAndScrubUrl(droppedData);
                originalWebTitle = scrapeResult.title;
                rawContent = scrapeResult.content;
                prompt = `Analyze this web article and return strictly JSON:
                1. Title.
                2. Ultra-concise TLDR summary (1 short sentence, strictly under 15 words).
                3. 3-5 key takeaways in 'shortVersion'.
                4. Reconstruct detailed fullContent in clean Markdown.
                ${taxonomyRules}
                Content:\n${rawContent.substring(0, 40000)}`;
              } catch (err) {
                useSearchTool = true;
                prompt = `Use Google Search to find content for this URL: ${droppedData}. Return strictly JSON:
                1. Title. 2. Ultra-concise TLDR summary (1 short sentence, strictly under 15 words). 3. 3-5 key points in 'shortVersion'. 4. Reconstruct detailed fullContent in Markdown. ${taxonomyRules}`;
              }
              payloadParts = [{ text: prompt }];
            } else {
              prompt = `Analyze this text and return strictly JSON:
              1. Descriptive Title. 2. Ultra-concise TLDR summary (1 short sentence, strictly under 15 words). 3. 3-5 key takeaways in 'shortVersion'. 4. Format input text as clean Markdown in 'fullContent'. ${taxonomyRules}
              Content:\n${rawContent.substring(0, 40000)}`;
              payloadParts = [{ text: prompt }];
            }
          } else {
            throw new Error("No valid content to process.");
          }

          const payload = {
            contents: [{ role: 'user', parts: payloadParts }],
            generationConfig: { responseMimeType: "application/json", responseSchema: schema }
          };
          if (useSearchTool) payload.tools = [{ google_search: {} }];

          const metadataModel = taskModels.metadata || DEFAULT_MODEL;
          const result = await handleGeminiCall(payload, metadataModel);
          const parsed = parseAIJson(result.candidates[0].content.parts[0].text);
          const nextNumericId = Math.floor(entries.reduce((max, e) => Math.max(max, e.numericId || 0), 0)) + 1;

          const cleanedCategories = (parsed.categories || [])
            .map(c => String(c).toLowerCase().trim())
            .filter(c => c && !isEntryTypeTaxonomy(c));

          const cleanedTags = (parsed.tags || [])
            .map(t => String(t).toLowerCase().trim())
            .filter(t => t && !isEntryTypeTaxonomy(t));

          const newEntry = {
            id: 'entry-' + Date.now(),
            numericId: nextNumericId,
            title: originalWebTitle || parsed.title || 'Untitled Note',
            summary: parsed.summary || '',
            shortVersion: Array.isArray(parsed.shortVersion) ? parsed.shortVersion : [],
            fullContent: parsed.fullContent || '',
            categories: cleanedCategories,
            tags: [...new Set(cleanedTags)],
            projects: (parsed.projects || []).map(p => String(p).toLowerCase().trim()).filter(Boolean),
            createdAt: Date.now(),
            updatedAt: Date.now(),
            sourceUrl: sourceUrl,
            references: [],
            pinned: false
          };

          setEntries(prev => [newEntry, ...prev]);
          setSelectedEntryIds([newEntry.id]);
          setAddInput('');
        } catch (err) {
          setError(err.message || "Failed to process content.");
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        setError(null);
        if (e.dataTransfer.getData('kb-ref-id') || e.dataTransfer.getData('kb-tax')) return;
        const file = e.dataTransfer.files?.[0];
        const droppedData = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
        if (file && file.type === 'application/pdf') {
          processInput(null, file);
        } else if (droppedData) {
          processInput(droppedData, null);
        }
      };

      const handleEntryClick = (e, id) => {
        if (e.ctrlKey || e.metaKey) {
          const next = selectedEntryIds.includes(id) ? selectedEntryIds.filter(i => i !== id) : [...selectedEntryIds, id];
          selectEntryWithHistory(next);
        } else {
          selectEntryWithHistory([id]);
        }
      };

      const deleteEntry = (id) => {
        if (!window.confirm("Are you sure you want to delete this note?")) return;
        const now = Date.now();
        setTombstones(prev => {
          const updated = { ...prev, [id]: now };
          tombstonesRef.current = updated;
          return updated;
        });
        isDirtyRef.current = true;
        setEntries(prev => prev.filter(e => e.id !== id));
        setSelectedEntryIds(prev => prev.filter(i => i !== id));
        setEditingEntries(prev => { const n = { ...prev }; delete n[id]; return n; });
      };

      const togglePin = (e, id) => {
        e.stopPropagation();
        setEntries(prev => prev.map(ent => ent.id === id ? { ...ent, pinned: !ent.pinned, updatedAt: Date.now() } : ent));
      };

      const handleNewNote = () => {
        const nextNumericId = Math.floor(entries.reduce((max, e) => Math.max(max, e.numericId || 0), 0)) + 1;
        const newId = 'entry-' + Date.now();
        const newEntry = {
          id: newId,
          title: 'Untitled Note',
          numericId: nextNumericId,
          summary: '',
          shortVersion: [],
          fullContent: '',
          categories: [...activeCategories],
          tags: [...activeTags],
          projects: [...activeProjects],
          createdAt: Date.now(),
          updatedAt: Date.now(),
          sourceUrl: null,
          references: [],
          pinned: false
        };
        setEntries(prev => [newEntry, ...prev]);
        selectEntryWithHistory([newId]);
        setEditData(prev => ({
          ...prev,
          [newId]: {
            title: 'Untitled Note',
            summary: '',
            shortVersion: '',
            fullContent: '',
            categories: [...activeCategories],
            tags: [...activeTags],
            projects: [...activeProjects],
            sourceUrl: '',
            references: []
          }
        }));
        setEditingEntries(prev => ({ ...prev, [newId]: true }));
      };

      const handleWriteFromPrompt = () => {
        if (!promptState.draft) return;
        const draft = promptState.draft;
        const nextNumericId = Math.floor(entries.reduce((max, e) => Math.max(max, e.numericId || 0), 0)) + 1;
        const newId = 'entry-' + Date.now();
        const questionText = draft.fullContent || draft.content || '';
        const promptTitle = draft.title || 'Theme Reflection';

        const newEntry = {
          id: newId,
          title: promptTitle,
          numericId: nextNumericId,
          summary: '',
          promptQuestion: questionText,
          shortVersion: [],
          fullContent: '',
          categories: (draft.categories && draft.categories.length > 0)
            ? draft.categories.filter(c => !isEntryTypeTaxonomy(c))
            : activeCategories.filter(c => !isEntryTypeTaxonomy(c)),
          tags: (draft.tags && draft.tags.length > 0)
            ? draft.tags.filter(t => !isEntryTypeTaxonomy(t))
            : activeTags.filter(t => !isEntryTypeTaxonomy(t)),
          projects: (draft.projects && draft.projects.length > 0) ? [...draft.projects] : (activeProjects.length > 0 ? [...activeProjects] : []),
          createdAt: Date.now(),
          updatedAt: Date.now(),
          sourceUrl: null,
          references: [],
          pinned: false
        };

        skipDefocusOnSelectRef.current = true;
        setEntries(prev => [newEntry, ...prev]);
        setSelectedEntryIds([newId]);
        setNavHistory(prev => [[newId], ...prev]);
        setNavIndex(0);
        setEditData(prev => ({
          ...prev,
          [newId]: {
            ...newEntry,
            fullContent: ''
          }
        }));
        setEditingEntries(prev => ({ ...prev, [newId]: true }));
        setPromptState(prev => ({ ...prev, draft: null }));
        if (window.innerWidth < 1024 && typeof setIsListSidebarOpen === 'function') {
          setIsListSidebarOpen(false);
        }
        setIsContentFocused(true);
        setTimeout(() => {
          setIsContentFocused(true);
        }, 30);
      };

      const generatePromptNote = async () => {
        setPromptState({ isGenerating: true, draft: null });
        try {
          const now = Date.now();
          const fourMonthsAgo = now - (120 * 24 * 60 * 60 * 1000);
          
          const hasActiveTaxonomy = activeProjects.length > 0 || activeCategories.length > 0 || activeTags.length > 0;

          // Scope entries strictly to active taxonomies if any are selected
          const scopedEntries = hasActiveTaxonomy
            ? entries.filter(e => {
                if (!e) return false;
                const matchesProject = activeProjects.length === 0 || (Array.isArray(e.projects) && e.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
                const matchesCat = activeCategories.length === 0 || (Array.isArray(e.categories) && e.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
                const matchesTag = activeTags.length === 0 || (Array.isArray(e.tags) && e.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));
                return matchesProject && matchesCat && matchesTag;
              })
            : entries;

          if (scopedEntries.length === 0) {
            if (hasActiveTaxonomy) {
              const scopeDesc = [
                ...activeProjects,
                ...activeCategories,
                ...activeTags.map(t => '#' + t)
              ].join(', ');
              throw new Error(`No notes found matching the selected taxonomy filter(s) [${scopeDesc}] to analyze.`);
            } else {
              throw new Error("No notes found in knowledge base to analyze.");
            }
          }

          // 1. Partition scoped entries across all time into recent (last 4 months) and older history
          const recentEntries = scopedEntries.filter(e => {
            const time = Number(e.createdAt) || Number(e.updatedAt) || now;
            return time >= fourMonthsAgo;
          });
          const olderEntries = scopedEntries.filter(e => {
            const time = Number(e.createdAt) || Number(e.updatedAt) || now;
            return time < fourMonthsAgo;
          });

          // 2. Classify by topic hierarchy:
          //    - Manual entries (yellow / 'note'): highest priority for topic selection
          //    - Previous prompt responses (orange / 'prompt'): secondary priority
          //    - Other colors (media, web, pdf): background context only
          const categorize = (list) => ({
            manual: list.filter(e => getEntryType(e) === 'note'),
            prompt: list.filter(e => getEntryType(e) === 'prompt'),
            context: list.filter(e => getEntryType(e) !== 'note' && getEntryType(e) !== 'prompt')
          });

          const recent = categorize(recentEntries);
          const older = categorize(olderEntries);

          const shuffle = arr => [...arr].sort(() => 0.5 - Math.random());
          const sample = (arr, count) => shuffle(arr).slice(0, count);

          let selectedNotes = [];
          const chosenIds = new Set();
          const addNotes = (notes) => {
            notes.forEach(n => {
              if (n && !chosenIds.has(n.id)) {
                chosenIds.add(n.id);
                selectedNotes.push(n);
              }
            });
          };

          // Higher weighting to last 4 months (~65%), while considering all time (~35%)
          // Heavily prioritize manual notes (yellow), followed by prompt responses, with others as context
          // Recent pool (Last 4 months)
          addNotes(sample(recent.manual, 15));
          addNotes(sample(recent.prompt, 6));
          addNotes(sample(recent.context, 4));

          // Older / All-time history
          addNotes(sample(older.manual, 8));
          addNotes(sample(older.prompt, 4));
          addNotes(sample(older.context, 2));

          // Top up if we haven't reached 35 notes, preserving priority: manual -> prompt -> context
          // Strictly drawn from scopedEntries so notes outside selected taxonomies are never included
          const remaining = scopedEntries.filter(e => !chosenIds.has(e.id));
          if (selectedNotes.length < 35 && remaining.length > 0) {
            const remManual = remaining.filter(e => getEntryType(e) === 'note');
            const remPrompt = remaining.filter(e => getEntryType(e) === 'prompt');
            const remContext = remaining.filter(e => getEntryType(e) !== 'note' && getEntryType(e) !== 'prompt');
            addNotes(sample(remManual, 35 - selectedNotes.length));
            if (selectedNotes.length < 35) addNotes(sample(remPrompt, 35 - selectedNotes.length));
            if (selectedNotes.length < 35) addNotes(sample(remContext, 35 - selectedNotes.length));
          }

          if (selectedNotes.length === 0) {
            throw new Error("No notes found in selected scope to analyze.");
          }

          const contextText = selectedNotes.map(e => {
            const time = Number(e.createdAt) || Number(e.updatedAt) || now;
            const dateStr = new Date(time).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            const isRecent = time >= fourMonthsAgo;
            const type = getEntryType(e);

            let roleLabel = '';
            if (type === 'note') {
              roleLabel = 'PRIMARY TOPIC SOURCE [Manual Note - Yellow]';
            } else if (type === 'prompt') {
              roleLabel = 'SECONDARY TOPIC SOURCE [Previous Prompt Reflection - Orange]';
            } else {
              roleLabel = `BACKGROUND CONTEXT ONLY [External Source - ${type.toUpperCase()}]`;
            }

            const ageLabel = isRecent ? 'Recent (Last 4 Months)' : 'Earlier History';
            const takeaways = Array.isArray(e.shortVersion) && e.shortVersion.length ? `\nTakeaways: ${e.shortVersion.join('; ')}` : '';
            const summary = (type !== 'prompt' && e.summary) ? `\nSummary: ${e.summary}` : '';
            const contentText = e.fullContent ? e.fullContent.trim() : '';
            const snippet = (type === 'prompt' || !summary) && contentText ? `\nContent: ${contentText.substring(0, 350)}` : '';
            return `--- [[kb-ref:${e.id}]] "${e.title || 'Untitled'}" (${roleLabel} | ${dateStr} - ${ageLabel}) ---${summary}${takeaways}${snippet}`;
          }).join('\n\n');

            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { projects: { type: "ARRAY", items: { type: "STRING" } }, categories: { type: "ARRAY", items: { type: "STRING" } }, tags: { type: "ARRAY", items: { type: "STRING" } } } } }
          };
          const result = await handleGeminiCall(payload, taskModels.metadata || DEFAULT_MODEL);
          const resData = parseAIJson(result.candidates[0].content.parts[0].text);
          setEntries(prev => prev.map(e => {
            if (e.id === id) {
              return {
                ...e,
                projects: Array.isArray(resData.projects) ? [...new Set([...(e.projects || []), ...resData.projects.map(p => normTax(p)).filter(Boolean)])] : e.projects,
                categories: Array.isArray(resData.categories) ? [...new Set([...(e.categories || []), ...resData.categories.map(c => normTax(c)).filter(c => c && !isEntryTypeTaxonomy(c))])] : e.categories,
                tags: Array.isArray(resData.tags) ? [...new Set([...(e.tags || []), ...resData.tags.map(t => normTax(t)).filter(t => t && !isEntryTypeTaxonomy(t))])] : e.tags,
                updatedAt: Date.now()
              };
            }
            return e;
          }));
        } catch(err) {
          setError("Auto-tag failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
          setGeneratingField(null);
        }
      };

      // Taxonomy operations
      const performTaxonomyMigration = (oldName, oldType, newType, newName) => {
        const oldLower = oldName.toLowerCase();
        setEntries(prev => prev.map(entry => {
          let newProjs = [...(Array.isArray(entry.projects) ? entry.projects : [])];
          let newCats = [...(Array.isArray(entry.categories) ? entry.categories : [])];
          let newTags = [...(Array.isArray(entry.tags) ? entry.tags : [])];
          let wasModified = false;

          const removeFromList = (list) => {
            if (list.some(i => i.toLowerCase() === oldLower)) {
              wasModified = true;
              return list.filter(i => i.toLowerCase() !== oldLower);
            }
            return list;
          };

          if (oldType === 'project') newProjs = removeFromList(newProjs);
          if (oldType === 'category') newCats = removeFromList(newCats);
          if (oldType === 'tag') newTags = removeFromList(newTags);

          if (wasModified) {
            const targetList = newType === 'project' ? newProjs : newType === 'category' ? newCats : newTags;
            if (!targetList.some(i => i.toLowerCase() === newName.toLowerCase())) {
              targetList.push(newName.toLowerCase());
            }
            return {
              ...entry,
              projects: [...new Set(newProjs)],
              categories: [...new Set(newCats)],
              tags: [...new Set(newTags)],
              updatedAt: Date.now()
            };
          }
          return entry;
        }));
      };

      const handleTaxonomyDrop = (e, targetType, targetName) => {
        e.preventDefault();
        const dataStr = e.dataTransfer.getData('kb-tax');
        if (!dataStr) return;
        try {
          const data = JSON.parse(dataStr);
          if (data.val && data.type && (data.val !== targetName || data.type !== targetType)) {
            performTaxonomyMigration(data.val, data.type, targetType, targetName);
          }
        } catch(err) { console.error(err); }
      };

      const submitTaxonomyRename = (oldName, newName, currentType) => {
        if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
          performTaxonomyMigration(oldName, currentType, currentType, newName.trim());
        }
      };

      const deleteTaxonomy = (type, name) => {
        if (!name) return;
        const displayName = type === 'tag' ? `#${name}` : name;
        if (!window.confirm(`Are you sure you want to delete the ${type} "${displayName}" from all notes?`)) return;
        const targetLower = normTax(name);
        isDirtyRef.current = true;
        setEntries(prev => prev.map(entry => {
          let wasModified = false;
          let newProjs = Array.isArray(entry.projects) ? entry.projects : [];
          let newCats = Array.isArray(entry.categories) ? entry.categories : [];
          let newTags = Array.isArray(entry.tags) ? entry.tags : [];

          if (type === 'project' && newProjs.some(p => normTax(p) === targetLower)) {
            newProjs = newProjs.filter(p => normTax(p) !== targetLower);
            wasModified = true;
          } else if (type === 'category' && newCats.some(c => normTax(c) === targetLower)) {
            newCats = newCats.filter(c => normTax(c) !== targetLower);
            wasModified = true;
          } else if (type === 'tag' && newTags.some(t => normTax(t) === targetLower)) {
            newTags = newTags.filter(t => normTax(t) !== targetLower);
            wasModified = true;
          }

          if (wasModified) {
            return {
              ...entry,
              projects: newProjs,
              categories: newCats,
              tags: newTags,
              updatedAt: Date.now()
            };
          }
          return entry;
        }));

        if (type === 'project') {
          setActiveProjects(prev => prev.filter(p => normTax(p) !== targetLower));
        } else if (type === 'category') {
          setActiveCategories(prev => prev.filter(c => normTax(c) !== targetLower));
        } else if (type === 'tag') {
          setActiveTags(prev => prev.filter(t => normTax(t) !== targetLower));
        }

        setEditData(prev => {
          const next = { ...prev };
          let modified = false;
          Object.keys(next).forEach(id => {
            if (!next[id]) return;
            if (type === 'project' && Array.isArray(next[id].projects) && next[id].projects.some(p => normTax(p) === targetLower)) {
              next[id] = { ...next[id], projects: next[id].projects.filter(p => normTax(p) !== targetLower) };
              modified = true;
            } else if (type === 'category' && Array.isArray(next[id].categories) && next[id].categories.some(c => normTax(c) === targetLower)) {
              next[id] = { ...next[id], categories: next[id].categories.filter(c => normTax(c) !== targetLower) };
              modified = true;
            } else if (type === 'tag' && Array.isArray(next[id].tags) && next[id].tags.some(t => normTax(t) === targetLower)) {
              next[id] = { ...next[id], tags: next[id].tags.filter(t => normTax(t) !== targetLower) };
              modified = true;
            }
          });
          return modified ? next : prev;
        });
      };

      const handleEntryDrop = (e, targetId) => {
        e.preventDefault();
        setDragOverEntryId(null);
        const taxData = e.dataTransfer.getData('kb-tax');
        if (taxData) {
          try {
            const { type, val } = JSON.parse(taxData);
            setEntries(prev => prev.map(ent => {
              if (ent.id === targetId) {
                if (type === 'category' && !(ent.categories || []).includes(val)) return { ...ent, categories: [...(ent.categories || []), val.toLowerCase()], updatedAt: Date.now() };
                if (type === 'tag' && !(ent.tags || []).includes(val)) return { ...ent, tags: [...(ent.tags || []), val.toLowerCase()], updatedAt: Date.now() };
                if (type === 'project' && !(ent.projects || []).includes(val)) return { ...ent, projects: [...(ent.projects || []), val.toLowerCase()], updatedAt: Date.now() };
              }
              return ent;
            }));
          } catch(err) {}
        }
        const draggedId = e.dataTransfer.getData('kb-ref-id');
        if (draggedId && draggedId !== targetId) {
          setEntries(prev => prev.map(ent => {
            if (ent.id === targetId) {
              const refs = ent.references || [];
              if (!refs.includes(draggedId)) {
                return { ...ent, references: [...refs, draggedId], updatedAt: Date.now() };
              }
            }
            return ent;
          }));
        }
      };

      const handleContentDrop = (e, targetEntry) => {
        const draggedId = e.dataTransfer.getData('kb-ref-id');
        if (draggedId && draggedId !== targetEntry.id) {
          e.preventDefault();
          const refShortcode = `\n\n[[kb-ref:${draggedId}]]`;
          setEntries(prev => prev.map(ent =>
            ent.id === targetEntry.id
              ? { ...ent, fullContent: (ent.fullContent || '') + refShortcode, updatedAt: Date.now() }
              : ent
          ));
        }
      };

      const handleContentClick = (e) => {
        const refEl = e.target.closest('.kb-embedded-ref');
        if (refEl) {
          e.preventDefault();
          e.stopPropagation();
          const refId = refEl.getAttribute('data-id');
          if (refId) {
            const found = entries.find(ent => ent.id === refId);
            if (found) {
              setActiveRefModal(found);
              setHoveredRef(null);
            }
          }
        }
      };

      const handleContentMouseOver = (e) => {
        const refEl = e.target.closest('.kb-embedded-ref');
        if (refEl) {
          const refId = refEl.getAttribute('data-id');
          if (refId) {
            const rect = refEl.getBoundingClientRect();
            setHoveredRef({ id: refId, x: rect.left + rect.width / 2, y: rect.top });
          }
        }
      };

      const handleContentMouseOut = (e) => {
        if (e.target.closest('.kb-embedded-ref')) setHoveredRef(null);
      };

      // UNIFIED AI ASSISTANT
      const sendAssistantMessage = async (overrideText = null) => {
        const queryText = (overrideText || assistantInput).trim();
        if (!queryText) return;
        if (!apiKeys || apiKeys.length === 0) {
          setShowKeyModal(true);
          return setError("Please configure your Gemini API key in Settings first.");
        }

        setAssistantInput('');
        setIsAssistantThinking(true);
        setError(null);

        const userMsg = {
          id: 'msg-' + Date.now(),
          role: 'user',
          text: queryText,
          timestamp: Date.now()
        };

        const chatKey = assistantScope === 'workspace' ? 'workspace' : (activeSingleEntry ? activeSingleEntry.id : 'selected');
        const currentHistory = assistantChats[chatKey] || [];
        const updatedMessages = [...currentHistory, userMsg];

        setAssistantChats(prev => ({
          ...prev,
          [chatKey]: updatedMessages
        }));

        try {
          const currentScope = assistantScope;
          let targetDocs = [];

          if (currentScope === 'selected') {
            targetDocs = selectedEntries.length > 0 ? selectedEntries : (activeSingleEntry ? [activeSingleEntry] : (entries.length > 0 ? [entries[0]] : []));
          } else {
            targetDocs = entries;
          }

          if (currentScope === 'selected' && targetDocs.length > 0) {
            let contextText = targetDocs.map(ent => {
              let block = `--- PRIMARY DOCUMENT: ${ent.title} (ID: ${ent.numericId || ent.id}) ---\n`;
              if (ent.summary) block += `Summary: ${ent.summary}\n`;
              if (ent.shortVersion && ent.shortVersion.length > 0) block += `Key Points:\n${ent.shortVersion.map(p => `- ${p}`).join('\n')}\n`;
              if (ent.fullContent) block += `Content:\n${ent.fullContent}\n`;
              if (ent.sourceUrl) block += `Source URL: ${ent.sourceUrl}\n`;
              return block;
            }).join('\n\n');

            const otherEntries = entries.filter(e => !targetDocs.some(se => se.id === e.id));
            let archiveContextText = "";
            if (otherEntries.length > 0) {
              archiveContextText = otherEntries.map(e => {
                let line = `• [[kb-ref:${e.id}]] "${e.title || 'Untitled'}"`;
                if (e.summary) line += `\n  Executive Summary: ${e.summary}`;
                if (Array.isArray(e.shortVersion) && e.shortVersion.length > 0) line += `\n  Key Takeaways: ${e.shortVersion.join(' | ')}`;
                return line;
              }).join('\n\n');
            }

            const payload = {
              contents: [
                ...currentHistory.slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
                { role: 'user', parts: [{ text: queryText }] }
              ],
              systemInstruction: {
                parts: [{
                  text: `You are a helpful AI Assistant for the user's personal knowledge base.
Answer comprehensively based primarily on the active document: "${targetDocs[0]?.title || 'Selected Note'}", using the wider archive of personal notes for context, cross-references, and thematic connections.

CRITICAL RULES:
- Primary focus is on the Selected Active Document.
- You ALSO have access to Executive Summaries and Takeaways of ALL other notes below. Cross-reference other notes using exact syntax [[kb-ref:ID]] (e.g. [[kb-ref:${targetDocs[0]?.id || 'ID'}]]).
- Format responses cleanly in Markdown with headings, bullet points, and concise language.

=== PRIMARY ACTIVE DOCUMENT ===
${contextText}

${archiveContextText ? `=== WIDER PERSONAL CONTEXT (EXECUTIVE SUMMARIES & TAKEAWAYS OF ALL OTHER NOTES) ===\n${archiveContextText}` : ''}`
                }]
              }
            };

            if (targetDocs.some(e => e.sourceUrl)) {
              payload.tools = [{ google_search: {} }];
            }

            const activeAssistantModel = taskModels.assistant || DEFAULT_MODEL;
            const result = await handleGeminiCall(payload, activeAssistantModel);
            const candidate = result.candidates?.[0];
            const parts = candidate?.content?.parts || [];
            const replyText = parts.map(p => p.text || '').filter(Boolean).join('\n').trim() || "No response received.";

            setAssistantChats(prev => ({
              ...prev,
              [chatKey]: [
                ...(prev[chatKey] || updatedMessages),
                { id: 'msg-' + (Date.now() + 1), role: 'model', text: replyText, timestamp: Date.now(), model: activeAssistantModel }
              ]
            }));
          } else {
            const candidateSummaries = entries.map(e => `[kb-ref:${e.id}] (Title: ${e.title}) - ${e.summary || e.fullContent?.substring(0, 150) || ''}`).join('\n');

            const activeAssistantModel = taskModels.assistant || DEFAULT_MODEL;
            const pass1Payload = {
              contents: [{ role: 'user', parts: [{ text: `User query: "${queryText}"\n\nIdentify up to 5 note IDs that are most relevant to answering this query comprehensively. Return ONLY a JSON array of strings (e.g. ["${entries[0]?.id || 'entry-1'}"]). If none apply, return [].\n\nAvailable Notes:\n${candidateSummaries}` }] }],
              generationConfig: { temperature: 0.1 }
            };

            let neededIds = [];
            try {
              const pass1Res = await handleGeminiCall(pass1Payload, activeAssistantModel);
              neededIds = parseAIJson(pass1Res.candidates[0].content.parts[0].text);
              if (!Array.isArray(neededIds)) neededIds = [];
            } catch(e) {
              console.warn("Pass 1 routing fallback:", e);
            }

            const fullContextEntries = entries.filter(e => neededIds.includes(e.id));
            let contextText = `Primary Relevant Notes:\n\n`;
            if (fullContextEntries.length > 0) {
              contextText += fullContextEntries.map(e => `--- [kb-ref:${e.id}] Title: ${e.title} ---\n${e.fullContent || e.summary}`).join('\n\n');
            } else {
              contextText += entries.slice(0, 15).map(e => `--- [kb-ref:${e.id}] Title: ${e.title} ---\n${e.summary}`).join('\n\n');
            }

            const pass2Payload = {
              contents: [
                ...currentHistory.slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
                { role: 'user', parts: [{ text: queryText }] }
              ],
              systemInstruction: {
                parts: [{
                  text: `You are an overarching Knowledge Base Assistant synthesizing information across the user's entire notes archive.
                  CRITICAL RULES:
                  - Always cite sources using exact syntax [[kb-ref:ID]] (e.g. [[kb-ref:entry-1234]]).
                  - Be concise, structured, factual, and direct.
                  - Format in clean Markdown.
                  
                  Context:\n${contextText}`
                }]
              },
              tools: [{ google_search: {} }]
            };

            const result = await handleGeminiCall(pass2Payload, activeAssistantModel);
            const candidate = result.candidates?.[0];
            const parts = candidate?.content?.parts || [];
            const replyText = parts.map(p => p.text || '').filter(Boolean).join('\n').trim() || "No response received.";

            setAssistantChats(prev => ({
              ...prev,
              [chatKey]: [
                ...(prev[chatKey] || updatedMessages),
                { id: 'msg-' + (Date.now() + 1), role: 'model', text: replyText, timestamp: Date.now(), model: activeAssistantModel }
              ]
            }));
          }
        } catch (err) {
          setAssistantChats(prev => ({
            ...prev,
            [chatKey]: [
              ...(prev[chatKey] || updatedMessages),
              { id: 'msg-' + (Date.now() + 1), role: 'model', text: `⚠️ Error: ${err.message}`, timestamp: Date.now() }
            ]
          }));
        } finally {
          setIsAssistantThinking(false);
        }
      };

      const copyMessage = (msgId, text) => {
        navigator.clipboard.writeText(text);
        setActionFeedback({ msgId, type: 'copy' });
        setTimeout(() => setActionFeedback(null), 1500);
      };

      const insertMessageIntoNote = (msgId, text) => {
        if (!activeSingleEntry) {
          setError("Select a single note in the list first to insert this response.");
          return;
        }
        const addition = `\n\n---\n### 💡 AI Synthesis (${new Date().toLocaleDateString()})\n\n${text}\n`;
        setEntries(prev => prev.map(ent =>
          ent.id === activeSingleEntry.id
            ? { ...ent, fullContent: (ent.fullContent || '') + addition, updatedAt: Date.now() }
            : ent
        ));
        setActionFeedback({ msgId, type: 'insert' });
        setTimeout(() => setActionFeedback(null), 1500);
      };

      const handleStartNewChat = () => {
        if (assistantMessages.length > 0) {
          const firstUserMsg = assistantMessages.find(m => m.role === 'user');
          const snippet = firstUserMsg ? firstUserMsg.text.replace(/[\r\n]+/g, ' ').trim() : 'Conversation';
          const chatTitle = snippet.length > 42 ? snippet.substring(0, 42) + '...' : snippet;
          
          const newArchive = {
            id: 'arch-' + Date.now(),
            title: chatTitle,
            timestamp: Date.now(),
            messages: [...assistantMessages]
          };

          setArchivedAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: [newArchive, ...(prev[activeChatKey] || [])]
          }));

          setAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: []
          }));
        }
      };

      const handleArchiveCurrentChat = () => {
        if (assistantMessages.length === 0) return;
        handleStartNewChat();
      };

      const restoreArchivedChat = (archivedChat) => {
        if (assistantMessages.length > 0) {
          const firstUserMsg = assistantMessages.find(m => m.role === 'user');
          const snippet = firstUserMsg ? firstUserMsg.text.replace(/[\r\n]+/g, ' ').trim() : 'Conversation';
          const currentTitle = snippet.length > 42 ? snippet.substring(0, 42) + '...' : snippet;
          
          const currentArchive = {
            id: 'arch-' + Date.now(),
            title: currentTitle,
            timestamp: Date.now(),
            messages: [...assistantMessages]
          };

          setArchivedAssistantChats(prev => {
            const list = (prev[activeChatKey] || []).filter(c => c.id !== archivedChat.id);
            return {
              ...prev,
              [activeChatKey]: [currentArchive, ...list]
            };
          });
        } else {
          setArchivedAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: (prev[activeChatKey] || []).filter(c => c.id !== archivedChat.id)
          }));
        }

        setAssistantChats(prev => ({
          ...prev,
          [activeChatKey]: [...archivedChat.messages]
        }));
      };

      const deleteArchivedChat = (chatId) => {
        if (window.confirm("Delete this previous chat?")) {
          setArchivedAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: (prev[activeChatKey] || []).filter(c => c.id !== chatId)
          }));
          setExpandedArchivedChatIds(prev => prev.filter(id => id !== chatId));
        }
      };

      const handleClearAllArchivedChats = () => {
        if (window.confirm("Clear all previous chats for this conversation?")) {
          setArchivedAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: []
          }));
          setExpandedArchivedChatIds([]);
        }
      };

      const toggleExpandArchivedChat = (chatId) => {
        setExpandedArchivedChatIds(prev => 
          prev.includes(chatId) ? prev.filter(id => id !== chatId) : [...prev, chatId]
        );
      };

      const clearAssistantHistory = () => {
        if (window.confirm("Clear current active chat history? (Archived chats will remain saved)")) {
          setAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: []
          }));
        }
      };

      // Filtered entries
      const filteredEntries = entries.filter(entry => {
        if (!entry) return false;
        const entryType = getEntryType(entry);
        if (!activeTypeFilters.includes(entryType)) return false;
        const matchesProject = activeProjects.length === 0 || (Array.isArray(entry.projects) && entry.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
        const matchesCat = activeCategories.length === 0 || (Array.isArray(entry.categories) && entry.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
        const matchesTag = activeTags.length === 0 || (Array.isArray(entry.tags) && entry.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));
        const searchLower = searchQuery.toLowerCase();
        const matchesSearch = !searchQuery ||
          (entry.title && entry.title.toLowerCase().includes(searchLower)) ||
          (entry.summary && entry.summary.toLowerCase().includes(searchLower)) ||
          (entry.fullContent && entry.fullContent.toLowerCase().includes(searchLower)) ||
          (entry.numericId != null && (`#${entry.numericId}`).includes(searchLower)) ||
          (entry.numericId != null && String(entry.numericId).includes(searchLower));
        return matchesProject && matchesCat && matchesTag && matchesSearch;
      }).sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return (b.numericId || 0) - (a.numericId || 0);
      });

      const activeTaxonomyList = [
        ...activeProjects,
        ...activeCategories,
        ...activeTags.map(t => `#${t}`)
      ];
      const activeTaxonomySummary = activeTaxonomyList.length > 0
        ? (activeTaxonomyList.length <= 2 ? activeTaxonomyList.join(', ') : `${activeTaxonomyList.slice(0, 2).join(', ')} +${activeTaxonomyList.length - 2}`)
        : '';

      const openSettings = () => {
        const currentKeys = [...apiKeys];
        setTempKeys(currentKeys);
        setTempModel(model);
        setTempTaskModels({
          metadata: taskModels.metadata || DEFAULT_MODEL,
          prompts: taskModels.prompts || DEFAULT_MODEL,
          assistant: taskModels.assistant || model || DEFAULT_MODEL
        });
        setTempTheme(theme);
        setMergeStatus(null);
        setFetchModelsError(null);
        setShowKeyModal(true);
        if (availableModels.length === 0 && currentKeys[0]?.key) {
          fetchAvailableModels(currentKeys[0].key);
        }
      };

      const saveSettings = () => {
        const cleanKeys = tempKeys.filter(k => k.key.trim() !== '');
        setApiKeys(cleanKeys);
        const resolvedTaskModels = {
          metadata: tempTaskModels.metadata || DEFAULT_MODEL,
          prompts: tempTaskModels.prompts || DEFAULT_MODEL,
          assistant: tempTaskModels.assistant || tempModel || DEFAULT_MODEL
        };
        setTaskModels(resolvedTaskModels);
        setModel(resolvedTaskModels.assistant);
        setTheme(tempTheme);
        setShowKeyModal(false);
      };

      if (appState === 'init') {
        return (
          <div className="flex h-screen items-center justify-center bg-[var(--bg-main)]">
            <i className="fa-solid fa-spinner fa-spin text-3xl text-[var(--accent)]"></i>
          </div>
        );
      }

      if (appState === 'landing') {
        return (
          <div className="flex h-screen items-center justify-center bg-[var(--bg-main)] p-[50px]">
            <div className="bg-[var(--card-bg)] p-8 md:p-12 rounded-lg shadow-xl text-center max-w-md w-full relative">
              <div className="w-16 h-16 bg-[var(--bg-hover)] text-[var(--accent)] rounded-lg flex items-center justify-center mx-auto mb-6">
                <i className="fa-solid fa-brain text-3xl"></i>
              </div>
              <h1 className="text-xl font-bold text-[var(--text-main)] mb-2 font-mono">Ali Brain</h1>
              <p className="text-[var(--text-muted)] mb-8 text-xs leading-relaxed font-mono">
                Offline-first personal knowledge management. Your data stays 100% private in a local JSON file.
              </p>
              <div className="space-y-3">
                {savedHandle && (
                  <button onClick={handleResume} className="btn-primary w-full py-2.5">
                    <i className="fa-solid fa-rotate-right mr-2"></i> Resume "{savedHandle.name}"
                  </button>
                )}
                <button onClick={handleOpenFile} className="btn-secondary w-full py-2.5 text-xs font-semibold">
                  <i className="fa-regular fa-folder-open mr-2 text-[var(--accent)]"></i> Open Existing File
                </button>
                <button onClick={handleNewFile} className="btn-secondary w-full py-2.5 text-xs font-semibold">

                        <button type="button" onClick={() => setActiveProjects(prev => prev.filter(x => x !== p))} className="hover:text-[var(--danger)] ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>

                    {activeCategories.map(c => (
                      <span key={c} className="badge text-[10px]">
                        <i className="fa-solid fa-layer-group text-[9px] text-[var(--accent)]"></i> {c}
                        <button type="button" onClick={() => setActiveCategories(prev => prev.filter(x => x !== c))} className="hover:text-[var(--danger)] ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>
                    ))}
                    {activeTags.map(t => (
                      <span key={t} className="badge text-[10px]">
                        #{t}
                        <button type="button" onClick={() => setActiveTags(prev => prev.filter(x => x !== t))} className="hover:text-[var(--danger)] ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>
                    ))}

                      type="button" 
                      onClick={() => { setActiveProjects([]); setActiveCategories([]); setActiveTags([]); }}
                      className="text-[10px] text-[var(--text-muted)] hover:text-[var(--accent)] underline ml-1 font-mono"
                    >
                      Clear
                    </button>
                  </div>
