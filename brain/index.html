<body class="bg-[var(--bg-main)] text-[var(--text-main)] font-sans overflow-hidden transition-colors duration-200 antialiased">
  
  <!-- Global Diagnostic Screen -->
  <div id="error-fallback" class="hidden fixed inset-0 bg-[var(--bg-main)] text-[var(--text-main)] p-[50px] flex flex-col items-center justify-center z-[9999]">
    <div class="max-w-md w-full bg-[var(--card-bg)] p-8 rounded-lg shadow-xl text-center">
      <div class="flex items-center justify-center gap-3 text-[var(--danger)] mb-4">
        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
        <h1 class="text-lg font-bold">App Initialization Error</h1>
      </div>
      <p class="text-[var(--text-muted)] text-xs mb-4">A background script encountered an issue.</p>
      <div id="error-details" class="bg-[var(--bg-main)] p-3 rounded font-mono text-xs text-[var(--danger)] overflow-x-auto mb-6 max-h-40 text-left"></div>
      <button onclick="window.location.reload()" class="btn-primary w-full py-2.5">
        <i class="fa-solid fa-rotate-right mr-2"></i> Reload App
      </button>
    </div>
  </div>

  <div id="root"></div>

  <script>
    window.addEventListener('error', function(e) {
      console.error("Captured Error:", e);
      const fallback = document.getElementById('error-fallback');
      const details = document.getElementById('error-details');
      if (fallback && details) {
        fallback.classList.remove('hidden');
        details.textContent = `${e.message}\nLine: ${e.lineno}:${e.colno}\nFile: ${e.filename}`;
      }
    });
  </script>

  <script type="text/babel">

    const { useState, useEffect, useLayoutEffect, useRef } = React;

    // =========================================================================
    // VERSIONING & DOCUMENTATION PROTOCOL:
    // With each functional change or new feature, maintainers MUST:
    // 1. Bump APP_VERSION below (e.g. v2.8.65 -> v2.8.66 or v2.9.0).
    // 2. Update changelog.html and CHANGELOG.md:
    //    - Keep 3-digit dot points (e.g. v2.8.x) ONLY for the current minor series,
    //      merging cumulative/iterative updates into the latest entry.
    //    - When bumping to a new two-digit minor version (e.g. v2.9), condense and
    //      summarize all 3-digit entries from the previous series into a single
    //      round two-digit entry (e.g. "v2.8").
    // 3. Update README.md and readme.html to reflect the modified functionality.
    // =========================================================================
    const APP_VERSION = "v2.8.101";

    const isMediaSource = (url) => {
      if (!url) return false;
      return /(youtube\.com|youtu\.be|vimeo\.com|tiktok\.com|twitch\.tv|dailymotion\.com|spotify\.com|soundcloud\.com|\.(mp4|webm|ogg|mov|mp3|wav|m4a)$)/i.test(url);
    };

    const isPromptEntry = (entry) => {
      if (!entry) return false;
      return Boolean(entry.promptQuestion || (Array.isArray(entry.tags) && entry.tags.includes('prompt')) || (Array.isArray(entry.categories) && entry.categories.includes('prompt')));
    };

    const isSeedEntry = (entry) => {
      if (!entry) return false;
      return entry.type === 'seed' || (Array.isArray(entry.tags) && entry.tags.includes('seed')) || (Array.isArray(entry.tags) && entry.tags.includes('seeds')) || (Array.isArray(entry.categories) && entry.categories.includes('seed')) || (Array.isArray(entry.categories) && entry.categories.includes('seeds'));
    };

    const isAiChatEntry = (entry) => {
      if (!entry) return false;
      return entry.type === 'aiChat' || (Array.isArray(entry.chatMessages) && entry.chatMessages.length > 0) || (Array.isArray(entry.tags) && entry.tags.includes('ai-chat')) || (Array.isArray(entry.categories) && entry.categories.includes('ai-chat'));
    };

    const ENTRY_TYPES = [
      { id: 'note', label: 'Notes', color: '#f59e0b', icon: 'fa-file-lines', description: 'Manual user thoughts, outlines, and notes' },
      { id: 'media', label: 'Media', color: '#ff5252', icon: 'fa-play', description: 'YouTube & Vimeo videos or audio with sync notes' },
      { id: 'web', label: 'Web', color: '#38bdf8', icon: 'fa-link', description: 'Scraped web articles, pages, and processed PDFs' },
      { id: 'prompt', label: 'Prompts', color: '#059669', icon: 'fa-brain', description: 'AI-generated reflection questions & syntheses' },
      { id: 'aiChat', label: 'AI Chat', color: '#a855f7', icon: 'fa-comment-dots', description: 'Archived AI conversations & knowledge syntheses' },
      { id: 'seed', label: 'Seeds', color: '#3b82f6', icon: 'fa-seedling', description: 'AI prompt shortcuts & instructions' }
    ];

    // Keywords and aliases corresponding to entry types that should not be used as categories or tags
    const ENTRY_TYPE_TAXONOMY_KEYWORDS = new Set([
      'note', 'notes',
      'seed', 'seeds',
      'prompt', 'prompts',
      'media', 'video', 'videos', 'audio', 'podcast', 'podcasts',
      'web', 'website', 'webpage', 'article', 'articles',
      'pdf', 'pdfs', 'document', 'documents',
      'aichat', 'ai-chat', 'chat', 'chats'
    ]);

    const isEntryTypeTaxonomy = (term) => {
      if (!term || typeof term !== 'string') return false;
      const clean = term.trim().toLowerCase().replace(/^[#@]/, '');
      return ENTRY_TYPE_TAXONOMY_KEYWORDS.has(clean);
    };

    const getEntryType = (entry) => {
      if (!entry) return 'note';
      if (isAiChatEntry(entry)) return 'aiChat';
      if (isSeedEntry(entry)) return 'seed';
      if (isPromptEntry(entry)) return 'prompt';
      if (isMediaSource(entry.sourceUrl)) return 'media';
      const isPdf = !entry.sourceUrl && entry.title?.toLowerCase().endsWith('.pdf');
      if (isPdf || entry.sourceUrl) return 'web';
      return 'note';
    };

    const ENTRY_TYPE_ACCENTS = {
      note: ['#f59e0b', '#d97706'],
      media: ['#ff5252', '#e03e3e'],
      web: ['#38bdf8', '#0ea5e9'],
      prompt: ['#059669', '#047857'],
      aiChat: ['#a855f7', '#9333ea'],
      seed: ['#3b82f6', '#2563eb']
    };
    const getEntryAccentStyle = (entry) => {
      if (!entry) return undefined;
      const [accent, hover] = ENTRY_TYPE_ACCENTS[getEntryType(entry)] || ENTRY_TYPE_ACCENTS.note;
      return { '--accent': accent, '--accent-hover': hover };
    };

    const getEmbedUrl = (url) => {
      if (!url) return null;
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
      if (match && match[1]) return `https://www.youtube-nocookie.com/embed/${match[1]}?origin=https://localhost`;
      match = url.match(/vimeo\.com\/(?:video\/)?([0-9]+)/);
      if (match && match[1]) return `https://player.vimeo.com/video/${match[1]}`;
      return null;
    };

    const parseMarkdown = (content) => {
      if (typeof marked !== 'undefined' && marked.parse) {
        return marked.parse(content || '');
      }
      return (content || '')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br />');
    };

    const parseMarkdownInline = (content) => {
      if (typeof marked !== 'undefined' && marked.parseInline) {
        return marked.parseInline(content || '');
      }
      return content || '';
    };

    const cleanTitle = (text) => {
      if (!text || typeof text !== 'string') return 'Untitled Note';
      let t = text.trim();
      // Remove outer markdown formatting, brackets, quotes
      t = t.replace(/^[#*"'`]+|[#*"'`]+$/g, '').trim();
      t = t.replace(/^(title|suggested title|titre|subject)\s*:\s*/i, '').trim();
      // Only keep the first line
      t = t.split('\n')[0].trim();
      // If there is a period followed by a sentence and the first sentence has at least 2 words, take the first sentence
      const sentences = t.split(/\.\s+/);
      if (sentences.length > 1 && sentences[0].split(/\s+/).filter(Boolean).length >= 2) {
        t = sentences[0];
      }
      // If there is an abrupt script transition from Latin letters directly to non-Latin characters (e.g. Devanagari/Hindi token glitch), strip from the glitch onwards
      t = t.replace(/([A-Za-z\u00C0-\u024F]{2,})[^\x00-\x7F\u00C0-\u024F\s].*$/, '$1');
      // Tokenize into words and prevent runaway strings or overly long titles
      const rawWords = t.split(/\s+/).filter(Boolean);
      const cleanWords = [];
      for (const w of rawWords) {
        // If an individual unhyphenated word is suspiciously long (> 25 chars), it's runaway text; stop adding
        if (w.length > 25 && !w.includes('-') && !w.includes('/') && !w.includes('_')) {
          break;
        }
        cleanWords.push(w);
        // Strictly enforce a maximum 8 words ceiling for titles
        if (cleanWords.length >= 8) {
          break;
        }
      }
      let result = cleanWords.join(' ').replace(/^[\s,:;.\-]+|[\s,:;.\-]+$/g, '').trim();
      return result || 'Untitled Note';
    };

    const cleanExecutiveSummary = (text, sourceContent = '') => {
      if (!text || typeof text !== 'string') return '';
      let cleaned = text.trim();
      // Strip redundant meta-intros: "This note summarises...", "This document explores...", etc.
      cleaned = cleaned.replace(/^(this\s+(note|document|article|text|video|piece|entry|chat|conversation|dialogue)\s+(summarises|summarizes|provides\s+a\s+summary\s+of|outlines|explores|discusses|details|examines|focuses\s+on|describes|presents|covers|highlights))\s*(that\s+|how\s+|the\s+|an\s+|a\s+|:\s*|\.\s*)?/i, (match, prefix, noun, verb, lead) => {
        if (!lead) return '';
        const trimmedLead = lead.trim();
        if (trimmedLead === ':' || trimmedLead === '.') return '';
        return trimmedLead + ' ';
      });
      cleaned = cleaned.replace(/^(in\s+this\s+(note|document|article|entry),\s*)/i, '');
      cleaned = cleaned.replace(/^(this\s+(note|document|article|entry)\s+is\s+about\s+)/i, '');
      cleaned = cleaned.replace(/^(summary|executive\s+summary|tl;?dr):\s*/i, '');
      cleaned = cleaned.trim();

      // Word count constraints:
      // 1. Strictly no longer than 100 words
      // 2. Not more than 50% longer than content (i.e. summary words <= Math.ceil(sourceWords * 1.5)) when source is substantive
      const words = cleaned.split(/\s+/).filter(Boolean);
      let maxAllowedWords = 100;
      if (sourceContent && typeof sourceContent === 'string') {
        const sourceWords = sourceContent.trim().split(/\s+/).filter(Boolean).length;
        if (sourceWords > 0) {
          const proportionalCap = Math.max(15, Math.ceil(sourceWords * 1.5));
          maxAllowedWords = Math.min(100, proportionalCap);
        }
      }

      if (words.length > maxAllowedWords) {
        cleaned = words.slice(0, maxAllowedWords).join(' ');
        // If cut off mid-sentence, finish with ellipsis or closest punctuation
        if (!/[.!?]$/.test(cleaned)) {
          const lastPunct = Math.max(cleaned.lastIndexOf('.'), cleaned.lastIndexOf('!'), cleaned.lastIndexOf('?'));
          if (lastPunct > cleaned.length * 0.7) {
            cleaned = cleaned.slice(0, lastPunct + 1);
          } else {
            cleaned += '...';
          }
        }
      }

      if (cleaned.length > 0) {
        cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
      }
      return cleaned;
    };

    const injectReferences = (text, allEntries) => {
      if (!text) return '';
      return text.replace(/\[\[(?:kb-ref:|ref:\s*)?([^\]]+)\]\]|\[(?:kb-ref:|ref:\s*)([^\]]+)\](?!\()|\[(entry-[a-zA-Z0-9_-]+)\](?!\()/gi, (match, id1, id2, id3) => {
        const rawId = (id1 || id2 || id3 || '').trim();
        const refEntry = (allEntries || []).find(e => e.id === rawId || String(e.numericId) === rawId);
        if (!refEntry) return `<span class="text-[var(--danger)] text-xs font-semibold px-2 py-0.5 rounded bg-[var(--danger)]/10">[Broken Link: ${rawId}]</span>`;
        return `<span class="kb-embedded-ref" data-id="${refEntry.id}" title="${refEntry.title}">[Ref: ${refEntry.numericId}]</span>`;
      });
    };

    const INITIAL_ENTRY = {
      id: 'sample-1',
      title: 'Welcome to your Knowledge Base',
      summary: 'A clean, local-first personal knowledge base with built-in Gemini AI copilots.',
      shortVersion: [
        'All data auto-saves non-destructively to your local JSON file with zero cloud lock-in.',
        'Add new Notes, Seeds, Prompts, and AI Chats from the action buttons row at the top of the entry list.',
        'You must add notes first before generating Theme Prompts, as prompts require summarized notes to analyze.',
        'Set your Gemini API key in Settings (sliders icon) — AI copilots, summaries, prompts, and chats require it.',
        'Use [Ref: 1] syntax or drag note cards into the editor to create instant interactive backlinks.',
        'Read the comprehensive [System Manual](readme.html) for shortcuts, architecture details, and usage guides.'
      ],
      fullContent: 'Welcome! This application runs entirely in your browser and automatically syncs with your selected local JSON file on your machine.\n\n### Getting Started: Notes, Seeds & Prompts\nUse the quick-action buttons directly at the top of the entry list panel:\n* **+ Note:** Write your own markdown thoughts, journals, or references.\n* **+ Seed:** Create reusable prompt templates and instructions (shortcuts inspired by Gemini Gems). Seeds appear as one-click shortcut chips in the AI Assistant.\n* **+ Prompt:** Generate exploratory theme reflection questions that juxtapose ideas and loose ends across your notes. **Note:** You will need to add some summarized notes to your knowledge base first before Theme Prompts can analyze themes and generate questions!\n* **+ Chat:** Launch a full-width AI Chat session scoped to your active knowledge.\n\n### Scoped Whole Brain & Assistant Chat\n* **Whole Brain Chat:** Clicking **+ Chat** or the assistant drawer synthesizes across your knowledge base. Whole Brain chat dynamically honors your active filters — it scopes context to your **selected entry types, categories, and projects** so you can focus discussions on specific topics or your entire brain.\n* **Google Gemini API Key:** AI summaries, key takeaways, theme prompts, and chat copilots require a Gemini API key. Set your API key in **Settings** (sliders icon) or grab a free key at [Google AI Studio](https://aistudio.google.com/app/apikey). Features relying on AI will remain inactive until a key is saved.\n\n### Interactive Backlinks & References\n* Type `[Ref: 1]` (or `[ref: 1]`) to embed a live interactive citation to this note [Ref: 1]. Hovering previews the target note, and clicking navigates directly to it.\n* You can also drag any note card from the entry list directly into the content editor to insert its backlink.\n\n### Local-First & Non-Destructive Sync\nYour active file remains safely on your disk. Background saving occurs automatically, and you can undo actions anytime using `Cmd+Z` / `Ctrl+Z`.\n\n### Documentation & Manual\nFor the complete user manual, keyboard shortcuts, import/export workflows, and architecture documentation, open the [System Manual](readme.html).',
      categories: ['getting started'],
      tags: ['tutorial'],
      projects: [],
      numericId: 1,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      sourceUrl: null,
      references: [],
      pinned: true
    };

    const normalizeTaxonomy = (entries) => {
      return (entries || []).map(e => ({
        ...e,
        categories: Array.isArray(e.categories) ? [...new Set(e.categories.map(c => String(c).toLowerCase()))] : [],
        tags: Array.isArray(e.tags) ? [...new Set(e.tags.map(t => String(t).toLowerCase()))] : [],
        projects: Array.isArray(e.projects) ? [...new Set(e.projects.map(p => String(p).toLowerCase()))] : []
      }));
    };

    const fetchAndScrubUrl = async (urlString) => {
      let html = '';
      try {
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(urlString)}`);
        const data = await response.json();
        if (data.contents) html = data.contents;
        else throw new Error("Invalid proxy response");
      } catch (err) {
        try {
          const response2 = await fetch(`https://corsproxy.io/?${encodeURIComponent(urlString)}`);
          if (!response2.ok) throw new Error("Network response failed");
          html = await response2.text();
        } catch (err2) {
          throw new Error("Scrape blocked. Falling back to search.");
        }
      }
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      let originalTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || 
                          doc.querySelector('title')?.textContent || 
                          doc.querySelector('h1')?.textContent || 
                          "Untitled Page";
      originalTitle = originalTitle.trim().replace(/\s*[|•-]\s*([A-Za-z0-9 ]+Substack|[A-Za-z0-9 ]+Medium|[A-Za-z0-9 ]+Blog|[A-Za-z0-9 ]+HQ|QUT.*)$/i, '').trim();

      const unwanted = doc.querySelectorAll('script, style, noscript, iframe, svg, video, header, footer, nav, aside, form, .menu, .mega-menu, .global-nav, .navbar');
      unwanted.forEach(el => el.remove());
      
      let mainNode = doc.querySelector('.profile-details') || doc.querySelector('article') || doc.querySelector('main') || doc.body;
      
      let markdownContent = '';
      if (typeof TurndownService !== 'undefined') {
        const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
        markdownContent = turndownService.turndown(mainNode);
      } else {
        markdownContent = mainNode.innerText || mainNode.textContent || '';
      }
      
      if (!markdownContent || markdownContent.length < 50) throw new Error("No text found. Falling back to search.");
      return { title: originalTitle, content: markdownContent.substring(0, 50000) }; 
    };

    const SAFARI_BRIDGE_URL = 'http://127.0.0.1:8765';
    const hasNativeFileSystemAccess = typeof window !== 'undefined' && typeof window.showOpenFilePicker === 'function' && typeof window.showSaveFilePicker === 'function';

    async function checkSafariBridgeStatus(filePath = '') {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 1500);
        const query = filePath ? `?path=${encodeURIComponent(filePath)}` : '';
        const res = await fetch(`${SAFARI_BRIDGE_URL}/status${query}`, {
          method: 'GET',
          signal: controller.signal
        });
        clearTimeout(timer);
        if (!res.ok) return null;
        const data = await res.json();
        return data && data.ok ? data : null;
      } catch (e) {
        return null;
      }
    }

    function createBridgeFileHandle(filePath, fileName) {
      const resolvedName = fileName || (filePath ? filePath.split('/').pop() : 'knowledge-base.json');
      return {
        isBridgeHandle: true,
        path: filePath,
        name: resolvedName,
        queryPermission: async () => 'granted',
        requestPermission: async () => 'granted',
        getFile: async () => {
          const res = await fetch(`${SAFARI_BRIDGE_URL}/file?path=${encodeURIComponent(filePath)}`);
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            throw new Error(data.error || 'Could not read file from Safari Local Sync Bridge.');
          }
          return {
            name: data.name || resolvedName,
            path: data.path || filePath,
            lastModified: data.lastModified || Date.now(),
            text: async () => (typeof data.content === 'string' ? data.content : '')
          };
        },
        createWritable: async () => {
          let buffer = '';
          return {
            write: async (chunk) => {
              buffer += typeof chunk === 'string' ? chunk : JSON.stringify(chunk);
            },
            close: async () => {
              const res = await fetch(`${SAFARI_BRIDGE_URL}/file`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: filePath, content: buffer })
              });
              const data = await res.json().catch(() => ({}));
              if (!res.ok || !data.ok) {
                throw new Error(data.error || 'Failed to write file via Safari Local Sync Bridge.');
              }
            }
          };
        }
      };
    }

    function serializeFileHandleForStorage(handle) {
      if (!handle) return null;
      if (handle.isBridgeHandle) {
        return {
          isBridgeHandle: true,
          path: handle.path,
          name: handle.name
        };
      }
      return handle;
    }

    function hydrateFileHandle(raw) {
      if (!raw) return null;
      if (raw.isBridgeHandle && raw.path) {
        return createBridgeFileHandle(raw.path, raw.name);
      }
      return raw;
    }

    async function verifyPermission(fileHandle, readWrite) {
      if (!fileHandle) return false;
      if (fileHandle.isBridgeHandle) {
        const status = await checkSafariBridgeStatus(fileHandle.path);
        return Boolean(status && status.ok && status.exists);
      }
      const options = { mode: readWrite ? 'readwrite' : 'read' };

        const inputTokens = Number(usage.promptTokenCount) || 0;
        const candidatesTokens = Number(usage.candidatesTokenCount) || 0;
        const thoughtsTokens = Number(usage.thoughtsTokenCount) || 0;
        const outputTokens = (candidatesTokens + thoughtsTokens) || Math.max(0, (Number(usage.totalTokenCount) || 0) - inputTokens);
        return { inputTokens, outputTokens };
      }
      const estIn = fallbackInputText ? Math.ceil(String(fallbackInputText).length / 4) : 0;

      const storedIn = Number(storedTokenUsage?.inputTokens) || 0;
      const storedOut = Number(storedTokenUsage?.outputTokens) || 0;
      return {

      const parts = candidateObj.content?.parts || candidateObj.parts;

    const parseAIJson = (textOrCandidate) => {
      if (!textOrCandidate) return null;
      if (typeof textOrCandidate === 'object' && !textOrCandidate.parts && !Array.isArray(textOrCandidate.content?.parts) && (textOrCandidate.summary || textOrCandidate.title || textOrCandidate.content || textOrCandidate.question || textOrCandidate.prompt || textOrCandidate.theme || textOrCandidate.shortVersion || textOrCandidate.projects || textOrCandidate.categories || textOrCandidate.tags)) {
        return textOrCandidate;
      }
      const text = typeof textOrCandidate === 'string' ? textOrCandidate : getCandidateText(textOrCandidate);
      if (!text || typeof text !== 'string') return null;
      let t = text.trim();
      const fenceMatch = t.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
      if (fenceMatch) {
        t = fenceMatch[1].trim();
      }
      if (!t.startsWith('{') && !t.startsWith('[')) {
        const firstBrace = t.indexOf('{');
        const lastBrace = t.lastIndexOf('}');
        if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
          t = t.substring(firstBrace, lastBrace + 1).trim();
        }
      }
      try {
        return JSON.parse(t);
      } catch (e) {
        // Fallback for truncated or slightly malformed JSON
        try {
          let fixed = t;
          if (!fixed.endsWith('}')) {
            if (fixed.lastIndexOf('"') > fixed.lastIndexOf(':')) {
              fixed += '"';
            }
            fixed += '}';
          }
          return JSON.parse(fixed);
        } catch (e2) {
          // Extract known fields via regex fallback
          const extracted = {};
          const titleMatch = t.match(/["']?(?:title|Title|suggestedTitle|suggested_title|headline|name)["']?\s*:\s*["']?([^"',}\n]+)/i);
          if (titleMatch) extracted.title = titleMatch[1].replace(/^["']+|["']+$/g, '').trim();
          const summaryMatch = t.match(/"summary"\s*:\s*"([\s\S]*?)(?:"|\Z)/i);
          if (summaryMatch) extracted.summary = summaryMatch[1];
          const contentMatch = t.match(/"(?:content|question|prompt|reflection|inquiry)"\s*:\s*"([\s\S]*?)(?:"\s*,\s*"[a-zA-Z]+"|"\s*\}|$)/i);
          if (contentMatch) extracted.content = contentMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n').trim();
          const themeMatch = t.match(/"theme"\s*:\s*"([\s\S]*?)(?:"\s*,\s*"[a-zA-Z]+"|"\s*\}|$)/i);
          if (themeMatch) extracted.theme = themeMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n').trim();
          const selectedIdsMatch = t.match(/"selectedIds"\s*:\s*\[([\s\S]*?)\]/i);
          if (selectedIdsMatch) {
            try {
              extracted.selectedIds = JSON.parse(`[${selectedIdsMatch[1]}]`);
            } catch (sErr) {}
          }
          const shortVersionMatch = t.match(/"shortVersion"\s*:\s*\[([\s\S]*?)\]/i);
          if (shortVersionMatch) {
            try {
              extracted.shortVersion = JSON.parse(`[${shortVersionMatch[1]}]`);
            } catch (svErr) {}
          }
          const projectsMatch = t.match(/"projects"\s*:\s*\[([\s\S]*?)\]/i);
          if (projectsMatch) {
            try {
              extracted.projects = JSON.parse(`[${projectsMatch[1]}]`);
            } catch (pErr) {}
          }
          const categoriesMatch = t.match(/"categories"\s*:\s*\[([\s\S]*?)\]/i);
          if (categoriesMatch) {
            try {
              extracted.categories = JSON.parse(`[${categoriesMatch[1]}]`);
            } catch (cErr) {}
          }
          const tagsMatch = t.match(/"tags"\s*:\s*\[([\s\S]*?)\]/i);
          if (tagsMatch) {
            try {
              extracted.tags = JSON.parse(`[${tagsMatch[1]}]`);
            } catch (tErr) {}
          }
          if (Object.keys(extracted).length > 0) return extracted;
          console.warn('Failed to parse AI JSON:', t, e);
          return null;
        }
      }
    };

    const EditableText = ({ text, onSave, className = '', tag = 'span', multiline = false, stripPrefix = '', renderView = null, placeholder = '', disabled = false }) => {
      const [isEditing, setIsEditing] = useState(false);

      const handleDoubleClick = (e) => {
        if (disabled) return;
        e.stopPropagation();
        setIsEditing(true);
      };

      const handleBlur = () => {
        if (disabled) return;
        setIsEditing(false);
        if (elementRef.current) {
          let newText = elementRef.current.innerText;
          if (newText !== undefined && newText !== null) {
            newText = newText.trim();
          } else {
            newText = '';
          }
          const originalText = (text || '').trim();
          if (newText !== originalText && newText !== (stripPrefix + originalText).trim()) {
            if (stripPrefix && newText.startsWith(stripPrefix)) {
              newText = newText.substring(stripPrefix.length);
            }
            onSave(newText);
          } else if (!renderView) {
            elementRef.current.innerText = (stripPrefix || '') + (text || placeholder || '');
          }
        }
      };

      const handleKeyDown = (e) => {
        if (disabled) return;
        if (e.key === 'Enter' && !e.shiftKey && !multiline) {
          e.preventDefault();
          elementRef.current.blur();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          setIsEditing(false);
          if (elementRef.current && !renderView) {
            elementRef.current.innerText = (stripPrefix || '') + (text || placeholder || '');
          }
        }
      };

      useEffect(() => {
        if (elementRef.current && !isEditing && !renderView) {
          elementRef.current.innerText = (stripPrefix || '') + (text || placeholder || '');
        }
      }, [text, isEditing, stripPrefix, renderView, placeholder]);

      useEffect(() => {
        if (isEditing && !disabled && elementRef.current) {
          elementRef.current.innerText = (stripPrefix || '') + (text || '');
          elementRef.current.focus();
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(elementRef.current);
          selection.removeAllRanges();
          selection.addRange(range);
        }
      }, [isEditing, disabled]);

      const Tag = tag;

      return (
        <Tag
          ref={elementRef}
          contentEditable={isEditing && !disabled}
          onDoubleClick={handleDoubleClick}
          onBlur={handleBlur}
          onKeyDown={handleKeyDown}
          className={`${className} ${!text && placeholder ? 'italic opacity-60' : ''} ${isEditing && !disabled ? 'outline-none rounded bg-[var(--card-bg)] text-[var(--text-main)] cursor-text p-2 font-mono whitespace-pre-wrap text-sm block not-italic opacity-100' : ''}`}
          suppressContentEditableWarning={true}
          title={!isEditing && !disabled ? "Double-click to edit inline" : undefined}
        >
          {isEditing && !disabled ? (stripPrefix || '') + (text || '') : (renderView ? renderView(text) : `${stripPrefix || ''}${text || placeholder}`)}
        </Tag>
      );
    };

      const migrateWorkspaceData = (data) => {
        let migratedEntries = [];
        if (data.entries && Array.isArray(data.entries)) {
          migratedEntries = processLoadedEntries(data.entries).map(e => ({
            ...e,
            title: cleanTitle(e.title || 'Untitled Note'),
            summary: cleanExecutiveSummary(e.summary || ''),
            updatedAt: e.updatedAt || e.createdAt || Date.now()
          }));
        } else {
          migratedEntries = [INITIAL_ENTRY];
        }

        let loadedTombstones = {};
        if (data.tombstones && typeof data.tombstones === 'object' && !Array.isArray(data.tombstones)) {
          const CUTOFF = Date.now() - (60 * 24 * 60 * 60 * 1000); // 60-day prune
          Object.entries(data.tombstones).forEach(([id, time]) => {
            const t = Number(time);
            if (t > CUTOFF) loadedTombstones[id] = t;
          });
        }

        let parsedKeys = data.apiKeys || [];
        if (!parsedKeys.length && data.apiKey) {
          parsedKeys = data.apiKey.split(',').map((k, i) => ({ id: 'k' + Date.now() + i, name: 'Key ' + (i + 1), key: k.trim() })).filter(k => k.key);
        }

        let loadedArchived = { workspace: [] };
        if (data.archivedAssistantChats && typeof data.archivedAssistantChats === 'object') {
          loadedArchived = data.archivedAssistantChats;
        } else if (data.chats && typeof data.chats === 'object') {
          loadedArchived = {};
          Object.entries(data.chats).forEach(([k, val]) => {
            if (Array.isArray(val)) {
              if (val.length > 0 && val[0].messages) {
                loadedArchived[k] = val;
              } else if (val.length > 0 && val[0].role) {
                loadedArchived[k] = [{
                  id: 'arch-migrated-' + Date.now(),
                  title: val[0].text ? (val[0].text.substring(0, 40) + '...') : 'Archived Chat',
                  timestamp: Date.now(),
                  messages: val
                }];
              } else {
                loadedArchived[k] = [];
              }
            }
          });
        }

        let loadedStoredPrompts = [];
        if (Array.isArray(data.storedPrompts)) {
          loadedStoredPrompts = data.storedPrompts;
        } else if (Array.isArray(data.generatedPrompts)) {
          loadedStoredPrompts = data.generatedPrompts;
        }

        let loadedLayout = {
          isLeftSidebarOpen: true,
          isListSidebarOpen: true,
          isAssistantOpen: false
        };
        if (data && data.layout && typeof data.layout === 'object') {
          if (typeof data.layout.isLeftSidebarOpen === 'boolean') loadedLayout.isLeftSidebarOpen = data.layout.isLeftSidebarOpen;
          if (typeof data.layout.isListSidebarOpen === 'boolean') loadedLayout.isListSidebarOpen = data.layout.isListSidebarOpen;
          if (typeof data.layout.isAssistantOpen === 'boolean') loadedLayout.isAssistantOpen = data.layout.isAssistantOpen;
        } else if (data) {
          if (typeof data.isLeftSidebarOpen === 'boolean') loadedLayout.isLeftSidebarOpen = data.isLeftSidebarOpen;
          if (typeof data.isListSidebarOpen === 'boolean') loadedLayout.isListSidebarOpen = data.isListSidebarOpen;
          if (typeof data.isAssistantOpen === 'boolean') loadedLayout.isAssistantOpen = data.isAssistantOpen;
        }

        let loadedTaskModels = {
          metadata: DEFAULT_MODEL,
          prompts: DEFAULT_MODEL,
          assistant: DEFAULT_MODEL
        };
        if (data && data.taskModels && typeof data.taskModels === 'object') {
          loadedTaskModels = {
            metadata: data.taskModels.metadata || DEFAULT_MODEL,
            prompts: data.taskModels.prompts || DEFAULT_MODEL,
            assistant: data.taskModels.assistant || data.model || DEFAULT_MODEL
          };
        } else if (data && data.model) {
          loadedTaskModels = {
            metadata: data.model,
            prompts: data.model,
            assistant: data.model
          };
        }

        let loadedPromptConfig = { ...DEFAULT_PROMPT_CONFIG };
        if (data && data.promptConfig && typeof data.promptConfig === 'object') {
          if (typeof data.promptConfig.dateRangeMonths === 'number') loadedPromptConfig.dateRangeMonths = data.promptConfig.dateRangeMonths;
          if (typeof data.promptConfig.poolSize === 'number') loadedPromptConfig.poolSize = data.promptConfig.poolSize;
          if (typeof data.promptConfig.temperature === 'number') loadedPromptConfig.temperature = data.promptConfig.temperature;
          if (typeof data.promptConfig.model === 'string') loadedPromptConfig.model = data.promptConfig.model;
          if (typeof data.promptConfig.maxNotes === 'number') loadedPromptConfig.maxNotes = data.promptConfig.maxNotes;
          if (typeof data.promptConfig.instructions === 'string') loadedPromptConfig.instructions = data.promptConfig.instructions;
        }

        return {
          entries: migratedEntries,
          tombstones: loadedTombstones,
          storedPrompts: loadedStoredPrompts,
          promptConfig: loadedPromptConfig,
          apiKeys: parsedKeys,
          model: data.model || loadedTaskModels.assistant || DEFAULT_MODEL,
          taskModels: loadedTaskModels,
          theme: data.theme || 'default',
          assistantChats: (data.assistantChats && typeof data.assistantChats === 'object')
            ? data.assistantChats
            : (Array.isArray(data.assistantMessages) ? { workspace: data.assistantMessages } : { workspace: [] }),
          archivedAssistantChats: loadedArchived,
          layout: loadedLayout,
          isLeftSidebarOpen: loadedLayout.isLeftSidebarOpen,
          isListSidebarOpen: loadedLayout.isListSidebarOpen,
          isAssistantOpen: loadedLayout.isAssistantOpen
        };
      };

      const saveStateRef = useRef({
        entries,
        tombstones,
        storedPrompts,
        promptConfig,
        apiKeys,
        model,
        taskModels,
        theme,
        assistantChats,
        archivedAssistantChats,
        appState,
        fileHandle,
        editData,
        editingEntries,
        isLeftSidebarOpen,
        isListSidebarOpen,
        isAssistantOpen
      });

      useEffect(() => {
        saveStateRef.current = {
          entries,
          tombstones,
          storedPrompts,
          promptConfig,
          apiKeys,
          model,
          taskModels,
          theme,
          assistantChats,
          archivedAssistantChats,
          appState,
          fileHandle,
          editData,
          editingEntries,
          isLeftSidebarOpen,
          isListSidebarOpen,
          isAssistantOpen
        };
      }, [entries, tombstones, storedPrompts, promptConfig, apiKeys, model, taskModels, theme, assistantChats, archivedAssistantChats, appState, fileHandle, editData, editingEntries, isLeftSidebarOpen, isListSidebarOpen, isAssistantOpen]);

      // Non-Destructive Entry-Level 3-Way Merge Algorithm
      const mergeDatabases = (localState, incomingRawData) => {
        const incoming = migrateWorkspaceData(incomingRawData);

        // 1. Tombstone merging & pruning (60-day cutoff)
        const SIXTY_DAYS = 60 * 24 * 60 * 60 * 1000;
        const cutoff = Date.now() - SIXTY_DAYS;
        const mergedTombstones = {};

        const addTombstone = (id, time) => {
          const t = Number(time) || 0;
          if (t > cutoff) {
            mergedTombstones[id] = Math.max(mergedTombstones[id] || 0, t);
          }
        };

        if (localState.tombstones) {
          Object.entries(localState.tombstones).forEach(([id, time]) => addTombstone(id, time));
        }
        if (incoming.tombstones) {
          Object.entries(incoming.tombstones).forEach(([id, time]) => addTombstone(id, time));
        }

        // 2. Index local entries and incoming entries
        const localMap = new Map();
        (localState.entries || []).forEach(e => {
          if (e && e.id) localMap.set(e.id, { ...e });
        });

        const incomingMap = new Map();
        (incoming.entries || []).forEach(e => {
          if (e && e.id) incomingMap.set(e.id, { ...e });
        });

        const allIds = new Set([...localMap.keys(), ...incomingMap.keys()]);
        const mergedList = [];
        let addedCount = 0;
        let updatedCount = 0;
        let conflictCount = 0;

        const getEntryTime = (e) => Number(e.updatedAt) || Number(e.createdAt) || 0;

        allIds.forEach(id => {
          const local = localMap.get(id);
          const inc = incomingMap.get(id);
          const tombTime = mergedTombstones[id] || 0;

          // Case 1: Only in local
          if (local && !inc) {
            const localTime = getEntryTime(local);
            if (tombTime >= localTime) {
              // Deleted externally on disk
              return;
            }
            mergedList.push(local);
            return;
          }

          // Case 2: Only in incoming
          if (!local && inc) {
            const incTime = getEntryTime(inc);
            if (tombTime >= incTime) {
              // Deleted locally
              return;
            }
            mergedList.push(inc);
            addedCount++;
            return;
          }

          // Case 3: In both local and incoming
          const localTime = getEntryTime(local);
          const incTime = getEntryTime(inc);

          // If deleted after the latest edit
          if (tombTime >= Math.max(localTime, incTime)) {
            return;
          }

          // If edited after tombstone, keep note and remove tombstone
          if (mergedTombstones[id]) {
            delete mergedTombstones[id];
          }

          const localContent = (local.fullContent || '').trim();
          const incContent = (inc.fullContent || '').trim();
          const localTitle = (local.title || '').trim();
          const incTitle = (inc.title || '').trim();
          const contentsDiffer = (localContent !== incContent || localTitle !== incTitle);

          if (!contentsDiffer) {
            // Text is identical: preserve newer timestamp and metadata
            const preferred = incTime > localTime ? { ...local, ...inc } : { ...inc, ...local };
            mergedList.push({ ...preferred, numericId: local.numericId || inc.numericId });
          } else if (incTime > localTime) {
            // Disk version is newer
            // Did local modify this concurrently?
            if (localState.isDirty && Math.abs(incTime - localTime) < 86400000) {
              // Concurrent edit: keep disk as primary, duplicate local as conflict copy
              mergedList.push({ ...inc, numericId: local.numericId || inc.numericId });
              const conflictCopy = {
                ...local,
                id: 'conflict-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                numericId: undefined,
                title: `[Conflict Copy] ${local.title || 'Untitled'}`,
                updatedAt: Date.now()
              };
              mergedList.push(conflictCopy);
              conflictCount++;
            } else {
              mergedList.push({ ...inc, numericId: local.numericId || inc.numericId });
              updatedCount++;
            }
          } else if (localTime > incTime) {
            // Local version is newer
            if (localState.lastSyncTime && incTime > localState.lastSyncTime) {
              // Both modified concurrently: keep local as primary, disk as conflict copy
              mergedList.push(local);
              const conflictCopy = {
                ...inc,
                id: 'conflict-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                numericId: undefined,
                title: `[Conflict Copy] ${inc.title || 'Untitled'}`,
                updatedAt: Date.now()
              };
              mergedList.push(conflictCopy);
              conflictCount++;
            } else {
              mergedList.push(local);
            }
          } else {
            // Timestamps equal but contents differ: keep local
            mergedList.push(local);
          }
        });

        // 3. Merge Assistant Chats
        const updatedChats = { ...(localState.assistantChats || { workspace: [] }) };
        if (incoming.assistantChats && typeof incoming.assistantChats === 'object') {
          Object.entries(incoming.assistantChats).forEach(([k, msgs]) => {
            if (Array.isArray(msgs) && msgs.length > 0) {
              if (!updatedChats[k] || updatedChats[k].length === 0) {
                updatedChats[k] = msgs;
              }
            }
          });
        }

        // 4. Merge Archived Assistant Chats
        const updatedArchived = { ...(localState.archivedAssistantChats || { workspace: [] }) };
        if (incoming.archivedAssistantChats && typeof incoming.archivedAssistantChats === 'object') {
          Object.entries(incoming.archivedAssistantChats).forEach(([k, archList]) => {
            if (Array.isArray(archList) && archList.length > 0) {
              const currentList = updatedArchived[k] || [];
              const currentIds = new Set(currentList.map(c => c.id));
              const toAdd = archList.filter(c => c && c.id && !currentIds.has(c.id));
              if (toAdd.length > 0) {
                updatedArchived[k] = [...currentList, ...toAdd];
              }
            }
          });
        }

        // 5. Merge Prompts
        const localPrompts = localState.storedPrompts || [];
        const incomingPrompts = incoming.storedPrompts || [];
        const promptMap = new Map();
        localPrompts.forEach(p => { if (p) promptMap.set(p.id || p.promptQuestion || JSON.stringify(p), p); });
        incomingPrompts.forEach(p => { if (p) promptMap.set(p.id || p.promptQuestion || JSON.stringify(p), p); });
        const mergedPrompts = Array.from(promptMap.values());

        return {
          entries: processLoadedEntries(mergedList),
          tombstones: mergedTombstones,
          assistantChats: updatedChats,
          archivedAssistantChats: updatedArchived,
          storedPrompts: mergedPrompts,
          promptConfig: localState.promptConfig || incoming.promptConfig || DEFAULT_PROMPT_CONFIG,
          apiKeys: (localState.apiKeys && localState.apiKeys.length > 0) ? localState.apiKeys : incoming.apiKeys,
          model: localState.model || incoming.model || DEFAULT_MODEL,
          taskModels: localState.taskModels || incoming.taskModels || {
            metadata: DEFAULT_MODEL,
            prompts: DEFAULT_MODEL,
            assistant: localState.model || incoming.model || DEFAULT_MODEL
          },
          theme: localState.theme || incoming.theme,
          layout: localState.isDirty ? (localState.layout || { isLeftSidebarOpen: localState.isLeftSidebarOpen, isListSidebarOpen: localState.isListSidebarOpen, isAssistantOpen: localState.isAssistantOpen }) : (incoming.layout || localState.layout),
          isLeftSidebarOpen: localState.isDirty ? localState.isLeftSidebarOpen : (incoming.isLeftSidebarOpen ?? localState.isLeftSidebarOpen),
          isListSidebarOpen: localState.isDirty ? localState.isListSidebarOpen : (incoming.isListSidebarOpen ?? localState.isListSidebarOpen),
          isAssistantOpen: localState.isDirty ? localState.isAssistantOpen : (incoming.isAssistantOpen ?? localState.isAssistantOpen),
          addedCount,
          updatedCount,
          conflictCount
        };
      };

      const saveWorkspaceToDisk = async (force = false) => {
        const current = saveStateRef.current;
        if (current.appState !== 'workspace') return;
        if (!current.fileHandle) return;

        // Skip saving if clean and not forced
        if (!isDirtyRef.current && !force) return;

        if (isSavingRef.current) {
          savePendingRef.current = true;
          return;
        }

        isSavingRef.current = true;
        try {
          let currentEntries = current.entries;
          let currentTombstones = tombstonesRef.current || {};
          let currentChats = current.assistantChats;
          let currentArchived = current.archivedAssistantChats;
          let currentPrompts = current.storedPrompts || [];
          let currentKeys = current.apiKeys;
          let currentModel = current.model;
          let currentTaskModels = current.taskModels || { metadata: DEFAULT_MODEL, prompts: DEFAULT_MODEL, assistant: current.model || DEFAULT_MODEL };
          let currentTheme = current.theme;

          // Non-destructive check: Did disk file change externally since our last sync?
          try {
            const file = await current.fileHandle.getFile();
            if (file.lastModified > (lastSyncTimeRef.current || 0) + 1500) {
              const diskText = await file.text();
              if (diskText.trim()) {
                const diskData = JSON.parse(diskText);
                const merged = mergeDatabases(
                  {
                    entries: currentEntries,
                    tombstones: currentTombstones,
                    assistantChats: currentChats,
                    archivedAssistantChats: currentArchived,
                    storedPrompts: currentPrompts,
                    promptConfig: current.promptConfig,
                    apiKeys: currentKeys,
                    model: currentModel,
                    taskModels: currentTaskModels,
                    theme: currentTheme,
                    isDirty: isDirtyRef.current,
                    lastSyncTime: lastSyncTimeRef.current
                  },
                  diskData
                );

                currentEntries = merged.entries;
                currentTombstones = merged.tombstones;
                currentChats = merged.assistantChats;
                currentArchived = merged.archivedAssistantChats;
                currentPrompts = merged.storedPrompts;
                currentKeys = merged.apiKeys;
                currentModel = merged.model;
                currentTaskModels = merged.taskModels || currentTaskModels;
                currentTheme = merged.theme;

                setHistoryState(h => ({
                  past: h.past,
                  present: currentEntries
                }));
                setTombstones(currentTombstones);
                tombstonesRef.current = currentTombstones;
                setAssistantChats(currentChats);
                setArchivedAssistantChats(currentArchived);
                setStoredPrompts(currentPrompts);
                if (merged.promptConfig) setPromptConfig(merged.promptConfig);
                setTaskModels(currentTaskModels);
                setModel(currentModel);

                if (merged.addedCount > 0 || merged.updatedCount > 0 || merged.conflictCount > 0) {
                  setSyncNotification({
                    time: Date.now(),
                    msg: `Merged: ${merged.addedCount ? `+${merged.addedCount} new ` : ''}${merged.updatedCount ? `~${merged.updatedCount} updated ` : ''}${merged.conflictCount ? `(${merged.conflictCount} conflicts saved)` : ''}`
                  });
                }
              }
            }
          } catch (readErr) {
            console.warn("External pre-save check failed:", readErr);
          }

          // Clean up any empty AI chat placeholders before saving to disk
          currentEntries = currentEntries.filter(e => {
            if (isAiChatEntry(e)) {
              const msgs = Array.isArray(e.chatMessages) ? e.chatMessages : [];
              const isEmpty = msgs.length === 0 || !msgs.some(m => m.text && m.text.trim());
              if (isEmpty) return false;
            }
            return true;
          });

          const dataToWrite = {
            entries: currentEntries,
            tombstones: currentTombstones,
            storedPrompts: currentPrompts,
            promptConfig: current.promptConfig || DEFAULT_PROMPT_CONFIG,
            apiKeys: currentKeys,
            model: currentModel,
            taskModels: currentTaskModels,
            theme: currentTheme,
            assistantMessages: (currentChats['workspace'] || []).slice(-50),
            assistantChats: currentChats,
            archivedAssistantChats: currentArchived,
            chats: currentArchived,
            layout: {
              isLeftSidebarOpen: current.isLeftSidebarOpen,
              isListSidebarOpen: current.isListSidebarOpen,
              isAssistantOpen: current.isAssistantOpen
            },
            isLeftSidebarOpen: current.isLeftSidebarOpen,
            isListSidebarOpen: current.isListSidebarOpen,
            isAssistantOpen: current.isAssistantOpen,
            updatedAt: Date.now()
          };

          const writable = await current.fileHandle.createWritable();
          await writable.write(JSON.stringify(dataToWrite, null, 2));
          await writable.close();

          const updatedFile = await current.fileHandle.getFile();
          lastSyncTimeRef.current = updatedFile.lastModified;
          setLastSyncTime(updatedFile.lastModified);
          isDirtyRef.current = false;

          if (typeof idbKeyval !== 'undefined') {
            try {
              await idbKeyval.set('kb_workspace_backup', {
                data: dataToWrite,
                savedAt: Date.now()
              });
            } catch (idbErr) {
              console.warn("IndexedDB backup failed:", idbErr);
            }
          }
        } catch (err) {
          console.error("Workspace save failed:", err);
        } finally {
          isSavingRef.current = false;
          if (savePendingRef.current) {
            savePendingRef.current = false;
            saveWorkspaceToDisk();
          }
        }
      };

      // Pull updates from disk in background without overwriting
      const pullExternalChangesIfAny = async () => {
        const current = saveStateRef.current;
        if (current.appState !== 'workspace' || !current.fileHandle || isSavingRef.current) return;
        if (isContentFocused) return;

        try {
          const file = await current.fileHandle.getFile();
          if (file.lastModified > (lastSyncTimeRef.current || 0) + 1500) {
            const diskText = await file.text();
            if (!diskText.trim()) return;
            let diskData;
            try {
              diskData = JSON.parse(diskText);
            } catch (pErr) {
              return;
            }

            const merged = mergeDatabases(
              {
                entries: current.entries,
                tombstones: tombstonesRef.current || {},
                assistantChats: current.assistantChats,
                archivedAssistantChats: current.archivedAssistantChats,
                storedPrompts: current.storedPrompts,
                apiKeys: current.apiKeys,
                model: current.model,
                taskModels: current.taskModels,
                theme: current.theme,
                isDirty: isDirtyRef.current,
                lastSyncTime: lastSyncTimeRef.current
              },
              diskData
            );

            setHistoryState(h => ({
              past: h.past,
              present: merged.entries
            }));
            setTombstones(merged.tombstones);
            tombstonesRef.current = merged.tombstones;
            setAssistantChats(merged.assistantChats);
            setArchivedAssistantChats(merged.archivedAssistantChats);
            setStoredPrompts(merged.storedPrompts);
            if (merged.promptConfig) setPromptConfig(merged.promptConfig);
            if (merged.taskModels) setTaskModels(merged.taskModels);
            if (merged.model) setModel(merged.model);
            if (!isDirtyRef.current && merged.layout) {
              setIsLeftSidebarOpen(merged.layout.isLeftSidebarOpen);
              setIsListSidebarOpen(merged.layout.isListSidebarOpen);
            }

            lastSyncTimeRef.current = file.lastModified;
            setLastSyncTime(file.lastModified);

            if (merged.addedCount > 0 || merged.updatedCount > 0 || merged.conflictCount > 0) {
              setSyncNotification({
                time: Date.now(),
                msg: `Synced: ${merged.addedCount ? `+${merged.addedCount} new ` : ''}${merged.updatedCount ? `~${merged.updatedCount} updated ` : ''}${merged.conflictCount ? `(${merged.conflictCount} conflicts)` : ''}`
              });
            }
          }
        } catch (err) {
          console.warn("Pulling external changes failed:", err);
        }
      };

      // 1. Reactive Debounced Auto-Save to disk on actual state changes
      useEffect(() => {
        if (appState !== 'workspace') return;
        if (!isLoadedRef.current) return;
        isDirtyRef.current = true;
        const timer = setTimeout(() => {
          saveWorkspaceToDisk();
        }, 1200);
        return () => clearTimeout(timer);
      }, [entries, storedPrompts, apiKeys, model, taskModels, theme, assistantChats, archivedAssistantChats, tombstones, isLeftSidebarOpen, isListSidebarOpen, isAssistantOpen]);

      // 2. Periodic sync (every 10 seconds): save if dirty, or pull external changes if clean
      useEffect(() => {
        if (appState !== 'workspace') return;

          if (isDirtyRef.current) {
            saveWorkspaceToDisk();
          } else {
            pullExternalChangesIfAny();
          }
        }, 10000);
        return () => clearInterval(interval);
      }, [appState]);

      // 3. Tab visibility change and focus sync listeners
      useEffect(() => {
        const handleBeforeUnload = () => {
          if (editingEntriesRef.current) {
            const activeEditingIds = Object.keys(editingEntriesRef.current).filter(id => editingEntriesRef.current[id]);
            activeEditingIds.forEach(id => {
              if (saveNoteRef.current) saveNoteRef.current(id);
            });
          }
          if (isDirtyRef.current) {
            saveWorkspaceToDisk();
          }
        };

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'hidden') {
            if (editingEntriesRef.current) {
              const activeEditingIds = Object.keys(editingEntriesRef.current).filter(id => editingEntriesRef.current[id]);
              activeEditingIds.forEach(id => {
                if (saveNoteRef.current) saveNoteRef.current(id);
              });
            }
            if (isDirtyRef.current) {
              saveWorkspaceToDisk();
            }
          } else if (document.visibilityState === 'visible') {
            if (!isDirtyRef.current) {
              pullExternalChangesIfAny();
            }
          }
        };

        const handleFocus = () => {
          if (!isDirtyRef.current) {
            pullExternalChangesIfAny();
          }
        };

        window.addEventListener('beforeunload', handleBeforeUnload);
        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('focus', handleFocus);

        return () => {
          window.removeEventListener('beforeunload', handleBeforeUnload);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('focus', handleFocus);
        };
      }, []);

      // Auto-clear sync notification after 4.5s
      useEffect(() => {
        if (!syncNotification) return;
        const t = setTimeout(() => setSyncNotification(null), 4500);
        return () => clearTimeout(t);
      }, [syncNotification]);

      const convertChatMessagesToEntry = (messages, existingEntries = entries) => {
        if (!Array.isArray(messages) || messages.length === 0) return null;
        const userMessages = messages.filter(m => m.role === 'user');
        const firstUserMsg = userMessages[0];
        const snippet = firstUserMsg ? firstUserMsg.text.replace(/[\r\n]+/g, ' ').trim() : 'AI Chat Session';
        const chatTitle = snippet.length > 50 ? snippet.substring(0, 50) + '...' : snippet;
        const markdownTranscript = messages.map(m => `**${m.role === 'user' ? 'User' : 'AI Assistant'}:**\n\n${m.text}`).join('\n\n---\n\n');
        const targetList = Array.isArray(existingEntries) && existingEntries.length > 0 ? existingEntries : (entries || []);
        const nextNumericId = Math.floor(targetList.reduce((max, e) => Math.max(max, e.numericId || 0), 0)) + 1;

        const userQueries = userMessages.map(m => m.text.replace(/[\r\n]+/g, ' ').trim()).filter(Boolean);
        const queryTopicsSummary = userQueries.slice(0, 3).map(q => `"${q.length > 55 ? q.substring(0, 55) + '...' : q}"`).join(', ');
        const descriptiveSummary = userQueries.length > 0
          ? `Archived Whole Brain AI dialogue synthesizing knowledge base notes around ${queryTopicsSummary}. Comprises ${messages.length} message exchanges between user and AI copilot.`
          : `Archived Whole Brain AI conversation session containing ${messages.length} collaborative message exchanges across the knowledge base.`;

        const descriptiveTakeaways = userQueries.length > 0
          ? userQueries.slice(0, 5).map(q => `Inquiry topic: ${q.length > 110 ? q.substring(0, 110) + '...' : q}`)
          : [`Archived conversational dialogue containing ${messages.length} message exchanges.`];

        return {
          id: newId,
          type: 'aiChat',
          title: chatTitle,
          numericId: nextNumericId,
          summary: descriptiveSummary,
          shortVersion: descriptiveTakeaways,
          fullContent: markdownTranscript,
          chatMessages: messages.map(m => ({ ...m })),
          categories: ['ai chat'],
          tags: ['ai-chat'],
          projects: [],
          createdAt: Date.now(),
          updatedAt: Date.now(),
          sourceUrl: null,
          references: [],
          pinned: false
        };
      };

      const loadWorkspaceData = async (rawHandle) => {
        try {
          const handle = hydrateFileHandle(rawHandle);
          const hasPerm = await verifyPermission(handle, true);
          if (!hasPerm) {
            setAppState('landing');
            return false;
          }
          const file = await handle.getFile();
          const text = await file.text();
          
          let data = { entries: [] };
          if (text.trim()) data = JSON.parse(text);
          
          const migrated = migrateWorkspaceData(data);
          let activeEntries = migrated.entries;
          let loadedChats = migrated.assistantChats || { workspace: [] };
          let chatArchivedOnLoad = false;
          const activeWholeBrainMsgs = loadedChats.workspace || [];
          if (Array.isArray(activeWholeBrainMsgs) && activeWholeBrainMsgs.length > 0) {
            const archivedChatEntry = convertChatMessagesToEntry(activeWholeBrainMsgs, activeEntries);
            if (archivedChatEntry) {
              activeEntries = [archivedChatEntry, ...activeEntries];
              loadedChats = { ...loadedChats, workspace: [] };
              chatArchivedOnLoad = true;
            }
          }

          setHistoryState({ past: [], present: activeEntries });
          // On app load, AI chat entries are not visible in list view by default; select the most recent note of other types
          const visibleEntriesOnLoad = activeEntries
            .filter(e => e && !isAiChatEntry(e))
            .sort((a, b) => {
              if (a.pinned && !b.pinned) return -1;
              if (!a.pinned && b.pinned) return 1;
              return (b.numericId || 0) - (a.numericId || 0);
            });
          const initialEntryCandidate = visibleEntriesOnLoad[0] || activeEntries[0];
          const initialIds = initialEntryCandidate ? [initialEntryCandidate.id] : [];
          setSelectedEntryIds(initialIds);
          setNavHistory(initialIds.length > 0 ? [initialIds] : []);
          setNavIndex(initialIds.length > 0 ? 0 : -1);
          
          setTombstones(migrated.tombstones || {});
          tombstonesRef.current = migrated.tombstones || {};
          setStoredPrompts(migrated.storedPrompts || []);
          if (migrated.promptConfig) setPromptConfig(migrated.promptConfig);
          setApiKeys(migrated.apiKeys);
          setModel(migrated.model);
          setTaskModels(migrated.taskModels || {
            metadata: DEFAULT_MODEL,
            prompts: DEFAULT_MODEL,
            assistant: migrated.model || DEFAULT_MODEL
          });
          setTheme(migrated.theme);
          setAssistantChats(loadedChats);
          assistantChatsRef.current = loadedChats;
          setArchivedAssistantChats(migrated.archivedAssistantChats || { workspace: [] });
          setExpandedArchivedChatIds([]);
          if (migrated.layout) {
            setIsLeftSidebarOpen(migrated.layout.isLeftSidebarOpen);
            setIsListSidebarOpen(migrated.layout.isListSidebarOpen);
          }
          const initialEntryMsgs = (initialEntryCandidate && loadedChats[initialEntryCandidate.id]) || [];
          const initialHasEntryChat = Array.isArray(initialEntryMsgs) && initialEntryMsgs.some(m => m && m.text && String(m.text).trim());
          setIsAssistantOpen(initialHasEntryChat);
          
          setFileHandle(handle);
          setSavedHandle(handle);
          setFileName(file.name);
          setLastSyncTime(file.lastModified);
          lastSyncTimeRef.current = file.lastModified;
          isDirtyRef.current = chatArchivedOnLoad;
          isLoadedRef.current = false;
          setTimeout(() => { isLoadedRef.current = true; }, 1500);
          
          if (typeof idbKeyval !== 'undefined') {
            await idbKeyval.set('kb_file_handle', serializeFileHandleForStorage(handle));
          }
          setAppState('workspace');
          return true;
        } catch (err) {
          console.error("Failed to open workspace:", err);
          setError(`Failed to open workspace: ${err.message}`);
          setAppState('landing');
          return false;
        }
      };

      const handleResume = () => loadWorkspaceData(savedHandle);

      const handleOpenFile = async () => {
        setError(null);
        try {
          if (hasNativeFileSystemAccess) {
            const [handle] = await window.showOpenFilePicker({
              types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
            });
            await loadWorkspaceData(handle);
            return;
          }

          const res = await fetch(`${SAFARI_BRIDGE_URL}/pick-open`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ remember: true })
          }).catch(() => null);

          if (!res) {
            setSafariBridgeStatus('offline');
            throw new Error("Safari Local File Sync Bridge is not running yet. Download and run Enable-Safari-Sync.command below first.");
          }

          const data = await res.json().catch(() => ({}));
          if (data.cancelled) return;
          if (!res.ok || !data.ok) {
            throw new Error(data.error || "Could not open file via Safari Local Sync Bridge.");
          }
          setSafariBridgeStatus('online');
          const handle = createBridgeFileHandle(data.path, data.name);
          await loadWorkspaceData(handle);
        } catch (err) {
          if (err.name !== 'AbortError') setError(`File error: ${err.message}`);
        }
      };

      const handleNewFile = async () => {
        setError(null);
        try {
          let handle;
          if (hasNativeFileSystemAccess) {
            handle = await window.showSaveFilePicker({
              suggestedName: 'my-knowledge-base.json',
              types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
            });
          } else {
            const res = await fetch(`${SAFARI_BRIDGE_URL}/pick-save`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ suggestedName: 'my-knowledge-base.json' })
            }).catch(() => null);

            if (!res) {
              setSafariBridgeStatus('offline');
              throw new Error("Safari Local File Sync Bridge is not running yet. Download and run Enable-Safari-Sync.command below first.");
            }

            const data = await res.json().catch(() => ({}));
            if (data.cancelled) return;
            if (!res.ok || !data.ok) {
              throw new Error(data.error || "Could not create file via Safari Local Sync Bridge.");

          setModel(DEFAULT_MODEL);
          setTaskModels({
            metadata: DEFAULT_MODEL,

          setTheme('default');
          setAssistantChats({ workspace: [] });
          setArchivedAssistantChats({ workspace: [] });
          setExpandedArchivedChatIds([]);
          setSelectedEntryIds([INITIAL_ENTRY.id]);
          setNavHistory([[INITIAL_ENTRY.id]]);
          setNavIndex(0);
          
          const file = await handle.getFile();
