          setPromptState({ isGenerating: false, draft: previousDraft || null });
        }
      };

      const startEditing = (entry) => {
        if (!entry || isAiChatEntry(entry)) return;
        setEditData(prev => ({
          ...prev,
          [entry.id]: {
            title: entry.title || '',
            summary: entry.summary || '',
            promptQuestion: entry.promptQuestion || '',
            fullContent: entry.fullContent || (
              Array.isArray(entry.chatMessages) && entry.chatMessages.length > 0
                ? entry.chatMessages.map(m => `**${m.role === 'user' ? 'User' : 'Assistant'}:**\n\n${m.text}`).join('\n\n---\n\n')
                : (Array.isArray(entry.chatHistory) && entry.chatHistory.length > 0
                    ? entry.chatHistory.map(m => `**${m.role === 'user' ? 'User' : 'Assistant'}:**\n\n${m.text}`).join('\n\n---\n\n')
                    : '')
            ),
            shortVersion: (Array.isArray(entry.shortVersion) ? entry.shortVersion : []).join('\n'),
            categories: Array.isArray(entry.categories) ? [...entry.categories] : [],
            tags: Array.isArray(entry.tags) ? [...entry.tags] : [],
            projects: Array.isArray(entry.projects) ? [...entry.projects] : [],
            sourceUrl: entry.sourceUrl || '',
            references: Array.isArray(entry.references) ? entry.references : []
          }
        }));
        setEditingEntries(prev => ({ ...prev, [entry.id]: true }));
      };

      // =========================================================================
      // CANONICAL METADATA FIELD DEFINITION REGISTRY (Single Source of Truth)
      // All single-field generators and combined initial auto-generation MUST use
      // these unified field specifications for instructions, schemas, and cleaning.
      // =========================================================================
      const METADATA_FIELD_SPECS = {
        title: {
          key: 'title',
          getInstructions: (entry) => {
            const isPrompt = isPromptEntry(entry);
            if (isPrompt && entry?.promptQuestion) {
              return "In 'title': Suggest a punchy, reflective title (strictly 3 to 6 words maximum) based on the user's answer. Never append explanations, quotes, preambles, or summaries.";
            }
            return "In 'title': Suggest a punchy, highly descriptive title (strictly 3 to 6 words maximum). Never append explanations, quotes, preambles, or summaries.";
          },
          schemaProperty: {
            type: "STRING",
            description: "Concise title, strictly 3 to 6 words maximum. Never include quotes, explanations, preambles, or summaries."
          },
          apply: (parsed, currentEntry, updates, contentToAnalyze, rawText = '') => {
            let candidate = null;
            if (parsed && typeof parsed === 'object') {
              candidate = parsed.title || parsed.Title || parsed.suggestedTitle || parsed.suggested_title || parsed.noteTitle || parsed.note_title || parsed.name || parsed.headline || parsed.heading;
              if (!candidate && Array.isArray(parsed)) {
                candidate = parsed[0]?.title || parsed[0]?.Title || parsed[0];
              }
            } else if (typeof parsed === 'string' && parsed.trim()) {
              candidate = parsed.trim();
            }
            let finalTitle = null;
            if (candidate && typeof candidate === 'string' && candidate.trim()) {
              const cleaned = cleanTitle(candidate.trim());
              if (cleaned && cleaned !== 'Untitled Note') {
                finalTitle = cleaned;
              }
            }
            if (!finalTitle && rawText) {
              const tm = rawText.match(/["']?(?:title|Title|suggestedTitle|suggested_title|noteTitle|note_title|headline|heading|name)["']?\s*:\s*["']([^"'\n]+)["']/i);
              if (tm) {
                const cleaned = cleanTitle(tm[1].trim());
                if (cleaned && cleaned !== 'Untitled Note') finalTitle = cleaned;
              }
            }
            if (!finalTitle && contentToAnalyze) {
              const firstLine = contentToAnalyze.split('\n').map(l => l.replace(/^#+\s*/, '').trim()).find(l => l.length >= 3);
              if (firstLine) {
                const cleaned = cleanTitle(firstLine);
                if (cleaned && cleaned !== 'Untitled Note') finalTitle = cleaned;
              }
            }
            if (finalTitle) {
              updates.title = finalTitle;
            }
          }
        },

        summary: {
          key: 'summary',
          getInstructions: (entry) => {
            const isPrompt = isPromptEntry(entry);
            if (isPrompt && entry?.promptQuestion) {
              return "In 'summary': Provide a concise, thoughtful executive summary (1-2 sentences, strictly under 70 words, maximum 100 words, and never more than 50% longer than the user's response) directly synthesizing the answer. CRITICAL: Jump straight into substance; no meta-intros.";
            }
            return "In 'summary': Provide a concise, punchy executive summary (1-2 sentences, strictly under 70 words, maximum 100 words, and never more than 50% longer than the note content). CRITICAL: Jump straight into substance; no meta-intros.";
          },
          schemaProperty: {
            type: "STRING",
            description: "Concise executive summary, strictly no longer than 100 words and proportional to content length."
          },
          apply: (parsed, currentEntry, updates, contentToAnalyze) => {
            let candidate = null;
            if (parsed && typeof parsed === 'object') {
              candidate = parsed.summary || parsed.Summary || parsed.tldr || parsed.executive_summary;
            } else if (typeof parsed === 'string' && parsed.trim()) {
              candidate = parsed.trim();
            }
            if (candidate && typeof candidate === 'string' && candidate.trim()) {
              updates.summary = cleanExecutiveSummary(candidate.trim(), contentToAnalyze);
            }
          }
        },

        taxonomies: {
          key: 'taxonomies',
          getInstructions: (entry, taxContext = {}) => {
            const knownProjects = JSON.stringify(Array.from(taxContext.allProjects || []));
            const knownCategories = JSON.stringify(Array.from(taxContext.allCategories || []));
            const knownTags = JSON.stringify(Array.from(taxContext.allTags || []));
            return [
              `In 'projects': Assign 0-1 scoped initiative from: ${knownProjects}. Return lowercase strings.`,
              `In 'categories': Assign 1-2 topic/domain categories from: ${knownCategories}. Return lowercase strings.`,
              `In 'tags': Assign 2-4 concept keywords, reusing when applicable: ${knownTags}. Return lowercase strings.`,
              "CRITICAL TAXONOMY RULE: Categories and tags MUST represent domain topics only. NEVER assign words representing entry types or document formats (e.g. 'notes', 'note', 'video', 'videos', 'media', 'audio', 'web', 'website', 'prompt', 'pdf', 'document')."
            ];
          },
          schemaProperties: {
            projects: {
              type: "ARRAY",
              items: { type: "STRING" },
              description: "0 to 1 scoped initiative project in lowercase."
            },
            categories: {
              type: "ARRAY",
              items: { type: "STRING" },
              description: "1 to 2 broad topic/domain categories in lowercase."
            },
            tags: {
              type: "ARRAY",
              items: { type: "STRING" },
              description: "2 to 4 concept keywords in lowercase."
            }
          },
          apply: (parsed, currentEntry, updates) => {
            if (!parsed || typeof parsed !== 'object') return;
            const curProjects = Array.isArray(currentEntry?.projects) ? currentEntry.projects : [];
            const curCategories = Array.isArray(currentEntry?.categories) ? currentEntry.categories : [];
            const curTags = Array.isArray(currentEntry?.tags) ? currentEntry.tags : [];

            if (Array.isArray(parsed.projects)) {
              const cleanedProjects = parsed.projects.map(p => normTax(p)).filter(Boolean);
              if (cleanedProjects.length > 0) {
                updates.projects = [...new Set([...curProjects, ...cleanedProjects])];
              }
            }
            if (Array.isArray(parsed.categories)) {
              const cleanedCats = parsed.categories.map(c => normTax(c)).filter(c => c && !isEntryTypeTaxonomy(c));
              if (cleanedCats.length > 0) {
                updates.categories = [...new Set([...curCategories, ...cleanedCats])];
              }
            }
            if (Array.isArray(parsed.tags)) {
              const cleanedTags = parsed.tags.map(t => normTax(t)).filter(t => t && !isEntryTypeTaxonomy(t));
              if (cleanedTags.length > 0) {
                updates.tags = [...new Set([...curTags, ...cleanedTags])];
              }
            }
          }
        },

        takeaways: {
          key: 'takeaways',
          getInstructions: () => {
            return "In 'shortVersion': Extract 3-5 descriptive, insightful key takeaways that provide substantive context and actionable depth rather than brief fragments.";
          },
          schemaProperty: {
            type: "ARRAY",
            items: { type: "STRING" },
            description: "3 to 5 descriptive, insightful key takeaways."
          },
          apply: (parsed, currentEntry, updates) => {
            const list = (parsed && typeof parsed === 'object' && Array.isArray(parsed.shortVersion))
              ? parsed.shortVersion
              : (Array.isArray(parsed) ? parsed : null);
            if (list && list.length > 0) {
              updates.shortVersion = list.map(s => String(s).trim()).filter(Boolean);
            }
          }
        }
      };

      const getEntryForAnalysis = (id) => {
        return (entriesRef.current || []).find(e => e.id === id) || entries.find(e => e.id === id) || (editDataRef.current && editDataRef.current[id]) || (editData && editData[id]);
      };

      const getEntryContentForAnalysis = (id, entry) => {
        let liveContent = '';
        if (contentTextareaRef.current && activeSingleEntryRef.current?.id === id) {
          liveContent = contentTextareaRef.current.value || '';
        }
        const stagedEdit = (editDataRef.current && editDataRef.current[id]) || (editData && editData[id]);
        const chatContent = (Array.isArray(entry?.chatMessages) && entry.chatMessages.length > 0)
          ? entry.chatMessages.map(m => `**${m.role === 'user' ? 'User' : 'Assistant'}:** ${m.text}`).join('\n\n')
          : (Array.isArray(entry?.chatHistory) && entry.chatHistory.length > 0
              ? entry.chatHistory.map(m => `**${m.role === 'user' ? 'User' : 'Assistant'}:** ${m.text}`).join('\n\n')
              : '');
        return (liveContent || stagedEdit?.fullContent || entry?.fullContent || chatContent || entry?.summary || '').trim();
      };

      const buildMetadataPayload = (fieldKeys, entry, contentToAnalyze, taxContext) => {
        const instructions = [];
        const schemaProps = {};

        fieldKeys.forEach(key => {
          const spec = METADATA_FIELD_SPECS[key];
          if (!spec) return;

          if (key === 'taxonomies') {
            const taxInstrs = spec.getInstructions(entry, taxContext);
            taxInstrs.forEach(instr => instructions.push(instr));
            Object.assign(schemaProps, spec.schemaProperties);
          } else {
            const instr = spec.getInstructions(entry, taxContext);
            instructions.push(instr);
            const propKey = key === 'takeaways' ? 'shortVersion' : key;
            schemaProps[propKey] = spec.schemaProperty;
          }
        });

        const isPrompt = isPromptEntry(entry);
        const existingTitle = (entry?.title || '').trim();
        const isUntitled = !existingTitle || /^untitled(\s+note)?(\s*#?\d+)?$/i.test(existingTitle) || existingTitle.toLowerCase() === 'theme reflection' || existingTitle.toLowerCase() === 'theme prompt';
        const titleContext = (isUntitled || fieldKeys.includes('title')) ? '' : `Title: ${existingTitle}\n`;
        const promptContext = (isPrompt && entry?.promptQuestion)
          ? `Prompt Question:\n${entry.promptQuestion}\n\nUser's Answer/Response:\n`
          : 'Content:\n';

        const numberedInstructions = instructions.map((ins, i) => `${i + 1}. ${ins}`).join('\n');
        const aiPrompt = `Analyze this note and generate the requested metadata:\n${numberedInstructions}\n\n${titleContext}${promptContext}${contentToAnalyze.substring(0, 30000)}`;

        const requiredProps = Object.keys(schemaProps);
        // Expand token ceiling to 4096 across all metadata calls so thinking/reasoning models
        // (e.g. Gemini 2.5 Flash, Gemini 2.5 Pro) never exhaust output limits during internal reasoning.
        const maxTokens = 4096;

        return {
          contents: [{ role: 'user', parts: [{ text: aiPrompt }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: schemaProps,
              required: requiredProps
            },
            temperature: 0.2,
            maxOutputTokens: maxTokens
          }
        };
      };

      const applyMetadataResults = (fieldKeys, parsed, entry, contentToAnalyze, rawText = '') => {
        const updates = {};
        fieldKeys.forEach(key => {
          const spec = METADATA_FIELD_SPECS[key];
          if (spec && spec.apply) {
            spec.apply(parsed, entry, updates, contentToAnalyze, rawText);
          }
        });
        return updates;
      };

      const saveNote = async (id) => {
        if (savingIdsRef.current.has(id)) return;
        setIsContentFocused(false);
        if (contentTextareaRef.current && activeSingleEntryRef.current?.id === id) {
          const val = contentTextareaRef.current.value;
          if (val !== undefined && val !== null) {
            editDataRef.current = {
              ...editDataRef.current,
              [id]: {
                ...(editDataRef.current[id] || activeSingleEntryRef.current),
                fullContent: val
              }
            };
          }
        }
        const existingEntry = (entriesRef.current || []).find(e => e.id === id) || entries.find(e => e.id === id);
        const data = (editDataRef.current && editDataRef.current[id]) || editData[id] || existingEntry;
        if (!data) return;

        // If manual note is untitled and content is empty, delete it on save/defocus
        const checkContent = (data.fullContent !== undefined && data.fullContent !== null ? data.fullContent : (existingEntry?.fullContent || '')).trim();
        const checkTitle = (data.title !== undefined && data.title !== null ? data.title : (existingEntry?.title || '')).trim();
        const isDefaultTitle = !checkTitle || /^untitled(\s+(note|seed))?(\s*#?\d+)?$/i.test(checkTitle);
        const isNotAiChat = !isAiChatEntry(existingEntry || data);
        if (isNotAiChat && !checkContent && isDefaultTitle && !(existingEntry || data).sourceUrl) {
          setEntries(prev => prev.filter(e => e.id !== id));
          setNavHistory(prev => prev.map(hist => hist.filter(i => i !== id)).filter(h => h.length > 0));
          setSelectedEntryIds(prev => prev.filter(i => i !== id));
          setEditingEntries(prev => { const n = { ...prev }; delete n[id]; return n; });
          setEditData(prev => { const n = { ...prev }; delete n[id]; return n; });
          if (editDataRef.current) { delete editDataRef.current[id]; }
          savingIdsRef.current.delete(id);
          return;
        }
        savingIdsRef.current.add(id);

        const isSeed = isSeedEntry(existingEntry || data);
        const rawShortVersion = isSeed ? [] : (typeof data.shortVersion === 'string'
          ? data.shortVersion.split('\n').map(s => s.trim()).filter(Boolean)
          : (Array.isArray(data.shortVersion) ? data.shortVersion : (existingEntry?.shortVersion || [])));

        const initialSavedEntry = {
          type: (data.type !== undefined) ? data.type : (existingEntry?.type || (isSeed ? 'seed' : undefined)),
          title: (data.title !== undefined && data.title !== null) ? data.title.trim() : (existingEntry?.title || (isSeed ? 'Untitled Seed' : 'Untitled Note')),
          summary: isSeed ? '' : ((data.summary !== undefined && data.summary !== null) ? data.summary.trim() : (existingEntry?.summary || '')),
          promptQuestion: data.promptQuestion || existingEntry?.promptQuestion || undefined,
          fullContent: (data.fullContent !== undefined && data.fullContent !== null) ? data.fullContent : (existingEntry?.fullContent || ''),
          shortVersion: rawShortVersion,
          sourceUrl: data.sourceUrl !== undefined ? data.sourceUrl : (existingEntry?.sourceUrl || null),
          categories: (data.categories || existingEntry?.categories || []).map(c => String(c).toLowerCase().trim()).filter(Boolean),
          tags: (data.tags || existingEntry?.tags || []).map(t => String(t).toLowerCase().trim()).filter(Boolean),
          projects: (data.projects || existingEntry?.projects || []).map(p => String(p).toLowerCase().trim()).filter(Boolean),
          references: data.references || existingEntry?.references || [],
          updatedAt: Date.now()
        };

        entriesRef.current = (entriesRef.current || []).map(e => e.id === id ? { ...e, ...initialSavedEntry } : e);
        setEntries(prev => prev.map(e => e.id === id ? { ...e, ...initialSavedEntry } : e));
        editingEntriesRef.current = { ...(editingEntriesRef.current || {}) };
        delete editingEntriesRef.current[id];
        setEditingEntries(prev => { const n = { ...prev }; delete n[id]; return n; });
        setEditData(prev => { const n = { ...prev }; delete n[id]; return n; });
        if (editDataRef.current) { delete editDataRef.current[id]; }

        try {
          // Auto-generate title, summary, takeaways, and taxonomies when user stops editing
          if (isAiChatEntry(initialSavedEntry) || isSeed) return;

          const existingTitle = (initialSavedEntry.title || '').trim();
          const isUntitled = !existingTitle || /^untitled(\s+(note|seed))?(\s*#?\d+)?$/i.test(existingTitle) || existingTitle.toLowerCase() === 'theme reflection' || existingTitle.toLowerCase() === 'theme prompt';
          const userManuallyRenamedTitle = !isUntitled && existingEntry && (existingEntry.title || '').trim() !== existingTitle && !/^untitled(\s+(note|seed))?(\s*#?\d+)?$/i.test((existingEntry.title || '').trim());
          const contentChanged = Boolean(!existingEntry || (existingEntry.fullContent || '').trim() !== (initialSavedEntry.fullContent || '').trim());
          const hasTaxonomies = (Array.isArray(initialSavedEntry.categories) && initialSavedEntry.categories.length > 0) ||
                                (Array.isArray(initialSavedEntry.tags) && initialSavedEntry.tags.length > 0) ||
                                (Array.isArray(initialSavedEntry.projects) && initialSavedEntry.projects.length > 0);
          const hasTakeaways = Array.isArray(initialSavedEntry.shortVersion) && initialSavedEntry.shortVersion.length > 0;
          const isInitialGen = !autoGeneratedMetaIdsRef.current.has(id) && (isUntitled || (!existingEntry?.summary && !initialSavedEntry.summary) || !hasTaxonomies || !hasTakeaways);
          const needsTitle = isUntitled || (isInitialGen && !userManuallyRenamedTitle);
          const needsSummary = !initialSavedEntry.summary || contentChanged;
          const needsTaxonomies = isInitialGen || (!hasTaxonomies && !autoGeneratedMetaIdsRef.current.has(id));
          const needsTakeaways = isInitialGen || (!hasTakeaways && !autoGeneratedMetaIdsRef.current.has(id));

          let liveContent = '';
          if (contentTextareaRef.current && activeSingleEntryRef.current?.id === id) {
            liveContent = contentTextareaRef.current.value || '';
          }
          const contentToAnalyze = (liveContent || initialSavedEntry.fullContent || initialSavedEntry.summary || '').trim();

          if ((needsTitle || needsSummary || needsTaxonomies || needsTakeaways) && contentToAnalyze.length > 5 && apiKeys && apiKeys.length > 0) {
            autoGeneratedMetaIdsRef.current.add(id);
            setIsAnalyzing(true);
            setGeneratingField('metadata');
            try {
              const requestedFields = [];
              if (needsTitle) requestedFields.push('title');
              if (needsSummary) requestedFields.push('summary');
              if (needsTakeaways) requestedFields.push('takeaways');
              if (needsTaxonomies) requestedFields.push('taxonomies');

              const payload = buildMetadataPayload(requestedFields, initialSavedEntry, contentToAnalyze, { allProjects, allCategories, allTags });
              const result = await handleGeminiCall(payload, taskModels.metadata || DEFAULT_MODEL);
              const rawCandidate = result?.candidates?.[0];
              const rawText = getCandidateText(rawCandidate || result);
              const parsed = parseAIJson(rawCandidate) || parseAIJson(rawText);
              const updates = applyMetadataResults(requestedFields, parsed, initialSavedEntry, contentToAnalyze, rawText);
              if (Object.keys(updates).length > 0) {
                entriesRef.current = (entriesRef.current || []).map(e => e.id === id ? { ...e, ...updates, updatedAt: Date.now() } : e);
                setEntries(prev => prev.map(e => e.id === id ? { ...e, ...updates, updatedAt: Date.now() } : e));
              }
            } catch (err) {
              console.error("Auto-generation of title/summary/takeaways/taxonomies failed:", err);
              setError("Metadata auto-generation: " + err.message);
            } finally {
              setIsAnalyzing(false);
              setGeneratingField(null);
            }
          }
        } finally {
          savingIdsRef.current.delete(id);
        }
      };
      saveNoteRef.current = saveNote;

      const cancelEdit = (id) => {
        setIsContentFocused(false);
        setEditingEntries(prev => { const n = { ...prev }; delete n[id]; return n; });
        setEditData(prev => { const n = { ...prev }; delete n[id]; return n; });
        if (editDataRef.current) { delete editDataRef.current[id]; }
      };

      // Edit field helpers
      const removeEditCategory = (id, cat) => setEditData(prev => ({ ...prev, [id]: { ...prev[id], categories: prev[id].categories.filter(c => c !== cat) } }));
      const removeEditTag = (id, tag) => setEditData(prev => ({ ...prev, [id]: { ...prev[id], tags: prev[id].tags.filter(t => t !== tag) } }));
      const removeEditProject = (id, proj) => setEditData(prev => ({ ...prev, [id]: { ...prev[id], projects: prev[id].projects.filter(p => p !== proj) } }));

      const handleAddEditCategory = (id, e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = (editCatInput[id] || '').trim().replace(/^,|,$/g, '').toLowerCase();
          if (val && !editData[id].categories.includes(val)) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], categories: [...prev[id].categories, val] } }));
          }
          setEditCatInput(prev => ({ ...prev, [id]: '' }));
        }
      };

      const handleAddEditProject = (id, e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = (editProjectInput[id] || '').trim().replace(/^,|,$/g, '').toLowerCase();
          if (val && !editData[id].projects.includes(val)) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], projects: [...prev[id].projects, val] } }));
          }
          setEditProjectInput(prev => ({ ...prev, [id]: '' }));
        }
      };

      const handleAddEditTag = (id, e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = (editTagInput[id] || '').trim().replace(/^,|,$/g, '').toLowerCase();
          if (val && !editData[id].tags.includes(val)) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], tags: [...prev[id].tags, val] } }));
          }
          setEditTagInput(prev => ({ ...prev, [id]: '' }));
        }
      };

      // Entry taxonomy helpers for in-place editor
      const removeEntryProject = (id, proj) => {
        setEntries(prev => prev.map(e => e.id === id ? {
          ...e,
          projects: (e.projects || []).filter(p => normTax(p) !== normTax(proj)),
          updatedAt: Date.now()
        } : e));
      };

      const removeEntryCategory = (id, cat) => {
        setEntries(prev => prev.map(e => e.id === id ? {
          ...e,
          categories: (e.categories || []).filter(c => normTax(c) !== normTax(cat)),
          updatedAt: Date.now()
        } : e));
      };

      const removeEntryTag = (id, tag) => {
        setEntries(prev => prev.map(e => e.id === id ? {
          ...e,
          tags: (e.tags || []).filter(t => normTax(t) !== normTax(tag)),
          updatedAt: Date.now()
        } : e));
      };

      const addEntryProject = (id, name) => {
        const val = normTax(name);
        if (!val) return;
        setEntries(prev => prev.map(e => e.id === id ? {
          ...e,
          projects: [...new Set([...(e.projects || []), val])],
          updatedAt: Date.now()
        } : e));
      };

      const addEntryCategory = (id, name) => {
        const val = normTax(name);
        if (!val) return;
        setEntries(prev => prev.map(e => e.id === id ? {
          ...e,
          categories: [...new Set([...(e.categories || []), val])],
          updatedAt: Date.now()
        } : e));
      };

      const addEntryTag = (id, name) => {
        const val = normTax(name.replace(/^#/, ''));
        if (!val) return;
        setEntries(prev => prev.map(e => e.id === id ? {
          ...e,
          tags: [...new Set([...(e.tags || []), val])],
          updatedAt: Date.now()
        } : e));
      };

      const renderTaxonomySection = (entry, { showSourceUrl = true } = {}) => {
        if (!entry) return null;
        return (
          <>
            {/* In-Place Taxonomy Section */}
            {isEditingTaxonomy ? (
              <div className="relative group p-4 bg-[var(--card-bg)] border border-[var(--border)] rounded-md space-y-4 font-mono my-2 shadow-[var(--track-card-shadow)]">
                <div className="flex justify-between items-center">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-[var(--text-main)] flex items-center gap-1.5">
                    <i className="fa-solid fa-tags text-[var(--accent)]"></i> Taxonomy & Tags
                  </h3>
                  <button 
                    type="button" 
                    onClick={() => setIsEditingTaxonomy(false)} 
                    className="btn-primary h-6 px-3 text-[11px] font-semibold"
                  >
                    Done
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {/* Projects */}
                  <div>
                    <label className="block text-[11px] font-semibold text-amber-500 uppercase mb-1 flex items-center gap-1">
                      <i className="fa-solid fa-folder-open text-[10px]"></i> Projects
                    </label>
                    <div className="flex flex-wrap gap-1 mb-1.5 min-h-[26px]">
                      {(entry.projects || []).map(p => (
                        <span key={p} className="badge text-xs">
                          {p}
                          <button type="button" onClick={() => removeEntryProject(entry.id, p)} className="hover:text-[var(--danger)] ml-1">
                            <i className="fa-solid fa-xmark text-[10px]"></i>
                          </button>
                        </span>
                      ))}
                    </div>
                    <input 
                      type="text" 
                      value={taxProjectInput} 
                      onChange={e => setTaxProjectInput(e.target.value)} 
                      onKeyDown={e => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          addEntryProject(entry.id, taxProjectInput);
                          setTaxProjectInput('');
                        }
                      }} 
                      placeholder="Add project (Enter)" 
                      className="w-full px-2.5 py-1 text-xs bg-[var(--bg-main)] text-[var(--text-main)] rounded font-mono border border-[var(--border)] focus:border-[var(--accent)] outline-none" 
                    />
                  </div>

                  {/* Categories */}
                  <div>
                    <label className="block text-[11px] font-semibold text-[var(--accent)] uppercase mb-1 flex items-center gap-1">
                      <i className="fa-solid fa-layer-group text-[10px]"></i> Categories
                    </label>
                    <div className="flex flex-wrap gap-1 mb-1.5 min-h-[26px]">
                      {(entry.categories || []).map(c => (
                        <span key={c} className="badge text-xs">
                          {c}
                          <button type="button" onClick={() => removeEntryCategory(entry.id, c)} className="hover:text-[var(--danger)] ml-1">
                            <i className="fa-solid fa-xmark text-[10px]"></i>
                          </button>
                        </span>
                      ))}
                    </div>
                    <input 
                      type="text" 
                      value={taxCatInput} 
                      onChange={e => setTaxCatInput(e.target.value)} 
                      onKeyDown={e => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          addEntryCategory(entry.id, taxCatInput);
                          setTaxCatInput('');
                        }
                      }} 
                      placeholder="Add category (Enter)" 
                      className="w-full px-2.5 py-1 text-xs bg-[var(--bg-main)] text-[var(--text-main)] rounded font-mono border border-[var(--border)] focus:border-[var(--accent)] outline-none" 
                    />
                  </div>

                  {/* Tags */}
                  <div>
                    <label className="block text-[11px] font-semibold text-[var(--text-muted)] uppercase mb-1 flex items-center gap-1">
                      <i className="fa-solid fa-tag text-[10px]"></i> Tags
                    </label>
                    <div className="flex flex-wrap gap-1 mb-1.5 min-h-[26px]">
                      {(entry.tags || []).map(t => (
                        <span key={t} className="badge text-xs">
                          #{t}
                          <button type="button" onClick={() => removeEntryTag(entry.id, t)} className="hover:text-[var(--danger)] ml-1">
                            <i className="fa-solid fa-xmark text-[10px]"></i>
                          </button>
                        </span>
                      ))}
                    </div>
                    <input 
                      type="text" 
                      value={taxTagInput} 
                      onChange={e => setTaxTagInput(e.target.value)} 
                      onKeyDown={e => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          addEntryTag(entry.id, taxTagInput);
                          setTaxTagInput('');
                        }
                      }} 
                      placeholder="Add tag (Enter)" 
                      className="w-full px-2.5 py-1 text-xs bg-[var(--bg-main)] text-[var(--text-main)] rounded font-mono border border-[var(--border)] focus:border-[var(--accent)] outline-none" 
                    />
                  </div>
                </div>

                {/* Source URL in taxonomy editor */}
                {showSourceUrl && (
                  <div>
                    <label className="block text-[11px] font-semibold text-[var(--text-muted)] uppercase mb-1">Source URL</label>
                    <input 
                      type="text" 
                      value={entry.sourceUrl || ''} 
                      onChange={e => {
                        const val = e.target.value;
                        setEntries(prev => prev.map(ent => ent.id === entry.id ? { ...ent, sourceUrl: val || null, updatedAt: Date.now() } : ent));
                      }} 
                      placeholder="https://example.com/article" 
                      className="w-full px-2.5 py-1 text-xs bg-[var(--bg-main)] text-[var(--text-main)] rounded font-mono border border-[var(--border)] focus:border-[var(--accent)] outline-none" 
                    />
                  </div>
                )}

                {/* Round refresh icon hanging in margin */}
                <button
                  type="button"
                  onClick={() => handleGenerateTaxonomies(entry.id)}
                  disabled={isAnalyzing}
                  className={`absolute left-full ml-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full flex items-center justify-center bg-[var(--card-bg)] border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--accent)] hover:border-[var(--accent)] shadow-xs transition-all cursor-pointer ${isAnalyzing && (generatingField === 'taxonomies' || generatingField === 'metadata') ? 'opacity-100' : ''}`}
                  title="Auto-generate taxonomy & tags"
                  aria-label="Auto-generate taxonomy & tags"
                >
                  <i className={`fa-solid fa-rotate-right text-xs ${isAnalyzing && (generatingField === 'taxonomies' || generatingField === 'metadata') ? 'animate-spin' : ''}`}></i>
                </button>
              </div>
            ) : (
              <div className="relative group">
                <div 
                  onClick={() => setIsEditingTaxonomy(true)}
                  className="flex flex-wrap items-center gap-2 text-xs font-mono cursor-pointer rounded p-1 -m-1 hover:bg-[var(--bg-hover)] transition-colors"
                  title="Click to edit taxonomy & tags"
                >
                  {Array.isArray(entry.projects) && entry.projects.length > 0 && entry.projects.map(p => (
                    <span key={p} className="badge text-[11px]">
                      <i className="fa-solid fa-folder-open text-[10px] text-amber-500"></i>{p}
                    </span>
                  ))}
                  {Array.isArray(entry.categories) && entry.categories.length > 0 && entry.categories.map(c => (
                    <span key={c} className="badge text-[11px]">{c}</span>
                  ))}
                  {Array.isArray(entry.tags) && entry.tags.length > 0 && entry.tags.map(t => (
                    <span key={t} className="badge text-[11px]">#{t}</span>
                  ))}
                  {(!entry.projects?.length && !entry.categories?.length && !entry.tags?.length) && (
                    <span className="text-[11px] text-[var(--text-muted)] italic flex items-center gap-1.5 py-0.5">
                      <i className="fa-solid fa-tags text-[10px]"></i> Click to add projects, categories & tags...
                    </span>
                  )}
                  {showSourceUrl && entry.sourceUrl && (
                    <a 
                      href={entry.sourceUrl} 
                      target="_blank" 
                      rel="noopener noreferrer" 
                      onClick={e => e.stopPropagation()} 
                      className="ml-auto btn-secondary text-xs px-2.5 py-1"
                    >
                      <i className="fa-solid fa-arrow-up-right-from-square text-[10px] mr-1"></i> View Source
                    </a>
                  )}
                </div>
                <button
                  type="button"
                  onClick={(e) => {
                    e.stopPropagation();
                    handleGenerateTaxonomies(entry.id);
                  }}
                  disabled={isAnalyzing}
                  className={`absolute left-full ml-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full flex items-center justify-center bg-[var(--card-bg)] border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--accent)] hover:border-[var(--accent)] shadow-xs transition-all cursor-pointer ${(!entry.projects?.length && !entry.categories?.length && !entry.tags?.length) ? 'opacity-70 sm:opacity-40' : 'opacity-70 sm:opacity-0'} sm:group-hover:opacity-100 ${(isAnalyzing && (generatingField === 'taxonomies' || generatingField === 'metadata')) ? 'opacity-100' : ''}`}
                  title="Auto-generate taxonomy & tags"
                  aria-label="Auto-generate taxonomy & tags"
                >
                  <i className={`fa-solid fa-rotate-right text-xs ${(isAnalyzing && (generatingField === 'taxonomies' || generatingField === 'metadata')) ? 'animate-spin' : ''}`}></i>
                </button>
              </div>
            )}
          </>
        );
      };

      // Focused Note AI Helpers (Margin Refresh Actions)
      const handleSuggestTitle = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        setGeneratingField('title');
        try {
          const entry = getEntryForAnalysis(id);
          if (!entry) throw new Error("Note not found.");
          const noteContent = getEntryContentForAnalysis(id, entry);
          if (!noteContent && !entry.promptQuestion && !entry.summary) {
            throw new Error("No note content available to generate a title.");
          }
          const contentToAnalyze = noteContent || entry.summary || entry.promptQuestion || '';

          const payload = buildMetadataPayload(['title'], entry, contentToAnalyze, { allProjects, allCategories, allTags });
          const result = await handleGeminiCall(payload, taskModels.metadata || DEFAULT_MODEL);
          const rawCandidate = result?.candidates?.[0];
          const rawText = getCandidateText(rawCandidate || result);
          let parsed = parseAIJson(rawCandidate) || parseAIJson(rawText);

          const updates = applyMetadataResults(['title'], parsed, entry, contentToAnalyze);

          let finalTitle = updates.title || null;

          // Multi-layer resilient fallback if parsed title wasn't cleanly extracted
          if (!finalTitle && rawText) {
            const tm = rawText.match(/["']?(?:title|Title|suggestedTitle|suggested_title|headline|name)["']?\s*:\s*["']?([^"',}\n]+)/i);
            if (tm) {
              const cleaned = cleanTitle(tm[1].replace(/^["']+|["']+$/g, '').trim());
              if (cleaned && cleaned !== 'Untitled Note') finalTitle = cleaned;
            }
          }
          if (!finalTitle && rawText) {
            const headMatch = rawText.match(/^(?:#+\s*|(?:suggested\s+)?title\s*:\s*)(.+)$/im);
            if (headMatch) {
              const cleaned = cleanTitle(headMatch[1].trim());
              if (cleaned && cleaned !== 'Untitled Note') finalTitle = cleaned;
            }
          }
          if (!finalTitle && rawText) {
            const cleanRaw = rawText.replace(/```(?:json)?/gi, '').replace(/```/g, '').trim();
            if (cleanRaw && !cleanRaw.startsWith('{') && cleanRaw.length < 100) {
              const cleaned = cleanTitle(cleanRaw);
              if (cleaned && cleaned !== 'Untitled Note') finalTitle = cleaned;
            }
          }

          // Content-derived fallback so user is never stranded with an error if the AI returned unusable output
          if (!finalTitle || finalTitle === 'Untitled Note') {
            const firstLine = contentToAnalyze.split('\n').map(l => l.replace(/^#+\s*/, '').trim()).find(l => l.length >= 3);
            if (firstLine) {
              finalTitle = cleanTitle(firstLine);
            }
          }

          if (finalTitle && finalTitle !== 'Untitled Note') {
            setEntries(prev => prev.map(e => e.id === id ? { ...e, title: finalTitle, updatedAt: Date.now() } : e));
          } else {
            throw new Error("The AI did not return a valid title.");
          }
        } catch(err) {
          setError("Title suggestion failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
          setGeneratingField(null);
        }
      };

      const handleGenerateTLDR = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        setGeneratingField('summary');
        try {
          const entry = getEntryForAnalysis(id);
          if (!entry) throw new Error("Note not found.");
          const noteContent = getEntryContentForAnalysis(id, entry);
          if (!noteContent && !entry.promptQuestion && !entry.summary) {
            throw new Error("No note content available to summarize.");
          }
          const contentToAnalyze = noteContent || entry.summary || entry.promptQuestion || '';

          const payload = buildMetadataPayload(['summary'], entry, contentToAnalyze, { allProjects, allCategories, allTags });
          const result = await handleGeminiCall(payload, taskModels.metadata || DEFAULT_MODEL);
          const rawCandidate = result?.candidates?.[0];
          const rawText = getCandidateText(rawCandidate || result);
          const parsed = parseAIJson(rawCandidate) || parseAIJson(rawText);
          const updates = applyMetadataResults(['summary'], parsed, entry, contentToAnalyze);

          let finalSummary = updates.summary || null;
          if (!finalSummary && rawText) {
            const sm = rawText.match(/"(?:summary|Summary|tldr|executive_summary)"\s*:\s*"([\s\S]*?)(?:"\s*,\s*"[a-zA-Z]+"|"\s*\}|$)/i);
            if (sm) {
              finalSummary = cleanExecutiveSummary(sm[1].replace(/\\"/g, '"').replace(/\\n/g, '\n').trim(), contentToAnalyze);
            }
          }

          if (finalSummary) {
            setEntries(prev => prev.map(e => e.id === id ? { ...e, summary: finalSummary, updatedAt: Date.now() } : e));
          } else {
            throw new Error("The AI did not return a valid summary. Please try again.");
          }
        } catch(err) {
          setError("Summary generation failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
          setGeneratingField(null);
        }
      };

      const handleGenerateAnswerSummary = handleGenerateTLDR;

      const handleGenerateTakeaways = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        setGeneratingField('takeaways');
        try {
          const entry = getEntryForAnalysis(id);
          if (!entry) throw new Error("Note not found.");
          const noteContent = getEntryContentForAnalysis(id, entry);
          if (!noteContent && !entry.promptQuestion && !entry.summary) {
            throw new Error("No note content available to extract takeaways from.");
          }
          const contentToAnalyze = noteContent || entry.summary || entry.promptQuestion || '';

          const payload = buildMetadataPayload(['takeaways'], entry, contentToAnalyze, { allProjects, allCategories, allTags });
          const result = await handleGeminiCall(payload, taskModels.metadata || DEFAULT_MODEL);
          const rawCandidate = result?.candidates?.[0];
          const rawText = getCandidateText(rawCandidate || result);
          const parsed = parseAIJson(rawCandidate) || parseAIJson(rawText);
          const updates = applyMetadataResults(['takeaways'], parsed, entry, contentToAnalyze);
          if (updates.shortVersion && updates.shortVersion.length > 0) {
            setEntries(prev => prev.map(e => e.id === id ? { ...e, shortVersion: updates.shortVersion, updatedAt: Date.now() } : e));
          } else {
            throw new Error("The AI did not return valid key takeaways.");
          }
        } catch(err) {
          setError("Key points generation failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
          setGeneratingField(null);
        }
      };

      const handleGenerateTaxonomies = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        setGeneratingField('taxonomies');
        try {
          const entry = getEntryForAnalysis(id);
          if (!entry) throw new Error("Note not found.");
          const noteContent = getEntryContentForAnalysis(id, entry);

          const payload = buildMetadataPayload(['taxonomies'], entry, noteContent, { allProjects, allCategories, allTags });
          const result = await handleGeminiCall(payload, taskModels.metadata || DEFAULT_MODEL);
          const parsed = parseAIJson(result.candidates?.[0]);
          const updates = applyMetadataResults(['taxonomies'], parsed, entry, noteContent);
          if (updates.projects || updates.categories || updates.tags) {
            setEntries(prev => prev.map(e => e.id === id ? { ...e, ...updates, updatedAt: Date.now() } : e));
          } else {
            throw new Error("The AI did not return valid taxonomy data.");
          }
        } catch(err) {
          setError("Auto-tag failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
          setGeneratingField(null);
        }
      };

      // Taxonomy operations
      const performTaxonomyMigration = (oldName, oldType, newType, newName) => {
        const oldLower = oldName.toLowerCase();
        setEntries(prev => prev.map(entry => {
          let newProjs = [...(Array.isArray(entry.projects) ? entry.projects : [])];
          let newCats = [...(Array.isArray(entry.categories) ? entry.categories : [])];
          let newTags = [...(Array.isArray(entry.tags) ? entry.tags : [])];
          let wasModified = false;

          const removeFromList = (list) => {
            if (list.some(i => i.toLowerCase() === oldLower)) {
              wasModified = true;
              return list.filter(i => i.toLowerCase() !== oldLower);
            }
            return list;
          };

          if (oldType === 'project') newProjs = removeFromList(newProjs);
          if (oldType === 'category') newCats = removeFromList(newCats);
          if (oldType === 'tag') newTags = removeFromList(newTags);

          if (wasModified) {
            const targetList = newType === 'project' ? newProjs : newType === 'category' ? newCats : newTags;
            if (!targetList.some(i => i.toLowerCase() === newName.toLowerCase())) {
              targetList.push(newName.toLowerCase());
            }
            return {
              ...entry,
              projects: [...new Set(newProjs)],
              categories: [...new Set(newCats)],
              tags: [...new Set(newTags)],
              updatedAt: Date.now()
            };
          }
          return entry;
        }));
      };

      const handleTaxonomyDrop = (e, targetType, targetName) => {
        e.preventDefault();
        const dataStr = e.dataTransfer.getData('kb-tax');
        if (!dataStr) return;
        try {
          const data = JSON.parse(dataStr);
          if (data.val && data.type && (data.val !== targetName || data.type !== targetType)) {
            performTaxonomyMigration(data.val, data.type, targetType, targetName);
          }
        } catch(err) { console.error(err); }
      };

      const submitTaxonomyRename = (oldName, newName, currentType) => {
        if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
          performTaxonomyMigration(oldName, currentType, currentType, newName.trim());
        }
      };

      const deleteTaxonomy = (type, name) => {
        if (!name) return;
        const displayName = type === 'tag' ? `#${name}` : name;
        if (!window.confirm(`Are you sure you want to delete the ${type} "${displayName}" from all notes?`)) return;
        const targetLower = normTax(name);
        isDirtyRef.current = true;
        setEntries(prev => prev.map(entry => {
          let wasModified = false;
          let newProjs = Array.isArray(entry.projects) ? entry.projects : [];
          let newCats = Array.isArray(entry.categories) ? entry.categories : [];
          let newTags = Array.isArray(entry.tags) ? entry.tags : [];

          if (type === 'project' && newProjs.some(p => normTax(p) === targetLower)) {
            newProjs = newProjs.filter(p => normTax(p) !== targetLower);
            wasModified = true;
          } else if (type === 'category' && newCats.some(c => normTax(c) === targetLower)) {
            newCats = newCats.filter(c => normTax(c) !== targetLower);
            wasModified = true;
          } else if (type === 'tag' && newTags.some(t => normTax(t) === targetLower)) {
            newTags = newTags.filter(t => normTax(t) !== targetLower);
            wasModified = true;
          }

          if (wasModified) {
            return {
              ...entry,
              projects: newProjs,
              categories: newCats,
              tags: newTags,
              updatedAt: Date.now()
            };
          }
          return entry;
        }));

        if (type === 'project') {
          setActiveProjects(prev => prev.filter(p => normTax(p) !== targetLower));
        } else if (type === 'category') {
          setActiveCategories(prev => prev.filter(c => normTax(c) !== targetLower));
        } else if (type === 'tag') {
          setActiveTags(prev => prev.filter(t => normTax(t) !== targetLower));
        }

        setEditData(prev => {
          const next = { ...prev };
          let modified = false;
          Object.keys(next).forEach(id => {
            if (!next[id]) return;
            if (type === 'project' && Array.isArray(next[id].projects) && next[id].projects.some(p => normTax(p) === targetLower)) {
              next[id] = { ...next[id], projects: next[id].projects.filter(p => normTax(p) !== targetLower) };
              modified = true;
            } else if (type === 'category' && Array.isArray(next[id].categories) && next[id].categories.some(c => normTax(c) === targetLower)) {
              next[id] = { ...next[id], categories: next[id].categories.filter(c => normTax(c) !== targetLower) };
              modified = true;
            } else if (type === 'tag' && Array.isArray(next[id].tags) && next[id].tags.some(t => normTax(t) === targetLower)) {
              next[id] = { ...next[id], tags: next[id].tags.filter(t => normTax(t) !== targetLower) };
              modified = true;
            }
          });
          return modified ? next : prev;
        });
      };

      const handleEntryDrop = (e, targetId) => {
        e.preventDefault();
        setDragOverEntryId(null);
        const taxData = e.dataTransfer.getData('kb-tax');
        if (taxData) {
          try {
            const { type, val } = JSON.parse(taxData);
            setEntries(prev => prev.map(ent => {
              if (ent.id === targetId) {
                if (type === 'category' && !(ent.categories || []).includes(val)) return { ...ent, categories: [...(ent.categories || []), val.toLowerCase()], updatedAt: Date.now() };
                if (type === 'tag' && !(ent.tags || []).includes(val)) return { ...ent, tags: [...(ent.tags || []), val.toLowerCase()], updatedAt: Date.now() };
                if (type === 'project' && !(ent.projects || []).includes(val)) return { ...ent, projects: [...(ent.projects || []), val.toLowerCase()], updatedAt: Date.now() };
              }
              return ent;
            }));
          } catch(err) {}
        }
        const draggedId = e.dataTransfer.getData('kb-ref-id');
        if (draggedId && draggedId !== targetId) {
          setEntries(prev => prev.map(ent => {
            if (ent.id === targetId) {
              const refs = ent.references || [];
              if (!refs.includes(draggedId)) {
                return { ...ent, references: [...refs, draggedId], updatedAt: Date.now() };
              }
            }
            return ent;
          }));
        }
      };

      const handleContentDrop = (e, targetEntry) => {
        if (!targetEntry || isAiChatEntry(targetEntry)) return;
        const draggedId = e.dataTransfer.getData('kb-ref-id');
        if (draggedId && draggedId !== targetEntry.id) {
          e.preventDefault();
          const draggedEntry = entries.find(ent => ent.id === draggedId);
          const refTag = draggedEntry?.numericId ? `[Ref: ${draggedEntry.numericId}]` : `[Ref: ${draggedId}]`;
          const refShortcode = `\n\n${refTag}`;
          setEntries(prev => prev.map(ent =>
            ent.id === targetEntry.id
              ? { ...ent, fullContent: (ent.fullContent || '') + refShortcode, updatedAt: Date.now() }
              : ent
          ));
        }
      };

      const handleContentClick = (e) => {
        const refEl = e.target.closest('.kb-embedded-ref');
        if (refEl) {
          e.preventDefault();
          e.stopPropagation();
          const refId = refEl.getAttribute('data-id');
          if (refId) {
            const found = entries.find(ent => ent.id === refId);
            if (found) {
              setActiveRefModal(found);
              setHoveredRef(null);
            }
          }
        }
      };

      const handleContentMouseOver = (e) => {
        const refEl = e.target.closest('.kb-embedded-ref');
        if (refEl) {
          const refId = refEl.getAttribute('data-id');
          if (refId) {
            const rect = refEl.getBoundingClientRect();
            setHoveredRef({ id: refId, x: rect.left + rect.width / 2, y: rect.top });
          }
        }
      };

      const handleContentMouseOut = (e) => {
        if (e.target.closest('.kb-embedded-ref')) setHoveredRef(null);
      };

      // UNIFIED AI ASSISTANT
      const sendAssistantMessage = async (overrideText = null) => {
        const queryText = (overrideText || assistantInput).trim();
        if (!queryText) return;
        if (!apiKeys || apiKeys.length === 0) {
          setShowKeyModal(true);
          return setError("Please configure your Gemini API key in Settings first.");
        }

        setAssistantInput('');
        setIsAssistantThinking(true);
        setError(null);

        const userMsg = {
          id: 'msg-' + Date.now(),
          role: 'user',
          text: queryText,
          timestamp: Date.now()
        };

        const chatKey = assistantScope === 'workspace' ? 'workspace' : (activeSingleEntry ? activeSingleEntry.id : 'selected');
        const currentHistory = assistantChats[chatKey] || [];
        const updatedMessages = [...currentHistory, userMsg];

        setAssistantChats(prev => ({
          ...prev,
          [chatKey]: updatedMessages
        }));

        try {
          const currentScope = assistantScope;
          let targetDocs = [];

          if (currentScope === 'selected') {
            targetDocs = selectedEntries.length > 0 ? selectedEntries : (activeSingleEntry ? [activeSingleEntry] : (entries.length > 0 ? [entries[0]] : []));
          } else {
            targetDocs = entries;
          }

          if (currentScope === 'selected' && targetDocs.length > 0) {
            let contextText = targetDocs.map(ent => {
              const docType = getEntryType(ent);
              let provLabel = 'Note [User Content - Own Issues/Projects/Knowledge]';
              if (docType === 'prompt') provLabel = 'Prompt Reply [User Content - Reflection Answer]';
              else if (docType === 'media') provLabel = 'Media [External Third-Hand Knowledge - Video/Audio]';
              else if (docType === 'web') provLabel = 'Web / Document [External Third-Hand Knowledge - Web/Text]';
              let block = `--- PRIMARY DOCUMENT: ${ent.title} (ID: ${ent.numericId || ent.id}, Provenance: ${provLabel}) ---\n`;
              if (docType === 'prompt' && ent.promptQuestion) block += `Prompt Question: ${ent.promptQuestion}\n`;
              if (ent.summary) block += `Summary: ${ent.summary}\n`;
              if (ent.shortVersion && ent.shortVersion.length > 0) block += `Key Points:\n${ent.shortVersion.map(p => `- ${p}`).join('\n')}\n`;
              if (ent.fullContent) block += `${docType === 'prompt' ? 'User Reply' : 'Content'}:\n${ent.fullContent}\n`;
              if (ent.sourceUrl) block += `Source URL: ${ent.sourceUrl}\n`;
              return block;
            }).join('\n\n');

            const primaryDoc = targetDocs[0];
            const primaryProjects = (Array.isArray(primaryDoc?.projects) ? primaryDoc.projects : []).map(p => String(p).toLowerCase().trim()).filter(Boolean);
            const primaryCategories = (Array.isArray(primaryDoc?.categories) ? primaryDoc.categories : []).map(c => String(c).toLowerCase().trim()).filter(Boolean);

            let relatedEntries = [];
            if (primaryProjects.length > 0 || primaryCategories.length > 0) {
              const matchedEntries = entries.filter(e => {
                if (!e || targetDocs.some(se => se.id === e.id)) return false;
                if (isAiChatEntry(e) || isSeedEntry(e)) return false;
                if (typeof isWelcomeEntry === 'function' && isWelcomeEntry(e)) return false;
                const matchesProj = primaryProjects.length > 0 && Array.isArray(e.projects) && e.projects.some(p => primaryProjects.includes(String(p).toLowerCase().trim()));
                const matchesCat = primaryCategories.length > 0 && Array.isArray(e.categories) && e.categories.some(c => primaryCategories.includes(String(c).toLowerCase().trim()));
                return matchesProj || matchesCat;
              });

              const primNum = Number(primaryDoc?.numericId) || 0;
              const primTime = Number(primaryDoc?.createdAt) || Number(primaryDoc?.updatedAt) || Date.now();

              const priorMatches = matchedEntries.filter(e => {
                const eNum = Number(e.numericId) || 0;
                if (primNum && eNum) return eNum < primNum;
                const eTime = Number(e.createdAt) || Number(e.updatedAt) || 0;
                return eTime ? eTime <= primTime : true;
              });

              const candidatePool = priorMatches.length > 0 ? priorMatches : matchedEntries;
              candidatePool.sort((a, b) => {
                const aNum = Number(a.numericId) || 0;
                const bNum = Number(b.numericId) || 0;
                if (aNum && bNum) return bNum - aNum;
                const aTime = Number(a.createdAt) || Number(a.updatedAt) || 0;
                const bTime = Number(b.createdAt) || Number(b.updatedAt) || 0;
                return bTime - aTime;
              });

              relatedEntries = candidatePool.slice(0, 10);
            }

            let archiveContextText = "";
            if (relatedEntries.length > 0) {
              archiveContextText = relatedEntries.map(e => {
                const relType = getEntryType(e);
                let relLabel = 'Note [User Content]';
                if (relType === 'prompt') relLabel = 'Prompt Reply [User Content]';
                else if (relType === 'media') relLabel = 'Media [External]';
                else if (relType === 'web') relLabel = 'Web/Text [External]';
                let line = `• [[kb-ref:${e.id}]] [${relLabel}] "${e.title || 'Untitled'}"`;
                if (e.summary) line += `\n  Executive Summary: ${e.summary}`;
                if (Array.isArray(e.shortVersion) && e.shortVersion.length > 0) line += `\n  Key Takeaways: ${e.shortVersion.join(' | ')}`;
                return line;
              }).join('\n\n');
            }

            const payload = {
              contents: [
                ...currentHistory.slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
                { role: 'user', parts: [{ text: queryText }] }
              ],
              generationConfig: { temperature: 0.3 },
              systemInstruction: {
                parts: [{
                  text: `You are a helpful AI Assistant for the user's personal knowledge base.
Focus primarily on the active document: "${targetDocs[0]?.title || 'Selected Note'}", using relevant notes in the same project or category for context and cross-references.

KNOWLEDGE PROVENANCE & USER PERSPECTIVE:
- Assume ONLY the content of Notes and Prompt replies is user-generated content that reflects their own issues, projects, and personal knowledge.
- Web, media, and text documents are assumed to be external and contextual third-hand knowledge (reference materials, articles, videos, or external docs collected for context, NOT the user's personal thoughts or creations).
- Seeds and AI are ignored as source knowledge.

CONVERSATIONAL & CONCISE WRITING RULES:
- Length: Under 50 words unless requested or necessary. Default to short.
- Be concise, conversational, and direct. Go a step at a time.
- Avoid spilling large amounts of text unless specifically requested.
- Delete unnecessary words. Cut everything that doesn't add value.
- Prefer short words. Use simple language over complex terms.
- Stick to the active voice. It’s direct and impactful.
- Avoid tired phrases. No clichés, similes, or metaphors.
- Use plain English. Swap jargon and technical terms for everyday words.
- Zero hyperbole. Stay honest. Avoid exaggeration.
- No filler or prefaces. Skip "basically," "so," and introductory fluff.
- Short, declarative sentences. One idea per sentence.
- Use contractions. It keeps the tone natural.
- Emojis in headings. Use them in headers to stay scannable, not the body.
- Citations: When cross-referencing OTHER notes, cite them using exact syntax [[kb-ref:ID]]. CRITICAL: Do NOT cite or tag the primary active document itself ([[kb-ref:${targetDocs[0]?.id || 'ID'}]]) since the user is already viewing it.
- Format cleanly in Markdown.

=== PRIMARY ACTIVE DOCUMENT ===
${contextText}

${archiveContextText ? `=== RELATED TAXONOMY CONTEXT (PREVIOUS NOTES IN SAME CATEGORY / PROJECT) ===\n${archiveContextText}` : ''}`
                }]
              }
            };

            const activeAssistantModel = taskModels.assistant || DEFAULT_MODEL;
            const result = await handleGeminiCall(payload, activeAssistantModel);
            const candidate = result.candidates?.[0];
            const parts = candidate?.content?.parts || [];
            const replyText = parts.map(p => p.text || '').filter(Boolean).join('\n').trim() || "No response received.";
            const { inputTokens, outputTokens } = extractUsageTokens(result, JSON.stringify(payload), replyText);

            setAssistantChats(prev => ({
              ...prev,
              [chatKey]: [
                ...(prev[chatKey] || updatedMessages),
                {
                  id: 'msg-' + (Date.now() + 1),
                  role: 'model',
                  text: replyText,
                  timestamp: Date.now(),
                  model: activeAssistantModel,
                  inputTokens,
                  outputTokens
                }
              ]
            }));
          } else {
            const candidateNotes = getWholeBrainCandidateNotes();
            const activeAssistantModel = taskModels.assistant || model || DEFAULT_MODEL;
            const { replyText, inputTokens, outputTokens } = await runWholeBrainQuery(queryText, currentHistory, candidateNotes, activeAssistantModel);

            setAssistantChats(prev => ({
              ...prev,
              [chatKey]: [
                ...(prev[chatKey] || updatedMessages),
                {
                  id: 'msg-' + (Date.now() + 1),
                  role: 'model',
                  text: replyText,
                  timestamp: Date.now(),
                  model: activeAssistantModel,

            ...prev,
            [chatKey]: [
              ...(prev[chatKey] || updatedMessages),
              { id: 'msg-' + (Date.now() + 1), role: 'model', text: `⚠️ Error: ${err.message}`, timestamp: Date.now() }

          setIsAssistantThinking(false);
        }
      };

      const copyMessage = (msgId, text) => {
        navigator.clipboard.writeText(text);
        setActionFeedback({ msgId, type: 'copy' });
        setTimeout(() => setActionFeedback(null), 1500);
      };

      const insertMessageIntoNote = (msgId, text) => {
        if (!activeSingleEntry) {
          setError("Select a single note in the list first to insert this response.");
          return;
        }
        if (isAiChatEntry(activeSingleEntry)) {
          setError("AI Chat conversation logs are read-only and cannot be modified.");
          return;
        }
        const addition = `\n\n---\n### 💡 AI Synthesis (${new Date().toLocaleDateString()})\n\n${text}\n`;
        const updatedContent = (activeSingleEntry.fullContent || '') + addition;
        
        // Synchronize in-memory edit draft buffers so edits and auto-save do not overwrite or lose the insertion
        setEditData(prev => {
          const currentDraft = prev[activeSingleEntry.id] || activeSingleEntry;
          return {
            ...prev,
            [activeSingleEntry.id]: {
              ...currentDraft,
              fullContent: (currentDraft.fullContent || activeSingleEntry.fullContent || '') + addition
            }
          };
        });
        if (editDataRef.current) {
          const currentDraftRef = editDataRef.current[activeSingleEntry.id] || activeSingleEntry;
          editDataRef.current = {
            ...editDataRef.current,
            [activeSingleEntry.id]: {
              ...currentDraftRef,
              fullContent: (currentDraftRef.fullContent || activeSingleEntry.fullContent || '') + addition
            }
          };
        }

        setEntries(prev => prev.map(ent =>
          ent.id === activeSingleEntry.id
            ? { ...ent, fullContent: updatedContent, updatedAt: Date.now() }
            : ent
        ));
        setActionFeedback({ msgId, type: 'insert' });
        setTimeout(() => setActionFeedback(null), 1500);
      };

      // Filter-scoped Whole Brain candidate pool & single-pass / on-demand escalation engine
      const getWholeBrainCandidateNotes = (excludeId = null) => {
        // Draw candidate pool from currently selected entry types and active taxonomy/search filters (just like generatePromptNote),
        // strictly requiring an executive summary (e.summary) and NEVER feeding previous AI Chat sessions or seeds into context.
        let pool = filteredEntries.filter(e =>
          !isWelcomeEntry(e) &&
          !isAiChatEntry(e) &&
          !isSeedEntry(e) &&
          e.id !== excludeId &&
          Boolean(e.summary && String(e.summary).trim())
        );

        // Edge case: if the user solo-selected 'aiChat' or 'seed' in the entry type filter bar so non-chat notes are hidden,
        // fall back to non-chat/non-seed entries matching the active taxonomy & search filters that have a summary.
        if (pool.length === 0 && activeTypeFilters.every(t => t === 'aiChat' || t === 'seed')) {
          pool = entries.filter(entry => {
            if (!entry || isWelcomeEntry(entry) || isAiChatEntry(entry) || isSeedEntry(entry) || entry.id === excludeId) return false;
            if (!entry.summary || !String(entry.summary).trim()) return false;
            const matchesProject = activeProjects.length === 0 || (Array.isArray(entry.projects) && entry.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
            const matchesCat = activeCategories.length === 0 || (Array.isArray(entry.categories) && entry.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
            const matchesTag = activeTags.length === 0 || (Array.isArray(entry.tags) && entry.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));
            const searchLower = searchQuery.toLowerCase();
            const matchesSearch = !searchQuery ||
              (entry.title && entry.title.toLowerCase().includes(searchLower)) ||
              (entry.summary && entry.summary.toLowerCase().includes(searchLower)) ||
              (entry.fullContent && entry.fullContent.toLowerCase().includes(searchLower));
            return matchesProject && matchesCat && matchesTag && matchesSearch;
          });
        }

        return pool;
      };

      const WHOLE_BRAIN_WRITING_RULES = `KNOWLEDGE PROVENANCE & USER PERSPECTIVE:
- Assume ONLY the content of Notes and Prompt replies is user-generated content that reflects their own issues, projects, and personal knowledge.
- Web, media, and text documents are assumed to be external and contextual third-hand knowledge (articles, podcasts, videos, or external docs collected for reference, NOT the user's personal thoughts or creations).
- Seeds and AI chats are ignored as source knowledge.

CONVERSATIONAL & CONCISE WRITING RULES:
- Length: Under 50 words unless requested or necessary. Default to short.
- Be concise, conversational, and direct. Go a step at a time.
- Avoid spilling large amounts of text unless specifically requested.
- Delete unnecessary words. Cut everything that doesn't add value.
- Prefer short words. Use simple language over complex terms.
- Stick to the active voice. It’s direct and impactful.
- Avoid tired phrases. No clichés, similes, or metaphors.
- Use plain English. Swap jargon and technical terms for everyday words.
- Zero hyperbole. Stay honest. Avoid exaggeration.
- No filler or prefaces. Skip "basically," "so," and introductory fluff.
- Short, declarative sentences. One idea per sentence.
- Use contractions. It keeps the tone natural.
- Emojis in headings. Use them in headers to stay scannable, not the body.
- Citations: Always cite sources using exact syntax [[kb-ref:ID]] (e.g. [[kb-ref:entry-1234]]).
- Format cleanly in Markdown.`;

      const runWholeBrainQuery = async (queryText, recentMsgs, candidateNotes, activeAssistantModel) => {
        const filterScopeParts = [
          activeProjects.length > 0 ? `Projects: ${activeProjects.join(', ')}` : '',
          activeCategories.length > 0 ? `Categories: ${activeCategories.join(', ')}` : '',
          activeTags.length > 0 ? `Tags: ${activeTags.map(t => '#' + t).join(', ')}` : '',
          searchQuery ? `Search query: "${searchQuery}"` : '',
          hasCustomTypeFilter ? `Selected Types: ${selectedNonChatTypeObjs.map(t => t.label).join(', ')}` : ''
        ].filter(Boolean);

        const scopeBanner = filterScopeParts.length > 0
          ? `Active Filter Scope: ${filterScopeParts.join(' | ')} (${candidateNotes.length} matching summarized notes in pool)`
          : `Active Pool: All selected entry types (${candidateNotes.length} summarized notes in pool)`;

        if (candidateNotes.length === 0) {
          return {
            replyText: `No summarized notes match your currently selected entry types and taxonomy filters (${scopeBanner}).`,
            inputTokens: 0,
            outputTokens: 0
          };
        }

        let totalInputTokens = 0;
        let totalOutputTokens = 0;

        // Send ALL matching summaries through without any artificial count limit (user controls scope via type/taxonomy selections)
        const candidateSummaries = candidateNotes.map(e => {
          const cleanSum = String(e.summary || '').trim();
          const hasTakeawaysFlag = Array.isArray(e.shortVersion) && e.shortVersion.length > 0;
          const hasContentFlag = Boolean(e.fullContent && String(e.fullContent).trim());
          const availMeta = [hasTakeawaysFlag ? 'takeaways' : null, hasContentFlag ? 'content' : null].filter(Boolean).join(', ');
          const type = getEntryType(e);
          let typeTag = 'Note [User Content]';
          if (type === 'prompt') typeTag = 'Prompt Reply [User Content]';
          else if (type === 'media') typeTag = 'Media [External Third-Hand]';
          else if (type === 'web') typeTag = 'Web/Text [External Third-Hand]';
          return `[kb-ref:${e.id}] [${typeTag}] (Ref #${e.numericId || '?'}, Title: "${e.title || 'Untitled'}"${availMeta ? `, Available on-demand: ${availMeta}` : ''}) — Summary: ${cleanSum}`;
        }).join('\n');

        // Pass 1: Single-Pass Direct Synthesis OR On-Demand Escalation
        // If summaries suffice, the model writes "directReply" immediately (1 API call total).
        // If deeper takeaways or full content are required for specific notes, it requests them via "takeawayIds" / "contentIds" and leaves "directReply" empty.
        let directReply = '';
        let takeawayIds = [];
        let contentIds = [];

        const pass1SystemText = `You are an overarching Knowledge Base Assistant synthesizing information across the user's selected notes pool (${scopeBanner}).
Your base context is strictly limited to the Executive Summaries below (all ${candidateNotes.length} matching notes in the user's current type/taxonomy selection are included).

DECISION & EFFICIENCY PROTOCOL:
1. IF SUMMARIES SUFFICE: If you can answer the user's query accurately using the Executive Summaries alone, write your complete Markdown response in "directReply" (following the writing rules below) and return empty arrays [] for "takeawayIds" and "contentIds".
2. IF DEEPER DETAIL IS REQUIRED: Only if the summaries lack specific details needed to answer the query:
   - Prefer requesting Key Takeaways first: put the needed note IDs in "takeawayIds".
   - Only request Full Content if full body text is strictly needed: put the needed note IDs in "contentIds".
   - When requesting any "takeawayIds" or "contentIds", leave "directReply" as an empty string "".

${WHOLE_BRAIN_WRITING_RULES}

Available Note Summaries (${candidateNotes.length} notes):
${candidateSummaries}`;

        const pass1Payload = {
          contents: [
            ...(recentMsgs || []).slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
            { role: 'user', parts: [{ text: queryText }] }
          ],
          systemInstruction: {
            parts: [{ text: pass1SystemText }]
          },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                directReply: {
                  type: "STRING",
                  description: "Your final Markdown answer citing [[kb-ref:ID]] if the Executive Summaries alone are sufficient. Leave empty string if requesting takeawayIds or contentIds."
                },
                takeawayIds: {
                  type: "ARRAY",
                  items: { type: "STRING" },
                  description: "Note IDs whose Key Takeaways (shortVersion) are needed on demand. Empty array if directReply is provided."
                },
                contentIds: {
                  type: "ARRAY",
                  items: { type: "STRING" },
                  description: "Note IDs whose Full Content (fullContent) is needed on demand. Empty array if directReply is provided."
                }
              },
              required: ["directReply", "takeawayIds", "contentIds"]
            },
            temperature: 0.3
          }
        };

        try {
          const pass1Res = await handleGeminiCall(pass1Payload, activeAssistantModel);
          const p1Tokens = extractUsageTokens(pass1Res, JSON.stringify(pass1Payload), '');
          totalInputTokens += p1Tokens.inputTokens;
          totalOutputTokens += p1Tokens.outputTokens;

          const parsedP1 = parseAIJson(pass1Res.candidates?.[0]);
          if (parsedP1 && typeof parsedP1 === 'object' && !Array.isArray(parsedP1)) {
            if (typeof parsedP1.directReply === 'string') directReply = parsedP1.directReply.trim();
            if (Array.isArray(parsedP1.takeawayIds)) takeawayIds = parsedP1.takeawayIds;
            if (Array.isArray(parsedP1.contentIds)) contentIds = parsedP1.contentIds;
          }
        } catch (p1Err) {
          console.warn("Pass 1 single-pass/escalation fallback:", p1Err);
        }

        const requestedSet = new Set([...takeawayIds, ...contentIds]);

        // Fast path: If Pass 1 answered directly and didn't request any valid note expansions, return immediately (1 API call total!)
        const matchedNotes = candidateNotes.filter(e => requestedSet.has(e.id));

            inputTokens: totalInputTokens,
            outputTokens: totalOutputTokens

        const expandedBlocks = (matchedNotes.length > 0 ? matchedNotes : candidateNotes).map(e => {
          const wantTakeaways = takeawayIds.includes(e.id);
          const wantContent = contentIds.includes(e.id);
          const type = getEntryType(e);
          let typeTag = 'Note [User Content]';
          if (type === 'prompt') typeTag = 'Prompt Reply [User Content]';
          else if (type === 'media') typeTag = 'Media [External Third-Hand Knowledge]';
          else if (type === 'web') typeTag = 'Web/Text [External Third-Hand Knowledge]';
          const parts = [
            `--- [kb-ref:${e.id}] (Ref #${e.numericId || '?'}, Type: ${typeTag}) Title: "${e.title || 'Untitled'}" ---`,
            `Executive Summary: ${e.summary}`
          ];
          if (wantTakeaways && Array.isArray(e.shortVersion) && e.shortVersion.length > 0) {

          }
          if (wantContent && e.fullContent && String(e.fullContent).trim()) {
            parts.push(`${type === 'prompt' ? 'User Reply' : 'Full Content'}:\n${String(e.fullContent).trim()}`);

          return parts.join('\n');
        });

        const pass2Payload = {
          contents: [
            ...(recentMsgs || []).slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
            { role: 'user', parts: [{ text: queryText }] }
          ],
          generationConfig: { temperature: 0.3 },
          systemInstruction: {

${WHOLE_BRAIN_WRITING_RULES}

Requested Note Details (Summaries + On-Demand Takeaways/Content):
${expandedBlocks.join('\n\n')}`

        const p2Tokens = extractUsageTokens(result, JSON.stringify(pass2Payload), finalReply);

          inputTokens: totalInputTokens,
          outputTokens: totalOutputTokens

      };

      // Full-Width Whole Brain AI Chat Functions
      const startWholeBrainChat = (targetChatId = null) => {

        if (activeSingleEntry && isAiChatEntry(activeSingleEntry)) {

            setEntries(prev => prev.map(e => e.id === activeSingleEntry.id ? {
              ...e,
              title: scopedDefaultTitle,
              projects: [...activeProjects],

              tags: activeTags.length > 0 ? [...activeTags] : ['ai-chat']
            } : e));

        }

        const nextNumericId = Math.floor(entries.reduce((max, e) => Math.max(max, e.numericId || 0), 0)) + 1;
        const newId = 'entry-' + Date.now();
        const scopedDefaultTitle = activeListScopeSummary ? `${activeListScopeSummary} AI Chat` : 'Whole Brain AI Chat';
        const placeholderEntry = {
          id: newId,
          type: 'aiChat',

          numericId: nextNumericId,

          fullContent: '',
          chatMessages: [],
