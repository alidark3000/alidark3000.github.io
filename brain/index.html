          categories: activeCategories.length > 0 ? [...activeCategories] : ['ai chat'],
          tags: activeTags.length > 0 ? [...activeTags] : ['ai-chat'],
          projects: [...activeProjects],

          updatedAt: Date.now(),

        };

        setNewlyCreatedEntryId(newId);
        selectEntryWithHistory([newId]);
        setIsAssistantOpen(false);
      };

      const handleSendWholeBrainMessage = async (overrideText = null) => {
        const queryText = (overrideText || wholeBrainInput).trim();
        if (!queryText) return;

          setShowKeyModal(true);

        };

        const curTitle = activeSingleEntry.title || '';
        const isDefault = !curTitle || curTitle === 'New AI Chat' || curTitle === 'Whole Brain AI Chat' || curTitle === 'Untitled Note' || curTitle === 'AI Chat Session' || curTitle.endsWith(' AI Chat');
        const shortQuery = queryText.length > 42 ? queryText.substring(0, 42) + '...' : queryText;
        const newTitle = isDefault
          ? (activeListScopeSummary ? `[${activeListScopeSummary}] ${shortQuery}` : shortQuery)
          : curTitle;

        } : e));

          const queryTopics = userQueries.slice(0, 3).map(q => `"${q.length > 55 ? q.substring(0, 55) + '...' : q}"`).join(', ');
          const autoSummary = userQueries.length > 0
            ? `Archived Whole Brain AI dialogue synthesizing knowledge base notes around ${queryTopics}. Comprises ${finalMessages.length} message exchanges.`

                inputTokens: prevTotals.inputTokens + (Number(inputTokens) || 0),
                outputTokens: prevTotals.outputTokens + (Number(outputTokens) || 0)
              },

                          const currentMonths = Number(tempPromptConfig?.dateRangeMonths) || 2;
                          let activeIdx = steps.findIndex(s => s === currentMonths);
                          if (activeIdx === -1) {
                            if (currentMonths >= 25) activeIdx = 5;
                            else {
                              // snap to closest step
                              activeIdx = steps.reduce((prev, curr, idx) => 
                                Math.abs(curr - currentMonths) < Math.abs(steps[prev] - currentMonths) ? idx : prev, 0);
                            }
                          }
                          return (
                            <input
                              type="range"
                              min="0"
                              max="5"
                              step="1"
                              value={activeIdx}
                              onChange={(e) => {
                                const idx = Math.max(0, Math.min(5, Number(e.target.value)));
                                setTempPromptConfig(prev => ({ ...prev, dateRangeMonths: steps[idx] }));

                        onClick={() => handleGenerateTakeaways(activeSingleEntry.id)}
                        disabled={isAnalyzing}
                        className={`absolute left-full ml-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full flex items-center justify-center bg-[var(--card-bg)] border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--accent)] hover:border-[var(--accent)] shadow-xs transition-all cursor-pointer ${(!activeSingleEntry.shortVersion || activeSingleEntry.shortVersion.length === 0) ? 'opacity-70 sm:opacity-40' : 'opacity-70 sm:opacity-0'} sm:group-hover:opacity-100 ${(isAnalyzing && (generatingField === 'takeaways' || generatingField === 'metadata')) ? 'opacity-100' : ''}`}
                        title="Auto-generate key takeaways"
                        aria-label="Auto-generate key takeaways"
                      >
                        <i className={`fa-solid fa-rotate-right text-xs ${(isAnalyzing && (generatingField === 'takeaways' || generatingField === 'metadata')) ? 'animate-spin' : ''}`}></i>
                      </button>
                    </div>
                  )}

                  {/* Media Embed */}
                  {getEmbedUrl(activeSingleEntry.sourceUrl) && (
                    <div className="aspect-video w-full rounded overflow-hidden shadow-md bg-black">
                      <iframe src={getEmbedUrl(activeSingleEntry.sourceUrl)} className="w-full h-full" allowFullScreen referrerPolicy="strict-origin-when-cross-origin"></iframe>
                    </div>
                  )}

                  {/* Markdown Body */}
                  {(() => {
                    const isSeed = isSeedEntry(activeSingleEntry);
                    const isEditingContent = !isAiChat && Boolean(editingEntries[activeSingleEntry.id]);
                    const noteMarkdown = activeSingleEntry.fullContent || (
                      Array.isArray(activeSingleEntry.chatMessages) && activeSingleEntry.chatMessages.length > 0
                        ? activeSingleEntry.chatMessages.map(m => `**${m.role === 'user' ? 'User' : 'Assistant'}:**\n\n${m.text}`).join('\n\n---\n\n')
                        : (Array.isArray(activeSingleEntry.chatHistory) && activeSingleEntry.chatHistory.length > 0
                            ? activeSingleEntry.chatHistory.map(m => `**${m.role === 'user' ? 'User' : 'Assistant'}:**\n\n${m.text}`).join('\n\n---\n\n')
                            : '')
                    );

                    if (isEditingContent) {
                      return (
                        <div ref={editFormRef} className="relative space-y-2">
                          <div className="flex justify-between items-center mb-1">
                            <div className="flex items-center gap-2">
                              <span className="text-[11px] font-semibold text-[var(--text-muted)] uppercase tracking-wider">
                                {isSeed ? 'Seed Prompt / Instructions' : 'Content'}
                              </span>
                              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-[var(--accent)]/15 text-[var(--accent)] border border-[var(--accent)]/30 font-semibold">
                                Editing
                              </span>
                            </div>
                            <div className="flex items-center gap-2">
                              <button 
                                type="button" 
                                onClick={() => {
                                  setIsContentFocused(true);
                                }} 
                                className="btn-secondary h-6 px-3 text-[11px] font-semibold text-[var(--accent)]"
                                title="Open distraction-free Focus Mode"
                              >
                                <i className="fa-solid fa-expand text-[10px]"></i> Focus Mode
                              </button>
                              <button
                                type="button"
                                onClick={() => saveNote(activeSingleEntry.id)}
                                className="btn-primary h-6 px-3 text-[11px] font-semibold"
                                title="Save note and finish editing"
                              >
                                <i className="fa-solid fa-check text-[10px]"></i> Done
                              </button>
                            </div>
                          </div>
                          <textarea 
                            ref={!isContentFocused ? contentTextareaRef : null}
                            autoFocus
                            value={editData[activeSingleEntry.id]?.fullContent ?? activeSingleEntry.fullContent ?? ''}
                            onChange={e => {
                              const val = e.target.value;
                              setEditData(prev => ({
                                ...prev,
                                [activeSingleEntry.id]: {
                                  ...(prev[activeSingleEntry.id] || activeSingleEntry),
                                  fullContent: val
                                }
                              }));
                              if (editDataRef.current) {
                                editDataRef.current = {
                                  ...editDataRef.current,
                                  [activeSingleEntry.id]: {
                                    ...(editDataRef.current[activeSingleEntry.id] || activeSingleEntry),
                                    fullContent: val
                                  }
                                };
                              }
                            }} 
                            onKeyDown={handleContentKeyDown}
                            className="w-full p-4 font-mono text-sm leading-[1.4] bg-[var(--card-bg)] text-[var(--text-main)] border border-[var(--border)] rounded focus:border-[var(--accent)] outline-none resize-y min-h-[260px] cursor-text select-text"
                            placeholder={isSeed ? "Write a reusable prompt that runs on any note with one click. E.g. \"Rewrite this note as a concise LinkedIn post with a strong opening hook and 3 key takeaways.\"" : "Write your note in Markdown..."}
                            onBlur={() => {
                              if (activeSingleEntry?.id) {
                                triggerAutoMetadataOnFirstBlur(activeSingleEntry.id);
                              }
                            }}
                          />
                        </div>
                      );
                    }

                    return (
                      <div className="relative group">
                        <div className="flex justify-between items-center mb-2">
                          <div className="flex items-center gap-2">
                            <span className="text-[11px] font-semibold text-[var(--text-muted)] uppercase tracking-wider">
                              {isSeed ? 'Seed Prompt / Instructions' : 'Content'}
                            </span>
                            {isSeed && (
                              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-[#3b82f6]/15 text-[#60a5fa] border border-[#3b82f6]/30 flex items-center gap-1 font-semibold">
                                <i className="fa-solid fa-seedling text-[9px]"></i> AI Prompt Shortcut
                              </span>
                            )}
                            {isAiChat && (
                              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-[#a855f7]/15 text-[#a855f7] border border-[#a855f7]/30 flex items-center gap-1 font-semibold">
                                <i className="fa-solid fa-lock text-[9px]"></i> Read-Only Chat Transcript
                              </span>
                            )}
                          </div>
                          {!isAiChat && (
                            <div className="flex items-center gap-2">
                              <button 
                                type="button" 
                                onClick={() => {
                                  startEditing(activeSingleEntry);
                                }} 
                                className="btn-secondary h-6 px-3 text-[11px] font-semibold"
                                title={isSeed ? "Edit seed prompt" : "Edit note content"}
                              >
                                <i className="fa-regular fa-pen-to-square text-[10px]"></i> Edit
                              </button>
                            </div>
                          )}
                        </div>
                        {noteMarkdown ? (
                          <div 
                            onDoubleClick={(e) => {
                              e.stopPropagation();
                              if (!isAiChat) startEditing(activeSingleEntry);
                            }}
                            className={`prose prose-player max-w-none text-[var(--text-main)] leading-[1.4] font-mono min-h-[60px] ${isAiChat ? 'select-text cursor-default' : 'cursor-text'}`}
                            title={isAiChat ? undefined : (isSeed ? "Double-click to edit seed prompt" : "Double-click to edit content")}
                            dangerouslySetInnerHTML={{ __html: injectReferences(parseMarkdown(noteMarkdown), entries) }} 
                          />
                        ) : (
                          <div 
                            onDoubleClick={(e) => {
                              e.stopPropagation();
                              if (!isAiChat) startEditing(activeSingleEntry);
                            }}
                            className={`text-[var(--text-muted)] italic leading-relaxed font-mono min-h-[60px] py-4 border border-dashed border-[var(--border)] rounded px-4 text-center ${isAiChat ? 'cursor-default' : 'cursor-text'}`}
                            title={isAiChat ? undefined : (isSeed ? "Double-click to write seed prompt..." : "Double-click to write note content...")}
                          >
                            {isAiChat ? 'No chat messages recorded in this session.' : (isSeed ? 'Double-click to write seed prompt / instructions...' : 'Double-click to write note content...')}
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {/* Linked References */}
                  {Array.isArray(activeSingleEntry.references) && activeSingleEntry.references.length > 0 && (
                    <div className="pt-6 font-mono">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)] mb-3 flex items-center gap-1.5">
                        <i className="fa-solid fa-link text-[var(--accent)]"></i> Linked References
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {activeSingleEntry.references.map(refId => {
                          const refEntry = entries.find(e => e.id === refId);
                          if (!refEntry) return null;
                          return (
                            <div 
                              key={refId} 
                              onClick={() => selectEntryWithHistory([refId])} 
                              className="p-3.5 rounded bg-[var(--card-bg)] hover:bg-[var(--bg-hover)] cursor-pointer transition-colors flex justify-between items-center shadow-[var(--track-card-shadow)]"
                            >
                              <div className="truncate mr-2">
                                <div className="text-xs font-semibold text-[var(--text-main)] truncate">{refEntry.title}</div>
                                <div className="text-[11px] text-[var(--text-muted)] truncate">{refEntry.summary || 'No summary'}</div>
                              </div>
                              <i className="fa-solid fa-arrow-right text-xs text-[var(--text-muted)]"></i>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              );
            })() : null}
            </div>
          </div>

          {/* RIGHT COLUMN: UNIFIED AI ASSISTANT SIDEBAR */}
          <div className={`flex-shrink-0 flex flex-col z-20 overflow-hidden bg-white dark:bg-[var(--bg-pane)] transition-all duration-300 ease-in-out ${
            isAssistantOpen && !(activeSingleEntry && isAiChatEntry(activeSingleEntry))
              ? 'w-96 lg:w-[440px] opacity-100 visible' 
              : 'w-0 min-w-0 opacity-0 invisible pointer-events-none'
          }`}>
            <div className="w-96 lg:w-[440px] h-full flex flex-col shrink-0">
              
              {/* Assistant Header */}
              <div className="px-[50px] pt-[50px] pb-4 shrink-0 space-y-3">
                {(() => {
                  const drawerTokens = sumChatTokens(assistantMessages);
                  return (
                    <div className="flex flex-wrap justify-between items-center gap-2 min-h-8">
                      <div className="flex items-center gap-2">
                        <h3 className="text-xs font-bold text-[var(--text-main)] font-mono">AI Assistant</h3>
                        <span className="badge text-[10px] font-mono" title={`Model: ${taskModels.assistant || DEFAULT_MODEL}`}>
                          {(taskModels.assistant || model || DEFAULT_MODEL).replace('gemini-', '')}
                        </span>
                      </div>
                      <span className="badge text-[10px] font-mono flex items-center gap-1 text-[var(--text-muted)]" title="Cumulative Input & Output Tokens in this chat">
                        <span>In: {drawerTokens.inputTokens.toLocaleString()}</span>
                        <span className="opacity-40">|</span>
                        <span>Out: {drawerTokens.outputTokens.toLocaleString()}</span>
                      </span>
                    </div>
                  );
                })()}

                {/* Active note context pill */}
                {assistantScope === 'selected' && activeSingleEntry && (
                  <div className="flex items-center gap-1.5 text-[11px] text-[var(--text-muted)] px-1 truncate font-mono">
                    <span className="font-semibold text-[var(--accent)] shrink-0">Note:</span>
                    <span className="truncate font-medium text-[var(--text-main)]" title={activeSingleEntry.title}>{activeSingleEntry.title || 'Untitled Note'}</span>
                  </div>
                )}
              </div>

              {/* Message Thread */}
              <div ref={chatScrollRef} className="flex-1 overflow-y-auto px-[50px] py-4 space-y-4 text-xs min-h-0 font-mono">
                {assistantMessages.length === 0 ? (
                  <div className="py-6 flex flex-col items-center justify-center text-center text-[var(--text-muted)] space-y-3">
                    <div className="w-12 h-12 rounded bg-[var(--bg-hover)] text-[var(--accent)] flex items-center justify-center text-xl">
                      <i className={`fa-solid ${assistantScope === 'workspace' ? 'fa-brain' : 'fa-file-lines'}`}></i>
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-[var(--text-main)]">
                        {assistantScope === 'workspace' 
                          ? 'Whole Brain Chat' 
                          : (activeSingleEntry ? activeSingleEntry.title : 'Current Entry Chat')}
                      </h4>
                      <p className="text-xs text-[var(--text-muted)] mt-1 leading-relaxed">
                        {assistantScope === 'workspace'
                          ? 'Ask questions across your entire knowledge base, request cross-cutting syntheses, or discover connections.'
                          : (activeSingleEntry 
                              ? `This note is loaded into context with its full content, plus executive summaries and takeaways from other notes.`
                              : 'Select any note from the list to start a focused discussion.')}
                      </p>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3.5">
                    {assistantMessages.map(msg => (
                      <div key={msg.id} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[90%] rounded px-3.5 py-2.5 shadow-[var(--track-card-shadow)] leading-relaxed ${
                          msg.role === 'user' 
                            ? 'bg-[var(--bg-main)] text-[var(--text-main)]' 
                            : 'bg-[#a855f7]/10 text-[var(--text-main)]'
                        }`}>
                          {msg.role === 'user' ? (
                            <div className="whitespace-pre-wrap">{msg.text}</div>
                          ) : (
                            <div>
                              <div 
                                className="prose prose-player text-xs max-w-none prose-p:my-1 prose-headings:my-2 prose-ul:my-1" 
                                dangerouslySetInnerHTML={{ __html: injectReferences(parseMarkdown(msg.text), entries) }}
                                onClick={handleContentClick}
                              />
                              <div className="flex items-center gap-2 mt-2 pt-2 text-[10px]">
                                <button 
                                  onClick={() => copyMessage(msg.id, msg.text)} 
                                  className="text-[var(--text-muted)] hover:text-[var(--accent)] flex items-center gap-1"
                                >
                                  <i className="fa-regular fa-copy"></i>
                                  {actionFeedback?.msgId === msg.id && actionFeedback.type === 'copy' ? 'Copied!' : 'Copy'}
                                </button>
                                {activeSingleEntry && !isAiChatEntry(activeSingleEntry) && (
                                  <button 
                                    onClick={() => insertMessageIntoNote(msg.id, msg.text)} 
                                    className="text-[var(--text-muted)] hover:text-[var(--accent)] flex items-center gap-1 cursor-pointer"
                                    title="Insert into currently open note"
                                  >
                                    <i className="fa-solid fa-file-import"></i>
                                    {actionFeedback?.msgId === msg.id && actionFeedback.type === 'insert' ? 'Inserted!' : 'Insert to Note'}
                                  </button>
                                )}
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}

                    {isAssistantThinking && (
                      <div className="flex justify-start">
                        <div className="bg-[var(--card-bg)] text-[var(--text-muted)] rounded px-3 py-2 text-xs flex items-center gap-2">
                          <i className="fa-solid fa-spinner fa-spin text-[var(--accent)]"></i> Thinking...
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Assistant Input Bar */}
              <div className="px-[50px] pb-[50px] pt-3 shrink-0 bg-white dark:bg-[var(--bg-pane)]">
                <form 
                  onSubmit={(e) => { e.preventDefault(); sendAssistantMessage(); }} 
                  className="relative flex items-center"
                >
                  <textarea 
                    value={assistantInput} 
                    onChange={e => setAssistantInput(e.target.value)} 
                    onKeyDown={e => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendAssistantMessage();
                      }
                    }} 
                    rows="2" 
                    placeholder={assistantScope === 'selected' && activeSingleEntry ? `Ask about "${activeSingleEntry.title.substring(0, 18)}..."` : "Ask across knowledge base..."} 
                    className="w-full pl-3.5 pr-10 py-2.5 text-xs bg-[var(--bg-main)] text-[var(--text-main)] placeholder-[var(--text-muted)] rounded resize-none font-mono" 
                    disabled={isAssistantThinking}
                  />
                  <button 
                    type="submit" 
                    disabled={isAssistantThinking || !assistantInput.trim()} 
                    className="absolute right-3 bottom-3 text-[var(--accent)] hover:text-[var(--accent-hover)] disabled:opacity-30 p-1 transition-colors"
                  >
                    <i className="fa-solid fa-paper-plane text-sm"></i>
                  </button>
                </form>
                  {/* Seed Prompt Chips (Current Entry Only) */}
                  {assistantScope === 'selected' && (() => {
                    const activeProjs = (activeSingleEntry && Array.isArray(activeSingleEntry.projects)) ? activeSingleEntry.projects.map(normTax) : [];
                    const activeCats = (activeSingleEntry && Array.isArray(activeSingleEntry.categories)) ? activeSingleEntry.categories.map(normTax) : [];
                
                    const matchingSeeds = entries.filter(e => {
                      if (!e || !isSeedEntry(e)) return false;
                      if (activeSingleEntry && e.id === activeSingleEntry.id) return false;
                      const eProjs = Array.isArray(e.projects) ? e.projects.filter(Boolean) : [];
                      const eCats = Array.isArray(e.categories) ? e.categories.filter(Boolean) : [];
                      // Uncategorized seeds (global seeds without projects or categories) appear everywhere
                      const isGlobalSeed = eProjs.length === 0 && eCats.length === 0;
                      const hasSharedProject = activeProjs.length > 0 && eProjs.some(p => activeProjs.includes(normTax(p)));
                      const hasSharedCategory = activeCats.length > 0 && eCats.some(c => activeCats.includes(normTax(c)));
                      return isGlobalSeed || hasSharedProject || hasSharedCategory;
                    });

                    if (matchingSeeds.length === 0) return null;

                    return (
                      <div className="pt-3 flex flex-wrap items-center gap-2 font-mono">
                                                {matchingSeeds.map(seed => {
                          const promptText = seed.fullContent || seed.title || 'Execute seed';
                          return (
                            <button
                              key={seed.id}
                              type="button"
                              onClick={() => sendAssistantMessage(promptText)}
                              className="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-md bg-[#2563eb]/20 hover:bg-[#2563eb]/35 text-[#1e40af] dark:text-[#bfdbfe] border border-[#3b82f6]/50 hover:border-[#3b82f6] transition-all shadow-xs cursor-pointer max-w-[260px] truncate"
                              title={`Execute Seed prompt: "${seed.title}"\n\n${promptText}`}
                            >
                              <i className="fa-solid fa-seedling text-[10px] shrink-0 text-[#3b82f6] dark:text-[#60a5fa]"></i>
                              <span className="truncate">{seed.title || 'Untitled Seed'}</span>
                            </button>
                          );
                        })}
                      </div>
                    );
                  })()}
              </div>
            </div>
          </div>

          {/* Hover Preview for [[kb-ref:ID]] */}
          {hoveredRef && (() => {
            const refEntry = entries.find(e => e.id === hoveredRef.id);
            if (!refEntry) return null;
            return (
              <div 
                className="fixed z-[100] bg-[var(--card-bg)] shadow-2xl rounded p-3.5 w-64 pointer-events-none transition-all duration-75 text-xs font-mono transform -translate-x-1/2 -translate-y-full"
                style={{ top: hoveredRef.y - 10, left: hoveredRef.x }}
              >
                <h4 className="font-bold text-[var(--text-main)] line-clamp-1 mb-1">{refEntry.title}</h4>
                <p className="text-[var(--text-muted)] line-clamp-2 leading-relaxed">{refEntry.summary || 'No summary available.'}</p>
              </div>
            );
          })()}

          {/* DISTRACTION-FREE FOCUS MODE (PORTAL OVER ENTIRE APP) */}
          {isContentFocused && activeSingleEntry && !isAiChatEntry(activeSingleEntry) && ReactDOM.createPortal(
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4" style={getEntryAccentStyle(activeSingleEntry)}>
              {/* Opaque backdrop fading in */}
              <div 
                className="absolute inset-0 animate-focus-backdrop cursor-pointer"
                style={{ backgroundColor: 'var(--bg-main)' }}
                onClick={handleDefocus}
                title="Click outside to save and close"
              />
              {/* Centered 40em x 40em window animated into place */}
              <div 
                className="relative z-10 animate-focus-window flex flex-col rounded-lg shadow-2xl border border-[var(--border)] bg-[var(--card-bg)] overflow-hidden"
                style={{ width: '40em', height: '40em', maxWidth: 'calc(100vw - 2rem)', maxHeight: 'calc(100vh - 2rem)' }}
                onClick={e => e.stopPropagation()}
              >
                {/* Close Icon in the top right */}
                <button 
                  type="button" 
                  onClick={handleDefocus}
                  className="absolute top-3 right-3 z-20 w-8 h-8 flex items-center justify-center rounded text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-hover)] transition-colors cursor-pointer"
                  title="Close and save (Esc or click outside)"
                >
                  <i className="fa-solid fa-xmark text-sm"></i>
                </button>

                {/* Prompt Question Display Above Text Area */}
                {activeSingleEntry.promptQuestion && (
                  <div className="shrink-0 pt-6 px-8 pb-4 pr-14 border-b border-[var(--border)] bg-[var(--bg-pane)] select-text">
                    <div className="flex items-center gap-1.5 text-[10px] uppercase font-bold tracking-wider text-[#059669] font-mono mb-1.5">
                      <i className="fa-solid fa-brain"></i>
                      <span>Theme Prompt</span>
                    </div>
                    <div 
                      className="text-xs font-mono text-[var(--text-main)] leading-relaxed italic font-medium"
                      dangerouslySetInnerHTML={{ __html: injectReferences(parseMarkdownInline(activeSingleEntry.promptQuestion), entries) }}
                      onClick={handleContentClick}
                      onMouseOver={handleContentMouseOver}
                      onMouseOut={handleContentMouseOut}
                    />
                  </div>
                )}

                {/* Textarea */}
                <textarea 
                  ref={isContentFocused ? contentTextareaRef : null}
                  value={editData[activeSingleEntry.id]?.fullContent ?? activeSingleEntry.fullContent ?? ''}
                  onChange={e => {
                    const val = e.target.value;
                    setEditData(prev => ({ ...prev, [activeSingleEntry.id]: { ...(prev[activeSingleEntry.id] || activeSingleEntry), fullContent: val } }));
                    if (editDataRef.current) {
                      editDataRef.current = {
                        ...editDataRef.current,
                        [activeSingleEntry.id]: {
                          ...(editDataRef.current[activeSingleEntry.id] || activeSingleEntry),
                          fullContent: val
                        }
                      };
                    }
                  }} 
                  onKeyDown={handleContentKeyDown}
                  className="w-full flex-1 p-8 font-mono text-sm leading-[1.4] bg-[var(--card-bg)] text-[var(--text-main)] resize-none outline-none border-none cursor-text select-text"
                  placeholder="Write your note in Markdown..."
                  onBlur={() => {
                    if (activeSingleEntry?.id) {
                      triggerAutoMetadataOnFirstBlur(activeSingleEntry.id);
                    }
                  }}
                ></textarea>
              </div>
            </div>,
            document.body
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KnowledgeApp />);
  </script>
</body>
</html>
