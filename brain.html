<body class="bg-claude-bg dark:bg-claude-bgdark text-stone-800 dark:text-stone-300 font-sans overflow-hidden transition-colors duration-200 antialiased selection:bg-neutral-500/30">
  
  <!-- Global Diagnostic Screen -->
  <div id="error-fallback" class="hidden fixed inset-0 bg-slate-900 text-white p-8 flex flex-col items-center justify-center z-[9999]">
    <div class="max-w-md w-full bg-slate-800 p-6 rounded-xl shadow-xl  ">
      <div class="flex items-center gap-3 text-red-500 mb-4">
        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
        <h1 class="text-xl font-bold">App Initialization Error</h1>
      </div>
      <p class="text-slate-300 text-sm mb-4">A background script failed or encountered a critical syntax error. This is usually due to delayed CDNs or local script blockers.</p>
      <div id="error-details" class="bg-black/40 p-4 rounded-lg font-mono text-xs text-red-400 overflow-x-auto mb-6 max-h-40"></div>
      <button onclick="window.location.reload()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors">
        <i class="fa-solid fa-rotate-right mr-2"></i> Reload App
      </button>
    </div>
  </div>

  <div id="root"></div>

  <script>
    window.addEventListener('error', function(e) {
      console.error("Captured Error:", e);
      const fallback = document.getElementById('error-fallback');
      const details = document.getElementById('error-details');
      if (fallback && details) {
        fallback.classList.remove('hidden');
        details.textContent = `${e.message}\nLine: ${e.lineno}:${e.colno}\nFile: ${e.filename}`;
      }
    });
  </script>

  <script type="text/babel">

    const { useState, useEffect, useRef } = React;

    const APP_VERSION = "v2.1.0";

    const isMediaSource = (url) => {
      if (!url) return false;
      return /(youtube\.com|youtu\.be|vimeo\.com|tiktok\.com|twitch\.tv|dailymotion\.com|spotify\.com|soundcloud\.com|\.(mp4|webm|ogg|mov|mp3|wav|m4a)$)/i.test(url);
    };

    const getEmbedUrl = (url) => {
      if (!url) return null;
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
      if (match && match[1]) return `https://www.youtube-nocookie.com/embed/${match[1]}?origin=https://localhost`;
      match = url.match(/vimeo\.com\/(?:video\/)?([0-9]+)/);
      if (match && match[1]) return `https://player.vimeo.com/video/${match[1]}`;
      return null;
    };

    const parseMarkdown = (content) => {
      if (typeof marked !== 'undefined' && marked.parse) {
        return marked.parse(content || '');
      }
      return (content || '')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br />');
    };

    const parseMarkdownInline = (content) => {
      if (typeof marked !== 'undefined' && marked.parseInline) {
        return marked.parseInline(content || '');
      }
      return content || '';
    };

    const injectReferences = (text, allEntries) => {
      if (!text) return '';
      return text.replace(/\[\[kb-ref:([^\]]+)\]\]/g, (match, entryId) => {
        const refEntry = (allEntries || []).find(e => e.id === entryId);
        if (!refEntry) return `<span class="text-red-500 dark:text-red-400 text-xs font-semibold bg-red-50 dark:bg-red-900/30 px-2 py-1 rounded">[Broken Link: ${entryId}]</span>`;
        return `<span class="kb-embedded-ref cursor-pointer text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300 font-semibold px-1.5 py-0.5 mx-1 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-900/30 dark:hover:bg-indigo-900/50 rounded transition-colors" data-id="${refEntry.id}" title="${refEntry.title}">[Ref: ${refEntry.numericId}]</span>`;
      });
    };

    const INITIAL_ENTRY = {
      id: 'sample-1',
      title: 'Welcome to your Knowledge Base',
      summary: 'A clean, offline-first personal knowledge base with a built-in AI Assistant.',
      shortVersion: [
        'Drag and drop web links or text into the top-left box to add notes.',
        'All data is saved locally to your selected JSON file.',
        'Use the AI Assistant on the right to summarize or query your notes.',
        'Use [[kb-ref:ID]] to create backlinks between documents.'
      ],
      fullContent: 'Welcome! This application runs entirely in your browser and automatically syncs with a local JSON file on your machine.\n\n### Quick Start\n* **Ingest Notes:** Paste any article or YouTube link in the input bar above the list.\n* **Edit:** Click the Edit button on any note to refine title, summary, takeaways, or content.\n* **AI Assistant:** Click **Ask AI** or open the right sidebar to synthesize information across your notes.\n* **Taxonomy:** Organize notes by Projects, Categories, and Tags in the left sidebar.',
      categories: ['getting started'],
      tags: ['tutorial'],
      projects: [],
      numericId: 1,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      sourceUrl: null,
      references: [],
      pinned: true
    };

    const normalizeTaxonomy = (entries) => {
      return (entries || []).map(e => ({
        ...e,
        categories: Array.isArray(e.categories) ? [...new Set(e.categories.map(c => String(c).toLowerCase()))] : [],
        tags: Array.isArray(e.tags) ? [...new Set(e.tags.map(t => String(t).toLowerCase()))] : [],
        projects: Array.isArray(e.projects) ? [...new Set(e.projects.map(p => String(p).toLowerCase()))] : []
      }));
    };

    const fetchAndScrubUrl = async (urlString) => {
      let html = '';
      try {
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(urlString)}`);
        const data = await response.json();
        if (data.contents) html = data.contents;
        else throw new Error("Invalid proxy response");
      } catch (err) {
        try {
          const response2 = await fetch(`https://corsproxy.io/?${encodeURIComponent(urlString)}`);
          if (!response2.ok) throw new Error("Network response failed");
          html = await response2.text();
        } catch (err2) {
          throw new Error("Scrape blocked. Falling back to search.");
        }
      }
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      let originalTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || 
                          doc.querySelector('title')?.textContent || 
                          doc.querySelector('h1')?.textContent || 
                          "Untitled Page";
      originalTitle = originalTitle.trim().replace(/\s*[|•-]\s*([A-Za-z0-9 ]+Substack|[A-Za-z0-9 ]+Medium|[A-Za-z0-9 ]+Blog|[A-Za-z0-9 ]+HQ|QUT.*)$/i, '').trim();

      const unwanted = doc.querySelectorAll('script, style, noscript, iframe, svg, video, header, footer, nav, aside, form, .menu, .mega-menu, .global-nav, .navbar');
      unwanted.forEach(el => el.remove());
      
      let mainNode = doc.querySelector('.profile-details') || doc.querySelector('article') || doc.querySelector('main') || doc.body;
      
      let markdownContent = '';
      if (typeof TurndownService !== 'undefined') {
        const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
        markdownContent = turndownService.turndown(mainNode);
      } else {
        markdownContent = mainNode.innerText || mainNode.textContent || '';
      }
      
      if (!markdownContent || markdownContent.length < 50) throw new Error("No text found. Falling back to search.");
      return { title: originalTitle, content: markdownContent.substring(0, 50000) }; 
    };

    async function verifyPermission(fileHandle, readWrite) {
      const options = { mode: readWrite ? 'readwrite' : 'read' };
      if ((await fileHandle.queryPermission(options)) === 'granted') return true;
      if ((await fileHandle.requestPermission(options)) === 'granted') return true;
      return false;
    }

    const readFileAsBase64 = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const callGemini = async (key, payload, model) => {
      const activeModel = model || 'gemini-2.5-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${key}`;
      const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await response.json();
      
      if (result.error) throw new Error(result.error.message);
      if (!result.candidates || result.candidates.length === 0) {
        const reason = result.promptFeedback?.blockReason || "Empty response from AI";
        throw new Error(`AI rejected the prompt. Reason: ${reason}`);
      }
      return result;
    };

    const parseAIJson = (text) => {
      let t = text.trim();
      const match = t.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
      if (match) t = match[1];
      return JSON.parse(t);
    };

    const EditableText = ({ text, onSave, className = '', tag = 'span', multiline = false, stripPrefix = '' }) => {
      const [isEditing, setIsEditing] = useState(false);
      const elementRef = useRef(null);

      const handleDoubleClick = (e) => {
        e.stopPropagation();
        setIsEditing(true);
      };

      const handleBlur = () => {
        setIsEditing(false);
        if (elementRef.current) {
          let newText = elementRef.current.innerText.trim();
          if (newText !== text && newText !== stripPrefix + text && newText !== '') {
             if (stripPrefix && newText.startsWith(stripPrefix)) {
                 newText = newText.substring(stripPrefix.length);
             }
             onSave(newText);
          } else {
             elementRef.current.innerText = (stripPrefix || '') + text;
          }
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !multiline) {
          e.preventDefault();
          elementRef.current.blur();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          elementRef.current.innerText = (stripPrefix || '') + text;
          setIsEditing(false);
        }
      };

      useEffect(() => {
        if (isEditing && elementRef.current) {
          elementRef.current.focus();
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(elementRef.current);
          selection.removeAllRanges();
          selection.addRange(range);
        }
      }, [isEditing]);

      const Tag = tag;

      return (
        <Tag
          ref={elementRef}
          contentEditable={isEditing}
          onDoubleClick={handleDoubleClick}
          onBlur={handleBlur}
          onKeyDown={handleKeyDown}
          className={`${className} ${isEditing ? 'outline-none ring-2 ring-indigo-500 rounded bg-white/90 dark:bg-slate-800/90 cursor-text' : ''}`}
          suppressContentEditableWarning={true}
        >
          {stripPrefix}{text}
        </Tag>
      );
    };

    function KnowledgeApp() {
      const [appState, setAppState] = useState('init'); 
      const [savedHandle, setSavedHandle] = useState(null);
      const [fileHandle, setFileHandle] = useState(null);
      const [fileName, setFileName] = useState('');
      const [lastSyncTime, setLastSyncTime] = useState(Date.now());
      
      const [historyState, setHistoryState] = useState({ past: [], present: [] });
      const entries = historyState.present;
      
      const setEntries = (updater) => {
        setHistoryState(prev => {
          const nextPresent = typeof updater === 'function' ? updater(prev.present) : updater;
          if (nextPresent === prev.present) return prev;
          return {
            past: [...prev.past.slice(-25), prev.present],
            present: nextPresent
          };
        });
      };

      const undoEntries = () => {
        setHistoryState(h => {
          if (h.past.length === 0) return h;
          const previous = h.past[h.past.length - 1];
          const newPast = h.past.slice(0, h.past.length - 1);
          return { past: newPast, present: previous };
        });
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
            e.preventDefault();
            undoEntries();
          }
          if ((e.metaKey || e.ctrlKey) && (e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'l')) {
            e.preventDefault();
            setIsAssistantOpen(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const [apiKeys, setApiKeys] = useState([]);
      const [model, setModel] = useState('gemini-2.5-flash');
      const [theme, setTheme] = useState('default');
      
      const [showKeyModal, setShowKeyModal] = useState(false);
      const [showManual, setShowManual] = useState(false);
      const [tempKeys, setTempKeys] = useState([]);
      const [tempModel, setTempModel] = useState('gemini-2.5-flash');
      const [tempTheme, setTempTheme] = useState('default');

      const [isLeftSidebarOpen, setIsLeftSidebarOpen] = useState(true);
      const [isListSidebarOpen, setIsListSidebarOpen] = useState(true);
      const [activeProjects, setActiveProjects] = useState([]);
      const [activeCategories, setActiveCategories] = useState([]);
      const [activeTags, setActiveTags] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedEntryIds, setSelectedEntryIds] = useState([]);

      const [addInput, setAddInput] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [error, setError] = useState(null);

      const [editingEntries, setEditingEntries] = useState({});
      const [editData, setEditData] = useState({});
      const [editCatInput, setEditCatInput] = useState({});
      const [editTagInput, setEditTagInput] = useState({});
      const [editProjectInput, setEditProjectInput] = useState({});

      // Unified AI Assistant
      const [isAssistantOpen, setIsAssistantOpen] = useState(window.innerWidth >= 1280);
      const [assistantScope, setAssistantScope] = useState('selected'); // 'selected' | 'workspace'
      const [assistantMessages, setAssistantMessages] = useState([]);
      const [assistantInput, setAssistantInput] = useState('');
      const [isAssistantThinking, setIsAssistantThinking] = useState(false);
      const [actionFeedback, setActionFeedback] = useState(null); // { msgId, type: 'copy'|'insert' }

      const [dragOverEntryId, setDragOverEntryId] = useState(null);
      const [hoveredRef, setHoveredRef] = useState(null);
      const [isTagsOpen, setIsTagsOpen] = useState(true);
      const [showWorkspaceOptions, setShowWorkspaceOptions] = useState(false);
      const [legacyChats, setLegacyChats] = useState({});

      const chatScrollRef = useRef(null);
      const sourceCacheRef = useRef({});

      const handleGeminiCall = async (payload, customModel) => {
        if (!apiKeys || apiKeys.length === 0) {
          throw new Error("Please set your Gemini API key in Settings (Gear Icon in left sidebar).");
        }
        const activeKey = apiKeys[0].key;
        const activeModel = customModel || model || 'gemini-2.5-flash';
        return await callGemini(activeKey, payload, activeModel);
      };

      // Auto-scroll assistant thread
      useEffect(() => {
        if (chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
        }
      }, [assistantMessages, isAssistantThinking, isAssistantOpen]);

      // Initialize workspace from IndexedDB handle
      useEffect(() => {
        if (typeof idbKeyval !== 'undefined') {
          idbKeyval.get('kb_file_handle').then(handle => {
            if (handle) setSavedHandle(handle);
            setAppState('landing');
          }).catch(err => {
            console.error("IndexedDB error:", err);
            setAppState('landing');
          });
        } else {
          setAppState('landing');
        }
      }, []);

      // Clean, single Auto-Save to disk (no background AI timers)
      useEffect(() => {
        if (appState !== 'workspace' || !fileHandle) return;
        const timer = setTimeout(async () => {
          try {
            const dataToWrite = {
              entries,
              apiKeys,
              model,
              theme,
              assistantMessages: assistantMessages.slice(-50),
              chats: legacyChats,
              updatedAt: Date.now()
            };
            const writable = await fileHandle.createWritable();
            await writable.write(JSON.stringify(dataToWrite, null, 2));
            await writable.close();

            const updatedFile = await fileHandle.getFile();
            setLastSyncTime(updatedFile.lastModified);
          } catch (err) {
            console.error("Auto-save sync failed:", err);
          }
        }, 1200);
        return () => clearTimeout(timer);
      }, [entries, apiKeys, model, theme, assistantMessages, legacyChats, appState, fileHandle]);

      const ensureNumericIds = (loadedEntries) => {
        let maxId = loadedEntries.reduce((max, e) => Math.max(max, e.numericId || 0), 0);
        return loadedEntries.map(e => {
          if (!e.numericId) {
            maxId += 1;
            return { ...e, numericId: maxId };
          }
          return e;
        });
      };

      const processLoadedEntries = (entriesToProcess) => {
        return normalizeTaxonomy(ensureNumericIds(entriesToProcess));
      };

      const migrateWorkspaceData = (data) => {
        let migratedEntries = [];
        if (data.entries && Array.isArray(data.entries)) {
          migratedEntries = processLoadedEntries(data.entries).map(e => ({
            ...e,
            updatedAt: e.updatedAt || e.createdAt || Date.now()
          }));
        } else {
          migratedEntries = [INITIAL_ENTRY];
        }

        let parsedKeys = data.apiKeys || [];
        if (!parsedKeys.length && data.apiKey) {
          parsedKeys = data.apiKey.split(',').map((k, i) => ({ id: 'k' + Date.now() + i, name: 'Key ' + (i + 1), key: k.trim() })).filter(k => k.key);
        }

        return {
          entries: migratedEntries,
          apiKeys: parsedKeys,
          model: data.model || 'gemini-2.5-flash',
          theme: data.theme || 'default',
          assistantMessages: Array.isArray(data.assistantMessages) ? data.assistantMessages : [],
          chats: data.chats || {}
        };
      };

      const loadWorkspaceData = async (handle) => {
        try {
          const hasPerm = await verifyPermission(handle, true);
          if (!hasPerm) return;
          const file = await handle.getFile();
          const text = await file.text();
          
          let data = { entries: [] };
          if (text.trim()) data = JSON.parse(text);
          
          const migrated = migrateWorkspaceData(data);
          
          setHistoryState({ past: [], present: migrated.entries });
          setSelectedEntryIds(migrated.entries.length > 0 ? [migrated.entries[0].id] : []);
          
          setApiKeys(migrated.apiKeys);
          setModel(migrated.model);
          setTheme(migrated.theme);
          setAssistantMessages(migrated.assistantMessages);
          setLegacyChats(migrated.chats);
          
          setFileHandle(handle);
          setFileName(file.name);
          setLastSyncTime(file.lastModified);
          
          if (typeof idbKeyval !== 'undefined') {
            await idbKeyval.set('kb_file_handle', handle);
          }
          setAppState('workspace');
        } catch (err) {
          setError(`Failed to open workspace: ${err.message}`);
        }
      };

      const handleResume = () => loadWorkspaceData(savedHandle);

      const handleOpenFile = async () => {
        try {
          if (!window.showOpenFilePicker) throw new Error("File System Access API is not supported in this browser.");
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
          });
          await loadWorkspaceData(handle);
        } catch (err) {
          if (err.name !== 'AbortError') setError(`File error: ${err.message}`);
        }
      };

      const handleNewFile = async () => {
        try {
          if (!window.showSaveFilePicker) throw new Error("File System Access API is not supported in this browser.");
          const handle = await window.showSaveFilePicker({
            suggestedName: 'my-knowledge-base.json',
            types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
          });
          setFileHandle(handle);
          setFileName(handle.name);
          setHistoryState({ past: [], present: [INITIAL_ENTRY] });
          setApiKeys([]);
          setModel('gemini-2.5-flash');
          setTheme('default');
          setAssistantMessages([]);
          setLegacyChats({});
          setSelectedEntryIds([INITIAL_ENTRY.id]);
          
          const file = await handle.getFile();
          setLastSyncTime(file.lastModified);
          
          if (typeof idbKeyval !== 'undefined') {
            await idbKeyval.set('kb_file_handle', handle);
          }
          setAppState('workspace');
        } catch (err) {
          if (err.name !== 'AbortError') setError(`File error: ${err.message}`);
        }
      };
      
      const handleManualImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            const migrated = migrateWorkspaceData(data);

            setHistoryState({ past: [], present: migrated.entries });
            setSelectedEntryIds(migrated.entries.length > 0 ? [migrated.entries[0].id] : []);
            setApiKeys(migrated.apiKeys);
            setModel(migrated.model);
            setTheme(migrated.theme);
            setAssistantMessages(migrated.assistantMessages);
            setLegacyChats(migrated.chats);
            
            setFileName(file.name);
            setFileHandle(null);
            setLastSyncTime(Date.now());
            setAppState('workspace');
          } catch (err) {
            setError(`Import error: ${err.message}`);
          }
        };
        reader.readAsText(file);
      };

      const handleCloseWorkspace = () => {
        setAppState('landing');
        setFileHandle(null);
        setHistoryState({ past: [], present: [] });
      };

      // Taxonomy stats
      const projectCounts = {};
      const categoryCounts = {};
      const tagCounts = {};
      const allProjects = new Set();
      const allCategories = new Set();
      const allTags = new Set();

      entries.forEach(e => {
        if (Array.isArray(e.projects)) {
          e.projects.forEach(p => {
            allProjects.add(p);
            projectCounts[p] = (projectCounts[p] || 0) + 1;
          });
        }
        if (Array.isArray(e.categories)) {
          e.categories.forEach(c => {
            allCategories.add(c);
            categoryCounts[c] = (categoryCounts[c] || 0) + 1;
          });
        }
        if (Array.isArray(e.tags)) {
          e.tags.forEach(t => {
            allTags.add(t);
            tagCounts[t] = (tagCounts[t] || 0) + 1;
          });
        }
      });

      // Helper for clean, case-insensitive taxonomy comparison
      const normTax = s => String(s || '').trim().toLowerCase();

      const availableProjects = new Set();
      const availableCategories = new Set();
      const availableTags = new Set();

      entries.forEach(e => {
        const matchesProject = activeProjects.length === 0 || (Array.isArray(e.projects) && e.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
        const matchesCat = activeCategories.length === 0 || (Array.isArray(e.categories) && e.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
        const matchesTag = activeTags.length === 0 || (Array.isArray(e.tags) && e.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));

        if (matchesProject && matchesTag) {
          if (Array.isArray(e.categories)) e.categories.forEach(c => availableCategories.add(c));
        }
        if (matchesProject && matchesCat) {
          if (Array.isArray(e.tags)) e.tags.forEach(t => availableTags.add(t));
        }
        if (matchesCat && matchesTag) {
          if (Array.isArray(e.projects)) e.projects.forEach(p => availableProjects.add(p));
        }
      });

      const handleProjectClick = (proj, e) => {
        setActiveCategories([]);
        setActiveTags([]);
        if (e.ctrlKey || e.metaKey) {
          setActiveProjects(prev => prev.some(p => normTax(p) === normTax(proj)) ? prev.filter(p => normTax(p) !== normTax(proj)) : [...prev, proj]);
        } else {
          setActiveProjects(prev => (prev.length === 1 && normTax(prev[0]) === normTax(proj)) ? [] : [proj]);
        }
      };

      const handleCategoryClick = (cat, e) => {
        setActiveTags([]);
        if (e.ctrlKey || e.metaKey) {
          setActiveCategories(prev => prev.some(c => normTax(c) === normTax(cat)) ? prev.filter(c => normTax(c) !== normTax(cat)) : [...prev, cat]);
        } else {
          setActiveCategories(prev => (prev.length === 1 && normTax(prev[0]) === normTax(cat)) ? [] : [cat]);
        }
      };

      const handleTagClick = (tag, e) => {
        if (e.ctrlKey || e.metaKey) {
          setActiveTags(prev => prev.some(t => normTax(t) === normTax(tag)) ? prev.filter(t => normTax(t) !== normTax(tag)) : [...prev, tag]);
        } else {
          setActiveTags(prev => (prev.length === 1 && normTax(prev[0]) === normTax(tag)) ? [] : [tag]);
        }
      };

      const sortedProjects = Array.from(allProjects).sort((a, b) => a.localeCompare(b));
      const sortedCategories = Array.from(allCategories).sort((a, b) => a.localeCompare(b));
      const sortedTags = Array.from(allTags).sort((a, b) => {
        const diff = (tagCounts[b] || 0) - (tagCounts[a] || 0);
        return diff !== 0 ? diff : a.localeCompare(b);
      });

      const selectedEntries = entries.filter(e => selectedEntryIds.includes(e.id));
      const activeSingleEntry = selectedEntryIds.length === 1 ? entries.find(e => e.id === selectedEntryIds[0]) : null;

      // Ingestion / Add entry
      const processInput = async (textContent, file = null) => {
        if (!apiKeys || apiKeys.length === 0) {
          setShowKeyModal(true);
          return setError("Please set your Gemini API key in Settings first.");
        }
        setIsAnalyzing(true);
        setError(null);
        try {
          let sourceUrl = null;
          let originalWebTitle = null;
          let useSearchTool = false;
          let prompt = '';
          let payloadParts = [];

          const schema = {
            type: "OBJECT",
            properties: {
              title: { type: "STRING" },
              summary: { type: "STRING" },
              shortVersion: { type: "ARRAY", items: { type: "STRING" } },
              fullContent: { type: "STRING" },
              categories: { type: "ARRAY", items: { type: "STRING" } },
              tags: { type: "ARRAY", items: { type: "STRING" } },
              projects: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["title", "summary", "shortVersion", "fullContent", "categories", "tags", "projects"]
          };

          const taxonomyRules = `
          Taxonomy guidelines:
          - Projects: Assign 0-1 scoped initiative from: ${JSON.stringify(Array.from(allProjects))}. Return in lowercase.
          - Categories: Assign 1-2 broad categories from existing list: ${JSON.stringify(Array.from(allCategories))}. Return in lowercase.
          - Tags: Assign 2-4 concept tags from existing list if possible: ${JSON.stringify(Array.from(allTags))}. Include author/creator name as tag. Return in lowercase.`;

          if (file && file.type === 'application/pdf') {
            const base64Data = await readFileAsBase64(file);
            originalWebTitle = file.name;
            prompt = `Analyze this PDF document and return JSON:
            1. Title (Use the document title or "${file.name}").
            2. TLDR summary (MAX 25 WORDS).
            3. 3-5 key points in 'shortVersion'.
            4. Detailed reconstructed fullContent in clean Markdown.
            ${taxonomyRules}`;
            payloadParts = [
              { text: prompt },
              { inlineData: { mimeType: "application/pdf", data: base64Data } }
            ];
          } else if (textContent) {
            const droppedData = textContent.trim();
            const isUrl = /^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(droppedData);
            const isYouTube = isUrl && /(youtube\.com|youtu\.be)/i.test(droppedData);
            sourceUrl = isUrl ? droppedData : null;
            let rawContent = droppedData;

            if (isYouTube) {
              useSearchTool = true;
              let videoId = '';
              try {
                const urlObj = new URL(droppedData);
                videoId = urlObj.hostname.includes('youtu.be') ? urlObj.pathname.slice(1) : urlObj.searchParams.get('v');
              } catch(e) {}
              prompt = `Use Google Search to find the exact content, transcript, or summary for this YouTube video (URL: ${droppedData}, ID: ${videoId}). Return strictly JSON:
              1. Title.
              2. TLDR summary (MAX 25 WORDS).
              3. 3-5 key points in 'shortVersion'.
              4. Detailed reconstructed fullContent in clean Markdown.
              ${taxonomyRules}`;
              payloadParts = [{ text: prompt }];
            } else if (isUrl) {
              try {
                const scrapeResult = await fetchAndScrubUrl(droppedData);
                originalWebTitle = scrapeResult.title;
                rawContent = scrapeResult.content;
                prompt = `Analyze this web article and return strictly JSON:
                1. Title.
                2. TLDR summary (MAX 25 WORDS).
                3. 3-5 key takeaways in 'shortVersion'.
                4. Reconstruct detailed fullContent in clean Markdown.
                ${taxonomyRules}
                Content:\n${rawContent.substring(0, 40000)}`;
              } catch (err) {
                useSearchTool = true;
                prompt = `Use Google Search to find content for this URL: ${droppedData}. Return strictly JSON:
                1. Title. 2. TLDR summary (MAX 25 WORDS). 3. 3-5 key points in 'shortVersion'. 4. Reconstruct detailed fullContent in Markdown. ${taxonomyRules}`;
              }
              payloadParts = [{ text: prompt }];
            } else {
              prompt = `Analyze this text and return strictly JSON:
              1. Descriptive Title. 2. TLDR summary (MAX 25 WORDS). 3. 3-5 key takeaways in 'shortVersion'. 4. Format input text as clean Markdown in 'fullContent'. ${taxonomyRules}
              Content:\n${rawContent.substring(0, 40000)}`;
              payloadParts = [{ text: prompt }];
            }
          } else {
            throw new Error("No valid content to process.");
          }

          const payload = {
            contents: [{ role: 'user', parts: payloadParts }],
            generationConfig: { responseMimeType: "application/json", responseSchema: schema }
          };
          if (useSearchTool) payload.tools = [{ google_search: {} }];

          const result = await handleGeminiCall(payload, model);
          const parsed = parseAIJson(result.candidates[0].content.parts[0].text);
          const nextNumericId = entries.reduce((max, e) => Math.max(max, e.numericId || 0), 0) + 1;

          const autoTags = [];
          if (file && file.type === 'application/pdf') autoTags.push('pdf');
          else if (sourceUrl) {
            if (isMediaSource(sourceUrl)) autoTags.push('video');
            else autoTags.push('web');
          } else {
            autoTags.push('note');
          }

          const newEntry = {
            id: 'entry-' + Date.now(),
            numericId: nextNumericId,
            title: originalWebTitle || parsed.title || 'Untitled Note',
            summary: parsed.summary || '',
            shortVersion: Array.isArray(parsed.shortVersion) ? parsed.shortVersion : [],
            fullContent: parsed.fullContent || '',
            categories: (parsed.categories || []).map(c => String(c).toLowerCase()),
            tags: [...new Set([...(parsed.tags || []).map(t => String(t).toLowerCase()), ...autoTags])],
            projects: (parsed.projects || []).map(p => String(p).toLowerCase()),
            createdAt: Date.now(),
            updatedAt: Date.now(),
            sourceUrl: sourceUrl,
            references: [],
            pinned: false
          };

          setEntries(prev => [newEntry, ...prev]);
          setSelectedEntryIds([newEntry.id]);
          setAddInput('');
        } catch (err) {
          setError(err.message || "Failed to process content.");
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        setError(null);
        if (e.dataTransfer.getData('kb-ref-id') || e.dataTransfer.getData('kb-tax')) return;
        const file = e.dataTransfer.files?.[0];
        const droppedData = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
        if (file && file.type === 'application/pdf') {
          processInput(null, file);
        } else if (droppedData) {
          processInput(droppedData, null);
        }
      };

      const handleEntryClick = (e, id) => {
        if (e.ctrlKey || e.metaKey) {
          setSelectedEntryIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
        } else {
          setSelectedEntryIds([id]);
        }
      };

      const deleteEntry = (id) => {
        if (!window.confirm("Are you sure you want to delete this note?")) return;
        setEntries(prev => prev.filter(e => e.id !== id));
        setSelectedEntryIds(prev => prev.filter(i => i !== id));
        setEditingEntries(prev => { const n = { ...prev }; delete n[id]; return n; });
      };

      const togglePin = (e, id) => {
        e.stopPropagation();
        setEntries(prev => prev.map(ent => ent.id === id ? { ...ent, pinned: !ent.pinned, updatedAt: Date.now() } : ent));
      };

      const handleNewNote = () => {
        const nextNumericId = entries.reduce((max, e) => Math.max(max, e.numericId || 0), 0) + 1;
        const newId = 'entry-' + Date.now();
        const newEntry = {
          id: newId,
          title: 'Untitled Note',
          numericId: nextNumericId,
          summary: '',
          shortVersion: [],
          fullContent: '',
          categories: [...activeCategories],
          tags: [...activeTags],
          projects: [...activeProjects],
          createdAt: Date.now(),
          updatedAt: Date.now(),
          sourceUrl: null,
          references: [],
          pinned: false
        };
        setEntries(prev => [newEntry, ...prev]);
        setSelectedEntryIds([newId]);
        setEditData(prev => ({
          ...prev,
          [newId]: {
            title: 'Untitled Note',
            summary: '',
            shortVersion: '',
            fullContent: '',
            categories: [...activeCategories],
            tags: [...activeTags],
            projects: [...activeProjects],
            sourceUrl: '',
            references: []
          }
        }));
        setEditingEntries(prev => ({ ...prev, [newId]: true }));
      };

      const startEditing = (entry) => {
        setEditData(prev => ({
          ...prev,
          [entry.id]: {
            title: entry.title || '',
            summary: entry.summary || '',
            fullContent: entry.fullContent || (
              Array.isArray(entry.chatHistory) && entry.chatHistory.length > 0
                ? entry.chatHistory.map(m => `**${m.role === 'user' ? 'User' : 'Assistant'}:**\n\n${m.text}`).join('\n\n---\n\n')
                : ''
            ),
            shortVersion: (Array.isArray(entry.shortVersion) ? entry.shortVersion : []).join('\n'),
            categories: Array.isArray(entry.categories) ? [...entry.categories] : [],
            tags: Array.isArray(entry.tags) ? [...entry.tags] : [],
            projects: Array.isArray(entry.projects) ? [...entry.projects] : [],
            sourceUrl: entry.sourceUrl || '',
            references: Array.isArray(entry.references) ? entry.references : []
          }
        }));
        setEditingEntries(prev => ({ ...prev, [entry.id]: true }));
      };

      const saveNote = (id) => {
        const data = editData[id];
        if (!data) return;
        setEntries(prev => prev.map(e => {
          if (e.id === id) {
            return {
              ...e,
              title: data.title || 'Untitled',
              summary: data.summary,
              fullContent: data.fullContent,
              shortVersion: data.shortVersion.split('\n').map(s => s.trim()).filter(Boolean),
              sourceUrl: data.sourceUrl || null,
              categories: data.categories.map(c => c.toLowerCase()),
              tags: data.tags.map(t => t.toLowerCase()),
              projects: data.projects.map(p => p.toLowerCase()),
              references: data.references || [],
              updatedAt: Date.now()
            };
          }
          return e;
        }));
        setEditingEntries(prev => { const n = { ...prev }; delete n[id]; return n; });
      };

      const cancelEdit = (id) => {
        setEditingEntries(prev => { const n = { ...prev }; delete n[id]; return n; });
      };

      // Edit field helpers
      const removeEditCategory = (id, cat) => setEditData(prev => ({ ...prev, [id]: { ...prev[id], categories: prev[id].categories.filter(c => c !== cat) } }));
      const removeEditTag = (id, tag) => setEditData(prev => ({ ...prev, [id]: { ...prev[id], tags: prev[id].tags.filter(t => t !== tag) } }));
      const removeEditProject = (id, proj) => setEditData(prev => ({ ...prev, [id]: { ...prev[id], projects: prev[id].projects.filter(p => p !== proj) } }));

      const handleAddEditCategory = (id, e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = (editCatInput[id] || '').trim().replace(/^,|,$/g, '').toLowerCase();
          if (val && !editData[id].categories.includes(val)) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], categories: [...prev[id].categories, val] } }));
          }
          setEditCatInput(prev => ({ ...prev, [id]: '' }));
        }
      };

      const handleAddEditProject = (id, e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = (editProjectInput[id] || '').trim().replace(/^,|,$/g, '').toLowerCase();
          if (val && !editData[id].projects.includes(val)) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], projects: [...prev[id].projects, val] } }));
          }
          setEditProjectInput(prev => ({ ...prev, [id]: '' }));
        }
      };

      const handleAddEditTag = (id, e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = (editTagInput[id] || '').trim().replace(/^,|,$/g, '').toLowerCase();
          if (val && !editData[id].tags.includes(val)) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], tags: [...prev[id].tags, val] } }));
          }
          setEditTagInput(prev => ({ ...prev, [id]: '' }));
        }
      };

      // Focused Note Edit AI Helpers
      const handleSuggestTitle = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        try {
          const data = editData[id] || entries.find(e => e.id === id);
          if (!data) throw new Error("Note not found.");
          const prompt = `Read this note and suggest a punchy, highly descriptive title (maximum 6 words). Return strictly JSON: {"title": "The Title"}.\n\nContent: ${data.fullContent || data.summary}`;
          const payload = {
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { title: { type: "STRING" } } } }
          };
          const result = await handleGeminiCall(payload, model);
          const resData = parseAIJson(result.candidates[0].content.parts[0].text);
          if (resData.title) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], title: resData.title } }));
          }
        } catch(err) {
          setError("Title suggestion failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleGenerateTLDR = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        try {
          const data = editData[id] || entries.find(e => e.id === id);
          if (!data) throw new Error("Note not found.");
          const prompt = `Write a structured executive summary (TL;DR) of this note. Capture core context and key points. Limit strictly to 2 sentences. Return strictly JSON: {"summary": "text"}.\nTitle: ${data.title}\nContent: ${data.fullContent}`;
          const payload = {
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { summary: { type: "STRING" } } } }
          };
          const result = await handleGeminiCall(payload, model);
          const resData = parseAIJson(result.candidates[0].content.parts[0].text);
          if (resData.summary) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], summary: resData.summary } }));
          }
        } catch(err) {
          setError("TL;DR generation failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleGenerateTakeaways = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        try {
          const data = editData[id] || entries.find(e => e.id === id);
          if (!data) throw new Error("Note not found.");
          const prompt = `Analyze this note. Extract exactly 3-5 crucial key takeaways. Return strictly JSON: {"shortVersion": ["point 1", "point 2"]}.\nTitle: ${data.title}\nContent: ${data.fullContent}`;
          const payload = {
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { shortVersion: { type: "ARRAY", items: { type: "STRING" } } } } }
          };
          const result = await handleGeminiCall(payload, model);
          const resData = parseAIJson(result.candidates[0].content.parts[0].text);
          if (resData.shortVersion && Array.isArray(resData.shortVersion)) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], shortVersion: resData.shortVersion.join('\n') } }));
          }
        } catch(err) {
          setError("Key points generation failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleGenerateTaxonomies = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        try {
          const data = editData[id] || entries.find(e => e.id === id);
          if (!data) throw new Error("Note not found.");
          const prompt = `Analyze this note and return JSON matching: {"projects": ["proj"], "categories": ["cat"], "tags": ["tag1"]}.
          - Projects: Assign 0-1 from: ${JSON.stringify(Array.from(allProjects))}.
          - Categories: Assign 1-2 from: ${JSON.stringify(Array.from(allCategories))}.
          - Tags: Assign 2-4 specific concept keywords. Reuse: ${JSON.stringify(Array.from(allTags))}. Return in lowercase.
          Title: ${data.title}\nContent: ${data.fullContent}`;
          const payload = {
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { projects: { type: "ARRAY", items: { type: "STRING" } }, categories: { type: "ARRAY", items: { type: "STRING" } }, tags: { type: "ARRAY", items: { type: "STRING" } } } } }
          };
          const result = await handleGeminiCall(payload, model);
          const resData = parseAIJson(result.candidates[0].content.parts[0].text);
          setEditData(prev => ({
            ...prev,
            [id]: {
              ...prev[id],
              projects: Array.isArray(resData.projects) ? resData.projects.map(p => p.toLowerCase()) : prev[id].projects,
              categories: Array.isArray(resData.categories) ? resData.categories.map(c => c.toLowerCase()) : prev[id].categories,
              tags: Array.isArray(resData.tags) ? resData.tags.map(t => t.toLowerCase()) : prev[id].tags
            }
          }));
        } catch(err) {
          setError("Auto-tag failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      // Taxonomy drag/drop & rename operations
      const performTaxonomyMigration = (oldName, oldType, newType, newName) => {
        const oldLower = oldName.toLowerCase();
        setEntries(prev => prev.map(entry => {
          let newProjs = [...(Array.isArray(entry.projects) ? entry.projects : [])];
          let newCats = [...(Array.isArray(entry.categories) ? entry.categories : [])];
          let newTags = [...(Array.isArray(entry.tags) ? entry.tags : [])];
          let wasModified = false;

          const removeFromList = (list) => {
            if (list.some(i => i.toLowerCase() === oldLower)) {
              wasModified = true;
              return list.filter(i => i.toLowerCase() !== oldLower);
            }
            return list;
          };

          if (oldType === 'project') newProjs = removeFromList(newProjs);
          if (oldType === 'category') newCats = removeFromList(newCats);
          if (oldType === 'tag') newTags = removeFromList(newTags);

          if (wasModified) {
            const targetList = newType === 'project' ? newProjs : newType === 'category' ? newCats : newTags;
            if (!targetList.some(i => i.toLowerCase() === newName.toLowerCase())) {
              targetList.push(newName.toLowerCase());
            }
            return {
              ...entry,
              projects: [...new Set(newProjs)],
              categories: [...new Set(newCats)],
              tags: [...new Set(newTags)],
              updatedAt: Date.now()
            };
          }
          return entry;
        }));
      };

      const handleTaxonomyDrop = (e, targetType, targetName) => {
        e.preventDefault();
        const dataStr = e.dataTransfer.getData('kb-tax');
        if (!dataStr) return;
        try {
          const data = JSON.parse(dataStr);
          if (data.val && data.type && (data.val !== targetName || data.type !== targetType)) {
            performTaxonomyMigration(data.val, data.type, targetType, targetName);
          }
        } catch(err) { console.error(err); }
      };

      const submitTaxonomyRename = (oldName, newName, currentType) => {
        if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
          performTaxonomyMigration(oldName, currentType, currentType, newName.trim());
        }
      };

      const performTaxonomyDeletion = (oldName, targetType) => {
        const oldLower = oldName.toLowerCase();
        setEntries(prev => prev.map(entry => {
          let newProjs = [...(Array.isArray(entry.projects) ? entry.projects : [])];
          let newCats = [...(Array.isArray(entry.categories) ? entry.categories : [])];
          let newTags = [...(Array.isArray(entry.tags) ? entry.tags : [])];
          let wasModified = false;

          const removeFromList = (list) => {
            if (list.some(i => i.toLowerCase() === oldLower)) {
              wasModified = true;
              return list.filter(i => i.toLowerCase() !== oldLower);
            }
            return list;
          };

          if (targetType === 'project') newProjs = removeFromList(newProjs);
          if (targetType === 'category') newCats = removeFromList(newCats);
          if (targetType === 'tag') newTags = removeFromList(newTags);

          if (wasModified) {
            return {
              ...entry,
              projects: newProjs,
              categories: newCats,
              tags: newTags,
              updatedAt: Date.now()
            };
          }
          return entry;
        }));
        if (targetType === 'project') setActiveProjects(prev => prev.filter(p => p.toLowerCase() !== oldLower));
        if (targetType === 'category') setActiveCategories(prev => prev.filter(c => c.toLowerCase() !== oldLower));
        if (targetType === 'tag') setActiveTags(prev => prev.filter(t => t.toLowerCase() !== oldLower));
      };

      const handleEntryDrop = (e, targetId) => {
        e.preventDefault();
        setDragOverEntryId(null);
        const taxData = e.dataTransfer.getData('kb-tax');
        if (taxData) {
          try {
            const { type, val } = JSON.parse(taxData);
            setEntries(prev => prev.map(ent => {
              if (ent.id === targetId) {
                if (type === 'category' && !(ent.categories || []).includes(val)) return { ...ent, categories: [...(ent.categories || []), val.toLowerCase()], updatedAt: Date.now() };
                if (type === 'tag' && !(ent.tags || []).includes(val)) return { ...ent, tags: [...(ent.tags || []), val.toLowerCase()], updatedAt: Date.now() };
                if (type === 'project' && !(ent.projects || []).includes(val)) return { ...ent, projects: [...(ent.projects || []), val.toLowerCase()], updatedAt: Date.now() };
              }
              return ent;
            }));
          } catch(err) {}
        }
        const draggedId = e.dataTransfer.getData('kb-ref-id');
        if (draggedId && draggedId !== targetId) {
          setEntries(prev => prev.map(ent => {
            if (ent.id === targetId) {
              const refs = ent.references || [];
              if (!refs.includes(draggedId)) {
                return { ...ent, references: [...refs, draggedId], updatedAt: Date.now() };
              }
            }
            return ent;
          }));
        }
      };

      const handleContentDrop = (e, targetEntry) => {
        const draggedId = e.dataTransfer.getData('kb-ref-id');
        if (draggedId && draggedId !== targetEntry.id) {
          e.preventDefault();
          const refShortcode = `\n\n[[kb-ref:${draggedId}]]`;
          setEntries(prev => prev.map(ent =>
            ent.id === targetEntry.id
              ? { ...ent, fullContent: (ent.fullContent || '') + refShortcode, updatedAt: Date.now() }
              : ent
          ));
        }
      };

      const handleContentClick = (e) => {
        const refEl = e.target.closest('.kb-embedded-ref');
        if (refEl) {
          const refId = refEl.getAttribute('data-id');
          if (refId) setSelectedEntryIds([refId]);
        }
      };

      const handleContentMouseOver = (e) => {
        const refEl = e.target.closest('.kb-embedded-ref');
        if (refEl) {
          const refId = refEl.getAttribute('data-id');
          if (refId) {
            const rect = refEl.getBoundingClientRect();
            setHoveredRef({ id: refId, x: rect.left + rect.width / 2, y: rect.top });
          }
        }
      };

      const handleContentMouseOut = (e) => {
        if (e.target.closest('.kb-embedded-ref')) setHoveredRef(null);
      };

      // UNIFIED AI ASSISTANT
      const sendAssistantMessage = async (overrideText = null) => {
        const queryText = (overrideText || assistantInput).trim();
        if (!queryText) return;
        if (!apiKeys || apiKeys.length === 0) {
          setShowKeyModal(true);
          return setError("Please configure your Gemini API key in Settings first.");
        }

        setAssistantInput('');
        setIsAssistantThinking(true);
        setError(null);

        const userMsg = {
          id: 'msg-' + Date.now(),
          role: 'user',
          text: queryText,
          timestamp: Date.now()
        };

        const updatedMessages = [...assistantMessages, userMsg];
        setAssistantMessages(updatedMessages);

        try {
          const currentScope = assistantScope;
          let targetDocs = [];

          if (currentScope === 'selected' && selectedEntries.length > 0) {
            targetDocs = selectedEntries;
          } else {
            targetDocs = entries;
          }

          if (currentScope === 'selected' && selectedEntries.length > 0) {
            // Selected Notes Context
            let contextText = selectedEntries.map(ent => {
              let block = `--- DOCUMENT: ${ent.title} (ID: ${ent.numericId || ent.id}) ---\n`;
              if (ent.summary) block += `Summary: ${ent.summary}\n`;
              if (ent.shortVersion && ent.shortVersion.length > 0) block += `Key Points:\n${ent.shortVersion.map(p => `- ${p}`).join('\n')}\n`;
              if (ent.fullContent) block += `Content:\n${ent.fullContent}\n`;
              if (ent.sourceUrl) block += `Source URL: ${ent.sourceUrl}\n`;
              return block;
            }).join('\n\n');

            const payload = {
              contents: [
                ...assistantMessages.slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
                { role: 'user', parts: [{ text: queryText }] }
              ],
              systemInstruction: {
                parts: [{
                  text: `You are a helpful, brilliant AI Assistant for the user's personal knowledge base.
                  Answer strictly and comprehensively based on the provided documents.
                  CRITICAL RULES:
                  - Always use exact syntax [[kb-ref:ID]] when referencing notes so the user can click them (e.g. [[kb-ref:${selectedEntries[0]?.id || 'ID'}]]).
                  - Format responses cleanly in Markdown with headings, bullet points, and concise language.
                  - If the answer is not in the documents, state it clearly.
                  
                  Documents:\n${contextText}`
                }]
              }
            };

            if (selectedEntries.some(e => e.sourceUrl)) {
              payload.tools = [{ google_search: {} }];
            }

            const result = await handleGeminiCall(payload, model);
            const replyText = result.candidates[0].content.parts[0].text;

            setAssistantMessages([
              ...updatedMessages,
              { id: 'msg-' + (Date.now() + 1), role: 'model', text: replyText, timestamp: Date.now(), model }
            ]);
          } else {
            // Workspace / Whole Brain Search (2-Pass Retrieval)
            const candidateSummaries = entries.map(e => `[kb-ref:${e.id}] (Title: ${e.title}) - ${e.summary || e.fullContent?.substring(0, 150) || ''}`).join('\n');

            const pass1Payload = {
              contents: [{ role: 'user', parts: [{ text: `User query: "${queryText}"\n\nIdentify up to 5 note IDs that are most relevant to answering this query comprehensively. Return ONLY a JSON array of strings (e.g. ["${entries[0]?.id || 'entry-1'}"]). If none apply, return [].\n\nAvailable Notes:\n${candidateSummaries}` }] }],
              generationConfig: { temperature: 0.1 }
            };

            let neededIds = [];
            try {
              const pass1Res = await handleGeminiCall(pass1Payload, model);
              neededIds = parseAIJson(pass1Res.candidates[0].content.parts[0].text);
              if (!Array.isArray(neededIds)) neededIds = [];
            } catch(e) {
              console.warn("Pass 1 routing fallback:", e);
            }

            const fullContextEntries = entries.filter(e => neededIds.includes(e.id));
            let contextText = `Primary Relevant Notes:\n\n`;
            if (fullContextEntries.length > 0) {
              contextText += fullContextEntries.map(e => `--- [kb-ref:${e.id}] Title: ${e.title} ---\n${e.fullContent || e.summary}`).join('\n\n');
            } else {
              contextText += entries.slice(0, 15).map(e => `--- [kb-ref:${e.id}] Title: ${e.title} ---\n${e.summary}`).join('\n\n');
            }

            const pass2Payload = {
              contents: [
                ...assistantMessages.slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
                { role: 'user', parts: [{ text: queryText }] }
              ],
              systemInstruction: {
                parts: [{
                  text: `You are an overarching Knowledge Base Assistant synthesizing information across the user's entire notes archive.
                  CRITICAL RULES:
                  - Always cite sources using exact syntax [[kb-ref:ID]] (e.g. [[kb-ref:entry-1234]]).
                  - Be concise, structured, factual, and direct.
                  - Format in clean Markdown.
                  
                  Context:\n${contextText}`
                }]
              },
              tools: [{ google_search: {} }]
            };

            const result = await handleGeminiCall(pass2Payload, model);
            const replyText = result.candidates[0].content.parts[0].text;

            setAssistantMessages([
              ...updatedMessages,
              { id: 'msg-' + (Date.now() + 1), role: 'model', text: replyText, timestamp: Date.now(), model }
            ]);
          }
        } catch (err) {
          setAssistantMessages([
            ...updatedMessages,
            { id: 'msg-' + (Date.now() + 1), role: 'model', text: `⚠️ Error: ${err.message}`, timestamp: Date.now() }
          ]);
        } finally {
          setIsAssistantThinking(false);
        }
      };

      const copyMessage = (msgId, text) => {
        navigator.clipboard.writeText(text);
        setActionFeedback({ msgId, type: 'copy' });
        setTimeout(() => setActionFeedback(null), 1500);
      };

      const insertMessageIntoNote = (msgId, text) => {
        if (!activeSingleEntry) {
          setError("Select a single note in the list first to insert this response.");
          return;
        }
        const addition = `\n\n---\n### 💡 AI Synthesis (${new Date().toLocaleDateString()})\n\n${text}\n`;
        setEntries(prev => prev.map(ent =>
          ent.id === activeSingleEntry.id
            ? { ...ent, fullContent: (ent.fullContent || '') + addition, updatedAt: Date.now() }
            : ent
        ));
        setActionFeedback({ msgId, type: 'insert' });
        setTimeout(() => setActionFeedback(null), 1500);
      };

      const clearAssistantHistory = () => {
        if (window.confirm("Clear assistant conversation history?")) {
          setAssistantMessages([]);
        }
      };

      // Filtered entries
      const filteredEntries = entries.filter(entry => {
        if (!entry) return false;
        const matchesProject = activeProjects.length === 0 || (Array.isArray(entry.projects) && entry.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
        const matchesCat = activeCategories.length === 0 || (Array.isArray(entry.categories) && entry.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
        const matchesTag = activeTags.length === 0 || (Array.isArray(entry.tags) && entry.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));
        const searchLower = searchQuery.toLowerCase();
        const matchesSearch = !searchQuery ||
          (entry.title && entry.title.toLowerCase().includes(searchLower)) ||
          (entry.summary && entry.summary.toLowerCase().includes(searchLower)) ||
          (entry.fullContent && entry.fullContent.toLowerCase().includes(searchLower));
        return matchesProject && matchesCat && matchesTag && matchesSearch;
      }).sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return (b.numericId || 0) - (a.numericId || 0);
      });

      const openSettings = () => {
        setTempKeys([...apiKeys]);
        setTempModel(model);
        setTempTheme(theme);
        setShowKeyModal(true);
      };

      const saveSettings = () => {
        setApiKeys(tempKeys.filter(k => k.key.trim() !== ''));
        setModel(tempModel);
        setTheme(tempTheme);
        setShowKeyModal(false);
      };

      if (appState === 'init') {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-50 dark:bg-slate-950">
            <i className="fa-solid fa-spinner fa-spin text-4xl text-indigo-600 dark:text-indigo-400"></i>
          </div>
        );
      }

      if (appState === 'landing') {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-50 dark:bg-slate-950 p-4">
            <div className="bg-white dark:bg-slate-900 p-8 md:p-10 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 text-center max-w-md w-full relative">
              <div className="w-16 h-16 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i className="fa-solid fa-brain text-3xl"></i>
              </div>
              <h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-2">Knowledge Base</h1>
              <p className="text-slate-500 dark:text-slate-400 mb-8 text-sm leading-relaxed">
                Offline-first personal knowledge management. Your data stays 100% private in a local JSON file.
              </p>
              <div className="space-y-3">
                {savedHandle && (

                                  onDragOver={(e) => e.preventDefault()}
                                  onDrop={(e) => handleTaxonomyDrop(e, 'tag', tag)}
                                  onClick={(e) => handleTagClick(tag, e)}
                                  className={`group flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs cursor-pointer transition-colors ${activeTags.some(t => normTax(t) === normTax(tag)) ? 'bg-slate-200/80 dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'}`}
                                >
                                  <EditableText stripPrefix="#" text={tag} onSave={(newText) => submitTaxonomyRename(tag, newText, 'tag')} className="truncate mr-2 flex-1 text-left" />
                                  <span className="text-[10px] font-mono text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300">{tagCounts[tag]}</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

              </div>

              {/* Sidebar Footer */}
              <div className="p-3 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span className="text-[11px] font-mono">{entries.length} notes</span>
                <span className="text-[10px] opacity-75">{new Date(lastSyncTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
              </div>
            </div>
          )}

          {/* MIDDLE COLUMN: NOTE LIST */}
          {isListSidebarOpen && (
            <div 
              className="w-80 lg:w-96 flex-shrink-0 bg-white/50 dark:bg-slate-900/50 border-r border-slate-200/80 dark:border-slate-800/80 backdrop-blur-md flex flex-col z-10 transition-all duration-300 relative"
              onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={(e) => { e.preventDefault(); if (!e.currentTarget.contains(e.relatedTarget)) setIsDragging(false); }}
              onDrop={(e) => { handleDrop(e); setIsDragging(false); }}
            >
              {isDragging && (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-indigo-500/15 backdrop-blur-sm border-2 border-dashed border-indigo-500 m-2 rounded-2xl pointer-events-none transition-all">
                  <div className="bg-white dark:bg-slate-800 p-6 text-center rounded-2xl shadow-xl flex flex-col items-center">
                    <i className="fa-solid fa-cloud-arrow-up text-3xl text-indigo-600 dark:text-indigo-400 mb-2"></i>
                    <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">Drop to Add Note</h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">URLs, PDFs, or plain text</p>
                  </div>
                </div>
              )}

              {/* List Header */}
              <div className="p-3.5 border-b border-slate-100 dark:border-slate-800 flex flex-col gap-2.5">

                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input 
                      type="text" 
                      placeholder="Search notes..." 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                      className="w-full pl-8 pr-3 py-1.5 bg-slate-100/80 dark:bg-slate-800/80 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-transparent dark:text-slate-100 transition-all" 
                    />
                  </div>
                  <button 
                    onClick={handleNewNote} 
                    className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-colors shrink-0" 
                    title="Create new blank note"
                  >
                    <i className="fa-solid fa-plus text-xs"></i> Note
                  </button>
                  <button onClick={() => setIsListSidebarOpen(false)} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 rounded-lg hidden lg:block" title="Hide note list">
                    <i className="fa-solid fa-chevron-left text-xs"></i>
                  </button>
                </div>

                {/* Quick Add URL/Text */}
                <form onSubmit={(e) => { e.preventDefault(); if (addInput.trim()) processInput(addInput.trim()); }} className="relative">
                  <i className="fa-solid fa-link absolute left-3 top-2 text-slate-400 text-xs"></i>
                  <input 
                    type="text" 
                    value={addInput} 
                    onChange={e => setAddInput(e.target.value)} 
                    disabled={isAnalyzing} 
                    placeholder="Paste URL, YouTube, or text to ingest..." 
                    className="w-full pl-8 pr-7 py-1.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50" 
                  />
                  <button type="submit" disabled={isAnalyzing || !addInput.trim()} className="absolute right-2 top-1.5 text-indigo-600 dark:text-indigo-400 disabled:opacity-30 p-0.5">
                    {isAnalyzing ? <i className="fa-solid fa-spinner fa-spin text-xs"></i> : <i className="fa-solid fa-arrow-right text-xs"></i>}
                  </button>
                </form>
                {/* Active Filter Indicators */}
                {(activeProjects.length > 0 || activeCategories.length > 0 || activeTags.length > 0) && (
                  <div className="flex flex-wrap items-center gap-1.5 pt-1">
                    {activeProjects.map(p => (
                      <span key={p} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 dark:bg-amber-900/40 text-amber-900 dark:text-amber-200">
                        <i className="fa-solid fa-folder-open text-[8px]"></i> {p}
                        <button type="button" onClick={() => setActiveProjects(prev => prev.filter(x => x !== p))} className="hover:text-red-500 ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>
                    ))}
                    {activeCategories.map(c => (
                      <span key={c} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-indigo-100 dark:bg-indigo-900/40 text-indigo-900 dark:text-indigo-200">
                        {c}
                        <button type="button" onClick={() => setActiveCategories(prev => prev.filter(x => x !== c))} className="hover:text-red-500 ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>
                    ))}
                    {activeTags.map(t => (
                      <span key={t} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200">
                        #{t}
                        <button type="button" onClick={() => setActiveTags(prev => prev.filter(x => x !== t))} className="hover:text-red-500 ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>
                    ))}
                    <button 
                      type="button" 
                      onClick={() => { setActiveProjects([]); setActiveCategories([]); setActiveTags([]); }}
                      className="text-[10px] text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 underline ml-1"
                    >
                      Clear
                    </button>
                  </div>
                )}
              </div>

              {/* Note Cards List */}
              <div className="flex-1 overflow-y-auto p-2.5 space-y-2">
                {filteredEntries.map(entry => {
                  const isSelected = selectedEntryIds.includes(entry.id);
                  const isPdf = !entry.sourceUrl && entry.title?.toLowerCase().endsWith('.pdf');
                  const isMedia = !isPdf && isMediaSource(entry.sourceUrl);
                  
                  let typeBorder = 'border-l-indigo-500';
                  let typeIcon = 'fa-file-lines';
                  if (entry.sourceUrl) {
                    typeBorder = 'border-l-sky-500';
                    typeIcon = isMedia ? 'fa-play' : 'fa-link';
                  } else if (isPdf) {
                    typeBorder = 'border-l-rose-500';
                    typeIcon = 'fa-file-pdf';
                  }

                  return (
                    <div 
                      key={entry.id}
                      draggable
                      onDragStart={(e) => {
                        e.dataTransfer.setData('kb-ref-id', entry.id);
                        e.dataTransfer.setData('text/plain', `[[kb-ref:${entry.id}]]`);
                      }}
                      onClick={(e) => handleEntryClick(e, entry.id)}
                      onDragOver={(e) => { e.preventDefault(); setDragOverEntryId(entry.id); }}
                      onDragLeave={() => setDragOverEntryId(null)}
                      onDrop={(e) => handleEntryDrop(e, entry.id)}
                      className={`group relative p-3 rounded-xl border border-l-4 transition-all duration-150 cursor-pointer ${typeBorder} ${isSelected ? 'bg-white dark:bg-slate-800 shadow-md border-indigo-200 dark:border-indigo-900/50 ring-1 ring-indigo-500/20' : 'bg-white/60 dark:bg-slate-800/40 border-slate-200/70 dark:border-slate-800/70 hover:bg-white dark:hover:bg-slate-800 hover:shadow-sm'} ${dragOverEntryId === entry.id ? 'scale-[0.98] bg-indigo-50 dark:bg-indigo-900/20' : ''}`}
