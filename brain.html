                      <div className="flex justify-between items-start gap-2 mb-1">
                        <h4 className={`text-sm font-semibold leading-snug line-clamp-2 flex-1 ${isSelected ? 'text-slate-900 dark:text-slate-100' : 'text-slate-700 dark:text-slate-300'}`}>
                          <i className={`fa-solid ${typeIcon} mr-1.5 text-xs opacity-60`}></i>
                          {entry.title || 'Untitled Note'}
                        </h4>
                        <div className="flex items-center gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                          <button onClick={(e) => togglePin(e, entry.id)} className={`p-1 text-xs rounded hover:bg-slate-100 dark:hover:bg-slate-700 ${entry.pinned ? 'text-amber-500 opacity-100 !opacity-100' : 'text-slate-400'}`} title={entry.pinned ? "Unpin" : "Pin"}>
                            <i className="fa-solid fa-thumbtack"></i>
                          </button>
                          <button onClick={(e) => { e.stopPropagation(); deleteEntry(entry.id); }} className="p-1 text-xs text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded" title="Delete note">
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                        </div>
                        {entry.pinned && !isSelected && (
                          <i className="fa-solid fa-thumbtack text-[10px] text-amber-500 group-hover:hidden shrink-0 mt-0.5"></i>
                        )}
                      </div>

                      {entry.summary && (
                        <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed mb-2 font-normal">
                          {entry.summary}
                        </p>
                      )}

                      <div className="flex flex-wrap items-center gap-1 text-[10px]">
                        <span className="text-slate-400 font-mono mr-1">#{entry.numericId}</span>
                        {Array.isArray(entry.projects) && entry.projects.slice(0, 1).map(p => (
                          <span key={p} className="px-1.5 py-0.2 bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 rounded font-medium">{p}</span>
                        ))}
                        {Array.isArray(entry.categories) && entry.categories.slice(0, 1).map(c => (
                          <span key={c} className="px-1.5 py-0.2 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded font-medium">{c}</span>
                        ))}
                      </div>
                    </div>
                  );
                })}

                {filteredEntries.length === 0 && (
                  <div className="text-center py-12 px-4 text-slate-400 dark:text-slate-500">
                    <i className="fa-regular fa-folder-open text-3xl mb-3 opacity-40"></i>
                    <p className="text-xs font-medium">No notes match your filters</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MAIN DOCUMENT COLUMN (READER / EDITOR) */}
          <div className="flex-1 flex flex-col min-w-0 bg-white dark:bg-[#0e131b] overflow-hidden relative z-0">
            
            {/* Top Bar / Actions */}
            <div className="h-12 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center px-4 shrink-0 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md">
              <div className="flex items-center gap-2">
                {!isLeftSidebarOpen && (
                  <button onClick={() => setIsLeftSidebarOpen(true)} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-xs" title="Open taxonomy sidebar">
                    <i className="fa-solid fa-folder-tree mr-1"></i>
                  </button>
                )}
                {!isListSidebarOpen && (
                  <button onClick={() => setIsListSidebarOpen(true)} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-xs" title="Open note list">
                    <i className="fa-solid fa-list mr-1"></i>
                  </button>
                )}
                {selectedEntryIds.length > 1 && (
                  <span className="text-xs font-semibold px-2 py-0.5 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 rounded-full">
                    {selectedEntryIds.length} notes selected
                  </span>
                )}
              </div>

              <div className="flex items-center gap-2">
                {activeSingleEntry && !editingEntries[activeSingleEntry.id] && (
                  <>
                    <button 
                      onClick={() => {
                        setAssistantScope('selected');
                        setIsAssistantOpen(true);
                      }} 
                      className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-900/30 dark:hover:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors shadow-sm"
                      title="Ask AI about this note"
                    >
                      <i className="fa-solid fa-sparkles text-xs"></i> Ask AI
                    </button>
                    <button 
                      onClick={() => startEditing(activeSingleEntry)} 
                      className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors"
                      title="Edit note"
                    >
                      <i className="fa-solid fa-pen text-xs"></i> Edit
                    </button>
                  </>
                )}

                <button 
                  onClick={() => setIsAssistantOpen(!isAssistantOpen)} 
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors ${isAssistantOpen ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300'}`}
                  title="Toggle AI Assistant (Cmd+J)"
                >
                  <i className="fa-solid fa-sparkles text-xs"></i> Assistant
                </button>
              </div>
            </div>

            {/* Error Notification */}
            {error && (
              <div className="bg-red-500 text-white px-4 py-2 text-xs flex justify-between items-center shrink-0">
                <span>{error}</span>

              </div>

            <div className="flex-1 overflow-y-auto min-h-0">
              {!activeSingleEntry && selectedEntries.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 p-8 text-center">
                  <div className="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800/50 flex items-center justify-center mb-4 text-2xl opacity-60">
                    <i className="fa-solid fa-book-open"></i>
                  </div>
                  <h3 className="text-base font-semibold text-slate-700 dark:text-slate-300 mb-1">Select a Note</h3>
                  <p className="text-xs max-w-sm text-slate-400 dark:text-slate-500 leading-relaxed">

                  </p>
                </div>
              ) : selectedEntries.length > 1 ? (
                /* Multi-selection Summary View */
                <div className="max-w-3xl mx-auto p-6 lg:p-12 space-y-6">
                  <div className="border-b border-slate-100 dark:border-slate-800 pb-4">
                    <h2 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-1">
                      {selectedEntries.length} Notes Selected
                    </h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400">
                      Use the AI Assistant on the right to synthesize, compare, or extract insights across all selected documents.
                    </p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {selectedEntries.map(e => (
                      <div key={e.id} onClick={() => setSelectedEntryIds([e.id])} className="p-4 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500 cursor-pointer bg-white dark:bg-slate-900 transition-all">
                        <div className="text-xs font-semibold text-slate-800 dark:text-slate-100 truncate mb-1">{e.title}</div>
                        <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">{e.summary || 'No summary available.'}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ) : activeSingleEntry && editingEntries[activeSingleEntry.id] ? (
                /* Note Edit Mode */
                <div className="max-w-4xl mx-auto p-6 lg:p-10 space-y-6 pb-24">

                    <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100">Edit Note #{activeSingleEntry.numericId}</h2>
                    <div className="flex gap-2">
                      <button onClick={() => cancelEdit(activeSingleEntry.id)} className="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">Cancel</button>
                      <button onClick={() => saveNote(activeSingleEntry.id)} className="px-5 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm">Save Changes</button>
                    </div>
                  </div>

                  {/* Title */}
                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider">Title</label>
                      <button type="button" onClick={() => handleSuggestTitle(activeSingleEntry.id)} disabled={isAnalyzing} className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                        <i className="fa-solid fa-wand-magic-sparkles text-xs"></i> Suggest Title
                      </button>
                    </div>
                    <input 
                      type="text" 
                      value={editData[activeSingleEntry.id]?.title || ''} 
                      onChange={e => setEditData(prev => ({ ...prev, [activeSingleEntry.id]: { ...prev[activeSingleEntry.id], title: e.target.value } }))} 
                      className="w-full px-4 py-2.5 text-lg font-bold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                      placeholder="Note Title" 
                    />
                  </div>

                  {/* Summary */}
                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider">Executive Summary (TL;DR)</label>
                      <button type="button" onClick={() => handleGenerateTLDR(activeSingleEntry.id)} disabled={isAnalyzing} className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                        <i className="fa-solid fa-wand-magic-sparkles text-xs"></i> Generate TL;DR
                      </button>
                    </div>
                    <textarea 
                      rows="2" 
                      value={editData[activeSingleEntry.id]?.summary || ''} 
                      onChange={e => setEditData(prev => ({ ...prev, [activeSingleEntry.id]: { ...prev[activeSingleEntry.id], summary: e.target.value } }))} 
                      className="w-full px-4 py-2.5 text-sm border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 leading-relaxed" 
                      placeholder="Brief 1-2 sentence executive summary..."
                    ></textarea>
                  </div>

                  {/* Key Takeaways */}
                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider">Key Takeaways (One per line)</label>
                      <button type="button" onClick={() => handleGenerateTakeaways(activeSingleEntry.id)} disabled={isAnalyzing} className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                        <i className="fa-solid fa-wand-magic-sparkles text-xs"></i> Extract Key Points
                      </button>
                    </div>
                    <textarea 
                      rows="3" 
                      value={editData[activeSingleEntry.id]?.shortVersion || ''} 
                      onChange={e => setEditData(prev => ({ ...prev, [activeSingleEntry.id]: { ...prev[activeSingleEntry.id], shortVersion: e.target.value } }))} 
                      className="w-full px-4 py-2.5 text-sm border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono leading-relaxed" 
                      placeholder="Point 1&#10;Point 2..."
                    ></textarea>
                  </div>

                  {/* Markdown Content */}
                  <div>

                      value={editData[activeSingleEntry.id]?.fullContent || ''} 
                      onChange={e => setEditData(prev => ({ ...prev, [activeSingleEntry.id]: { ...prev[activeSingleEntry.id], fullContent: e.target.value } }))} 
                      className="w-full px-4 py-3 text-sm font-mono border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 leading-relaxed" 
                      placeholder="Write your note in Markdown... (Drag any note from the list into this box to insert a backlink)"
                    ></textarea>

                    <div className="flex justify-between items-center">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">Taxonomy & Tags</h3>
                      <button type="button" onClick={() => handleGenerateTaxonomies(activeSingleEntry.id)} disabled={isAnalyzing} className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                        <i className="fa-solid fa-wand-magic-sparkles text-xs"></i> Auto-Tag
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {/* Projects */}
                      <div>

                        <div className="flex flex-wrap gap-1 mb-1.5 min-h-[26px]">
                          {(editData[activeSingleEntry.id]?.projects || []).map(p => (

                              {p}
                              <button type="button" onClick={() => removeEditProject(activeSingleEntry.id, p)} className="hover:text-red-500"><i className="fa-solid fa-xmark text-[10px]"></i></button>
                            </span>
                          ))}
                        </div>
                        <input 
                          type="text" 
                          value={editProjectInput[activeSingleEntry.id] || ''} 
                          onChange={e => setEditProjectInput(prev => ({ ...prev, [activeSingleEntry.id]: e.target.value }))} 
                          onKeyDown={e => handleAddEditProject(activeSingleEntry.id, e)} 
                          placeholder="Add project (Enter)" 
                          className="w-full px-3 py-1.5 text-xs border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                        />
                      </div>

                      {/* Categories */}
                      <div>
                        <label className="block text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 uppercase mb-1">Categories</label>
                        <div className="flex flex-wrap gap-1 mb-1.5 min-h-[26px]">
                          {(editData[activeSingleEntry.id]?.categories || []).map(c => (
                            <span key={c} className="px-2 py-0.5 bg-indigo-100 dark:bg-indigo-900/40 text-indigo-800 dark:text-indigo-300 text-xs rounded-full flex items-center gap-1">
                              {c}
                              <button type="button" onClick={() => removeEditCategory(activeSingleEntry.id, c)} className="hover:text-red-500"><i className="fa-solid fa-xmark text-[10px]"></i></button>
                            </span>
                          ))}
                        </div>
                        <input 
                          type="text" 
                          value={editCatInput[activeSingleEntry.id] || ''} 
                          onChange={e => setEditCatInput(prev => ({ ...prev, [activeSingleEntry.id]: e.target.value }))} 
                          onKeyDown={e => handleAddEditCategory(activeSingleEntry.id, e)} 
                          placeholder="Add category (Enter)" 
                          className="w-full px-3 py-1.5 text-xs border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                        />
                      </div>

                      {/* Tags */}
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Tags</label>
                        <div className="flex flex-wrap gap-1 mb-1.5 min-h-[26px]">
                          {(editData[activeSingleEntry.id]?.tags || []).map(t => (
                            <span key={t} className="px-2 py-0.5 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs rounded-full flex items-center gap-1">
                              #{t}
                              <button type="button" onClick={() => removeEditTag(activeSingleEntry.id, t)} className="hover:text-red-500"><i className="fa-solid fa-xmark text-[10px]"></i></button>
                            </span>
                          ))}
                        </div>
                        <input 
                          type="text" 
                          value={editTagInput[activeSingleEntry.id] || ''} 
                          onChange={e => setEditTagInput(prev => ({ ...prev, [activeSingleEntry.id]: e.target.value }))} 
                          onKeyDown={e => handleAddEditTag(activeSingleEntry.id, e)} 
                          placeholder="Add tag (Enter)" 
                          className="w-full px-3 py-1.5 text-xs border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                        />
                      </div>
                    </div>
                  </div>

                  {/* Source URL */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Source URL</label>
                    <input 
                      type="text" 
                      value={editData[activeSingleEntry.id]?.sourceUrl || ''} 
                      onChange={e => setEditData(prev => ({ ...prev, [activeSingleEntry.id]: { ...prev[activeSingleEntry.id], sourceUrl: e.target.value } }))} 
                      className="w-full px-4 py-2 text-sm border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                      placeholder="https://example.com/article" 
                    />
                  </div>
                </div>
              ) : activeSingleEntry ? (
                /* Note Reading Mode (Claude-Style Clean Typography) */
                <div 
                  className="max-w-3xl mx-auto p-6 lg:p-12 space-y-6 pb-32"
                  onClick={handleContentClick}
                  onMouseOver={handleContentMouseOver}
                  onMouseOut={handleContentMouseOut}
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => handleContentDrop(e, activeSingleEntry)}
                >
                  {/* Note Header */}
                  <div>
                    <EditableText 
                      tag="h1"
                      className="text-3xl lg:text-4xl font-sans font-bold text-slate-900 dark:text-slate-50 tracking-tight leading-[1.25] mb-3" 
                      text={activeSingleEntry.title || 'Untitled Note'} 
                      onSave={(newText) => setEntries(prev => prev.map(e => e.id === activeSingleEntry.id ? { ...e, title: newText, updatedAt: Date.now() } : e))} 
                    />
                    
                    <div className="flex flex-wrap items-center gap-2 text-xs">
                      <span className="text-slate-400 dark:text-slate-500 flex items-center gap-1 font-mono">
                        <i className="fa-regular fa-calendar text-[11px]"></i>
                        {new Date(activeSingleEntry.createdAt || activeSingleEntry.updatedAt || Date.now()).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}
                      </span>
                      {Array.isArray(activeSingleEntry.projects) && activeSingleEntry.projects.map(p => (
                        <span key={p} className="px-2.5 py-0.5 bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 rounded-full font-medium flex items-center gap-1">
                          <i className="fa-solid fa-folder-open text-[10px]"></i>{p}
                        </span>
                      ))}
                      {Array.isArray(activeSingleEntry.categories) && activeSingleEntry.categories.map(c => (
                        <span key={c} className="px-2.5 py-0.5 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded-full font-medium">
                          {c}
                        </span>
                      ))}
                      {Array.isArray(activeSingleEntry.tags) && activeSingleEntry.tags.map(t => (
                        <span key={t} className="px-2 py-0.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-full font-medium">
                          #{t}
                        </span>
                      ))}
                      {activeSingleEntry.sourceUrl && (
                        <a href={activeSingleEntry.sourceUrl} target="_blank" rel="noopener noreferrer" className="ml-auto px-3 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-full font-medium flex items-center gap-1.5 transition-colors shadow-sm">
                          <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> View Source
                        </a>
                      )}
                    </div>
                  </div>

                  {/* Executive Summary */}
                  {activeSingleEntry.summary && (
                    <div className="bg-slate-50/80 dark:bg-slate-900/80 border-l-4 border-indigo-500 rounded-r-xl p-4 text-slate-700 dark:text-slate-300 text-base leading-relaxed">
                      <EditableText 
                        tag="p"
                        multiline={true}
                        text={activeSingleEntry.summary} 
                        onSave={(newText) => setEntries(prev => prev.map(e => e.id === activeSingleEntry.id ? { ...e, summary: newText, updatedAt: Date.now() } : e))} 
                      />
                    </div>
                  )}

                  {/* Key Takeaways */}
                  {Array.isArray(activeSingleEntry.shortVersion) && activeSingleEntry.shortVersion.length > 0 && (
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3 flex items-center gap-1.5">
                        <i className="fa-solid fa-list-check text-indigo-500"></i> Key Takeaways
                      </h3>
                      <ul className="space-y-2">
                        {activeSingleEntry.shortVersion.map((point, idx) => (
                          <li key={idx} className="flex items-start text-sm text-slate-700 dark:text-slate-300 leading-snug">
                            <span className="text-indigo-500 mr-2 font-bold">•</span>
                            <span dangerouslySetInnerHTML={{ __html: parseMarkdownInline(point) }}></span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Media Embed */}
                  {getEmbedUrl(activeSingleEntry.sourceUrl) && (
                    <div className="aspect-video w-full rounded-2xl overflow-hidden shadow-md border border-slate-200 dark:border-slate-800 bg-black">
                      <iframe src={getEmbedUrl(activeSingleEntry.sourceUrl)} className="w-full h-full" allowFullScreen referrerPolicy="strict-origin-when-cross-origin"></iframe>
                    </div>
                  )}

                  {/* Markdown Body */}
                  {(() => {
                    const noteMarkdown = activeSingleEntry.fullContent || (
                      Array.isArray(activeSingleEntry.chatHistory) && activeSingleEntry.chatHistory.length > 0
                        ? activeSingleEntry.chatHistory.map(m => `**${m.role === 'user' ? 'User' : 'Assistant'}:**\n\n${m.text}`).join('\n\n---\n\n')
                        : ''
                    );
                    if (!noteMarkdown) return null;
                    return (
                      <div 
                        className="prose prose-slate dark:prose-invert prose-base max-w-none text-slate-800 dark:text-slate-200 leading-relaxed font-sans prose-headings:font-semibold prose-a:text-indigo-600 dark:prose-a:text-indigo-400"
                        dangerouslySetInnerHTML={{ __html: injectReferences(parseMarkdown(noteMarkdown), entries) }}
                      />
                    );
                  })()}

                  {/* Linked References */}
                  {Array.isArray(activeSingleEntry.references) && activeSingleEntry.references.length > 0 && (
                    <div className="pt-6 border-t border-slate-100 dark:border-slate-800">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                        <i className="fa-solid fa-link text-indigo-500"></i> Linked References
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        {activeSingleEntry.references.map(refId => {
                          const refEntry = entries.find(e => e.id === refId);
                          if (!refEntry) return null;
                          return (
                            <div 
                              key={refId} 
                              onClick={() => setSelectedEntryIds([refId])} 
                              className="p-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500 bg-white dark:bg-slate-900 cursor-pointer transition-all flex justify-between items-center"
                            >
                              <div className="truncate mr-2">
                                <div className="text-xs font-semibold text-slate-800 dark:text-slate-200 truncate">{refEntry.title}</div>
                                <div className="text-[11px] text-slate-400 truncate">{refEntry.summary || 'No summary'}</div>
                              </div>
                              <i className="fa-solid fa-arrow-right text-xs text-slate-300"></i>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              ) : null}
            </div>
          </div>

          {/* RIGHT COLUMN: UNIFIED AI ASSISTANT SIDEBAR */}
          {isAssistantOpen && (
            <div className="w-80 lg:w-96 flex-shrink-0 bg-white/90 dark:bg-slate-900/90 border-l border-slate-200/80 dark:border-slate-800/80 backdrop-blur-md flex flex-col z-20 shadow-2xl lg:shadow-none transition-all duration-300">
              
              {/* Assistant Header */}
              <div className="p-3.5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center shrink-0">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs shadow-sm">
                    <i className="fa-solid fa-sparkles"></i>
                  </div>
                  <div>
                    <h3 className="text-xs font-bold text-slate-800 dark:text-slate-100">AI Assistant</h3>
                    <div className="flex items-center gap-1.5 mt-0.5">
                      {/* Scope Toggle Pill */}
                      <button 
                        onClick={() => setAssistantScope(prev => prev === 'selected' ? 'workspace' : 'selected')} 
                        className={`text-[10px] font-semibold px-2 py-0.5 rounded-full transition-colors flex items-center gap-1 ${assistantScope === 'selected' ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}`}
                        title="Click to toggle scope between Selected Note(s) and Whole Knowledge Base"
                      >
                        <i className={`fa-solid ${assistantScope === 'selected' ? 'fa-file-lines' : 'fa-brain'} text-[9px]`}></i>
                        {assistantScope === 'selected' 
                          ? (selectedEntries.length > 0 ? (selectedEntries.length === 1 ? `Note: ${activeSingleEntry?.title?.substring(0, 12)}...` : `${selectedEntries.length} Notes`) : 'Active Note')
                          : 'Whole Brain'
                        }
                      </button>

                      {/* Model Pill */}
                      <span className="text-[10px] font-mono text-slate-400">
                        {model.includes('pro') ? '🧠 Pro' : '⚡ Flash'}
                      </span>
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-1">
                  {assistantMessages.length > 0 && (
                    <button onClick={clearAssistantHistory} className="p-1.5 text-slate-400 hover:text-red-500 rounded-lg transition-colors text-xs" title="Clear chat history">
                      <i className="fa-solid fa-trash-can"></i>
                    </button>
                  )}
                  <button onClick={() => setIsAssistantOpen(false)} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 rounded-lg transition-colors text-xs" title="Close assistant">
                    <i className="fa-solid fa-xmark text-sm"></i>
                  </button>
                </div>
              </div>

              {/* Message Thread */}
              <div ref={chatScrollRef} className="flex-1 overflow-y-auto p-3.5 space-y-3.5 text-xs min-h-0">
                {assistantMessages.length === 0 && (
                  <div className="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400 dark:text-slate-500 space-y-3">
                    <div className="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xl">
                      <i className="fa-solid fa-sparkles"></i>
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-slate-700 dark:text-slate-200">How can I help?</h4>
                      <p className="text-xs text-slate-400 dark:text-slate-500 mt-1 leading-relaxed">
                        Ask questions about your notes, request summaries, or discover connections across your knowledge base.
                      </p>
                    </div>
                  </div>
                )}

                {assistantMessages.map(msg => (
                  <div key={msg.id} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[90%] rounded-2xl px-3.5 py-2.5 shadow-sm leading-relaxed ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-bl-none border border-slate-200/50 dark:border-slate-700/50'}`}>
                      {msg.role === 'user' ? (
                        <div className="whitespace-pre-wrap">{msg.text}</div>
                      ) : (
                        <div>
                          <div 
                            className="prose prose-slate dark:prose-invert prose-xs max-w-none prose-p:my-1 prose-headings:my-2 prose-ul:my-1" 
                            dangerouslySetInnerHTML={{ __html: injectReferences(parseMarkdown(msg.text), entries) }}
                            onClick={handleContentClick}
                          />
                          <div className="flex items-center gap-2 mt-2 pt-2 border-t border-slate-200/50 dark:border-slate-700/50 text-[10px]">
                            <button 
                              onClick={() => copyMessage(msg.id, msg.text)} 
                              className="text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center gap-1"
                            >
                              <i className="fa-regular fa-copy"></i>
                              {actionFeedback?.msgId === msg.id && actionFeedback.type === 'copy' ? 'Copied!' : 'Copy'}
                            </button>
                            {activeSingleEntry && (
                              <button 
                                onClick={() => insertMessageIntoNote(msg.id, msg.text)} 
                                className="text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center gap-1"
                                title="Insert into currently open note"
                              >
                                <i className="fa-solid fa-file-import"></i>
                                {actionFeedback?.msgId === msg.id && actionFeedback.type === 'insert' ? 'Inserted!' : 'Insert to Note'}
                              </button>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                ))}

                {isAssistantThinking && (
                  <div className="flex justify-start">
                    <div className="bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-2xl rounded-bl-none px-3.5 py-2.5 text-xs flex items-center gap-2">
                      <i className="fa-solid fa-spinner fa-spin text-indigo-500"></i> Thinking...
                    </div>
                  </div>
                )}
              </div>

              {/* Quick Prompt Chips */}
              <div className="px-3 pt-2 pb-1 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-1.5">
                <button 
                  onClick={() => sendAssistantMessage("Summarize the key points in 3 concise paragraphs.")} 
                  className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg text-[11px] font-medium transition-colors"
                >
                  ⚡ Summarize
                </button>
                <button 
                  onClick={() => sendAssistantMessage("Extract the top 5 key takeaways as bullet points.")} 
                  className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg text-[11px] font-medium transition-colors"
                >
                  💡 Key Takeaways
                </button>
                <button 
                  onClick={() => sendAssistantMessage("Extract all action items and tasks as a checklist.")} 
                  className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg text-[11px] font-medium transition-colors"
                >
                  ✅ Action Items
                </button>
                <button 
                  onClick={() => sendAssistantMessage("What are the most interesting connections or themes related to this?")} 
                  className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg text-[11px] font-medium transition-colors"
                >
                  🔗 Connections
                </button>
              </div>

              {/* Assistant Input Bar */}
              <div className="p-3 shrink-0">
                <form 
                  onSubmit={(e) => { e.preventDefault(); sendAssistantMessage(); }} 
                  className="relative flex items-center"
                >
                  <textarea 
                    value={assistantInput} 
                    onChange={e => setAssistantInput(e.target.value)} 
                    onKeyDown={e => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendAssistantMessage();
                      }
                    }} 
                    rows="2" 
                    placeholder={assistantScope === 'selected' && activeSingleEntry ? `Ask about "${activeSingleEntry.title.substring(0, 18)}..."` : "Ask across your knowledge base..."} 
                    className="w-full pl-3.5 pr-10 py-2.5 text-xs bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" 
                    disabled={isAssistantThinking}
                  />
                  <button 
                    type="submit" 
                    disabled={isAssistantThinking || !assistantInput.trim()} 
                    className="absolute right-2.5 bottom-2.5 text-indigo-600 dark:text-indigo-400 disabled:opacity-30 p-1 transition-colors"
                  >
                    <i className="fa-solid fa-paper-plane text-sm"></i>
                  </button>
                </form>
              </div>

            </div>
          )}

          {/* Hover Preview for [[kb-ref:ID]] */}
          {hoveredRef && (() => {
            const refEntry = entries.find(e => e.id === hoveredRef.id);
            if (!refEntry) return null;
            return (
              <div 
                className="fixed z-[100] bg-white dark:bg-slate-800 shadow-2xl rounded-xl p-3.5 w-64 pointer-events-none transition-all duration-75 border border-slate-200 dark:border-slate-700 text-xs font-sans transform -translate-x-1/2 -translate-y-full"
                style={{ top: hoveredRef.y - 10, left: hoveredRef.x }}
              >
                <h4 className="font-bold text-slate-800 dark:text-slate-100 line-clamp-1 mb-1">{refEntry.title}</h4>
                <p className="text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed">{refEntry.summary || 'No summary available.'}</p>
              </div>
            );
          })()}

        </div>
      );
    }


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KnowledgeApp />);
  </script>
</body>
</html>
