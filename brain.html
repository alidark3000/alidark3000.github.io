                          <i className={`fa-solid ${t.icon} text-[10px]`}></i>
                          <span>{t.label}</span>
                          <span className={`text-[10px] ml-0.5 px-1 rounded-full ${isActive ? 'bg-black/10 dark:bg-white/10' : 'opacity-60'}`}>
                            {count}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Projects */}
                <div>
                  <div className="flex items-center justify-between text-[11px] font-semibold text-[var(--text-muted)] uppercase tracking-wider mb-1.5 px-1.5 font-mono">
                    <span className="flex items-center gap-1.5"><i className="fa-solid fa-folder-open text-xs text-amber-500"></i> Projects</span>
                    <span className="font-mono opacity-75 text-[10px]">
                      {activeTypeFilters.length < ENTRY_TYPES.length || activeCategories.length > 0 || activeTags.length > 0 ? `${Array.from(availableProjects).length} / ${sortedProjects.length}` : sortedProjects.length}
                    </span>
                  </div>
                  <div className="flex flex-col">
                    <button 
                      onClick={() => setActiveProjects([])} 
                      className={`w-full text-left px-1.5 py-0.5 rounded text-xs transition-colors mb-0.5 ${activeProjects.length === 0 ? 'bg-[var(--bg-active)] text-[var(--accent)] font-semibold' : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-hover)]'}`}
                    >
                      All Projects
                    </button>
                    {sortedProjects.map(proj => {
                      const isVisible = Array.from(availableProjects).some(p => normTax(p) === normTax(proj));
                      return (
                        <div 
                          key={proj} 
                          className={`tax-collapse-item ${isVisible ? 'is-visible' : 'is-hidden'}`}
                          style={{ gridTemplateRows: isVisible ? '1fr' : '0fr' }}
                        >
                          <div className="overflow-hidden min-h-0">
                            <div 
                              draggable 
                              onDragStart={(e) => { e.dataTransfer.setData('kb-tax', JSON.stringify({ type: 'project', val: proj })); }}
                              onDragOver={(e) => e.preventDefault()}
                              onDrop={(e) => handleTaxonomyDrop(e, 'project', proj)}
                              onClick={(e) => handleProjectClick(proj, e)}
                              className={`group flex items-center justify-between px-1.5 py-0.5 rounded text-xs cursor-pointer transition-colors ${activeProjects.some(p => normTax(p) === normTax(proj)) ? 'bg-[var(--bg-active)] text-[var(--accent)] font-semibold' : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-hover)]'}`}
                            >
                              <EditableText text={proj} onSave={(newText) => submitTaxonomyRename(proj, newText, 'project')} className="truncate mr-2 flex-1 text-left" />
                              <span className="text-[10px] font-mono text-[var(--text-muted)] group-hover:text-[var(--text-main)]">{projectCounts[proj]}</span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Categories */}
                <div>
                  <div className="flex items-center justify-between text-[11px] font-semibold text-[var(--text-muted)] uppercase tracking-wider mb-1.5 px-1.5 font-mono">
                    <span className="flex items-center gap-1.5"><i className="fa-solid fa-layer-group text-xs text-[var(--accent)]"></i> Categories</span>
                    <span className="font-mono opacity-75 text-[10px]">
                      {activeTypeFilters.length < ENTRY_TYPES.length || activeProjects.length > 0 || activeTags.length > 0 ? `${Array.from(availableCategories).length} / ${sortedCategories.length}` : sortedCategories.length}
                    </span>
                  </div>
                  <div className="flex flex-col">
                    <button 
                      onClick={() => setActiveCategories([])} 
                      className={`w-full text-left px-1.5 py-0.5 rounded text-xs transition-colors mb-0.5 ${activeCategories.length === 0 ? 'bg-[var(--bg-active)] text-[var(--accent)] font-semibold' : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-hover)]'}`}
                    >
                      All Categories
                    </button>
                    {sortedCategories.map(cat => {
                      const isVisible = Array.from(availableCategories).some(c => normTax(c) === normTax(cat));
                      return (
                        <div 
                          key={cat} 
                          className={`tax-collapse-item ${isVisible ? 'is-visible' : 'is-hidden'}`}
                          style={{ gridTemplateRows: isVisible ? '1fr' : '0fr' }}
                        >
                          <div className="overflow-hidden min-h-0">
                            <div 
                              draggable 
                              onDragStart={(e) => { e.dataTransfer.setData('kb-tax', JSON.stringify({ type: 'category', val: cat })); }}
                              onDragOver={(e) => e.preventDefault()}
                              onDrop={(e) => handleTaxonomyDrop(e, 'category', cat)}
                              onClick={(e) => handleCategoryClick(cat, e)}
                              className={`group flex items-center justify-between px-1.5 py-0.5 rounded text-xs cursor-pointer transition-colors ${activeCategories.some(c => normTax(c) === normTax(cat)) ? 'bg-[var(--bg-active)] text-[var(--accent)] font-semibold' : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-hover)]'}`}
                            >
                              <EditableText text={cat} onSave={(newText) => submitTaxonomyRename(cat, newText, 'category')} className="truncate mr-2 flex-1 text-left" />
                              <span className="text-[10px] font-mono text-[var(--text-muted)] group-hover:text-[var(--text-main)]">{categoryCounts[cat]}</span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Tags */}
                <div>
                  <div 
                    onClick={() => setIsTagsOpen(!isTagsOpen)} 
                    className="flex items-center justify-between text-[11px] font-semibold text-[var(--text-muted)] uppercase tracking-wider mb-1.5 px-1.5 cursor-pointer select-none hover:text-[var(--text-main)] font-mono"
                  >
                    <span className="flex items-center gap-1.5">
                      <i className={`fa-solid fa-chevron-${isTagsOpen ? 'down' : 'right'} text-[9px]`}></i>
                      <i className="fa-solid fa-tag text-xs"></i> Tags
                      {activeTags.length > 0 && (
                        <span className="text-[9px] bg-[var(--accent)]/15 text-[var(--accent)] font-mono px-1.5 py-0.2 rounded-full lowercase">
                          {activeTags.length} active
                        </span>
                      )}
                    </span>
                    <span className="font-mono opacity-75 text-[10px]">
                      {activeTypeFilters.length < ENTRY_TYPES.length || activeProjects.length > 0 || activeCategories.length > 0 ? `${Array.from(availableTags).length} / ${sortedTags.length}` : sortedTags.length}
                    </span>
                  </div>
                  {isTagsOpen && (
                    <div className="flex flex-col">
                      <button 
                        onClick={() => setActiveTags([])} 
                        className={`w-full text-left px-1.5 py-0.5 rounded text-xs transition-colors mb-0.5 ${activeTags.length === 0 ? 'bg-[var(--bg-active)] text-[var(--accent)] font-semibold' : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-hover)]'}`}
                      >
                        All Tags
                      </button>
                      {sortedTags.map(tag => {
                        const isVisible = Array.from(availableTags).some(t => normTax(t) === normTax(tag));
                        return (
                          <div 
                            key={tag} 
                            className={`tax-collapse-item ${isVisible ? 'is-visible' : 'is-hidden'}`}
                            style={{ gridTemplateRows: isVisible ? '1fr' : '0fr' }}
                          >
                            <div className="overflow-hidden min-h-0">
                              <div 
                                draggable 
                                onDragStart={(e) => { e.dataTransfer.setData('kb-tax', JSON.stringify({ type: 'tag', val: tag })); }}
                                onDragOver={(e) => e.preventDefault()}
                                onDrop={(e) => handleTaxonomyDrop(e, 'tag', tag)}
                                onClick={(e) => handleTagClick(tag, e)}
                                className={`group flex items-center justify-between px-1.5 py-0.5 rounded text-xs cursor-pointer transition-colors ${activeTags.some(t => normTax(t) === normTax(tag)) ? 'bg-[var(--bg-active)] text-[var(--accent)] font-semibold' : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-hover)]'}`}
                              >
                                <EditableText stripPrefix="#" text={tag} onSave={(newText) => submitTaxonomyRename(tag, newText, 'tag')} className="truncate mr-2 flex-1 text-left" />
                                <span className="text-[10px] font-mono text-[var(--text-muted)] group-hover:text-[var(--text-main)]">{tagCounts[tag]}</span>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

              </div>

              {/* Sidebar Footer */}
              <div className="px-[50px] py-4 flex justify-between items-center text-[11px] font-mono text-[var(--text-muted)]">
                <span>{entries.length} notes</span>
                <span className="opacity-75">{new Date(lastSyncTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
              </div>
            </div>
          )}

          {/* MIDDLE COLUMN: NOTE LIST */}
          {isListSidebarOpen && (
            <div 
              className="w-96 lg:w-[440px] flex-shrink-0 flex flex-col z-10 transition-all duration-300 relative bg-[var(--bg-tracks)]"
              onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={(e) => { e.preventDefault(); if (!e.currentTarget.contains(e.relatedTarget)) setIsDragging(false); }}
              onDrop={(e) => { handleDrop(e); setIsDragging(false); }}
            >
              {isDragging && (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-[var(--accent)]/10 backdrop-blur-xs border-2 border-dashed border-[var(--accent)] m-2 rounded-lg pointer-events-none transition-all">
                  <div className="bg-[var(--card-bg)] p-6 text-center rounded-lg shadow-xl flex flex-col items-center">
                    <i className="fa-solid fa-cloud-arrow-up text-3xl text-[var(--accent)] mb-2"></i>
                    <h3 className="text-sm font-bold text-[var(--text-main)]">Drop to Add Note</h3>
                    <p className="text-xs text-[var(--text-muted)]">URLs, PDFs, or plain text</p>
                  </div>
                </div>
              )}

              {/* List Header */}
              <div className="px-[50px] pt-[50px] pb-4 flex flex-col gap-3">
                <div className="flex gap-2 items-center h-8">
                  <div className="relative flex-1 h-8">
                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-[var(--text-muted)] text-xs"></i>
                    <input 
                      type="text" 
                      placeholder="Search notes..." 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                      className="w-full h-8 pl-8 pr-3 bg-[var(--bg-main)] text-[var(--text-main)] placeholder-[var(--text-muted)] rounded text-xs transition-colors box-border" 
                    />
                  </div>
                  <button 
                    onClick={handleNewNote} 
                    className="btn-primary h-8 px-3 text-xs" 
                    title="Create new blank note"
                  >
                    <i className="fa-solid fa-plus text-xs"></i> Note
                  </button>
                  <button onClick={() => setIsListSidebarOpen(false)} className="btn-icon hidden lg:flex shrink-0" title="Hide note list">
                    <i className="fa-solid fa-chevron-left text-xs"></i>
                  </button>
                </div>

                {/* Quick Add URL/Text */}
                <form onSubmit={(e) => { e.preventDefault(); if (addInput.trim()) processInput(addInput.trim()); }} className="relative">
                  <i className="fa-solid fa-link absolute left-3 top-2 text-[var(--text-muted)] text-xs"></i>
                  <input 
                    type="text" 
                    value={addInput} 
                    onChange={e => setAddInput(e.target.value)} 
                    disabled={isAnalyzing} 
                    placeholder="Paste URL, YouTube, or text..." 
                    className="w-full pl-8 pr-7 py-1.5 text-xs bg-[var(--bg-main)] text-[var(--text-main)] placeholder-[var(--text-muted)] rounded disabled:opacity-50 transition-colors" 
                  />
                  <button type="submit" disabled={isAnalyzing || !addInput.trim()} className="absolute right-2 top-1.5 text-[var(--accent)] hover:text-[var(--accent-hover)] disabled:opacity-30 p-0.5">
                    {isAnalyzing ? <i className="fa-solid fa-spinner fa-spin text-xs"></i> : <i className="fa-solid fa-arrow-right text-xs"></i>}
                  </button>
                </form>

                {/* Active Filter Indicators */}
                {(activeProjects.length > 0 || activeCategories.length > 0 || activeTags.length > 0) && (
                  <div className="flex flex-wrap items-center gap-1.5 pt-0.5">
                    {activeProjects.map(p => (
                      <span key={p} className="badge text-[10px]">
                        <i className="fa-solid fa-folder-open text-[9px] text-amber-500"></i> {p}
                        <button type="button" onClick={() => setActiveProjects(prev => prev.filter(x => x !== p))} className="hover:text-[var(--danger)] ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>
                    ))}
                    {activeCategories.map(c => (
                      <span key={c} className="badge text-[10px]">
                        <i className="fa-solid fa-layer-group text-[9px] text-[var(--accent)]"></i> {c}
                        <button type="button" onClick={() => setActiveCategories(prev => prev.filter(x => x !== c))} className="hover:text-[var(--danger)] ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>
                    ))}
                    {activeTags.map(t => (
                      <span key={t} className="badge text-[10px]">
                        #{t}
                        <button type="button" onClick={() => setActiveTags(prev => prev.filter(x => x !== t))} className="hover:text-[var(--danger)] ml-0.5"><i className="fa-solid fa-xmark text-[9px]"></i></button>
                      </span>
                    ))}
                    <button 
                      type="button" 
                      onClick={() => { setActiveProjects([]); setActiveCategories([]); setActiveTags([]); }}
                      className="text-[10px] text-[var(--text-muted)] hover:text-[var(--accent)] underline ml-1 font-mono"
                    >
                      Clear
                    </button>
                  </div>
                )}
              </div>

              {/* Note Cards List: 30px margin between cards */}
              <div className="flex-1 overflow-y-auto px-[50px] pb-[50px] pt-2 space-y-[30px]">
                
                {/* PROMPT NOTE SECTION */}
                {!promptState.draft && !promptState.isGenerating && (
                  <button onClick={generatePromptNote} className="w-full p-3.5 rounded-md border-2 border-dashed border-[var(--accent)] text-[var(--accent)] hover:bg-[var(--accent)] hover:text-white transition-colors font-bold font-mono text-xs shadow-[var(--track-card-shadow)] flex items-center justify-center gap-2 cursor-pointer">
                    <i className="fa-solid fa-wand-magic-sparkles"></i> Generate Prompt
                  </button>
                )}
                {promptState.isGenerating && (
                  <div className="w-full p-3.5 rounded-md border-2 border-dashed border-[var(--text-muted)] text-[var(--text-muted)] font-mono text-xs flex items-center justify-center gap-2">
                    <i className="fa-solid fa-spinner fa-spin"></i> Finding themes and loose ends from last 4 months...
                  </div>
                )}
                {promptState.draft && (
                  <div className="group relative p-4 rounded-md shadow-[var(--track-card-shadow)] transition-all duration-150 border-l-4 bg-[var(--card-bg)]" style={{ borderLeftColor: '#f97316', borderLeftWidth: '4px' }}>
                    <div className="flex justify-between items-start mb-2">
                      <div className="flex items-center gap-2 text-[#f97316] font-bold text-xs uppercase tracking-wider">
                        <i className="fa-solid fa-brain"></i> Theme Prompt
                      </div>
                      <div className="flex items-center gap-2">
                        <button 
                          onClick={handleWriteFromPrompt} 
                          className="text-xs bg-[#f97316] text-white px-3 py-1 rounded font-bold hover:bg-[#ea580c] transition-colors flex items-center gap-1.5 font-mono shadow-xs cursor-pointer"
                          title="Open in Focus Mode to write your response"
                        >
                          <i className="fa-solid fa-pen-nib text-[10px]"></i> Write
                        </button>
                        <button 
                          onClick={() => setPromptState(prev => ({ ...prev, draft: null }))} 
                          className="text-xs text-[var(--text-muted)] hover:text-[var(--danger)] p-1 cursor-pointer transition-colors"
                          title="Dismiss prompt"
                        >
                          <i className="fa-solid fa-xmark"></i>
                        </button>
                      </div>
                    </div>
                    <div className="font-bold text-[var(--text-main)] mb-2 font-mono text-base">{promptState.draft.title}</div>
                    <div className="text-xs text-[var(--text-main)] font-mono leading-relaxed pb-1 whitespace-pre-wrap">{promptState.draft.fullContent}</div>
                  </div>
                )}

                {filteredEntries.map(entry => {
                  const isSelected = selectedEntryIds.includes(entry.id);
                  const isPdf = !entry.sourceUrl && entry.title?.toLowerCase().endsWith('.pdf');
                  const isMedia = !isPdf && isMediaSource(entry.sourceUrl);
                  const isPrompt = isPromptEntry(entry);
                  
                  let typeColor = '#f59e0b'; // Note (Amber)
                  let typeIcon = 'fa-file-lines';
                  if (isPrompt) {
                    typeColor = '#f97316'; // Prompt (Orange)
                    typeIcon = 'fa-brain';
                  } else if (isMedia) {
                    typeColor = '#ff5252'; // Media (Red)
                    typeIcon = 'fa-play';
                  } else if (entry.sourceUrl) {
                    typeColor = '#38bdf8'; // Web (Sky)
                    typeIcon = 'fa-link';
                  } else if (isPdf) {
                    typeColor = '#ec4899'; // PDF (Rose)
                    typeIcon = 'fa-file-pdf';
                  }

                  return (
                    <div 
                      key={entry.id}
                      draggable
                      onDragStart={(e) => {
                        e.dataTransfer.setData('kb-ref-id', entry.id);
                        e.dataTransfer.setData('text/plain', `[[kb-ref:${entry.id}]]`);
                      }}
                      onClick={(e) => handleEntryClick(e, entry.id)}
                      onDragOver={(e) => { e.preventDefault(); setDragOverEntryId(entry.id); }}
                      onDragLeave={() => setDragOverEntryId(null)}
                      onDrop={(e) => handleEntryDrop(e, entry.id)}
                      style={{
                        borderLeftColor: typeColor,
                        borderLeftWidth: '4px',
                      }}
                      className={`group relative p-3.5 rounded-md shadow-[var(--track-card-shadow)] transition-all duration-150 cursor-pointer ${
                        isSelected
                          ? 'bg-[var(--bg-active)] shadow-md'
                          : 'bg-[var(--track-card-bg)] hover:bg-[var(--table-row-hover)]'
                      } ${dragOverEntryId === entry.id ? 'scale-[0.98] bg-[var(--bg-hover)]' : ''}`}
                    >
                      <div className="flex justify-between items-start gap-2 mb-1">
                        <h4 className="text-sm font-semibold leading-snug line-clamp-2 flex-1 text-[var(--text-main)] font-mono">
                          <i className={`fa-solid ${typeIcon} mr-1.5 text-xs`} style={{ color: typeColor }}></i>
                          {entry.title || 'Untitled Note'}
                        </h4>
                        <div className="flex items-center gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                          <button 
                            onClick={(e) => togglePin(e, entry.id)} 
                            className={`p-1 text-xs rounded hover:bg-[var(--bg-hover)] ${entry.pinned ? 'text-[var(--accent)] opacity-100 !opacity-100' : 'text-[var(--text-muted)]'}`} 
                            title={entry.pinned ? "Unpin" : "Pin"}
                          >
                            <i className="fa-solid fa-thumbtack"></i>
                          </button>
                          <button 
                            data-delete-entry="true"
                            onClick={(e) => { e.stopPropagation(); deleteEntry(entry.id); }} 
                            className="p-1 text-xs text-[var(--text-muted)] hover:text-[var(--danger)] hover:bg-[var(--danger)]/10 rounded" 
                            title="Delete note"
                          >
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                        </div>
                        {entry.pinned && !isSelected && (
                          <i className="fa-solid fa-thumbtack text-[10px] text-[var(--accent)] group-hover:hidden shrink-0 mt-0.5"></i>
                        )}
                      </div>

                      {/* For prompt entries, show answer summary if present, else fullContent preview */}
                      {isPrompt ? (
                        (entry.summary || entry.fullContent) && (
                          <p className="text-xs text-[var(--text-muted)] line-clamp-2 leading-relaxed mb-2 font-normal font-mono">
                            {entry.summary || entry.fullContent}
                          </p>
                        )
                      ) : (
                        entry.summary && (
                          <p className="text-xs text-[var(--text-muted)] line-clamp-2 leading-relaxed mb-2 font-normal font-mono">
                            {entry.summary}
                          </p>
                        )
                      )}

                      <div className="flex flex-wrap items-center gap-1.5 text-[10px]">
                        <span className="text-[var(--text-muted)] font-mono mr-1">#{entry.numericId}</span>
                        {Array.isArray(entry.projects) && entry.projects.slice(0, 1).map(p => (
                          <span key={p} className="badge text-[10px]">{p}</span>
                        ))}
                        {Array.isArray(entry.categories) && entry.categories.slice(0, 1).map(c => (
                          <span key={c} className="badge text-[10px]">{c}</span>
                        ))}
                      </div>
                    </div>
                  );
                })}

                {filteredEntries.length === 0 && (
                  <div className="text-center py-12 px-4 text-[var(--text-muted)] font-mono">
                    <i className="fa-regular fa-folder-open text-3xl mb-3 opacity-40"></i>
                    <p className="text-xs font-medium">No notes match your filters</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MAIN DOCUMENT COLUMN (READER / EDITOR) */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden relative z-0 bg-[var(--bg-main)]">
            
            {/* Top Bar / Actions */}
            <div className="px-[50px] pt-[50px] pb-4 flex justify-between items-center shrink-0 bg-[var(--bg-pane)]">
              <div className="flex items-center gap-2 h-8">
                {!isLeftSidebarOpen && (
                  <button onClick={() => setIsLeftSidebarOpen(true)} className="btn-secondary h-8 px-2.5 text-xs" title="Open taxonomy sidebar">
                    <i className="fa-solid fa-folder-tree mr-1"></i> Library
                  </button>
                )}
                {!isListSidebarOpen && (
                  <button onClick={() => setIsListSidebarOpen(true)} className="btn-secondary h-8 px-2.5 text-xs" title="Open note list">
                    <i className="fa-solid fa-list mr-1"></i> Notes
                  </button>
                )}

                {/* Back / Forward Controls */}
                <div className="flex items-center gap-0.5 bg-[var(--bg-main)] p-0.5 rounded h-8 box-border">
                  <button 
                    onClick={handleNavBack} 
                    disabled={!canGoBack} 
                    className="btn-icon w-6 h-6 text-xs disabled:opacity-30 disabled:pointer-events-none" 
                    title="Back (Alt+Left)"
                  >
                    <i className="fa-solid fa-arrow-left text-[10px]"></i>
                  </button>
                  <button 
                    onClick={handleNavForward} 
                    disabled={!canGoForward} 
                    className="btn-icon w-6 h-6 text-xs disabled:opacity-30 disabled:pointer-events-none" 
                    title="Forward (Alt+Right)"
                  >
                    <i className="fa-solid fa-arrow-right text-[10px]"></i>
                  </button>
                </div>

                {selectedEntryIds.length > 1 && (
                  <span className="badge h-8 px-2.5 text-xs">
                    {selectedEntryIds.length} notes selected
                  </span>
                )}
              </div>

              <div className="flex items-center gap-2 h-8">
                {activeSingleEntry && !editingEntries[activeSingleEntry.id] && (
                  <button 
                    onClick={() => startEditing(activeSingleEntry)} 
                    className="btn-secondary h-8 px-3 text-xs" 
                    title="Edit note"
                  >
                    <i className="fa-solid fa-pen text-xs mr-1"></i> Edit
                  </button>
                )}

                <button 
                  onClick={() => setIsAssistantOpen(!isAssistantOpen)} 
                  className={`h-8 px-3 text-xs font-semibold rounded flex items-center gap-1.5 transition-colors ${
                    isAssistantOpen 
                      ? 'btn-primary' 
                      : 'btn-secondary'
                  }`}
                  title="Toggle AI Assistant (Cmd+J)"
                >
                  <i className="fa-solid fa-sparkles text-xs"></i> Assistant
                </button>
              </div>
            </div>

            {/* Error Notification */}
            {error && (

                                {Array.isArray(activeSingleEntry.tags) && activeSingleEntry.tags.map(t => (

                                <span key={c} className="badge text-[11px]">{c}</span>

                              {Array.isArray(activeSingleEntry.tags) && activeSingleEntry.tags.map(t => (

                                  <i className="fa-solid fa-arrow-up-right-from-square text-[10px] mr-1"></i> View Source

                              className="flex-1 cursor-text"

                              e.stopPropagation();

                              setIsContentFocused(true);

                            title="Double-click to write note content in Focus Mode"
                          >
                            Double-click to write note content in Focus Mode...
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {/* Linked References */}
                  {Array.isArray(activeSingleEntry.references) && activeSingleEntry.references.length > 0 && (
                    <div className="pt-6 font-mono">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)] mb-3 flex items-center gap-1.5">
                        <i className="fa-solid fa-link text-[var(--accent)]"></i> Linked References
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {activeSingleEntry.references.map(refId => {
                          const refEntry = entries.find(e => e.id === refId);
                          if (!refEntry) return null;
                          return (
                            <div 
                              key={refId} 
                              onClick={() => selectEntryWithHistory([refId])} 
                              className="p-3.5 rounded bg-[var(--card-bg)] hover:bg-[var(--bg-hover)] cursor-pointer transition-colors flex justify-between items-center shadow-[var(--track-card-shadow)]"
                            >
                              <div className="truncate mr-2">
                                <div className="text-xs font-semibold text-[var(--text-main)] truncate">{refEntry.title}</div>
                                <div className="text-[11px] text-[var(--text-muted)] truncate">{refEntry.summary || 'No summary'}</div>
                              </div>
                              <i className="fa-solid fa-arrow-right text-xs text-[var(--text-muted)]"></i>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              ) : null}
            </div>
          </div>

          {/* RIGHT COLUMN: UNIFIED AI ASSISTANT SIDEBAR */}
          {isAssistantOpen && (
            <div className="w-96 lg:w-[440px] flex-shrink-0 flex flex-col z-20 transition-all duration-300 bg-[var(--bg-pane)]">
              
              {/* Assistant Header */}
              <div className="px-[50px] pt-[50px] pb-4 shrink-0 space-y-3">
                <div className="flex justify-between items-center h-8">
                  <div className="flex items-center gap-2 h-8">
                    <div className="w-7 h-7 rounded bg-[var(--accent)] text-white flex items-center justify-center text-xs shadow-sm">
                      <i className="fa-solid fa-sparkles"></i>
                    </div>
                    <div className="flex items-center gap-2">
                      <h3 className="text-xs font-bold text-[var(--text-main)] font-mono">AI Assistant</h3>
                      <span className="badge text-[10px] font-mono">
                        {model.includes('pro') ? '🧠 Pro' : '⚡ Flash'}
                      </span>
                    </div>
                  </div>

                  <div className="flex items-center gap-1 h-8">
                    {assistantMessages.length > 0 && (
                      <button 
                        onClick={handleArchiveCurrentChat} 
                        className="btn-icon" 
                        title="Archive current chat session"
                      >
                        <i className="fa-solid fa-box-archive text-xs"></i>
                      </button>
                    )}
                    {assistantMessages.length > 0 && (
                      <button onClick={clearAssistantHistory} className="btn-icon" title="Clear active chat">
                        <i className="fa-regular fa-trash-can text-xs"></i>
                      </button>
                    )}
                    <button onClick={() => setIsAssistantOpen(false)} className="btn-icon" title="Close assistant">
                      <i className="fa-solid fa-xmark text-sm"></i>
                    </button>
                  </div>
                </div>

                {/* New Chat Button (Prominent Colored Button on its own line) */}
                <button 
                  type="button"
                  onClick={handleStartNewChat} 
                  className="btn-primary w-full py-2 px-3 text-xs font-semibold shadow-xs" 
                  title="Start new chat (archives current conversation)"
                >
                  <i className="fa-solid fa-plus text-xs"></i>
                  <span>New Chat</span>
                </button>

                {/* Scope Segmented Control */}
                <div className="grid grid-cols-2 p-0.5 bg-[var(--bg-main)] rounded text-[11px] font-medium font-mono">
                  <button 
                    type="button"
                    onClick={() => setAssistantScope('workspace')} 
                    className={`py-1.5 px-2 rounded transition-colors flex items-center justify-center gap-1.5 ${
                      assistantScope === 'workspace' 
                        ? 'bg-[var(--card-bg)] text-[var(--accent)] font-semibold shadow-xs' 
                        : 'text-[var(--text-muted)] hover:text-[var(--text-main)]'
                    }`}
                    title="Search and chat across whole knowledge base"
                  >
                    <i className="fa-solid fa-brain text-[10px]"></i>
                    <span>Whole Brain</span>
                  </button>

                  <button 
                    type="button"
                    onClick={() => {
                      if (!activeSingleEntry && entries.length > 0) {
                        setSelectedEntryIds([entries[0].id]);
                      }
                      setAssistantScope('selected');
                    }} 
                    className={`py-1.5 px-2 rounded transition-colors flex items-center justify-center gap-1.5 ${
                      assistantScope === 'selected' 
                        ? 'bg-[var(--card-bg)] text-[var(--accent)] font-semibold shadow-xs' 
                        : 'text-[var(--text-muted)] hover:text-[var(--text-main)]'
                    }`}
                    title={activeSingleEntry ? `Focus on "${activeSingleEntry.title}" with archive context` : 'Focus on current entry'}
                  >
                    <i className="fa-solid fa-file-lines text-[10px]"></i>
                    <span>Current Entry</span>
                  </button>
                </div>

                {/* Active note context pill */}
                {assistantScope === 'selected' && activeSingleEntry && (
                  <div className="flex items-center gap-1.5 text-[11px] text-[var(--text-muted)] px-1 truncate font-mono">
                    <span className="font-semibold text-[var(--accent)] shrink-0">Note:</span>
                    <span className="truncate font-medium text-[var(--text-main)]" title={activeSingleEntry.title}>{activeSingleEntry.title || 'Untitled Note'}</span>
                  </div>
                )}
              </div>

              {/* Message Thread */}
              <div ref={chatScrollRef} className="flex-1 overflow-y-auto px-[50px] py-4 space-y-4 text-xs min-h-0 font-mono">
                {assistantMessages.length === 0 ? (
                  <div className="py-6 flex flex-col items-center justify-center text-center text-[var(--text-muted)] space-y-3">
                    <div className="w-12 h-12 rounded bg-[var(--bg-hover)] text-[var(--accent)] flex items-center justify-center text-xl">
                      <i className={`fa-solid ${assistantScope === 'workspace' ? 'fa-brain' : 'fa-file-lines'}`}></i>
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-[var(--text-main)]">
                        {assistantScope === 'workspace' 
                          ? 'Whole Brain Chat' 
                          : (activeSingleEntry ? activeSingleEntry.title : 'Current Entry Chat')}
                      </h4>
                      <p className="text-xs text-[var(--text-muted)] mt-1 leading-relaxed">
                        {assistantScope === 'workspace'
                          ? 'Ask questions across your entire knowledge base, request cross-cutting syntheses, or discover connections.'
                          : (activeSingleEntry 
                              ? `This note is loaded into context with its full content, plus executive summaries and takeaways from other notes.`
                              : 'Select any note from the list to start a focused discussion.')}
                      </p>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3.5">
                    {assistantMessages.map(msg => (
                      <div key={msg.id} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[90%] rounded px-3.5 py-2.5 shadow-[var(--track-card-shadow)] leading-relaxed ${
                          msg.role === 'user' 
                            ? 'bg-[var(--chat-user-bg)] text-[var(--text-main)] border border-[var(--chat-user-border)]' 
                            : 'bg-[var(--card-bg)] text-[var(--text-main)]'
                        }`}>
                          {msg.role === 'user' ? (
                            <div className="whitespace-pre-wrap">{msg.text}</div>
                          ) : (
                            <div>
                              <div 
                                className="prose prose-player text-xs max-w-none prose-p:my-1 prose-headings:my-2 prose-ul:my-1" 
                                dangerouslySetInnerHTML={{ __html: injectReferences(parseMarkdown(msg.text), entries) }}
                                onClick={handleContentClick}
                              />
                              <div className="flex items-center gap-2 mt-2 pt-2 text-[10px]">
                                <button 
                                  onClick={() => copyMessage(msg.id, msg.text)} 
                                  className="text-[var(--text-muted)] hover:text-[var(--accent)] flex items-center gap-1"
                                >
                                  <i className="fa-regular fa-copy"></i>
                                  {actionFeedback?.msgId === msg.id && actionFeedback.type === 'copy' ? 'Copied!' : 'Copy'}
                                </button>
                                {activeSingleEntry && (
                                  <button 
                                    onClick={() => insertMessageIntoNote(msg.id, msg.text)} 
                                    className="text-[var(--text-muted)] hover:text-[var(--accent)] flex items-center gap-1"
                                    title="Insert into currently open note"
                                  >
                                    <i className="fa-solid fa-file-import"></i>
                                    {actionFeedback?.msgId === msg.id && actionFeedback.type === 'insert' ? 'Inserted!' : 'Insert to Note'}
                                  </button>
                                )}
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}

                    {isAssistantThinking && (
                      <div className="flex justify-start">
                        <div className="bg-[var(--card-bg)] text-[var(--text-muted)] rounded px-3 py-2 text-xs flex items-center gap-2">
                          <i className="fa-solid fa-spinner fa-spin text-[var(--accent)]"></i> Thinking...
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* PREVIOUS CHATS SECTION */}
                {activeArchivedChats.length > 0 && (
                  <div className="pt-6 mt-4 border-t border-[var(--bg-main)] space-y-3">
                    <div className="flex items-center justify-between">
                      <h4 className="text-[11px] font-bold uppercase tracking-wider text-[var(--text-muted)] flex items-center gap-1.5">
                        <i className="fa-solid fa-clock-rotate-left text-[var(--accent)]"></i>
                        Previous Chats ({activeArchivedChats.length})
                      </h4>
                      <button 
                        onClick={handleClearAllArchivedChats}
                        className="text-[10px] text-[var(--text-muted)] hover:text-[var(--danger)] transition-colors"
                        title="Clear all previous chats for this conversation"
                      >
                        Clear Archive
                      </button>
                    </div>

                    <div className="space-y-2.5">
                      {activeArchivedChats.map((archivedChat, idx) => {
                        const isExpanded = expandedArchivedChatIds.includes(archivedChat.id);
                        const firstUserText = (archivedChat.messages || []).find(m => m.role === 'user')?.text || '';
                        const msgCount = (archivedChat.messages || []).length;
                        const formattedTime = new Date(archivedChat.timestamp || Date.now()).toLocaleDateString(undefined, { 
                          month: 'short', 
                          day: 'numeric', 
                          hour: '2-digit', 
                          minute: '2-digit' 
                        });

                        return (
                          <div 
                            key={archivedChat.id || idx} 
                            className="bg-[var(--card-bg)] rounded overflow-hidden shadow-[var(--track-card-shadow)] transition-all"
                          >
                            {/* Previous Chat Card Header */}
                            <div 
                              onClick={() => toggleExpandArchivedChat(archivedChat.id)}
                              className="p-3 cursor-pointer hover:bg-[var(--bg-hover)] flex items-start justify-between gap-2 select-none"
                            >
                              <div className="min-w-0 flex-1">
                                <div className="flex items-center gap-1.5 mb-1">
                                  <i className={`fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-[10px] text-[var(--text-muted)]`}></i>
                                  <span className="font-bold text-xs text-[var(--text-main)] truncate">
                                    {archivedChat.title || firstUserText.substring(0, 40) || 'Archived Session'}
                                  </span>
                                </div>
                                <div className="flex items-center gap-2 text-[10px] text-[var(--text-muted)] pl-4">
                                  <span>{formattedTime}</span>
                                  <span>•</span>
                                  <span>{msgCount} message{msgCount === 1 ? '' : 's'}</span>
                                </div>
                              </div>

                              <div className="flex items-center gap-1 shrink-0" onClick={e => e.stopPropagation()}>
                                <button 
                                  onClick={() => restoreArchivedChat(archivedChat)}
                                  className="btn-icon text-xs hover:text-[var(--accent)]" 
                                  title="Restore / Resume as active chat"
                                >
                                  <i className="fa-solid fa-arrow-rotate-left"></i>
                                </button>
                                <button 
                                  onClick={() => deleteArchivedChat(archivedChat.id)}
                                  className="btn-icon text-xs hover:text-[var(--danger)]" 
                                  title="Delete this previous chat"
                                >
                                  <i className="fa-solid fa-trash-can"></i>
                                </button>
                              </div>
                            </div>

                            {/* Previous Chat Messages */}
                            {isExpanded && (
                              <div className="p-3 pt-1 space-y-2.5 bg-[var(--bg-pane)] border-t border-[var(--bg-main)]">
                                {(archivedChat.messages || []).map((msg, mIdx) => (
                                  <div key={msg.id || mIdx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} mt-2`}>
                                    <div className={`max-w-[92%] rounded px-3 py-2 leading-relaxed text-xs ${
                                      msg.role === 'user' 
                                        ? 'bg-[var(--chat-user-bg)] text-[var(--text-main)] border border-[var(--chat-user-border)]' 
                                        : 'bg-[var(--card-bg)] text-[var(--text-main)] shadow-xs'
                                    }`}>
                                      {msg.role === 'user' ? (
                                        <div className="whitespace-pre-wrap">{msg.text}</div>
                                      ) : (
                                        <div>
                                          <div 
                                            className="prose prose-player text-xs max-w-none prose-p:my-1 prose-headings:my-1 prose-ul:my-1" 
                                            dangerouslySetInnerHTML={{ __html: injectReferences(parseMarkdown(msg.text), entries) }}
                                            onClick={handleContentClick}
                                          />
                                          <div className="flex items-center gap-2 mt-2 pt-1 text-[10px]">
                                            <button 
                                              onClick={() => copyMessage(msg.id, msg.text)} 
                                              className="text-[var(--text-muted)] hover:text-[var(--accent)] flex items-center gap-1"
                                            >
                                              <i className="fa-regular fa-copy"></i>
                                              {actionFeedback?.msgId === msg.id && actionFeedback.type === 'copy' ? 'Copied!' : 'Copy'}
                                            </button>
                                            {activeSingleEntry && (
                                              <button 
                                                onClick={() => insertMessageIntoNote(msg.id, msg.text)} 
                                                className="text-[var(--text-muted)] hover:text-[var(--accent)] flex items-center gap-1"
                                                title="Insert into currently open note"
                                              >
                                                <i className="fa-solid fa-file-import"></i>
                                                {actionFeedback?.msgId === msg.id && actionFeedback.type === 'insert' ? 'Inserted!' : 'Insert'}
                                              </button>
                                            )}
                                          </div>
                                        </div>
                                      )}
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}

                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              {/* Quick Prompt Chips (Current Entry Only) */}
              {assistantScope === 'selected' && (
                <div className="px-[50px] py-3 flex flex-wrap gap-1.5 bg-[var(--bg-main)]">
                  <button 
                    onClick={() => sendAssistantMessage("Summarize the key points in 3 concise paragraphs.")} 
                    className="btn-secondary text-[11px] px-2.5 py-1"
                  >
                    ⚡ Summarize
                  </button>
                  <button 
                    onClick={() => sendAssistantMessage("Extract the top 5 key takeaways as bullet points.")} 
                    className="btn-secondary text-[11px] px-2.5 py-1"
                  >
                    💡 Key Takeaways
                  </button>
                  <button 
                    onClick={() => sendAssistantMessage("Extract all action items and tasks as a checklist.")} 
                    className="btn-secondary text-[11px] px-2.5 py-1"
                  >
                    ✅ Action Items
                  </button>
                  <button 
                    onClick={() => sendAssistantMessage("What are the most interesting connections or themes related to this?")} 
                    className="btn-secondary text-[11px] px-2.5 py-1"
                  >
                    🔗 Connections
                  </button>
                </div>
              )}

              {/* Assistant Input Bar */}
              <div className="px-[50px] pb-[50px] pt-3 shrink-0 bg-[var(--bg-pane)]">
                <form 
                  onSubmit={(e) => { e.preventDefault(); sendAssistantMessage(); }} 
                  className="relative flex items-center"
                >
                  <textarea 
                    value={assistantInput} 
                    onChange={e => setAssistantInput(e.target.value)} 
                    onKeyDown={e => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendAssistantMessage();
                      }
                    }} 
                    rows="2" 
                    placeholder={assistantScope === 'selected' && activeSingleEntry ? `Ask about "${activeSingleEntry.title.substring(0, 18)}..."` : "Ask across knowledge base..."} 
                    className="w-full pl-3.5 pr-10 py-2.5 text-xs bg-[var(--bg-main)] text-[var(--text-main)] placeholder-[var(--text-muted)] rounded resize-none font-mono" 
                    disabled={isAssistantThinking}
                  />
                  <button 
                    type="submit" 
                    disabled={isAssistantThinking || !assistantInput.trim()} 
                    className="absolute right-3 bottom-3 text-[var(--accent)] hover:text-[var(--accent-hover)] disabled:opacity-30 p-1 transition-colors"
                  >
                    <i className="fa-solid fa-paper-plane text-sm"></i>
                  </button>
                </form>
              </div>

            </div>
          )}

          {/* Hover Preview for [[kb-ref:ID]] */}
          {hoveredRef && (() => {
            const refEntry = entries.find(e => e.id === hoveredRef.id);
            if (!refEntry) return null;
            return (
              <div 
                className="fixed z-[100] bg-[var(--card-bg)] shadow-2xl rounded p-3.5 w-64 pointer-events-none transition-all duration-75 text-xs font-mono transform -translate-x-1/2 -translate-y-full"
                style={{ top: hoveredRef.y - 10, left: hoveredRef.x }}
              >
                <h4 className="font-bold text-[var(--text-main)] line-clamp-1 mb-1">{refEntry.title}</h4>
                <p className="text-[var(--text-muted)] line-clamp-2 leading-relaxed">{refEntry.summary || 'No summary available.'}</p>
              </div>
            );
          })()}

          {/* DISTRACTION-FREE FOCUS MODE (PORTAL OVER ENTIRE APP) */}
          {isContentFocused && activeSingleEntry && ReactDOM.createPortal(
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4">
              {/* Opaque backdrop fading in */}
              <div 
                className="absolute inset-0 animate-focus-backdrop cursor-pointer"
                style={{ backgroundColor: 'var(--bg-main)' }}
                onClick={handleDefocus}
                title="Click outside to save and close"
              />
              {/* Centered 40em x 40em window animated into place */}
              <div 
                className="relative z-10 animate-focus-window flex flex-col rounded-lg shadow-2xl border border-[var(--border)] bg-[var(--card-bg)] overflow-hidden"
                style={{ width: '40em', height: '40em', maxWidth: 'calc(100vw - 2rem)', maxHeight: 'calc(100vh - 2rem)' }}
                onClick={e => e.stopPropagation()}
              >
                {/* Close Icon in the top right */}
                <button 
                  type="button" 
                  onClick={handleDefocus}
                  className="absolute top-3 right-3 z-20 w-8 h-8 flex items-center justify-center rounded text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-hover)] transition-colors cursor-pointer"
                  title="Close and save (Esc or click outside)"
                >
                  <i className="fa-solid fa-xmark text-sm"></i>
                </button>

                {/* Prompt Question Display Above Text Area */}
                {activeSingleEntry.promptQuestion && (
                  <div className="shrink-0 pt-6 px-8 pb-4 pr-14 border-b border-[var(--border)] bg-[var(--bg-pane)] select-text">
                    <div className="flex items-center gap-1.5 text-[10px] uppercase font-bold tracking-wider text-[#f97316] font-mono mb-1.5">
                      <i className="fa-solid fa-brain"></i>
                      <span>Theme Prompt</span>
                    </div>
                    <p className="text-xs font-mono text-[var(--text-main)] leading-relaxed italic font-medium">
                      {activeSingleEntry.promptQuestion}
                    </p>
                  </div>
                )}

                {/* Textarea */}
                <textarea 
                  ref={contentTextareaRef}
                  value={editData[activeSingleEntry.id]?.fullContent ?? activeSingleEntry.fullContent ?? ''}
                  onChange={e => setEditData(prev => ({ ...prev, [activeSingleEntry.id]: { ...(prev[activeSingleEntry.id] || activeSingleEntry), fullContent: e.target.value } }))} 
                  onKeyDown={handleContentKeyDown}
                  className="w-full flex-1 p-8 font-mono text-sm leading-[1.4] bg-[var(--card-bg)] text-[var(--text-main)] resize-none outline-none border-none cursor-text select-text"
                  placeholder="Write your note in Markdown..."
                ></textarea>
              </div>
            </div>,
            document.body
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KnowledgeApp />);
  </script>
</body>
</html>
