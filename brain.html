<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Brain</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <!-- Consolidated Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['ui-monospace', 'Cascadia Code', 'Cascadia Mono', 'Consolas', 'Menlo', 'Monaco', 'monospace'],
            mono: ['ui-monospace', 'Cascadia Code', 'Cascadia Mono', 'Consolas', 'Menlo', 'Monaco', 'monospace'],
          },
          colors: {
            accent: {
              DEFAULT: 'var(--accent)',
              hover: 'var(--accent-hover)',
            }
          },
          typography: () => ({
            player: {
              css: {
                '--tw-prose-body': 'var(--text-main)',
                '--tw-prose-headings': 'var(--text-main)',
                'font-family': 'ui-monospace, Cascadia Code, Cascadia Mono, Consolas, Menlo, Monaco, monospace',
                'line-height': '1.4',
                'p': { 'line-height': '1.4', 'margin-top': '0.75em', 'margin-bottom': '0.75em' },
                'ul, ol': { 'margin-top': '0.4em', 'margin-bottom': '0.4em', 'padding-left': '1.25em' },
                'li': { 'line-height': '1.4', 'margin-top': '0', 'margin-bottom': '0', 'padding-left': '0' },
                'li > p, li p': { 'margin-top': '0', 'margin-bottom': '0', 'line-height': '1.4' },
                'h1, h2, h3, h4, h5, h6': {
                  'color': 'var(--text-main)',
                  'font-weight': '700',
                  'margin-top': '1.25em',
                  'margin-bottom': '0.5em',
                  'line-height': '1.3'
                },
                '--tw-prose-links': 'var(--accent)',
                '--tw-prose-bold': 'var(--text-main)',
                '--tw-prose-counters': 'var(--text-muted)',
                '--tw-prose-bullets': 'var(--text-muted)',
                '--tw-prose-quotes': 'var(--text-main)',
                '--tw-prose-quote-borders': 'var(--accent)',
                '--tw-prose-captions': 'var(--text-muted)',
                '--tw-prose-code': 'var(--text-main)',
                '--tw-prose-pre-code': 'var(--text-main)',
                '--tw-prose-pre-bg': 'var(--card-bg)',
                '--tw-prose-th-borders': 'transparent',
                '--tw-prose-td-borders': 'transparent',
              },
            },
          }),
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
  <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      /* Default Dark Theme - unified with player.html & index.html */
      --bg-main: #141414;
      --bg-pane: #1b1b1b;
      --bg-tracks: #181818;
      --bg-hover: #262626;
      --bg-active: #303030;
      --text-main: #e3e3dc;
      --text-muted: #95968f;
      --accent: #ff5252;
      --accent-hover: #ff7b7b;
      --border: #2a2a2a;
      --danger: #cf6679;

      --btn-primary-text: #ffffff;
      --card-bg: #202020;
      --card-shadow: rgba(0, 0, 0, 0.4);
      --track-card-bg: #202020;
      --track-card-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      --thumb-bg: #222222;
      --thumb-placeholder: rgba(255, 255, 255, 0.06);
      --table-header-bg: #181818;
      --table-row-hover: #282828;
      --table-playing-bg: rgba(255, 82, 82, 0.16);
      --context-menu-bg: #242424;
      --context-menu-shadow: rgba(0, 0, 0, 0.6);
      --scrollbar-thumb: #555555;
      --scrollbar-thumb-hover: #777777;
      --selection-bg: #37383a;
      --chat-user-bg: rgba(255, 82, 82, 0.12);
      --chat-user-border: rgba(255, 82, 82, 0.22);
      --link-color: #ff5252;
      --link-hover: #ff7b7b;
      --link-underline: rgba(255, 82, 82, 0.4);
    }

    @media (prefers-color-scheme: light) {
      :root {
        /* Clean Modern Light Theme - unified with player.html & index.html */
        --bg-main: #f7f7f9;
        --bg-pane: #ffffff;
        --bg-tracks: #f5f5f7;
        --track-card-bg: #ffffff;
        --track-card-shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
        --bg-hover: #f0f0f3;
        --bg-active: #e5e5ea;
        --text-main: #111111;
        --text-muted: #555555;
        --accent: #d32f2f;
        --accent-hover: #b71c1c;
        --border: #e5e5ea;
        --danger: #dc2626;

        --btn-primary-text: #ffffff;
        --card-bg: #ffffff;
        --card-shadow: rgba(0, 0, 0, 0.08);
        --thumb-bg: #ebebf0;
        --thumb-placeholder: rgba(0, 0, 0, 0.05);
        --table-header-bg: #f5f5f7;
        --table-row-hover: #fafafc;
        --table-playing-bg: rgba(211, 47, 47, 0.08);
        --context-menu-bg: #ffffff;
        --context-menu-shadow: rgba(0, 0, 0, 0.15);
        --scrollbar-thumb: #c7c7cc;
        --scrollbar-thumb-hover: #8e8e93;
        --selection-bg: #dbeafe;
        --chat-user-bg: rgba(211, 47, 47, 0.08);
        --chat-user-border: rgba(211, 47, 47, 0.18);
        --link-color: #d32f2f;
        --link-hover: #b71c1c;
        --link-underline: rgba(211, 47, 47, 0.35);
      }
    }

    * {
      box-sizing: border-box;
    }

    ::selection {
      background-color: var(--selection-bg);
      color: inherit;
    }

    body {
      font-family: ui-monospace, 'Cascadia Code', 'Cascadia Mono', 'Consolas', 'Menlo', 'Monaco', monospace;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Links */
    a {
      color: var(--link-color);
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3.5px;
      text-decoration-color: var(--link-underline);
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
    }

    a:hover {
      color: var(--link-hover);
      text-decoration-color: var(--link-hover);
    }

    /* Form Controls: Borderless matching player.html */
    input, textarea, select {
      border: none !important;
      outline: none !important;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    /* Player-style Buttons */
    .btn-primary {
      background-color: var(--accent);
      color: var(--btn-primary-text);
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 600;
      font-family: inherit;
      transition: background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: none;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: var(--bg-hover);
      border: none;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      transition: background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: var(--bg-active);
      color: var(--text-main);
    }
    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-icon:hover:not(:disabled) {
      color: var(--text-main);
      background-color: var(--bg-hover);
    }

    .badge {
      background-color: var(--bg-hover);
      color: var(--text-muted);
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .app-brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 50px 50px 14px 50px;
    }
    .app-brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .app-brand-link {
      font-size: 0.76rem;
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s;
    }
    .app-brand-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* Backlink badge styling */
    .kb-embedded-ref {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      margin: 0 2px;
      border-radius: 4px;
      background-color: rgba(255, 82, 82, 0.12);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.82em;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .kb-embedded-ref:hover {
      background-color: rgba(255, 82, 82, 0.22);
    }

    /* Taxonomy list collapsing transitions */
    .tax-collapse-item {
      display: grid;
      transition: grid-template-rows 250ms cubic-bezier(0.4, 0, 0.2, 1), opacity 200ms ease;
    }
    .tax-collapse-item.is-visible {
      grid-template-rows: 1fr;
      opacity: 1;
    }
    .tax-collapse-item.is-hidden {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    /* Neubrutalist Theme Overrides */
    .theme-neubrutalist {
      background-color: #f3f4f6 !important;
    }
    .theme-neubrutalist * {
      border-radius: 0px !important;
    }

    /* MS-DOS WordStar Theme */
    .theme-msdos * {
      border: none !important;
      border-radius: 0px !important;
      box-shadow: none !important;
      font-family: Menlo, Monaco, Consolas, monospace !important;
    }
    .theme-msdos {
      background-color: #000000 !important;
      color: #BDBDBD !important;
    }
    @keyframes focusFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes focusWindowIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .animate-focus-backdrop {
      animation: focusFadeIn 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-focus-window {
      animation: focusWindowIn 260ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Markdown Prose & List Spacing */
    .prose,
    .prose-player {
      line-height: 1.4 !important;
    }
    .prose p,
    .prose-player p {
      line-height: 1.4 !important;
    }
    .prose ul, .prose ol,
    .prose-player ul, .prose-player ol {
      margin-top: 0.4em !important;
      margin-bottom: 0.4em !important;
      padding-left: 1.25em !important;
    }
    .prose li,
    .prose-player li {
      margin-top: 0 !important;
      margin-bottom: 0 !important;
      line-height: 1.4 !important;
      padding-left: 0 !important;
    }
    .prose li p, .prose li > p,
    .prose-player li p, .prose-player li > p {
      margin-top: 0 !important;
      margin-bottom: 0 !important;
      line-height: 1.4 !important;
      display: inline !important;
    }
    .prose ul ul, .prose ul ol, .prose ol ul, .prose ol ol,
    .prose-player ul ul, .prose-player ul ol, .prose-player ol ul, .prose-player ol ol {
      margin-top: 0 !important;
      margin-bottom: 0 !important;
    }
  </style>
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)] font-sans overflow-hidden transition-colors duration-200 antialiased">
  
  <!-- Global Diagnostic Screen -->
  <div id="error-fallback" class="hidden fixed inset-0 bg-[var(--bg-main)] text-[var(--text-main)] p-[50px] flex flex-col items-center justify-center z-[9999]">
    <div class="max-w-md w-full bg-[var(--card-bg)] p-8 rounded-lg shadow-xl text-center">
      <div class="flex items-center justify-center gap-3 text-[var(--danger)] mb-4">
        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
        <h1 class="text-lg font-bold">App Initialization Error</h1>
      </div>
      <p class="text-[var(--text-muted)] text-xs mb-4">A background script encountered an issue.</p>
      <div id="error-details" class="bg-[var(--bg-main)] p-3 rounded font-mono text-xs text-[var(--danger)] overflow-x-auto mb-6 max-h-40 text-left"></div>
      <button onclick="window.location.reload()" class="btn-primary w-full py-2.5">
        <i class="fa-solid fa-rotate-right mr-2"></i> Reload App
      </button>
    </div>
  </div>

  <div id="root"></div>

  <script>
    window.addEventListener('error', function(e) {
      console.error("Captured Error:", e);
      const fallback = document.getElementById('error-fallback');
      const details = document.getElementById('error-details');
      if (fallback && details) {
        fallback.classList.remove('hidden');
        details.textContent = `${e.message}\nLine: ${e.lineno}:${e.colno}\nFile: ${e.filename}`;
      }
    });
  </script>

  <script type="text/babel">

    const { useState, useEffect, useRef } = React;

    const APP_VERSION = "v2.2.1";

    const CHANGELOG = [
      {
        version: "v2.2.1",
        date: "2026-09-30",
        highlights: [
          "Notes are now automatically saved whenever clicked away from, navigated away from, or when Focus Mode is exited (via Esc, backdrop click, or close button), not just when manually clicking Save.",
          "Added periodic background disk & IndexedDB auto-saving every 15 seconds regardless of user activity.",
          "Automatic sync triggers on window visibility changes and page unloads.",
          "Added AI Theme Prompt Generator: juxtaposes recurring themes and loose ends from the last 4 months while ignoring executive summaries of previous prompts, gives prompt notes their own distinct Orange color, and features a 'Write' action that opens straight into Focus Mode with the question displayed above the editor.",
          "Moved color-coded entry type toggles into the Taxonomy view above Projects (with live counts and 'all types' reset), dynamically filtering taxonomies below, with Tags collapsed by default on initial load.",
          "Prompt entries now display an Answer Summary alongside the Theme Prompt in the content view, with AI generation specifically tuned to synthesize and summarize the user's answer to the prompt question.",
          "In the content view, the last edited date is only displayed if it falls on a different day from the created date. When both dates are shown, they are neatly positioned on their own dedicated line above taxonomy badges."
        ]
      },
      {
        version: "v2.2.0",
        date: "2026-09-15",
        highlights: [
          "Applied visual style from player.html: borderless views and inputs, 50px view padding, 30px entry card spacing.",
          "Retained entry type colors on note cards as a left stripe (Media: Red, Web: Sky, PDF: Rose, Note: Amber).",
          "In-app Version Changelog accessible via Settings and Welcome screen.",
          "Automatic title, category, and tag generation when saving notes lacking metadata.",
          "Segmented dual-option switch for 'Whole Brain' and 'Current Entry' AI context.",
          "Segregated Assistant chat history per note and global workspace."
        ]
      },
      {
        version: "v2.1.0",
        date: "2026-09-14",
        highlights: [
          "Direct File System Access API integration with auto-sync and persistent file handles.",
          "Keyboard shortcut Cmd+J / Ctrl+J to toggle AI Assistant panel.",
          "Backlink detection and hover card previews with [[kb-ref:ID]].",
          "Improved Markdown rendering with syntax highlighting and task checklists."
        ]
      },
      {
        version: "v2.0.0",
        date: "2026-09-10",
        highlights: [
          "Initial release of local-first KnowledgeBase Brain.",
          "Theme support: Clean Modern, Neubrutalist, and MS-DOS WordStar styles.",
          "URL ingestion and automated Gemini AI summarization."
        ]
      }
    ];

    const isMediaSource = (url) => {
      if (!url) return false;
      return /(youtube\.com|youtu\.be|vimeo\.com|tiktok\.com|twitch\.tv|dailymotion\.com|spotify\.com|soundcloud\.com|\.(mp4|webm|ogg|mov|mp3|wav|m4a)$)/i.test(url);
    };

    const isPromptEntry = (entry) => {
      if (!entry) return false;
      return Boolean(entry.promptQuestion || (Array.isArray(entry.tags) && entry.tags.includes('prompt')) || (Array.isArray(entry.categories) && entry.categories.includes('prompt')));
    };

    const ENTRY_TYPES = [
      { id: 'note', label: 'Notes', color: '#f59e0b', icon: 'fa-file-lines' },
      { id: 'prompt', label: 'Prompts', color: '#f97316', icon: 'fa-brain' },
      { id: 'media', label: 'Media', color: '#ff5252', icon: 'fa-play' },
      { id: 'web', label: 'Web', color: '#38bdf8', icon: 'fa-link' },
      { id: 'pdf', label: 'PDFs', color: '#ec4899', icon: 'fa-file-pdf' }
    ];

    const getEntryType = (entry) => {
      if (!entry) return 'note';
      if (isPromptEntry(entry)) return 'prompt';
      const isPdf = !entry.sourceUrl && entry.title?.toLowerCase().endsWith('.pdf');
      if (isPdf) return 'pdf';
      if (isMediaSource(entry.sourceUrl)) return 'media';
      if (entry.sourceUrl) return 'web';
      return 'note';
    };

    const getEmbedUrl = (url) => {
      if (!url) return null;
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
      if (match && match[1]) return `https://www.youtube-nocookie.com/embed/${match[1]}?origin=https://localhost`;
      match = url.match(/vimeo\.com\/(?:video\/)?([0-9]+)/);
      if (match && match[1]) return `https://player.vimeo.com/video/${match[1]}`;
      return null;
    };

    const parseMarkdown = (content) => {
      if (typeof marked !== 'undefined' && marked.parse) {
        return marked.parse(content || '');
      }
      return (content || '')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br />');
    };

    const parseMarkdownInline = (content) => {
      if (typeof marked !== 'undefined' && marked.parseInline) {
        return marked.parseInline(content || '');
      }
      return content || '';
    };

    const injectReferences = (text, allEntries) => {
      if (!text) return '';
      return text.replace(/\[\[(?:kb-ref:|ref:)?([^\]]+)\]\]|\[(?:kb-ref:|ref:)?(entry-[a-zA-Z0-9_-]+)\](?!\()/gi, (match, id1, id2) => {
        const rawId = (id1 || id2 || '').trim();
        const refEntry = (allEntries || []).find(e => e.id === rawId || String(e.numericId) === rawId);
        if (!refEntry) return `<span class="text-[var(--danger)] text-xs font-semibold px-2 py-0.5 rounded bg-[var(--danger)]/10">[Broken Link: ${rawId}]</span>`;
        return `<span class="kb-embedded-ref" data-id="${refEntry.id}" title="${refEntry.title}">[Ref: ${refEntry.numericId}]</span>`;
      });
    };

    const ChangelogModal = ({ onClose }) => {
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-[80] p-[50px]">
          <div className="bg-[var(--card-bg)] rounded-lg shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden text-left">
            <div className="flex justify-between items-center p-6 shrink-0">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded bg-[var(--accent)] text-white flex items-center justify-center text-sm font-semibold">
                  <i className="fa-solid fa-clock-rotate-left"></i>
                </div>
                <div>
                  <h2 className="text-sm font-bold text-[var(--text-main)]">Release Notes & Changelog</h2>
                  <p className="text-xs text-[var(--text-muted)] font-mono">Current Version: {APP_VERSION}</p>
                </div>
              </div>
              <button 
                onClick={onClose} 
                className="btn-icon"
                title="Close"
              >
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>
            <div className="p-6 overflow-y-auto space-y-6">
              {CHANGELOG.map((release, idx) => (
                <div key={release.version} className="relative pl-6 pb-2 border-l-2 border-[var(--accent)]/40 last:border-l-transparent">
                  <div className={`absolute -left-[9px] top-0 w-4 h-4 rounded-full border-2 ${idx === 0 ? 'bg-[var(--accent)] border-[var(--card-bg)]' : 'bg-[var(--text-muted)] border-[var(--card-bg)]'}`}></div>
                  <div className="flex items-baseline justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-sm text-[var(--text-main)] font-mono">{release.version}</span>
                      {idx === 0 && (
                        <span className="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-[var(--accent)]/15 text-[var(--accent)]">Latest</span>
                      )}
                    </div>
                    <span className="text-xs text-[var(--text-muted)] font-mono">{release.date}</span>
                  </div>
                  <ul className="space-y-1.5 text-xs text-[var(--text-muted)]">
                    {release.highlights.map((item, itemIdx) => (
                      <li key={itemIdx} className="flex items-start gap-2">
                        <span className="text-[var(--accent)] font-bold leading-none mt-1">&bull;</span>
                        <span className="leading-relaxed text-[var(--text-main)]">{item}</span>
                      </li>

    const fetchAndScrubUrl = async (urlString) => {
      let html = '';
      try {
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(urlString)}`);
        const data = await response.json();
        if (data.contents) html = data.contents;
        else throw new Error("Invalid proxy response");
      } catch (err) {
        try {
          const response2 = await fetch(`https://corsproxy.io/?${encodeURIComponent(urlString)}`);
          if (!response2.ok) throw new Error("Network response failed");
          html = await response2.text();
        } catch (err2) {
          throw new Error("Scrape blocked. Falling back to search.");
        }
      }
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      let originalTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || 
                          doc.querySelector('title')?.textContent || 
                          doc.querySelector('h1')?.textContent || 
                          "Untitled Page";
      originalTitle = originalTitle.trim().replace(/\s*[|•-]\s*([A-Za-z0-9 ]+Substack|[A-Za-z0-9 ]+Medium|[A-Za-z0-9 ]+Blog|[A-Za-z0-9 ]+HQ|QUT.*)$/i, '').trim();

      const unwanted = doc.querySelectorAll('script, style, noscript, iframe, svg, video, header, footer, nav, aside, form, .menu, .mega-menu, .global-nav, .navbar');
      unwanted.forEach(el => el.remove());
      
      let mainNode = doc.querySelector('.profile-details') || doc.querySelector('article') || doc.querySelector('main') || doc.body;
      
      let markdownContent = '';
      if (typeof TurndownService !== 'undefined') {
        const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
        markdownContent = turndownService.turndown(mainNode);
      } else {
        markdownContent = mainNode.innerText || mainNode.textContent || '';
      }
      
      if (!markdownContent || markdownContent.length < 50) throw new Error("No text found. Falling back to search.");
      return { title: originalTitle, content: markdownContent.substring(0, 50000) }; 
    };

    async function verifyPermission(fileHandle, readWrite) {
      const options = { mode: readWrite ? 'readwrite' : 'read' };
      if ((await fileHandle.queryPermission(options)) === 'granted') return true;
      if ((await fileHandle.requestPermission(options)) === 'granted') return true;
      return false;
    }

      reader.readAsDataURL(file);
    });

    const callGemini = async (key, payload, model) => {
      const activeModel = model || 'gemini-2.5-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${key}`;
      const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await response.json();
      
      if (result.error) throw new Error(result.error.message);
      if (!result.candidates || result.candidates.length === 0) {
        const reason = result.promptFeedback?.blockReason || "Empty response from AI";
        throw new Error(`AI rejected the prompt. Reason: ${reason}`);
      }
      return result;

      let t = text.trim();

      return JSON.parse(t);

    const EditableText = ({ text, onSave, className = '', tag = 'span', multiline = false, stripPrefix = '', renderView = null, placeholder = '' }) => {
      const [isEditing, setIsEditing] = useState(false);
      const elementRef = useRef(null);

      const handleDoubleClick = (e) => {
        e.stopPropagation();
        setIsEditing(true);
      };

      const handleBlur = () => {
        setIsEditing(false);
        if (elementRef.current) {
          let newText = elementRef.current.innerText;
          if (newText !== undefined && newText !== null) {
            newText = newText.trim();
          } else {
            newText = '';
          }
          const originalText = (text || '').trim();
          if (newText !== originalText && newText !== (stripPrefix + originalText).trim()) {
            if (stripPrefix && newText.startsWith(stripPrefix)) {
              newText = newText.substring(stripPrefix.length);
            }
            onSave(newText);
          } else if (!renderView) {
            elementRef.current.innerText = (stripPrefix || '') + (text || '');
          }
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !multiline) {
          e.preventDefault();
          elementRef.current.blur();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          setIsEditing(false);
          if (elementRef.current && !renderView) {
            elementRef.current.innerText = (stripPrefix || '') + (text || '');
          }
        }
      };

      useEffect(() => {
        if (elementRef.current && !isEditing && !renderView) {
          elementRef.current.innerText = (stripPrefix || '') + (text || '');
        }
      }, [text, isEditing, stripPrefix, renderView]);

      useEffect(() => {
        if (isEditing && elementRef.current) {
          elementRef.current.innerText = (stripPrefix || '') + (text || '');
          elementRef.current.focus();
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(elementRef.current);
          selection.removeAllRanges();
          selection.addRange(range);
        }
      }, [isEditing]);

      const Tag = tag;

      return (
        <Tag
          ref={elementRef}
          contentEditable={isEditing}
          onDoubleClick={handleDoubleClick}
          onBlur={handleBlur}
          onKeyDown={handleKeyDown}
          className={`${className} ${isEditing ? 'outline-none rounded bg-[var(--card-bg)] text-[var(--text-main)] cursor-text p-2 font-mono whitespace-pre-wrap text-sm block' : ''}`}
          suppressContentEditableWarning={true}
          title={!isEditing ? "Double-click to edit inline" : undefined}
        >
          {isEditing ? (stripPrefix || '') + (text || '') : (renderView ? renderView(text) : `${stripPrefix || ''}${text || placeholder}`)}
        </Tag>
      );
    };

      const saveWorkspaceToDisk = async () => {
        const current = saveStateRef.current;
        if (current.appState !== 'workspace') return;

        if (isSavingRef.current) {
          savePendingRef.current = true;
          return;
        }

        isSavingRef.current = true;
        try {
          const dataToWrite = {
            entries: current.entries,
            storedPrompts: current.storedPrompts || [],

            model: current.model,

      useEffect(() => {

        const handleVisibilityChange = () => {

      const ensureNumericIds = (loadedEntries) => {

      // Library Merge state & helpers
      const [mergeStatus, setMergeStatus] = useState(null);
      const mergeFileInputRef = useRef(null);

      const executeLibraryMerge = (incomingData, sourceFileName = '') => {
        try {
          if (!incomingData || typeof incomingData !== 'object') {
            throw new Error("Invalid format. Expected a KnowledgeBase JSON object.");
          }

          let rawEntries = [];
          if (Array.isArray(incomingData)) {
            rawEntries = incomingData;
          } else if (incomingData.entries && Array.isArray(incomingData.entries)) {
            rawEntries = incomingData.entries;
          } else {
            throw new Error("No notes found in the selected library file.");
          }

          const processedIncoming = processLoadedEntries(rawEntries).map(e => ({
            ...e,
            createdAt: Number(e.createdAt) || Number(e.updatedAt) || Date.now(),
            updatedAt: Number(e.updatedAt) || Number(e.createdAt) || Date.now()
          }));

          if (!processedIncoming.length) {
            throw new Error("No valid notes found to merge.");
          }

          let addedCount = 0;
          let updatedCount = 0;
          let unchangedCount = 0;

          // Build index of current entries
          const existingMap = new Map();
          entries.forEach(e => {
            if (e.id) existingMap.set(e.id, { ...e });
          });

          const mergedList = entries.map(e => ({ ...e }));
          const incomingToInsert = [];

          // Helper to get consistent timestamp for chronological positioning
          const getEntryTime = (e) => Number(e.createdAt) || Number(e.updatedAt) || 0;

          // Step 1: Scan for existing entries vs new ones
          processedIncoming.forEach(incoming => {
            const existing = existingMap.get(incoming.id);

            if (existing) {
              const incomingTime = Number(incoming.updatedAt) || Number(incoming.createdAt) || 0;
              const existingTime = Number(existing.updatedAt) || Number(existing.createdAt) || 0;

              if (incomingTime > existingTime) {
                // Incoming note is more recent: update existing entry
                const idx = mergedList.findIndex(e => e.id === incoming.id);
                if (idx !== -1) {
                  mergedList[idx] = {
                    ...existing,
                    ...incoming,
                    numericId: existing.numericId != null ? existing.numericId : incoming.numericId,
                    createdAt: existing.createdAt || incoming.createdAt || incomingTime,
                    updatedAt: incomingTime || Date.now()
                  };
                  existingMap.set(incoming.id, mergedList[idx]);
                  updatedCount++;
                }
              } else {
                // Existing entry is already newer or identical
                unchangedCount++;
              }
            } else {
              // Incoming entry does not exist in current library
              incomingToInsert.push(incoming);
            }
          });

          // Step 2: Insert new incoming entries in chronological order using decimal numericIds
          if (incomingToInsert.length > 0) {
            // Sort new incoming notes chronologically
            incomingToInsert.sort((a, b) => getEntryTime(a) - getEntryTime(b));

            // Set of all used numeric IDs to guarantee uniqueness
            const usedIds = new Set(mergedList.map(e => Number(e.numericId)).filter(n => !isNaN(n)));

            const cleanFloat = (num) => parseFloat(Number(num).toFixed(4));

            const makeUnique = (candidate) => {
              let val = cleanFloat(candidate);
              while (usedIds.has(val)) {
                val = cleanFloat(val + 0.0001);
              }
              usedIds.add(val);
              return val;
            };

            // Existing chronological timeline of notes
            const currentTimeline = [...mergedList].sort((a, b) => {
              const timeDiff = getEntryTime(a) - getEntryTime(b);
              if (timeDiff !== 0) return timeDiff;
              return (a.numericId || 0) - (b.numericId || 0);
            });

            if (currentTimeline.length === 0) {
              incomingToInsert.forEach((inc, idx) => {
                const assignedId = makeUnique(idx + 1);
                const newEntry = {
                  ...inc,
                  numericId: assignedId,
                  createdAt: getEntryTime(inc) || Date.now(),
                  updatedAt: Number(inc.updatedAt) || getEntryTime(inc) || Date.now()
                };
                mergedList.push(newEntry);
                addedCount++;
              });
            } else {
              // Partition new notes into gaps relative to current timeline:
              // gaps[0]: before currentTimeline[0]
              // gaps[j]: between currentTimeline[j-1] and currentTimeline[j]
              // gaps[N]: after currentTimeline[N-1]
              const gaps = Array.from({ length: currentTimeline.length + 1 }, () => []);

              incomingToInsert.forEach(incoming => {
                const inTime = getEntryTime(incoming);

                if (inTime < getEntryTime(currentTimeline[0])) {
                  gaps[0].push(incoming);
                } else if (inTime >= getEntryTime(currentTimeline[currentTimeline.length - 1])) {
                  gaps[currentTimeline.length].push(incoming);
                } else {
                  let placed = false;
                  for (let j = 1; j < currentTimeline.length; j++) {
                    const prevTime = getEntryTime(currentTimeline[j - 1]);
                    const nextTime = getEntryTime(currentTimeline[j]);
                    if (inTime >= prevTime && inTime < nextTime) {
                      gaps[j].push(incoming);
                      placed = true;
                      break;
                    }
                  }
                  if (!placed) {
                    gaps[currentTimeline.length].push(incoming);
                  }
                }
              });

              // 1. Gap 0: Before oldest existing note
              if (gaps[0].length > 0) {
                const firstId = Number(currentTimeline[0].numericId) || 1;
                const k = gaps[0].length;
                const minVal = firstId > 0 ? 0 : firstId - 1;
                const step = (firstId - minVal) / (k + 1);

                gaps[0].forEach((inc, i) => {
                  const rawId = minVal + (i + 1) * step;
                  const assignedId = makeUnique(rawId);
                  const newEntry = {
                    ...inc,
                    numericId: assignedId,
                    createdAt: getEntryTime(inc) || Date.now(),
                    updatedAt: Number(inc.updatedAt) || getEntryTime(inc) || Date.now()
                  };
                  mergedList.push(newEntry);
                  addedCount++;
                });
              }

              // 2. Intermediate Gaps (1 <= j < currentTimeline.length)
              for (let j = 1; j < currentTimeline.length; j++) {
                const gapNotes = gaps[j];
                if (gapNotes.length === 0) continue;

                const prevId = Number(currentTimeline[j - 1].numericId) || 0;
                const nextId = Number(currentTimeline[j].numericId) || (prevId + 1);
                const k = gapNotes.length;

                if (nextId > prevId) {
                  const step = (nextId - prevId) / (k + 1);
                  gapNotes.forEach((inc, i) => {
                    const rawId = prevId + (i + 1) * step;
                    const assignedId = makeUnique(rawId);
                    const newEntry = {
                      ...inc,
                      numericId: assignedId,
                      createdAt: getEntryTime(inc) || Date.now(),
                      updatedAt: Number(inc.updatedAt) || getEntryTime(inc) || Date.now()
                    };
                    mergedList.push(newEntry);
                    addedCount++;
                  });
                } else {
                  const step = 0.01;
                  gapNotes.forEach((inc, i) => {
                    const rawId = prevId + (i + 1) * step;
                    const assignedId = makeUnique(rawId);
                    const newEntry = {
                      ...inc,
                      numericId: assignedId,
                      createdAt: getEntryTime(inc) || Date.now(),
                      updatedAt: Number(inc.updatedAt) || getEntryTime(inc) || Date.now()
                    };
                    mergedList.push(newEntry);
                    addedCount++;
                  });
                }
              }

              // 3. Gap After Last Note (newer than all notes)
              if (gaps[currentTimeline.length].length > 0) {
                let highestInt = Math.floor(Math.max(...Array.from(usedIds), 0));
                gaps[currentTimeline.length].forEach(inc => {
                  highestInt += 1;
                  const assignedId = makeUnique(highestInt);
                  const newEntry = {
                    ...inc,
                    numericId: assignedId,
                    createdAt: getEntryTime(inc) || Date.now(),
                    updatedAt: Number(inc.updatedAt) || getEntryTime(inc) || Date.now()
                  };
                  mergedList.push(newEntry);
                  addedCount++;
                });
              }
            }
          }

          const finalEntries = normalizeTaxonomy(mergedList);

          // Merge assistant chats if present in incomingData
          let updatedChats = { ...assistantChats };
          let updatedArchived = { ...archivedAssistantChats };

          if (incomingData.assistantChats && typeof incomingData.assistantChats === 'object') {

                if (toAdd.length > 0) {

          setEntries(finalEntries);
          setAssistantChats(updatedChats);
          setArchivedAssistantChats(updatedArchived);

          const summary = `Merged successfully${sourceFileName ? ` with "${sourceFileName}"` : ''}: ${addedCount} new note${addedCount === 1 ? '' : 's'} added in chronological order, ${updatedCount} note${updatedCount === 1 ? '' : 's'} updated to latest changes, ${unchangedCount} note${unchangedCount === 1 ? '' : 's'} already up to date.`;
          setMergeStatus({ type: 'success', message: summary });
        } catch (err) {
          console.error("Library merge error:", err);
          setMergeStatus({ type: 'error', message: `Merge failed: ${err.message}` });
        }
      };

      const handleMergePicker = async () => {

          if (err.name !== 'AbortError') {

          }
        }
      };

      const handleMergeFileInputChange = (e) => {

        reader.onload = (event) => {

          } catch (err) {
            setMergeStatus({ type: 'error', message: `Failed to parse JSON file: ${err.message}` });
          }
        };
        reader.readAsText(file);
      };

      // Taxonomy stats
      const projectCounts = {};
      const categoryCounts = {};
      const tagCounts = {};
      const allProjects = new Set();
      const allCategories = new Set();
      const allTags = new Set();

      entries.forEach(e => {
        if (Array.isArray(e.projects)) {
          e.projects.forEach(p => {
            allProjects.add(p);
            projectCounts[p] = (projectCounts[p] || 0) + 1;
          });
        }
        if (Array.isArray(e.categories)) {
          e.categories.forEach(c => {
            allCategories.add(c);
            categoryCounts[c] = (categoryCounts[c] || 0) + 1;
          });
        }
        if (Array.isArray(e.tags)) {
          e.tags.forEach(t => {
            allTags.add(t);
            tagCounts[t] = (tagCounts[t] || 0) + 1;
          });
        }
      });

      const normTax = s => String(s || '').trim().toLowerCase();

      const availableProjects = new Set();
      const availableCategories = new Set();
      const availableTags = new Set();

      entries.forEach(e => {
        const matchesType = activeTypeFilters.includes(getEntryType(e));
        if (!matchesType) return;

        const matchesProject = activeProjects.length === 0 || (Array.isArray(e.projects) && e.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
        const matchesCat = activeCategories.length === 0 || (Array.isArray(e.categories) && e.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
        const matchesTag = activeTags.length === 0 || (Array.isArray(e.tags) && e.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));

        if (matchesProject && matchesTag) {
          if (Array.isArray(e.categories)) e.categories.forEach(c => availableCategories.add(c));
        }
        if (matchesProject && matchesCat) {
          if (Array.isArray(e.tags)) e.tags.forEach(t => availableTags.add(t));
        }
        if (matchesCat && matchesTag) {
          if (Array.isArray(e.projects)) e.projects.forEach(p => availableProjects.add(p));
        }
      });

      const handleProjectClick = (proj, e) => {
        setActiveCategories([]);
        setActiveTags([]);
        if (e.ctrlKey || e.metaKey) {
          setActiveProjects(prev => prev.some(p => normTax(p) === normTax(proj)) ? prev.filter(p => normTax(p) !== normTax(proj)) : [...prev, proj]);
        } else {

        }

      const handleCategoryClick = (cat, e) => {

      const sortedProjects = Array.from(allProjects).sort((a, b) => a.localeCompare(b));
      const sortedCategories = Array.from(allCategories).sort((a, b) => a.localeCompare(b));
      const sortedTags = Array.from(allTags).sort((a, b) => {

      // Ingestion / Add entry
      const processInput = async (textContent, file = null) => {

        try {
          let sourceUrl = null;

          let payloadParts = [];

          const schema = {
            type: "OBJECT",
            properties: {
              title: { type: "STRING" },
              summary: { type: "STRING" },
              shortVersion: { type: "ARRAY", items: { type: "STRING" } },
              fullContent: { type: "STRING" },

          };

          const taxonomyRules = `
          Taxonomy guidelines:
          - Projects: Assign 0-1 scoped initiative from: ${JSON.stringify(Array.from(allProjects))}. Return in lowercase.
          - Categories: Assign 1-2 broad categories from existing list: ${JSON.stringify(Array.from(allCategories))}. Return in lowercase.
          - Tags: Assign 2-4 concept tags from existing list if possible: ${JSON.stringify(Array.from(allTags))}. Include author/creator name as tag. Return in lowercase.`;

          if (file && file.type === 'application/pdf') {
            const base64Data = await readFileAsBase64(file);
            originalWebTitle = file.name;
            prompt = `Analyze this PDF document and return JSON:
            1. Title (Use the document title or "${file.name}").
            2. Ultra-concise TLDR summary (1 short sentence, strictly under 15 words).
            3. 3-5 key points in 'shortVersion'.
            4. Detailed reconstructed fullContent in clean Markdown.
            ${taxonomyRules}`;
            payloadParts = [
              { text: prompt },
              { inlineData: { mimeType: "application/pdf", data: base64Data } }
            ];
          } else if (textContent) {
            const droppedData = textContent.trim();
            const isUrl = /^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(droppedData);
            const isYouTube = isUrl && /(youtube\.com|youtu\.be)/i.test(droppedData);
            sourceUrl = isUrl ? droppedData : null;
            let rawContent = droppedData;

            if (isYouTube) {
              useSearchTool = true;
              let videoId = '';
              try {
                const urlObj = new URL(droppedData);

      const handleGenerateTLDR = async (id) => {

            : `Write an ultra-concise executive summary (TL;DR) of this note capturing only the single core takeaway. Limit strictly to 1 short sentence (under 15 words). Return strictly JSON: {"summary": "text"}.\nTitle: ${data.title}\nContent: ${data.fullContent}`;
          const payload = {
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { summary: { type: "STRING" } } } }
          };
          const result = await handleGeminiCall(payload, model);

          if (resData.summary) {
            setEditData(prev => ({ ...prev, [id]: { ...prev[id], summary: resData.summary.trim() } }));
          }

          setIsAnalyzing(false);
        }

      const handleGenerateAnswerSummary = async (id) => {

        try {
          const entry = entries.find(e => e.id === id) || (editData && editData[id]);

          const questionText = entry.promptQuestion || '';
          const responseText = entry.fullContent || '';
          if (!responseText.trim()) throw new Error("No answer written yet to summarize.");

          const prompt = `You are summarizing the user's answer/response to a prompt question.
Prompt Question:
${questionText}

User's Written Response:
${responseText.substring(0, 30000)}

Instructions:
Write an ultra-concise 1-sentence summary (strictly under 20 words) that directly synthesizes and summarizes the user's answer/response to the prompt question. Return strictly JSON: {"summary": "text"}.`;

          const payload = {
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: { summary: { type: "STRING" } }
              }
            }
          };

          const result = await handleGeminiCall(payload, model);
          const resData = parseAIJson(result.candidates[0].content.parts[0].text);
          if (resData.summary) {
            const cleanSummary = resData.summary.trim();
            setEntries(prev => prev.map(e => e.id === id ? { ...e, summary: cleanSummary, updatedAt: Date.now() } : e));
            setEditData(prev => ({
              ...prev,
              [id]: { ...(prev[id] || entry), summary: cleanSummary }

          }
        } catch (err) {
          setError("Failed to generate answer summary: " + err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleGenerateTakeaways = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        try {
          const data = editData[id] || entries.find(e => e.id === id);
          if (!data) throw new Error("Note not found.");
          const prompt = `Analyze this note. Extract exactly 3-5 crucial key takeaways. Return strictly JSON: {"shortVersion": ["point 1", "point 2"]}.\nTitle: ${data.title}\nContent: ${data.fullContent}`;
          const payload = {
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { shortVersion: { type: "ARRAY", items: { type: "STRING" } } } } }
          };
          const result = await handleGeminiCall(payload, model);
          const resData = parseAIJson(result.candidates[0].content.parts[0].text);
          if (resData.shortVersion && Array.isArray(resData.shortVersion)) {

        } catch(err) {

          setIsAnalyzing(false);

      const handleGenerateTaxonomies = async (id) => {
        if (!apiKeys || apiKeys.length === 0) return setError("Set your API key first in Settings.");
        setIsAnalyzing(true);
        try {
          const data = editData[id] || entries.find(e => e.id === id);

          const prompt = `Analyze this note and return JSON matching: {"projects": ["proj"], "categories": ["cat"], "tags": ["tag1"]}.
          - Projects: Assign 0-1 from: ${JSON.stringify(Array.from(allProjects))}.
          - Categories: Assign 1-2 from: ${JSON.stringify(Array.from(allCategories))}.

          const payload = {
            contents: [{ role: 'user', parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { projects: { type: "ARRAY", items: { type: "STRING" } }, categories: { type: "ARRAY", items: { type: "STRING" } }, tags: { type: "ARRAY", items: { type: "STRING" } } } } }
          };
          const result = await handleGeminiCall(payload, model);
          const resData = parseAIJson(result.candidates[0].content.parts[0].text);
          setEditData(prev => ({
            ...prev,
            [id]: {
              ...prev[id],
              projects: Array.isArray(resData.projects) ? resData.projects.map(p => p.toLowerCase()) : prev[id].projects,
              categories: Array.isArray(resData.categories) ? resData.categories.map(c => c.toLowerCase()) : prev[id].categories,
              tags: Array.isArray(resData.tags) ? resData.tags.map(t => t.toLowerCase()) : prev[id].tags
            }
          }));
        } catch(err) {
          setError("Auto-tag failed: " + err.message);
        } finally {
          setIsAnalyzing(false);
        }

      // Taxonomy operations
      const performTaxonomyMigration = (oldName, oldType, newType, newName) => {
        const oldLower = oldName.toLowerCase();
        setEntries(prev => prev.map(entry => {
          let newProjs = [...(Array.isArray(entry.projects) ? entry.projects : [])];
          let newCats = [...(Array.isArray(entry.categories) ? entry.categories : [])];
          let newTags = [...(Array.isArray(entry.tags) ? entry.tags : [])];
          let wasModified = false;

          const removeFromList = (list) => {
            if (list.some(i => i.toLowerCase() === oldLower)) {
              wasModified = true;
              return list.filter(i => i.toLowerCase() !== oldLower);
            }
            return list;
          };

          if (oldType === 'project') newProjs = removeFromList(newProjs);
          if (oldType === 'category') newCats = removeFromList(newCats);
          if (oldType === 'tag') newTags = removeFromList(newTags);

          if (wasModified) {
            const targetList = newType === 'project' ? newProjs : newType === 'category' ? newCats : newTags;
            if (!targetList.some(i => i.toLowerCase() === newName.toLowerCase())) {
              targetList.push(newName.toLowerCase());
            }
            return {
              ...entry,
              projects: [...new Set(newProjs)],
              categories: [...new Set(newCats)],
              tags: [...new Set(newTags)],
              updatedAt: Date.now()
            };
          }
          return entry;
        }));

      const handleTaxonomyDrop = (e, targetType, targetName) => {
        e.preventDefault();

          const data = JSON.parse(dataStr);
          if (data.val && data.type && (data.val !== targetName || data.type !== targetType)) {
            performTaxonomyMigration(data.val, data.type, targetType, targetName);
          }
        } catch(err) { console.error(err); }
      };

      const submitTaxonomyRename = (oldName, newName, currentType) => {
        if (newName && newName.trim() !== '' && newName.trim() !== oldName) {

      const handleEntryDrop = (e, targetId) => {

            setEntries(prev => prev.map(ent => {
              if (ent.id === targetId) {
                if (type === 'category' && !(ent.categories || []).includes(val)) return { ...ent, categories: [...(ent.categories || []), val.toLowerCase()], updatedAt: Date.now() };
                if (type === 'tag' && !(ent.tags || []).includes(val)) return { ...ent, tags: [...(ent.tags || []), val.toLowerCase()], updatedAt: Date.now() };
                if (type === 'project' && !(ent.projects || []).includes(val)) return { ...ent, projects: [...(ent.projects || []), val.toLowerCase()], updatedAt: Date.now() };
              }
              return ent;
            }));
          } catch(err) {}
        }
        const draggedId = e.dataTransfer.getData('kb-ref-id');
        if (draggedId && draggedId !== targetId) {
          setEntries(prev => prev.map(ent => {
            if (ent.id === targetId) {
              const refs = ent.references || [];
              if (!refs.includes(draggedId)) {
                return { ...ent, references: [...refs, draggedId], updatedAt: Date.now() };
              }
            }
            return ent;
          }));
        }
      };

      const handleContentDrop = (e, targetEntry) => {
        const draggedId = e.dataTransfer.getData('kb-ref-id');
        if (draggedId && draggedId !== targetEntry.id) {
          e.preventDefault();
          const refShortcode = `\n\n[[kb-ref:${draggedId}]]`;
          setEntries(prev => prev.map(ent =>
            ent.id === targetEntry.id
              ? { ...ent, fullContent: (ent.fullContent || '') + refShortcode, updatedAt: Date.now() }
              : ent
          ));
        }
      };

      const handleContentClick = (e) => {
        const refEl = e.target.closest('.kb-embedded-ref');
        if (refEl) {
          e.preventDefault();
          e.stopPropagation();
          const refId = refEl.getAttribute('data-id');

            if (found) {
              setActiveRefModal(found);
              setHoveredRef(null);
            }
          }
        }
      };

      const handleContentMouseOver = (e) => {

          if (refId) {

            setHoveredRef({ id: refId, x: rect.left + rect.width / 2, y: rect.top });
          }

      const handleContentMouseOut = (e) => {
        if (e.target.closest('.kb-embedded-ref')) setHoveredRef(null);
      };

      // UNIFIED AI ASSISTANT
      const sendAssistantMessage = async (overrideText = null) => {
        const queryText = (overrideText || assistantInput).trim();
        if (!queryText) return;
        if (!apiKeys || apiKeys.length === 0) {
          setShowKeyModal(true);
          return setError("Please configure your Gemini API key in Settings first.");
        }

        setAssistantInput('');
        setIsAssistantThinking(true);
        setError(null);

        const userMsg = {
          id: 'msg-' + Date.now(),
          role: 'user',
          text: queryText,
          timestamp: Date.now()
        };

        const chatKey = assistantScope === 'workspace' ? 'workspace' : (activeSingleEntry ? activeSingleEntry.id : 'selected');
        const currentHistory = assistantChats[chatKey] || [];
        const updatedMessages = [...currentHistory, userMsg];

        setAssistantChats(prev => ({
          ...prev,
          [chatKey]: updatedMessages
        }));

        try {
          const currentScope = assistantScope;
          let targetDocs = [];

          if (currentScope === 'selected') {
            targetDocs = selectedEntries.length > 0 ? selectedEntries : (activeSingleEntry ? [activeSingleEntry] : (entries.length > 0 ? [entries[0]] : []));
          } else {
            targetDocs = entries;
          }

          if (currentScope === 'selected' && targetDocs.length > 0) {
            let contextText = targetDocs.map(ent => {
              let block = `--- PRIMARY DOCUMENT: ${ent.title} (ID: ${ent.numericId || ent.id}) ---\n`;
              if (ent.summary) block += `Summary: ${ent.summary}\n`;
              if (ent.shortVersion && ent.shortVersion.length > 0) block += `Key Points:\n${ent.shortVersion.map(p => `- ${p}`).join('\n')}\n`;
              if (ent.fullContent) block += `Content:\n${ent.fullContent}\n`;
              if (ent.sourceUrl) block += `Source URL: ${ent.sourceUrl}\n`;
              return block;
            }).join('\n\n');

            const otherEntries = entries.filter(e => !targetDocs.some(se => se.id === e.id));
            let archiveContextText = "";
            if (otherEntries.length > 0) {
              archiveContextText = otherEntries.map(e => {
                let line = `• [[kb-ref:${e.id}]] "${e.title || 'Untitled'}"`;
                if (e.summary) line += `\n  Executive Summary: ${e.summary}`;
                if (Array.isArray(e.shortVersion) && e.shortVersion.length > 0) line += `\n  Key Takeaways: ${e.shortVersion.join(' | ')}`;
                return line;
              }).join('\n\n');
            }

            const payload = {
              contents: [
                ...currentHistory.slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
                { role: 'user', parts: [{ text: queryText }] }
              ],
              systemInstruction: {
                parts: [{
                  text: `You are a helpful AI Assistant for the user's personal knowledge base.
Answer comprehensively based primarily on the active document: "${targetDocs[0]?.title || 'Selected Note'}", using the wider archive of personal notes for context, cross-references, and thematic connections.

CRITICAL RULES:
- Primary focus is on the Selected Active Document.
- You ALSO have access to Executive Summaries and Takeaways of ALL other notes below. Cross-reference other notes using exact syntax [[kb-ref:ID]] (e.g. [[kb-ref:${targetDocs[0]?.id || 'ID'}]]).
- Format responses cleanly in Markdown with headings, bullet points, and concise language.

=== PRIMARY ACTIVE DOCUMENT ===
${contextText}

${archiveContextText ? `=== WIDER PERSONAL CONTEXT (EXECUTIVE SUMMARIES & TAKEAWAYS OF ALL OTHER NOTES) ===\n${archiveContextText}` : ''}`
                }]
              }
            };

            if (targetDocs.some(e => e.sourceUrl)) {
              payload.tools = [{ google_search: {} }];
            }

            const result = await handleGeminiCall(payload, model);
            const candidate = result.candidates?.[0];
            const parts = candidate?.content?.parts || [];
            const replyText = parts.map(p => p.text || '').filter(Boolean).join('\n').trim() || "No response received.";

            setAssistantChats(prev => ({
              ...prev,
              [chatKey]: [
                ...(prev[chatKey] || updatedMessages),
                { id: 'msg-' + (Date.now() + 1), role: 'model', text: replyText, timestamp: Date.now(), model }
              ]
            }));
          } else {
            const candidateSummaries = entries.map(e => `[kb-ref:${e.id}] (Title: ${e.title}) - ${e.summary || e.fullContent?.substring(0, 150) || ''}`).join('\n');

            const pass1Payload = {
              contents: [{ role: 'user', parts: [{ text: `User query: "${queryText}"\n\nIdentify up to 5 note IDs that are most relevant to answering this query comprehensively. Return ONLY a JSON array of strings (e.g. ["${entries[0]?.id || 'entry-1'}"]). If none apply, return [].\n\nAvailable Notes:\n${candidateSummaries}` }] }],
              generationConfig: { temperature: 0.1 }
            };

            let neededIds = [];
            try {
              const pass1Res = await handleGeminiCall(pass1Payload, model);
              neededIds = parseAIJson(pass1Res.candidates[0].content.parts[0].text);
              if (!Array.isArray(neededIds)) neededIds = [];
            } catch(e) {
              console.warn("Pass 1 routing fallback:", e);
            }

            const fullContextEntries = entries.filter(e => neededIds.includes(e.id));
            let contextText = `Primary Relevant Notes:\n\n`;
            if (fullContextEntries.length > 0) {
              contextText += fullContextEntries.map(e => `--- [kb-ref:${e.id}] Title: ${e.title} ---\n${e.fullContent || e.summary}`).join('\n\n');
            } else {
              contextText += entries.slice(0, 15).map(e => `--- [kb-ref:${e.id}] Title: ${e.title} ---\n${e.summary}`).join('\n\n');
            }

            const pass2Payload = {
              contents: [
                ...currentHistory.slice(-6).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
                { role: 'user', parts: [{ text: queryText }] }
              ],
              systemInstruction: {
                parts: [{
                  text: `You are an overarching Knowledge Base Assistant synthesizing information across the user's entire notes archive.
                  CRITICAL RULES:
                  - Always cite sources using exact syntax [[kb-ref:ID]] (e.g. [[kb-ref:entry-1234]]).
                  - Be concise, structured, factual, and direct.
                  - Format in clean Markdown.
                  
                  Context:\n${contextText}`
                }]
              },
              tools: [{ google_search: {} }]
            };

            const result = await handleGeminiCall(pass2Payload, model);
            const candidate = result.candidates?.[0];
            const parts = candidate?.content?.parts || [];
            const replyText = parts.map(p => p.text || '').filter(Boolean).join('\n').trim() || "No response received.";

            setAssistantChats(prev => ({
              ...prev,
              [chatKey]: [
                ...(prev[chatKey] || updatedMessages),
                { id: 'msg-' + (Date.now() + 1), role: 'model', text: replyText, timestamp: Date.now(), model }
              ]
            }));
          }
        } catch (err) {
          setAssistantChats(prev => ({
            ...prev,
            [chatKey]: [
              ...(prev[chatKey] || updatedMessages),
              { id: 'msg-' + (Date.now() + 1), role: 'model', text: `⚠️ Error: ${err.message}`, timestamp: Date.now() }
            ]

          setIsAssistantThinking(false);

      const copyMessage = (msgId, text) => {

      const insertMessageIntoNote = (msgId, text) => {

        const addition = `\n\n---\n### 💡 AI Synthesis (${new Date().toLocaleDateString()})\n\n${text}\n`;
        setEntries(prev => prev.map(ent =>
          ent.id === activeSingleEntry.id
            ? { ...ent, fullContent: (ent.fullContent || '') + addition, updatedAt: Date.now() }
            : ent
        ));
        setActionFeedback({ msgId, type: 'insert' });
        setTimeout(() => setActionFeedback(null), 1500);
      };

      const handleStartNewChat = () => {
        if (assistantMessages.length > 0) {
          const firstUserMsg = assistantMessages.find(m => m.role === 'user');
          const snippet = firstUserMsg ? firstUserMsg.text.replace(/[\r\n]+/g, ' ').trim() : 'Conversation';
          const chatTitle = snippet.length > 42 ? snippet.substring(0, 42) + '...' : snippet;
          
          const newArchive = {
            id: 'arch-' + Date.now(),
            title: chatTitle,
            timestamp: Date.now(),
            messages: [...assistantMessages]
          };

          setArchivedAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: [newArchive, ...(prev[activeChatKey] || [])]
          }));

          setAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: []
          }));
        }
      };

      const handleArchiveCurrentChat = () => {

        handleStartNewChat();
      };

        if (assistantMessages.length > 0) {
          const firstUserMsg = assistantMessages.find(m => m.role === 'user');
          const snippet = firstUserMsg ? firstUserMsg.text.replace(/[\r\n]+/g, ' ').trim() : 'Conversation';
          const currentTitle = snippet.length > 42 ? snippet.substring(0, 42) + '...' : snippet;
          
          const currentArchive = {
            id: 'arch-' + Date.now(),
            title: currentTitle,
            timestamp: Date.now(),
            messages: [...assistantMessages]
          };

          setArchivedAssistantChats(prev => {
            const list = (prev[activeChatKey] || []).filter(c => c.id !== archivedChat.id);
            return {
              ...prev,
              [activeChatKey]: [currentArchive, ...list]
            };
          });
        } else {
          setArchivedAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: (prev[activeChatKey] || []).filter(c => c.id !== archivedChat.id)
          }));
        }

        setAssistantChats(prev => ({
          ...prev,
          [activeChatKey]: [...archivedChat.messages]
        }));

          setArchivedAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: (prev[activeChatKey] || []).filter(c => c.id !== chatId)
          }));
          setExpandedArchivedChatIds(prev => prev.filter(id => id !== chatId));
        }
      };

      const handleClearAllArchivedChats = () => {
        if (window.confirm("Clear all previous chats for this conversation?")) {
          setArchivedAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: []
          }));
          setExpandedArchivedChatIds([]);
        }
      };

      const toggleExpandArchivedChat = (chatId) => {
        setExpandedArchivedChatIds(prev => 
          prev.includes(chatId) ? prev.filter(id => id !== chatId) : [...prev, chatId]
        );
      };

      const clearAssistantHistory = () => {
        if (window.confirm("Clear current active chat history? (Archived chats will remain saved)")) {
          setAssistantChats(prev => ({
            ...prev,
            [activeChatKey]: []
          }));
        }
      };

      // Filtered entries
      const filteredEntries = entries.filter(entry => {
        if (!entry) return false;
        const entryType = getEntryType(entry);
        if (!activeTypeFilters.includes(entryType)) return false;
        const matchesProject = activeProjects.length === 0 || (Array.isArray(entry.projects) && entry.projects.some(p => activeProjects.some(ap => normTax(ap) === normTax(p))));
        const matchesCat = activeCategories.length === 0 || (Array.isArray(entry.categories) && entry.categories.some(c => activeCategories.some(ac => normTax(ac) === normTax(c))));
        const matchesTag = activeTags.length === 0 || (Array.isArray(entry.tags) && entry.tags.some(t => activeTags.some(at => normTax(at) === normTax(t))));
        const searchLower = searchQuery.toLowerCase();
        const matchesSearch = !searchQuery ||
          (entry.title && entry.title.toLowerCase().includes(searchLower)) ||
          (entry.summary && entry.summary.toLowerCase().includes(searchLower)) ||
          (entry.fullContent && entry.fullContent.toLowerCase().includes(searchLower)) ||
          (entry.numericId != null && (`#${entry.numericId}`).includes(searchLower)) ||
          (entry.numericId != null && String(entry.numericId).includes(searchLower));
        return matchesProject && matchesCat && matchesTag && matchesSearch;
      }).sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return (b.numericId || 0) - (a.numericId || 0);
      });

      const openSettings = () => {
        setTempKeys([...apiKeys]);
        setTempModel(model);
        setTempTheme(theme);
        setMergeStatus(null);
        setShowKeyModal(true);
      };

      const saveSettings = () => {
        setApiKeys(tempKeys.filter(k => k.key.trim() !== ''));
        setModel(tempModel);
        setTheme(tempTheme);
        setShowKeyModal(false);
      };

      if (appState === 'init') {
        return (
          <div className="flex h-screen items-center justify-center bg-[var(--bg-main)]">
            <i className="fa-solid fa-spinner fa-spin text-3xl text-[var(--accent)]"></i>
          </div>
        );
      }

      if (appState === 'landing') {

                          title={`${isActive ? 'Hide' : 'Show'} ${t.label} (Click to toggle)`}
